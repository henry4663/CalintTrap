<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Endless Runner 3D - Top Global</title>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #1a0033;
      font-family: Arial, sans-serif;
      touch-action: none;
    }

    canvas { display: block; }

    #distance, #pointsHud, #coinHud {
      position: absolute;
      color: white;
      font-weight: bold;
      text-shadow: 0 0 10px #000;
      z-index: 10;
      pointer-events: none;
      font-size: 24px;
    }

    #distance { top: 20px; left: 20px; }
    #pointsHud { top: 58px; left: 20px; color: #ffdd00; }
    #coinHud { top: 190px; right: 20px; }
    #coinCount { color: #ffdd00; }

    #globalLeaderboardCorner {
      position: absolute;
      top: 20px;
      right: 20px;
      width: 240px;
      padding: 12px;
      z-index: 50;
      color: white;
      background: linear-gradient(135deg, rgba(26, 0, 51, .9), rgba(42, 26, 68, .9));
      border: 2px solid rgba(0, 198, 255, .4);
      border-radius: 14px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, .6), inset 0 0 15px rgba(255, 0, 204, .15);
      transform: perspective(600px) rotateY(-5deg) rotateX(3deg);
      transform-origin: top right;
      pointer-events: none;
      backdrop-filter: blur(6px);
    }

    .corner-title {
      margin-bottom: 8px;
      padding-bottom: 4px;
      color: #00c6ff;
      border-bottom: 1px solid rgba(255, 255, 255, .15);
      font-size: 14px;
      font-weight: bold;
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 1px;
      text-shadow: 0 0 8px rgba(0, 198, 255, .6);
    }

    .corner-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 3px;
      padding: 4px 6px;
      background: rgba(255, 255, 255, .04);
      border-radius: 6px;
      font-size: 12px;
    }

    .corner-item:nth-child(1) { border-left: 3px solid #ffdd00; }
    .corner-item:nth-child(2) { border-left: 3px solid #c0c0c0; }
    .corner-item:nth-child(3) { border-left: 3px solid #cd7f32; }

    .corner-rank { width: 24px; color: #ffdd00; font-weight: bold; }
    .corner-name {
      flex-grow: 1;
      overflow: hidden;
      margin: 0 4px;
      opacity: .9;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .corner-score { color: #00ffcc; font-weight: bold; }

    .screen {
      position: absolute;
      inset: 0;
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: white;
      background: rgba(0, 0, 0, .78);
      text-align: center;
    }

    .screen h1 {
      margin-bottom: 15px;
      background: linear-gradient(45deg, #00c6ff, #ff00cc);
      background-clip: text;
      color: transparent;
      font-size: 48px;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .screen p { margin: 8px 0; opacity: .9; font-size: 18px; }

    .screen .key {
      display: inline-block;
      margin: 0 4px;
      padding: 4px 12px;
      color: #000;
      background: #fff;
      border-radius: 6px;
      font-weight: bold;
    }

    .screen button {
      margin-top: 25px;
      padding: 16px 55px;
      color: white;
      background: linear-gradient(45deg, #00c6ff, #ff00cc);
      border: 0;
      border-radius: 50px;
      box-shadow: 0 0 40px rgba(255, 0, 204, .5);
      font-size: 24px;
      font-weight: bold;
      cursor: pointer;
    }

    .screen button:active { transform: scale(.96); }
    .welcome-nick { color: #00ffcc; font-weight: bold; }
    #gameOver { display: none; }

    #gameOver h1 {
      background: none;
      color: #ff3366;
      font-size: 56px;
      -webkit-text-fill-color: #ff3366;
    }

    #finalScore { margin: 12px 0; color: #ffdd00; font-size: 34px; }
    #finalDistance, #finalCoins { margin: 4px 0; font-size: 20px; opacity: .9; }

    #hint {
      position: absolute;
      bottom: 25px;
      left: 50%;
      z-index: 10;
      color: rgba(255, 255, 255, .65);
      font-size: 15px;
      pointer-events: none;
      text-shadow: 0 0 8px #000;
      transform: translateX(-50%);
      white-space: nowrap;
    }

    .toast {
      position: absolute;
      bottom: -60px;
      left: 50%;
      z-index: 1000;
      max-width: calc(100vw - 32px);
      padding: 10px 20px;
      color: white;
      background: rgba(0, 0, 0, .9);
      border: 1px solid #00c6ff;
      border-radius: 8px;
      font-weight: bold;
      pointer-events: none;
      text-align: center;
      transform: translateX(-50%);
      transition: bottom .3s ease;
    }

    .toast.show { bottom: 70px; }
    .toast.success { color: #00ffcc; border-color: #00ffcc; }
    .toast.error { color: #ff3366; border-color: #ff3366; }

    @media (max-width: 600px) {
      #globalLeaderboardCorner { width: 190px; padding: 8px; }
      #distance, #pointsHud { left: 12px; font-size: 20px; }
      #distance { top: 16px; }
      #pointsHud { top: 48px; }
      #coinHud { top: 165px; right: 12px; font-size: 20px; }
      .screen h1 { font-size: 38px; }
      .screen p { font-size: 15px; }
      .screen button { padding: 14px 36px; font-size: 20px; }
      #hint { font-size: 12px; }
    }

    #mobileControls{display:none;position:fixed;inset:auto 0 18px;z-index:80;justify-content:space-between;align-items:end;padding:0 16px;pointer-events:none;gap:12px}
    .mobileGroup{display:flex;gap:9px;pointer-events:auto}
    .mobileControl{width:58px;height:58px;border:2px solid #ffffff88;border-radius:18px;background:#170b35dd;color:#fff;font-size:22px;font-weight:900;box-shadow:0 5px 18px #0008;touch-action:none;user-select:none;-webkit-user-select:none}
    .mobileControl:active{background:#7135c9;transform:scale(.94)}
    @media(max-width:700px),(pointer:coarse){#mobileControls{display:flex}#hint{bottom:92px;font-size:11px}#globalLeaderboardCorner{top:10px;right:10px;width:150px;padding:6px}.corner-title{font-size:11px}.corner-item{font-size:10px}#coinHud{top:130px}}
  </style>
</head>

<body>
  <div id="distance">📍 <span id="dist">0</span>m</div>
  <div id="pointsHud">🏆 <span id="points">0</span> pontos</div>
  <div id="coinHud">🪙 <span id="coinCount">0</span></div>

  <div id="globalLeaderboardCorner">
    <div class="corner-title">🏆 Top Global</div>
    <div id="cornerList">Carregando...</div>
  </div>

  <div id="hint">← → mover | ↑ pular | ↓ abaixar</div>

  <div id="startScreen" class="screen">
    <h1>ENDLESS RUNNER</h1>
    <p>Jogando como: <span id="displayNick" class="welcome-nick">Carregando...</span></p>
    <p style="margin-top:18px">
      <span class="key">←</span><span class="key">→</span>
      ou <span class="key">A</span><span class="key">D</span> para desviar
    </p>
    <p><span class="key">↑</span> / <span class="key">W</span> / <span class="key">ESPAÇO</span> para pular</p>
    <p><span class="key">↓</span> / <span class="key">S</span> para abaixar</p>
    <button id="startBtn">JOGAR</button>
  </div>

  <div id="gameOver" class="screen">
    <h1>GAME OVER</h1>
    <div id="finalScore">0 pontos</div>
    <div id="finalDistance">📍 0m</div>
    <div id="finalCoins">🪙 0 moedas</div>
    <button id="restartBtn">JOGAR NOVAMENTE</button>
  </div>

  <div id="toast" class="toast"></div>
  <div id="mobileControls" aria-label="Controles para celular">
    <div class="mobileGroup"><button class="mobileControl" id="mobileLeft" aria-label="Mover para esquerda">◀</button><button class="mobileControl" id="mobileRight" aria-label="Mover para direita">▶</button></div>
    <div class="mobileGroup"><button class="mobileControl" id="mobileDuck" aria-label="Abaixar">▼</button><button class="mobileControl" id="mobileJump" aria-label="Pular">▲</button></div>
  </div>


  <script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>

  <script type="module">
    import { criarPersonagem } from "./personagem.js";
    import { db, ref, set, get, update, onValue, toast } from "./firebase.js";
    import { increment } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
    import { getCurrentNick } from "./authLocal.js";

    (() => {
      "use strict";

      const playerNick = getCurrentNick() || "Anônimo";
      const profileKey = encodeURIComponent(String(playerNick).trim().toLowerCase()).replace(/\./g, "%2E");
      const PONTUACAO_MINIMA = 10;
      const leaderboardRef = ref(db, "leaderboard");

      document.getElementById("displayNick").textContent = playerNick;

      // Fórmula única para HUD, tela final e Firebase:
      // 1 ponto por metro + 5 pontos por moeda.
      function calcularPontuacao(distancia, moedas) {
        return Math.floor(distancia) + Number(moedas || 0) * 5;
      }

      function normalizarNome(nome) {
        return String(nome || "Anônimo")
          .trim()
          .substring(0, 12)
          .toLocaleLowerCase("pt-BR") || "anônimo";
      }

      function obterTopCinco(data) {
        const melhoresPorNome = new Map();

        if (!data) return [];

        for (const item of Object.values(data)) {
          if (!item) continue;

          const nome = String(item.name || "Anônimo").trim().substring(0, 12) || "Anônimo";
          const score = Number(item.score) || 0;
          const chaveNome = normalizarNome(nome);
          const anterior = melhoresPorNome.get(chaveNome);

          if (!anterior || score > anterior.score) {
            melhoresPorNome.set(chaveNome, { name: nome, score });
          }
        }

        return [...melhoresPorNome.values()]
          .sort((a, b) => b.score - a.score)
          .slice(0, 5);
      }

      function renderizarRanking(data) {
        const lista = document.getElementById("cornerList");
        lista.replaceChildren();

        const jogadores = obterTopCinco(data);

        if (jogadores.length === 0) {
          const vazio = document.createElement("div");
          vazio.textContent = "Sem pontuações";
          vazio.style.cssText = "text-align:center;opacity:.6;font-size:11px";
          lista.appendChild(vazio);
          return;
        }

        jogadores.forEach((jogador, indice) => {
          const linha = document.createElement("div");
          linha.className = "corner-item";

          const posicao = document.createElement("span");
          posicao.className = "corner-rank";
          posicao.textContent = `#${indice + 1}`;

          const nome = document.createElement("span");
          nome.className = "corner-name";
          nome.textContent = jogador.name;

          const pontos = document.createElement("span");
          pontos.className = "corner-score";
          pontos.textContent = String(jogador.score);

          linha.append(posicao, nome, pontos);
          lista.appendChild(linha);
        });
      }

      onValue(
        leaderboardRef,
        snapshot => renderizarRanking(snapshot.val()),
        error => {
          console.error("Erro ao carregar ranking:", error);
          document.getElementById("cornerList").textContent =
            "Não foi possível carregar o ranking.";
        }
      );

      async function salvarPontuacaoGlobal(nome, distancia, moedas) {
        const nomeLimpo = String(nome || "Anônimo").trim().substring(0, 12) || "Anônimo";
        const pontuacao = calcularPontuacao(distancia, moedas);

        if (pontuacao < PONTUACAO_MINIMA) {
          toast(`Pontuação baixa: mínimo de ${PONTUACAO_MINIMA} pontos para entrar no ranking.`, "aviso");
          return;
        }

        try {
          const snapshot = await get(leaderboardRef);
          const dados = snapshot.val() || {};
          const nomeBusca = normalizarNome(nomeLimpo);

          let melhorChave = null;
          let melhorPontuacao = -1;

          // Procura o melhor registro existente para esse apelido.
          for (const [chave, item] of Object.entries(dados)) {
            if (!item || normalizarNome(item.name) !== nomeBusca) continue;

            const scoreAtual = Number(item.score) || 0;
            if (scoreAtual > melhorPontuacao) {
              melhorPontuacao = scoreAtual;
              melhorChave = chave;
            }
          }

          if (melhorChave !== null && pontuacao <= melhorPontuacao) {
            toast("Seu recorde anterior é maior. Ele foi mantido!", "aviso");
            return;
          }

          const chave = melhorChave ||
            `jogador_${Date.now()}_${Math.random().toString(36).slice(2, 8)}`;

          await set(ref(db, `leaderboard/${chave}`), {
            name: nomeLimpo,
            score: pontuacao,
            distance: Math.floor(distancia),
            coins: moedas,
            timestamp: Date.now()
          });

          toast(
            melhorChave
              ? "Novo recorde salvo no ranking!"
              : "Pontuação salva no ranking global!",
            "sucesso"
          );
        } catch (error) {
          console.error("Erro ao salvar pontuação:", error);
          toast("Erro ao salvar pontuação.", "erro");
        }
      }

      // Cena Three.js
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x1a0033);
      scene.fog = new THREE.Fog(0x1a0033, 40, 100);

      const camera = new THREE.PerspectiveCamera(
        65,
        window.innerWidth / window.innerHeight,
        0.1,
        200
      );
      camera.position.set(0, 5.5, 8);
      camera.lookAt(0, 1.5, -5);

      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.shadowMap.enabled = true;
      document.body.appendChild(renderer.domElement);

      window.addEventListener("resize", () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      scene.add(new THREE.AmbientLight(0xffffff, 0.75));

      const sun = new THREE.DirectionalLight(0xffffff, 1);
      sun.position.set(8, 15, 8);
      sun.castShadow = true;
      sun.shadow.mapSize.set(1024, 1024);
      sun.shadow.camera.left = -15;
      sun.shadow.camera.right = 15;
      sun.shadow.camera.top = 15;
      sun.shadow.camera.bottom = -15;
      scene.add(sun);

      const LANE_WIDTH = 3;
      const LANES = [-LANE_WIDTH, 0, LANE_WIDTH];

      const floor = new THREE.Mesh(
        new THREE.PlaneGeometry(12, 300),
        new THREE.MeshStandardMaterial({ color: 0x2a1a44, roughness: 0.9 })
      );
      floor.rotation.x = -Math.PI / 2;
      floor.position.z = -140;
      floor.receiveShadow = true;
      scene.add(floor);

      for (const laneX of LANES) {
        const line = new THREE.Mesh(
          new THREE.PlaneGeometry(0.08, 300),
          new THREE.MeshBasicMaterial({
            color: 0x00ccff,
            transparent: true,
            opacity: 0.4
          })
        );
        line.rotation.x = -Math.PI / 2;
        line.position.set(laneX, 0.01, -140);
        scene.add(line);
      }

      for (const side of [-1, 1]) {
        const rail = new THREE.Mesh(
          new THREE.BoxGeometry(0.2, 0.5, 300),
          new THREE.MeshStandardMaterial({
            color: 0xff00cc,
            emissive: 0xff00cc,
            emissiveIntensity: 0.5
          })
        );
        rail.position.set(side * (LANE_WIDTH + 1.5), 0.25, -140);
        scene.add(rail);
      }

      const player = criarPersonagem("Jogador");
      scene.add(player);

      const body = player.getObjectByName("body");
      const parts = [
        "body", "chest", "head", "brim", "crown",
        "armL", "armR", "legL", "legR"
      ].map(name => player.getObjectByName(name)).filter(Boolean);

      const armPivotL = player.getObjectByName("armPivotL");
      const armPivotR = player.getObjectByName("armPivotR");
      const legPivotL = player.getObjectByName("legPivotL");
      const legPivotR = player.getObjectByName("legPivotR");

      const playerShadow = new THREE.Mesh(
        new THREE.CircleGeometry(0.55, 16),
        new THREE.MeshBasicMaterial({
          color: 0x000000,
          transparent: true,
          opacity: 0.35
        })
      );
      playerShadow.rotation.x = -Math.PI / 2;
      playerShadow.position.y = 0.02;
      scene.add(playerShadow);

      const deathShards = [];

      function shatterPlayer() {
        player.visible = false;
        playerShadow.visible = false;

        for (const part of parts) {
          const material = Array.isArray(part.material)
            ? part.material.map(item => item.clone())
            : part.material.clone();

          const shard = new THREE.Mesh(part.geometry.clone(), material);
          const worldPosition = new THREE.Vector3();
          part.getWorldPosition(worldPosition);
          shard.position.copy(worldPosition);

          shard.userData = {
            vel: new THREE.Vector3(
              (Math.random() - 0.5) * 0.25,
              Math.random() * 0.3 + 0.15,
              (Math.random() - 0.5) * 0.25 - 0.1
            ),
            rotVel: new THREE.Vector3(
              (Math.random() - 0.5) * 0.2,
              (Math.random() - 0.5) * 0.2,
              (Math.random() - 0.5) * 0.2
            )
          };

          scene.add(shard);
          deathShards.push(shard);
        }
      }

      function clearShards() {
        for (const shard of deathShards) {
          scene.remove(shard);
          shard.geometry.dispose();

          if (Array.isArray(shard.material)) {
            shard.material.forEach(material => material.dispose());
          } else {
            shard.material.dispose();
          }
        }
        deathShards.length = 0;
      }

      const obstacles = [];
      const coins = [];
      const TYPES = ["block", "low", "tall", "highBar", "spikes", "tunnel", "double"];

      function createObstacle(lane, z, type) {
        const group = new THREE.Group();
        group.position.set(LANES[lane], 0, z);

        if (type === "block") {
          const box = new THREE.Mesh(
            new THREE.BoxGeometry(2.2, 1.6, 2),
            new THREE.MeshStandardMaterial({
              color: 0x1f1a24,
              roughness: 0.4,
              metalness: 0.6
            })
          );
          box.position.y = 0.8;
          box.castShadow = true;
          box.receiveShadow = true;
          group.add(box);

          const stripeMaterial = new THREE.MeshStandardMaterial({
            color: 0xff0066,
            emissive: 0xff0066,
            emissiveIntensity: 0.8
          });

          for (const y of [0.5, 1.1]) {
            const stripe = new THREE.Mesh(
              new THREE.BoxGeometry(2.26, 0.15, 2.06),
              stripeMaterial
            );
            stripe.position.y = y;
            group.add(stripe);
          }

          group.userData = { type, width: 2.2, height: 1.6, depth: 2 };
        } else if (type === "low") {
          const bar = new THREE.Mesh(
            new THREE.BoxGeometry(2.5, 0.25, 0.4),
            new THREE.MeshStandardMaterial({
              color: 0xffaa00,
              emissive: 0xff6600,
              emissiveIntensity: 0.5,
              roughness: 0.3
            })
          );
          bar.position.y = 0.5;
          bar.castShadow = true;
          group.add(bar);

          const legMaterial = new THREE.MeshStandardMaterial({
            color: 0x333333,
            metalness: 0.8
          });

          const legLeft = new THREE.Mesh(
            new THREE.BoxGeometry(0.15, 0.5, 0.6),
            legMaterial
          );
          legLeft.position.set(-1.1, 0.25, 0);
          group.add(legLeft);

          const legRight = legLeft.clone();
          legRight.position.x = 1.1;
          group.add(legRight);

          group.userData = { type, width: 2.5, height: 0.65, depth: 0.6 };
        } else if (type === "highBar") {
          const frameMaterial = new THREE.MeshStandardMaterial({ color: 0x112233 });
          const neonMaterial = new THREE.MeshStandardMaterial({
            color: 0x00ffcc,
            emissive: 0x00ffcc,
            emissiveIntensity: 0.9
          });

          const bar = new THREE.Mesh(
            new THREE.BoxGeometry(2.7, 0.4, 0.6),
            neonMaterial
          );
          bar.position.y = 1.9;
          group.add(bar);

          const pillarLeft = new THREE.Mesh(
            new THREE.CylinderGeometry(0.1, 0.1, 2.1, 12),
            frameMaterial
          );
          pillarLeft.position.set(-1.25, 1.05, 0);
          group.add(pillarLeft);

          const pillarRight = pillarLeft.clone();
          pillarRight.position.x = 1.25;
          group.add(pillarRight);

          group.userData = { type, width: 2.7, height: 2.2, depth: 0.6, minY: 1.4 };
        } else if (type === "spikes") {
          const spikeMaterial = new THREE.MeshStandardMaterial({
            color: 0xff3344, emissive: 0x660011, emissiveIntensity: 0.45,
            metalness: 0.45, roughness: 0.3
          });
          for (let i = -1; i <= 1; i++) {
            const spike = new THREE.Mesh(new THREE.ConeGeometry(0.42, 1.15, 5), spikeMaterial);
            spike.position.set(i * 0.68, 0.57, 0);
            spike.castShadow = true;
            group.add(spike);
          }
          group.userData = { type, width: 2.5, height: 1.15, depth: 0.9 };
        } else if (type === "tunnel") {
          const frameMaterial = new THREE.MeshStandardMaterial({
            color: 0x168cff, emissive: 0x004477, emissiveIntensity: 0.55,
            metalness: 0.65, roughness: 0.25
          });
          const top = new THREE.Mesh(new THREE.BoxGeometry(2.8, 0.35, 1.1), frameMaterial);
          top.position.y = 1.55;
          top.castShadow = true;
          group.add(top);
          for (const x of [-1.25, 1.25]) {
            const leg = new THREE.Mesh(new THREE.BoxGeometry(0.22, 1.55, 1.1), frameMaterial);
            leg.position.set(x, 0.775, 0);
            group.add(leg);
          }
          group.userData = { type, width: 2.8, height: 1.9, depth: 1.1, minY: 1.05 };
        } else if (type === "double") {
          const material = new THREE.MeshStandardMaterial({
            color: 0x7733cc, emissive: 0x220044, emissiveIntensity: 0.5,
            metalness: 0.55, roughness: 0.35
          });
          for (const x of [-0.62, 0.62]) {
            const crate = new THREE.Mesh(new THREE.BoxGeometry(1.05, 1.35, 1.5), material);
            crate.position.set(x, 0.675, 0);
            crate.castShadow = true;
            crate.receiveShadow = true;
            group.add(crate);
            const stripe = new THREE.Mesh(
              new THREE.BoxGeometry(1.08, 0.12, 1.53),
              new THREE.MeshStandardMaterial({ color: 0xffcc00, emissive: 0x664400, emissiveIntensity: 0.5 })
            );
            stripe.position.set(x, 1.0, 0);
            group.add(stripe);
          }
          group.userData = { type, width: 2.4, height: 1.35, depth: 1.5 };
        } else {
          const pillar = new THREE.Mesh(
            new THREE.CylinderGeometry(1.1, 1.25, 3.4, 6),
            new THREE.MeshStandardMaterial({
              color: 0x6600cc,
              emissive: 0x330066,
              emissiveIntensity: 0.6,
              roughness: 0.2
            })
          );
          pillar.position.y = 1.7;
          pillar.castShadow = true;
          group.add(pillar);

          const glow = new THREE.Mesh(
            new THREE.CylinderGeometry(1.12, 1.12, 0.2, 6),
            new THREE.MeshStandardMaterial({
              color: 0xcc00ff,
              emissive: 0xcc00ff,
              emissiveIntensity: 0.9
            })
          );
          glow.position.y = 3.3;
          group.add(glow);

          group.userData = { type, width: 2.2, height: 3.4, depth: 2.2 };
        }

        scene.add(group);
        obstacles.push(group);
      }

      function createCoin(lane, z) {
        const coin = new THREE.Mesh(
          new THREE.CylinderGeometry(0.32, 0.32, 0.08, 16),
          new THREE.MeshStandardMaterial({
            color: 0xffdd00,
            emissive: 0xffaa00,
            emissiveIntensity: 0.8,
            roughness: 0.2
          })
        );
        coin.rotation.x = Math.PI / 2;
        coin.position.set(LANES[lane], 1, z);
        coin.castShadow = true;
        coin.userData = { baseY: 1 };
        scene.add(coin);
        coins.push(coin);
      }

      const G = {
        running: false,
        speed: 0.035,
        baseSpeed: 0.035,
        maxSpeed: 0.22,
        distance: 0,
        coins: 0,
        currentLane: 1,
        targetLane: 1,
        isJumping: false,
        jumpVel: 0,
        jumpY: 0,
        isDucking: false,
        duckTimer: 0,
        duckDuration: 18,
        gravity: 0.022,
        jumpPower: 0.34,
        spawnTimer: 0,
        spawnInterval: 75,
        lastTime: 0,
        animPhase: 0,
        visualJumpY: 0
      };

      let jumpPressed = false;
      let duckPressed = false;

      // Cada moeda coletada no Speed Run Arena adiciona exatamente 1 Zx à carteira.
      async function adicionarZxPorMoeda() {
        try {
          await update(ref(db, "profiles/" + profileKey), {
            zxBalance: increment(1)
          });
          toast("+1 Zx!", "sucesso");
        } catch (error) {
          console.error("Erro ao adicionar Zx pela moeda:", error);
          toast("Moeda coletada, mas não foi possível salvar o Zx.", "erro");
        }
      }

      function atualizarHUD() {
        document.getElementById("dist").textContent = String(Math.floor(G.distance));
        document.getElementById("coinCount").textContent = String(G.coins);
        document.getElementById("points").textContent =
          String(calcularPontuacao(G.distance, G.coins));
      }

      function onKeyDown(event) {
        if (!G.running) return;
        const key = event.key.toLowerCase();

        if ((key === "arrowleft" || key === "a") && G.targetLane > 0) {
          G.targetLane--;
          event.preventDefault();
        } else if ((key === "arrowright" || key === "d") && G.targetLane < 2) {
          G.targetLane++;
          event.preventDefault();
        } else if (["arrowup", "w", " ", "spacebar"].includes(key)) {
          jumpPressed = true;
          event.preventDefault();
        } else if (key === "arrowdown" || key === "s") {
          duckPressed = true;
          event.preventDefault();
        }
      }

      window.addEventListener("keydown", onKeyDown);

      let touchStartX = 0;
      let touchStartY = 0;

      window.addEventListener("touchstart", event => {
        if (!event.touches.length) return;
        touchStartX = event.touches[0].clientX;
        touchStartY = event.touches[0].clientY;
      }, { passive: true });

      window.addEventListener("touchend", event => {
        if (!G.running || !event.changedTouches.length) return;

        const dx = event.changedTouches[0].clientX - touchStartX;
        const dy = event.changedTouches[0].clientY - touchStartY;

        if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 25) {
          if (dx < 0 && G.targetLane > 0) G.targetLane--;
          if (dx > 0 && G.targetLane < 2) G.targetLane++;
        } else if (dy < -25) {
          jumpPressed = true;
        } else if (dy > 25) {
          duckPressed = true;
        }
      }, { passive: true });


      // Controles grandes para celular: suportam toque simultâneo e cancelamento.
      function bindMobileButton(id, action, release) {
        const button = document.getElementById(id);
        if (!button) return;
        button.addEventListener("pointerdown", event => {
          event.preventDefault();
          button.setPointerCapture(event.pointerId);
          if (!G.running) return;
          action();
        });
        ["pointerup", "pointercancel", "lostpointercapture"].forEach(type => {
          button.addEventListener(type, event => { event.preventDefault(); if (release) release(); });
        });
      }
      bindMobileButton("mobileLeft", () => { if (G.targetLane > 0) G.targetLane--; });
      bindMobileButton("mobileRight", () => { if (G.targetLane < 2) G.targetLane++; });
      bindMobileButton("mobileJump", () => { jumpPressed = true; });
      bindMobileButton("mobileDuck", () => { duckPressed = true; });

      function spawnRow(z) {
        const obstacleCount = Math.random() < 0.6 ? 2 : 1;
        const lanes = [0, 1, 2].sort(() => Math.random() - 0.5);

        lanes.slice(0, obstacleCount).forEach(lane => {
          createObstacle(lane, z, TYPES[Math.floor(Math.random() * TYPES.length)]);
        });

        lanes.slice(obstacleCount).forEach(lane => {
          if (Math.random() < 0.75) {
            createCoin(lane, z);
            if (Math.random() < 0.5) createCoin(lane, z - 3.5);
          }
        });
      }

      function reset() {
        obstacles.forEach(obstacle => scene.remove(obstacle));
        obstacles.length = 0;
        coins.forEach(coin => scene.remove(coin));
        coins.length = 0;
        clearShards();

        player.visible = true;
        playerShadow.visible = true;
        player.position.set(0, 0.5, 0);
        player.rotation.set(0, 0, 0);
        player.scale.set(1, 1, 1);

        G.running = true;
        G.speed = G.baseSpeed;
        G.distance = 0;
        G.coins = 0;
        G.currentLane = 1;
        G.targetLane = 1;
        G.isJumping = false;
        G.jumpVel = 0;
        G.jumpY = 0;
        G.visualJumpY = 0;
        G.isDucking = false;
        G.duckTimer = 0;
        G.spawnTimer = 0;
        G.animPhase = 0;
        G.lastTime = performance.now();

        jumpPressed = false;
        duckPressed = false;

        atualizarHUD();
        document.getElementById("startScreen").style.display = "none";
        document.getElementById("gameOver").style.display = "none";

        for (let i = 0; i < 6; i++) spawnRow(-i * 18 - 25);
      }

      function gameOver() {
        if (!G.running) return;

        G.running = false;
        jumpPressed = false;
        duckPressed = false;
        shatterPlayer();

        // Salva exatamente a mesma pontuação exibida na tela e no HUD.
        const pontuacaoFinal = calcularPontuacao(G.distance, G.coins);
        salvarPontuacaoGlobal(playerNick, G.distance, G.coins);

        setTimeout(() => {
          document.getElementById("gameOver").style.display = "flex";
          document.getElementById("finalScore").textContent =
            `${pontuacaoFinal} pontos`;
          document.getElementById("finalDistance").textContent =
            `📍 ${Math.floor(G.distance)}m`;
          document.getElementById("finalCoins").textContent =
            `🪙 ${G.coins} moedas`;
        }, 600);
      }

      document.getElementById("startBtn").addEventListener("click", reset);
      document.getElementById("restartBtn").addEventListener("click", reset);

      function animate() {
        requestAnimationFrame(animate);

        const now = performance.now();
        const dt = Math.min((now - G.lastTime) / 16.67, 3);
        G.lastTime = now;

        if (G.running) {
          G.speed = Math.min(G.speed + 0.000004 * dt, G.maxSpeed);
          G.distance += G.speed * dt * 1.8;
          G.currentLane += (G.targetLane - G.currentLane) * 0.4 * dt;
          player.position.x = LANES[0] + G.currentLane * LANE_WIDTH;

          if (duckPressed) {
            if (G.isJumping) {
              G.jumpVel = -G.jumpPower;
            } else {
              G.isDucking = true;
              G.duckTimer = G.duckDuration;
            }
            duckPressed = false;
          }

          if (G.isDucking && (G.duckTimer -= dt) <= 0) {
            G.isDucking = false;
          }

          if (jumpPressed && !G.isJumping && !G.isDucking) {
            G.isJumping = true;
            G.jumpVel = G.jumpPower;
            jumpPressed = false;
          }

          if (G.isJumping) {
            G.jumpVel -= G.gravity * dt;
            G.jumpY += G.jumpVel * dt;

            if (G.jumpY <= 0) {
              G.jumpY = 0;
              G.jumpVel = 0;
              G.isJumping = false;
            }
          }

          G.visualJumpY += (G.jumpY - G.visualJumpY) * 0.35 * dt;
          player.position.y = G.isDucking ? 0.25 : 0.5 + G.visualJumpY;

          let sx = 1, sy = 1, sz = 1;

          if (G.isDucking) {
            sx = 1.3;
            sy = 0.5;
            sz = 1.3;
          } else if (G.isJumping) {
            const velocityRatio = G.jumpVel / G.jumpPower;
            sy = velocityRatio > 0 ? 1 + velocityRatio * 0.15 : 1 + velocityRatio * 0.1;
            sx = velocityRatio > 0 ? 1 - velocityRatio * 0.1 : 1 - velocityRatio * 0.05;
          } else {
            sy = 1 + Math.sin(now * 0.004) * 0.02;
            sx = 1 - Math.sin(now * 0.004) * 0.02;
          }

          player.scale.set(sx, sy, sz);
          player.rotation.x = G.isJumping
            ? G.visualJumpY * 0.35
            : G.isDucking ? 0.3 : player.rotation.x * 0.9;
          player.rotation.z = (G.currentLane - 1) * 0.15;

          G.animPhase += dt * G.speed * 4.5;
          const cycle = G.animPhase;

          if (legPivotL && legPivotR && armPivotL && armPivotR) {
            if (!G.isJumping && !G.isDucking) {
              const swing = Math.sin(cycle) * 0.9;
              legPivotL.rotation.x = swing;
              legPivotR.rotation.x = -swing;
              armPivotL.rotation.x = -swing * 0.8;
              armPivotR.rotation.x = swing * 0.8;
              armPivotL.rotation.z = 0;
              armPivotR.rotation.z = 0;
              player.position.y = 0.5 + G.visualJumpY + Math.abs(Math.sin(cycle)) * 0.05;
              if (body) body.rotation.z = Math.sin(cycle * 2) * 0.03;
            } else if (G.isDucking) {
              legPivotL.rotation.x = -1.2;
              legPivotR.rotation.x = -1.2;
              armPivotL.rotation.x = 0.8;
              armPivotR.rotation.x = 0.8;
            } else {
              legPivotL.rotation.x = 0.7;
              legPivotR.rotation.x = 0.4;
              armPivotL.rotation.x = -1.5;
              armPivotR.rotation.x = -1.5;
              armPivotL.rotation.z = -0.3;
              armPivotR.rotation.z = 0.3;
              if (body) body.rotation.z = 0;
            }
          }

          playerShadow.position.set(player.position.x, 0.02, player.position.z);
          const shadowScale = Math.max(0.4, 1 - G.visualJumpY / 2);
          playerShadow.scale.set(shadowScale, shadowScale, 1);
          playerShadow.material.opacity = 0.35 * shadowScale;

          G.spawnTimer += dt;
          if (G.spawnTimer > G.spawnInterval) {
            G.spawnTimer = 0;
            spawnRow(-100);
          }

          for (let i = obstacles.length - 1; i >= 0; i--) {
            if (!G.running) break;

            const obstacle = obstacles[i];
            obstacle.position.z += G.speed * dt * 15;

            if (obstacle.position.z > 15) {
              scene.remove(obstacle);
              obstacles.splice(i, 1);
              continue;
            }

            // Hitbox real: só há colisão quando os volumes do personagem
            // e do obstáculo realmente se cruzam no espaço 3D.
            // Hitbox lógica do personagem: acompanha o pulo e o agachamento,
            // sem incluir chapéu, braços ou animações visuais.
            const playerHeight = G.isDucking ? 0.72 : 2.15;
            const playerWidth = 0.72;
            const playerDepth = 0.72;
            const playerBottom = G.isJumping ? Math.max(0, G.jumpY) : 0;
            const playerBox = new THREE.Box3().setFromCenterAndSize(
              new THREE.Vector3(
                player.position.x,
                playerBottom + playerHeight / 2,
                player.position.z
              ),
              new THREE.Vector3(playerWidth, playerHeight, playerDepth)
            );
            const obstacleSize = new THREE.Vector3(
              obstacle.userData.width,
              obstacle.userData.height,
              obstacle.userData.depth
            );
            const obstacleCenter = new THREE.Vector3(
              obstacle.position.x,
              obstacle.userData.height / 2,
              obstacle.position.z
            );
            const obstacleBox = new THREE.Box3().setFromCenterAndSize(
              obstacleCenter,
              obstacleSize
            );
            const overlapsXZ =
              playerBox.max.x > obstacleBox.min.x &&
              playerBox.min.x < obstacleBox.max.x &&
              playerBox.max.z > obstacleBox.min.z &&
              playerBox.min.z < obstacleBox.max.z;

            if (overlapsXZ) {
              const type = obstacle.userData.type;

              if (type === "highBar" || type === "tunnel") {
                // Passa por baixo apenas quando a hitbox agachada cabe no vão.
                if (playerBox.max.y > obstacle.userData.minY) gameOver();
              } else if (type === "low" || type === "spikes") {
                // Barra baixa e espinhos: só colide se a hitbox tocar neles.
                if (playerBox.intersectsBox(obstacleBox)) gameOver();
              } else {
                // Blocos, pilares e caixas: colisão 3D completa.
                if (playerBox.intersectsBox(obstacleBox)) gameOver();
              }
            }
          }

          if (G.running) {
            for (let i = coins.length - 1; i >= 0; i--) {
              const coin = coins[i];
              coin.position.z += G.speed * dt * 15;
              coin.rotation.z += 0.12 * dt;
              coin.position.y = coin.userData.baseY + Math.sin(now * 0.003 + i) * 0.1;

              if (coin.position.z > 15) {
                scene.remove(coin);
                coins.splice(i, 1);
                continue;
              }

              const dx = Math.abs(player.position.x - coin.position.x);
              const dz = Math.abs(player.position.z - coin.position.z);
              const dy = Math.abs(player.position.y - coin.position.y);

              if (dx < 0.8 && dz < 1 && dy < 1.2) {
                G.coins++;
                adicionarZxPorMoeda();
                scene.remove(coin);
                coins.splice(i, 1);
              }
            }
          }

          atualizarHUD();
        }

        for (const shard of deathShards) {
          shard.position.addScaledVector(shard.userData.vel, dt);
          shard.rotation.x += shard.userData.rotVel.x * dt;
          shard.rotation.y += shard.userData.rotVel.y * dt;
          shard.rotation.z += shard.userData.rotVel.z * dt;
          shard.userData.vel.y -= 0.015 * dt;
          shard.position.y = Math.max(0, shard.position.y);
        }

        renderer.render(scene, camera);
      }

      atualizarHUD();
      animate();
    })();
  </script>
