<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Endless Runner 3D</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #1a0033; font-family: Arial, sans-serif; touch-action: none; }
  canvas { display: block; }
  
  #hud, #distance {
    position: absolute; top: 20px;
    color: white; font-weight: bold;
    text-shadow: 0 0 10px #000;
    z-index: 10; pointer-events: none;
    font-size: 26px;
  }
  #hud { left: 20px; }
  #distance { right: 20px; }
  #score { color: #ffdd00; }
  
  .screen {
    position: absolute; inset: 0;
    background: rgba(0,0,0,0.78);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    z-index: 100; color: white; text-align: center;
    padding: 20px;
  }
  .screen h1 {
    font-size: 48px; margin-bottom: 15px;
    background: linear-gradient(45deg, #00c6ff, #ff00cc);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .screen p { font-size: 18px; margin: 8px 0; opacity: 0.9; }
  .screen .key {
    display: inline-block;
    background: #fff; color: #000;
    padding: 4px 12px; border-radius: 6px;
    font-weight: bold; margin: 0 4px;
  }
  .screen button {
    margin-top: 25px;
    padding: 16px 55px;
    font-size: 24px; font-weight: bold;
    background: linear-gradient(45deg, #00c6ff, #ff00cc);
    color: white; border: none; border-radius: 50px;
    cursor: pointer;
    box-shadow: 0 0 40px rgba(255,0,204,0.5);
  }
  .screen button:active { transform: scale(0.96); }
  
  #gameOver { display: none; }
  #gameOver h1 { font-size: 56px; color: #ff3366; background: none; -webkit-text-fill-color: #ff3366; }
  #finalScore { font-size: 34px; color: #ffdd00; margin: 15px 0; }
  #finalCoins { font-size: 20px; opacity: 0.85; }
  
  #hint {
    position: absolute; bottom: 25px; left: 50%;
    transform: translateX(-50%);
    color: rgba(255,255,255,0.65);
    font-size: 15px; z-index: 10;
    pointer-events: none;
    text-shadow: 0 0 8px #000;
    white-space: nowrap;
  }
</style>
</head>
<body>

<div id="hud">🪙 <span id="score">0</span></div>
<div id="distance">📍 <span id="dist">0</span>m</div>
<div id="hint">← → mover | ↑ pular | ↓ abaixar</div>

<div id="startScreen" class="screen">
  <h1>ENDLESS RUNNER</h1>
  <p>Corra o mais longe possível!</p>
  <p style="margin-top:18px;">
    <span class="key">←</span><span class="key">→</span> ou <span class="key">A</span><span class="key">D</span> para desviar
  </p>
  <p><span class="key">↑</span> / <span class="key">W</span> / <span class="key">ESPAÇO</span> para pular</p>
  <p><span class="key">↓</span> / <span class="key">S</span> para abaixar</p>
  <button id="startBtn">JOGAR</button>
</div>

<div id="gameOver" class="screen">
  <h1>GAME OVER</h1>
  <div id="finalScore">0m</div>
  <div id="finalCoins">🪙 0 moedas</div>
  <button id="restartBtn">JOGAR NOVAMENTE</button>
</div>

<!-- Three.js CDN -->
<script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>

<script>
(function() {
  'use strict';
  
  // ============ SETUP CENA E CÂMERA ============
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x1a0033);
  scene.fog = new THREE.Fog(0x1a0033, 40, 100);
  
  const camera = new THREE.PerspectiveCamera(65, window.innerWidth/window.innerHeight, 0.1, 200);
  camera.position.set(0, 5.5, 8);
  camera.lookAt(0, 1.5, -5);
  
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  document.body.appendChild(renderer.domElement);
  
  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  // ============ ILUMINAÇÃO ============
  scene.add(new THREE.AmbientLight(0xffffff, 0.75));
  
  const sun = new THREE.DirectionalLight(0xffffff, 1);
  sun.position.set(8, 15, 8);
  sun.castShadow = true;
  sun.shadow.mapSize.width = 1024;
  sun.shadow.mapSize.height = 1024;
  sun.shadow.camera.left = -15;
  sun.shadow.camera.right = 15;
  sun.shadow.camera.top = 15;
  sun.shadow.camera.bottom = -15;
  scene.add(sun);
  
  // ============ PISTAS E CENÁRIO ============
  const LANE_WIDTH = 3;
  const LANES = [-LANE_WIDTH, 0, LANE_WIDTH];
  
  const floorGeo = new THREE.PlaneGeometry(12, 300);
  const floorMat = new THREE.MeshStandardMaterial({ color: 0x2a1a44, roughness: 0.9 });
  const floor = new THREE.Mesh(floorGeo, floorMat);
  floor.rotation.x = -Math.PI/2;
  floor.position.z = -140;
  floor.receiveShadow = true;
  scene.add(floor);
  
  for (let i = 0; i < 3; i++) {
    const lineGeo = new THREE.PlaneGeometry(0.08, 300);
    const lineMat = new THREE.MeshBasicMaterial({ color: 0x00ccff, transparent: true, opacity: 0.4 });
    const line = new THREE.Mesh(lineGeo, lineMat);
    line.rotation.x = -Math.PI/2;
    line.position.set(LANES[i], 0.01, -140);
    scene.add(line);
  }
  
  for (const side of [-1, 1]) {
    const railGeo = new THREE.BoxGeometry(0.2, 0.5, 300);
    const railMat = new THREE.MeshStandardMaterial({ color: 0xff00cc, emissive: 0xff00cc, emissiveIntensity: 0.5 });
    const rail = new THREE.Mesh(railGeo, railMat);
    rail.position.set(side * (LANE_WIDTH + 1.5), 0.25, -140);
    scene.add(rail);
  }
  
  // ============ PERSONAGEM: BOLINHA COM OLHOS ============
  // A esfera fica no centro da pista e rola enquanto o cenário vem em sua direção.
  const player = new THREE.Group();
  player.name = 'SpeedRunBall';

  const ballMat = new THREE.MeshStandardMaterial({
    color: 0x38bdf8,
    roughness: 0.38,
    metalness: 0.04
  });
  const ball = new THREE.Mesh(new THREE.SphereGeometry(0.62, 32, 24), ballMat);
  ball.name = 'Bolinha';
  ball.position.y = 0.62;
  ball.castShadow = true;
  ball.receiveShadow = true;
  player.add(ball);

  const eyeWhiteMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.25 });
  const pupilMat = new THREE.MeshStandardMaterial({ color: 0x111827, roughness: 0.2 });
  function addEye(x) {
    const eye = new THREE.Group();
    eye.position.set(x, 0.79, -0.49);
    const white = new THREE.Mesh(new THREE.SphereGeometry(0.15, 16, 12), eyeWhiteMat);
    white.scale.set(0.9, 1.12, 0.55);
    eye.add(white);
    const pupil = new THREE.Mesh(new THREE.SphereGeometry(0.075, 12, 10), pupilMat);
    pupil.position.set(0.015, -0.005, -0.075);
    eye.add(pupil);
    player.add(eye);
    return eye;
  }
  const eyeLeft = addEye(-0.22);
  const eyeRight = addEye(0.22);

  // Sorriso discreto na frente da esfera.
  const smilePoints = [];
  for (let i = 0; i <= 14; i++) {
    const t = i / 14;
    smilePoints.push(new THREE.Vector3(-0.13 + t * 0.26, 0.43 - Math.sin(t * Math.PI) * 0.045, -0.586));
  }
  const smile = new THREE.Line(
    new THREE.BufferGeometry().setFromPoints(smilePoints),
    new THREE.LineBasicMaterial({ color: 0x172033 })
  );
  player.add(smile);
  scene.add(player);

  const playerShadow = new THREE.Mesh(
    new THREE.CircleGeometry(0.58, 24),
    new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.32 })
  );
  playerShadow.rotation.x = -Math.PI / 2;
  playerShadow.position.y = 0.02;
  scene.add(playerShadow);

  const deathShards = [];
  
  function shatterPlayer() {
    player.visible = false;
    playerShadow.visible = false;
  }
  
  function clearShards() {
    deathShards.forEach(s => scene.remove(s));
    deathShards.length = 0;
  }

  // ============ SISTEMA DE OBSTÁCULOS MELHORADO ============
  const obstacles = [];
  const coins = [];
  const TYPES = ['block', 'low', 'tall', 'highBar'];
  
  function createObstacle(lane, z, type) {
    const group = new THREE.Group();
    group.position.set(LANES[lane], 0, z);
    
    if (type === 'block') {
      // CAIXA METÁLICA FUTURISTA NEON ROSA
      const mainBox = new THREE.Mesh(
        new THREE.BoxGeometry(2.2, 1.6, 2.0),
        new THREE.MeshStandardMaterial({ color: 0x1f1a24, roughness: 0.4, metalness: 0.6 })
      );
      mainBox.position.y = 0.8; mainBox.castShadow = true; mainBox.receiveShadow = true;
      group.add(mainBox);

      const stripeMat = new THREE.MeshStandardMaterial({ color: 0xff0066, emissive: 0xff0066, emissiveIntensity: 0.8 });
      const stripe1 = new THREE.Mesh(new THREE.BoxGeometry(2.26, 0.15, 2.06), stripeMat);
      stripe1.position.y = 0.5; group.add(stripe1);
      
      const stripe2 = new THREE.Mesh(new THREE.BoxGeometry(2.26, 0.15, 2.06), stripeMat);
      stripe2.position.y = 1.1; group.add(stripe2);

      group.userData = { type, width: 2.2, height: 1.6, minY: 0 };
    } 
    else if (type === 'low') {
      // BARREIRA DE ATLETISMO AMARELA/LARANJA NEON (PULÁVEL)
      const matMain = new THREE.MeshStandardMaterial({ color: 0xffaa00, emissive: 0xff6600, emissiveIntensity: 0.5, roughness: 0.3 });
      const bar = new THREE.Mesh(new THREE.BoxGeometry(2.5, 0.25, 0.4), matMain);
      bar.position.y = 0.5; bar.castShadow = true;
      group.add(bar);

      const legMat = new THREE.MeshStandardMaterial({ color: 0x333333, metalness: 0.8 });
      const legL = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.5, 0.6), legMat);
      legL.position.set(-1.1, 0.25, 0); legL.castShadow = true;
      group.add(legL);

      const legR = legL.clone();
      legR.position.x = 1.1;
      group.add(legR);

      group.userData = { type, width: 2.5, height: 0.65, minY: 0 };
    }
    else if (type === 'highBar') {
      // TRAVE ALTA NEON AZUL/TURQUESA (ABAIXÁVEL)
      const frameMat = new THREE.MeshStandardMaterial({ color: 0x112233, roughness: 0.5 });
      const neonMat = new THREE.MeshStandardMaterial({ color: 0x00ffcc, emissive: 0x00ffcc, emissiveIntensity: 0.9 });
      
      const bar = new THREE.Mesh(new THREE.BoxGeometry(2.7, 0.4, 0.6), neonMat);
      bar.position.y = 1.9; bar.castShadow = true;
      group.add(bar);
      
      const pillarL = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 2.1, 12), frameMat);
      pillarL.position.set(-1.25, 1.05, 0); pillarL.castShadow = true;
      group.add(pillarL);
      
      const pillarR = pillarL.clone();
      pillarR.position.x = 1.25;
      group.add(pillarR);
      
      group.userData = { type, width: 2.7, height: 2.2, minY: 1.4 };
    }
    else {
      // TORRE MONOLÍTICA ROXA CRISTALINA
      const mainPillar = new THREE.Mesh(
        new THREE.CylinderGeometry(1.1, 1.25, 3.4, 6),
        new THREE.MeshStandardMaterial({ color: 0x6600cc, emissive: 0x330066, emissiveIntensity: 0.6, roughness: 0.2 })
      );
      mainPillar.position.y = 1.7; mainPillar.castShadow = true; mainPillar.receiveShadow = true;
      group.add(mainPillar);

      const topGlow = new THREE.Mesh(
        new THREE.CylinderGeometry(1.12, 1.12, 0.2, 6),
        new THREE.MeshStandardMaterial({ color: 0xcc00ff, emissive: 0xcc00ff, emissiveIntensity: 0.9 })
      );
      topGlow.position.y = 3.3; group.add(topGlow);

      group.userData = { type, width: 2.2, height: 3.4, minY: 0 };
    }
    
    scene.add(group);
    obstacles.push(group);
  }
  
  function createCoin(lane, z) {
    const coin = new THREE.Mesh(
      new THREE.CylinderGeometry(0.32, 0.32, 0.08, 16),
      new THREE.MeshStandardMaterial({ color: 0xffdd00, emissive: 0xffaa00, emissiveIntensity: 0.8, roughness: 0.2 })
    );
    coin.rotation.x = Math.PI/2;
    coin.position.set(LANES[lane], 1.0, z);
    coin.castShadow = true;
    coin.userData = { baseY: 1.0 };
    scene.add(coin);
    coins.push(coin);
  }
  
  const G = {
    running: false,
    speed: 0.003,
    baseSpeed: 0.035,
    maxSpeed: 0.22,
    distance: 0,
    coins: 0,
    currentLane: 1,
    targetLane: 1,
    isJumping: false,
    jumpVel: 0,
    jumpY: 0,
    isDucking: false,
    duckTimer: 0,
    duckDuration: 18,
    gravity: 0.025,
    jumpPower: 0.20,
    spawnTimer: 0,
    spawnInterval: 75,
    lastTime: 0,
    animPhase: 0,
    visualJumpY: 0
  };
  
  let jumpPressed = false;
  let duckPressed = false;
  
  function onKeyDown(e) {
    if (!G.running) return;
    const k = e.key.toLowerCase();
    if ((k === 'arrowleft' || k === 'a') && G.targetLane > 0) { 
      G.targetLane--; 
      e.preventDefault(); 
    }
    else if ((k === 'arrowright' || k === 'd') && G.targetLane < 2) { 
      G.targetLane++; 
      e.preventDefault(); 
    }
    else if (k === 'arrowup' || k === 'w' || k === ' ' || k === 'spacebar') { 
      jumpPressed = true; 
      e.preventDefault();
    }
    else if (k === 'arrowdown' || k === 's') { 
      duckPressed = true; 
      e.preventDefault();
    }
  }
  window.addEventListener('keydown', onKeyDown);
  
  let tStartX = 0, tStartY = 0;
  window.addEventListener('touchstart', (e) => {
    tStartX = e.touches[0].clientX;
    tStartY = e.touches[0].clientY;
  }, { passive: true });
  window.addEventListener('touchend', (e) => {
    if (!G.running) return;
    const dx = e.changedTouches[0].clientX - tStartX;
    const dy = e.changedTouches[0].clientY - tStartY;
    if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 25) {
      if (dx < 0 && G.targetLane > 0) G.targetLane--;
      if (dx > 0 && G.targetLane < 2) G.targetLane++;
    } else if (dy < -25) {
      jumpPressed = true;
    } else if (dy > 25) {
      duckPressed = true;
    }
  }, { passive: true });
  
  function spawnRow(z) {
    const num = Math.random() < 0.60 ? 2 : 1;
    const lanes = [0, 1, 2].sort(() => Math.random() - 0.5);
    const chosen = lanes.slice(0, num);
    
    chosen.forEach(lane => {
      const type = TYPES[Math.floor(Math.random() * TYPES.length)];
      createObstacle(lane, z, type);
    });
    
    lanes.slice(num).forEach(lane => {
      if (Math.random() < 0.75) {
        createCoin(lane, z);
        if (Math.random() < 0.5) createCoin(lane, z - 3.5);
      }
    });
  }
  
  function reset() {
    obstacles.forEach(o => scene.remove(o));
    obstacles.length = 0;
    coins.forEach(c => scene.remove(c));
    coins.length = 0;
    clearShards();
    
    player.visible = true;
    playerShadow.visible = true;
    player.position.set(0, 0, 0);
    player.rotation.set(0, 0, 0);
    player.scale.set(1, 1, 1);
    
    G.running = true;
    G.speed = G.baseSpeed;
    G.distance = 0;
    G.coins = 0;
    G.currentLane = 1;
    G.targetLane = 1;
    G.isJumping = false;
    G.isDucking = false;
    G.duckTimer = 0;
    G.jumpVel = 0;
    G.jumpY = 0;
    G.visualJumpY = 0;
    G.spawnTimer = 0;
    G.animPhase = 0;
    G.lastTime = performance.now();
    
    document.getElementById('score').textContent = '0';
    document.getElementById('dist').textContent = '0';
    document.getElementById('startScreen').style.display = 'none';
    document.getElementById('gameOver').style.display = 'none';
    
    for (let i = 0; i < 6; i++) {
      spawnRow(-i * 18 - 25);
    }
  }
  
  function gameOver() {
    G.running = false;
    shatterPlayer();
    
    setTimeout(() => {
      document.getElementById('gameOver').style.display = 'flex';
      document.getElementById('finalScore').textContent = Math.floor(G.distance) + 'm';
      document.getElementById('finalCoins').textContent = '🪙 ' + G.coins + ' moedas';
    }, 600);
  }

  document.getElementById('startBtn').addEventListener('click', reset);
  document.getElementById('restartBtn').addEventListener('click', reset);
  
  function animate() {
    requestAnimationFrame(animate);
    
    const now = performance.now();
    const dt = Math.min((now - G.lastTime) / 16.67, 3);
    G.lastTime = now;
    
    if (G.running) {
      G.speed = Math.min(G.speed + 0.000004 * dt, G.maxSpeed);
      G.distance += G.speed * dt * 1.8;
      
      document.getElementById('dist').textContent = Math.floor(G.distance);
      document.getElementById('score').textContent = G.coins;
      
      G.currentLane += (G.targetLane - G.currentLane) * 0.40 * dt;
      player.position.x = LANES[0] + G.currentLane * LANE_WIDTH;
      
      if (duckPressed) {
        if (G.isJumping) {
          G.jumpVel = -G.jumpPower;
        } else {
          G.isDucking = true;
          G.duckTimer = G.duckDuration;
        }
        duckPressed = false;
      }
      
      if (G.isDucking) {
        G.duckTimer -= dt;
        if (G.duckTimer <= 0) G.isDucking = false;
      }
      
      if (jumpPressed && !G.isJumping && !G.isDucking) {
        G.isJumping = true;
        G.jumpVel = G.jumpPower;
        jumpPressed = false;
      }
      
      if (G.isJumping) {
        G.jumpVel -= G.gravity * dt;
        G.jumpY += G.jumpVel * dt;
        if (G.jumpY <= 0) {
          G.jumpY = 0;
          G.jumpVel = 0;
          G.isJumping = false;
        }
      }
      
      G.visualJumpY += (G.jumpY - G.visualJumpY) * 0.35 * dt;
      player.position.y = G.visualJumpY;
      
      let sx = 1, sy = 1, sz = 1;
      if (G.isDucking) {
        sy = 0.88;
        sx = 1.04;
        sz = 1.04;
        player.position.y = 0;
      } else if (G.isJumping) {
        const v = G.jumpVel / G.jumpPower;
        if (v > 0) { sy = 1 + v * 0.15; sx = 1 - v * 0.1; }
        else { sy = 1 + v * 0.1; sx = 1 - v * 0.05; }
      } else {
        sy = 1;
        sx = 1;
        sz = 1;
      }
      player.scale.set(sx, sy, sz);
      
      if (G.isJumping) {
        player.rotation.x = G.visualJumpY * 0.35;
      } else if (G.isDucking) {
        player.rotation.x = 0.3;
      } else {
        player.rotation.x *= 0.9;
      }
      player.rotation.z = (G.currentLane - 1) * 0.15;
      
      // Rolagem contínua: a esfera gira conforme a velocidade da corrida.
      const rollSpeed = (G.speed * dt * 15) / 0.62;
      if (!G.isDucking) player.rotation.x -= rollSpeed;
      else player.rotation.x -= rollSpeed * 1.25;

      // Inclina levemente nas mudanças de faixa e dá uma pequena compressão ao saltar.
      player.rotation.z = (G.currentLane - 1) * -0.12;
      if (G.isJumping) {
        const stretch = Math.min(Math.abs(G.jumpVel) * 0.22, 0.045);
        player.scale.set(1 - stretch, 1 + stretch, 1 - stretch);
      } else if (G.isDucking) {
        player.scale.set(1.06, 0.92, 1.06);
      } else {
        player.scale.set(1, 1, 1);
      }
      
      playerShadow.position.set(player.position.x, 0.02, player.position.z);
      const ss = Math.max(0.45, 1 - G.visualJumpY / 1.8);
      playerShadow.scale.set(ss, ss, 1);
      playerShadow.material.opacity = 0.35 * ss;
      
      G.spawnTimer += dt;
      if (G.spawnTimer > G.spawnInterval) {
        G.spawnTimer = 0;
        spawnRow(-100);
      }
      
      for (let i = obstacles.length - 1; i >= 0; i--) {
        const obs = obstacles[i];
        obs.position.z += G.speed * dt * 15;
        
        if (obs.position.z > 15) {
          scene.remove(obs);
          obstacles.splice(i, 1);
          continue;
        }
        
        const dx = Math.abs(player.position.x - obs.position.x);
        const dz = Math.abs(player.position.z - obs.position.z);
        const w = obs.userData.width;
        const h = obs.userData.height;
        const minY = obs.userData.minY || 0;
        
        if (dx < w * 0.5 + 0.35 && dz < 1.3) {
          const ballRadius = G.isDucking ? 0.53 : 0.62;
          const pBottom = player.position.y + 0.62 - ballRadius;
          const pTop = player.position.y + 0.62 + ballRadius;
          
          if (obs.userData.type === 'highBar') {
            if (pTop > minY) {
              gameOver();
            }
          } else if (obs.userData.type === 'low' && pBottom > h - 0.1) {
            // Pulo limpo sobre barreira baixa
          } else if (obs.userData.type === 'tall') {
            if (pBottom < h - 0.8) { gameOver(); }
          } else {
            gameOver();
          }
        }
      }
      
      for (let i = coins.length - 1; i >= 0; i--) {
        const coin = coins[i];
        coin.position.z += G.speed * dt * 15;
        coin.rotation.z += 0.12 * dt;
        coin.position.y = coin.userData.baseY + Math.sin(now * 0.003 + i) * 0.1;
        
        if (coin.position.z > 15) {
          scene.remove(coin);
          coins.splice(i, 1);
          continue;
        }
        
        const dx = Math.abs(player.position.x - coin.position.x);
        const dz = Math.abs(player.position.z - coin.position.z);
        const dy = Math.abs(player.position.y - coin.position.y);
        
        if (dx < 0.8 && dz < 1.0 && dy < 1.2) {
          G.coins++;
          scene.remove(coin);
          coins.splice(i, 1);
        }
      }
    }
    
    for (let i = deathShards.length - 1; i >= 0; i--) {
      const s = deathShards[i];
      s.position.addScaledVector(s.userData.vel, dt);
      s.rotation.x += s.userData.rotVel.x * dt;
      s.rotation.y += s.userData.rotVel.y * dt;
      s.rotation.z += s.userData.rotVel.z * dt;
      s.userData.vel.y -= 0.015 * dt;
      
      if (s.position.y < 0) {
        s.position.y = 0;
        s.userData.vel.y *= -0.3;
        s.userData.vel.x *= 0.8;
        s.userData.vel.z *= 0.8;
      }
    }
    
    renderer.render(scene, camera);
  }
  
  animate();
})();
</script>
