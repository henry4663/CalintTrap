<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Endless Runner 3D</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { overflow: hidden; font-family: 'Arial', sans-serif; background: #000; touch-action: none; }
  canvas { display: block; }
  
  #hud {
    position: absolute; top: 20px; left: 20px;
    color: white; font-size: 28px; font-weight: bold;
    text-shadow: 0 0 10px rgba(0,0,0,0.8);
    z-index: 10; pointer-events: none;
  }
  #score { color: #ffdd00; }
  
  #distance {
    position: absolute; top: 20px; right: 20px;
    color: white; font-size: 24px; font-weight: bold;
    text-shadow: 0 0 10px rgba(0,0,0,0.8);
    z-index: 10; pointer-events: none;
  }
  
  #overlay {
    position: absolute; inset: 0;
    background: rgba(0,0,0,0.75);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    z-index: 100; color: white; text-align: center;
    padding: 20px;
  }
  #overlay h1 {
    font-size: 56px; margin-bottom: 10px;
    background: linear-gradient(45deg, #00c6ff, #ff00cc);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  #overlay p { font-size: 20px; margin: 10px 0; opacity: 0.9; }
  #overlay .key {
    display: inline-block;
    background: #fff; color: #000;
    padding: 4px 12px; border-radius: 6px;
    font-weight: bold; margin: 0 4px;
  }
  #startBtn {
    margin-top: 30px;
    padding: 18px 60px;
    font-size: 28px; font-weight: bold;
    background: linear-gradient(45deg, #00c6ff, #ff00cc);
    color: white; border: none; border-radius: 50px;
    cursor: pointer;
    box-shadow: 0 0 40px rgba(255,0,204,0.5);
    transition: transform 0.2s;
  }
  #startBtn:hover { transform: scale(1.05); }
  #startBtn:active { transform: scale(0.95); }
  
  #gameOver {
    display: none;
  }
  #gameOver h1 { font-size: 64px; }
  #finalScore { font-size: 40px; color: #ffdd00; margin: 20px 0; }
  #restartBtn {
    padding: 15px 50px; font-size: 24px; font-weight: bold;
    background: linear-gradient(45deg, #00c6ff, #ff00cc);
    color: white; border: none; border-radius: 50px;
    cursor: pointer; margin-top: 20px;
  }
  
  #controls-hint {
    position: absolute; bottom: 30px; left: 50%;
    transform: translateX(-50%);
    color: rgba(255,255,255,0.7);
    font-size: 16px; z-index: 10;
    pointer-events: none;
    text-shadow: 0 0 10px rgba(0,0,0,0.9);
    white-space: nowrap;
  }
</style>
</head>
<body>

<div id="hud">🪙 <span id="score">0</span></div>
<div id="distance">📍 <span id="dist">0</span>m</div>

<div id="overlay">
  <h1>ENDLESS RUNNER</h1>
  <p>Corra o mais longe possível!</p>
  <p style="margin-top: 20px;">
    <span class="key">←</span>
    <span class="key">→</span> ou <span class="key">A</span>
    <span class="key">D</span> para desviar
  </p>
  <p>
    <span class="key">↑</span> ou <span class="key">W</span> / <span class="key">ESPAÇO</span> para pular
  </p>
  <button id="startBtn">JOGAR</button>
</div>

<div id="gameOver" style="position:absolute; inset:0; background:rgba(0,0,0,0.8); display:none; flex-direction:column; align-items:center; justify-content:center; z-index:100; color:white; text-align:center;">
  <h1 style="font-size:64px; color:#ff3366;">GAME OVER</h1>
  <div id="finalScore" style="font-size:40px; color:#ffdd00; margin:20px 0;">0m</div>
  <div id="finalCoins" style="font-size:24px; opacity:0.8;">🪙 0 moedas</div>
  <button id="restartBtn" style="padding:15px 50px; font-size:24px; font-weight:bold; background:linear-gradient(45deg,#00c6ff,#ff00cc); color:white; border:none; border-radius:50px; cursor:pointer; margin-top:20px;">JOGAR NOVAMENTE</button>
</div>

<div id="controls-hint">← → mover &nbsp;|&nbsp; ↑ pular</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.128.0/build/three.module.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';

// ============ SETUP ============
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a0033);
scene.fog = new THREE.Fog(0x1a0033, 30, 90);

const camera = new THREE.PerspectiveCamera(70, window.innerWidth/window.innerHeight, 0.1, 200);
camera.position.set(0, 5, 8);
camera.lookAt(0, 1.5, -5);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

// ============ LUZES ============
scene.add(new THREE.AmbientLight(0x8866cc, 0.6));

const sun = new THREE.DirectionalLight(0xffffff, 1.2);
sun.position.set(10, 20, 10);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
sun.shadow.camera.left = -20;
sun.shadow.camera.right = 20;
sun.shadow.camera.top = 30;
sun.shadow.camera.bottom = -30;
sun.shadow.camera.far = 60;
scene.add(sun);

const backLight = new THREE.PointLight(0xff00cc, 0.8, 40);
backLight.position.set(0, 8, -20);
scene.add(backLight);

const frontLight = new THREE.PointLight(0x00ccff, 0.6, 40);
frontLight.position.set(0, 6, 10);
scene.add(frontLight);

// ============ CHÃO ============
const FLOOR_LENGTH = 200;
const LANE_WIDTH = 3;
const LANES = [-LANE_WIDTH, 0, LANE_WIDTH];

const floorGeo = new THREE.PlaneGeometry(12, FLOOR_LENGTH);
const floorMat = new THREE.MeshStandardMaterial({ 
  color: 0x2a1a44,
  emissive: 0x110022,
  roughness: 0.8,
  metalness: 0.2
});
const floor = new THREE.Mesh(floorGeo, floorMat);
floor.rotation.x = -Math.PI/2;
floor.position.z = -FLOOR_LENGTH/2 + 10;
floor.receiveShadow = true;
scene.add(floor);

// Linhas das pistas
for (let i = 0; i < 3; i++) {
  const lineGeo = new THREE.PlaneGeometry(0.1, FLOOR_LENGTH);
  const lineMat = new THREE.MeshBasicMaterial({ color: 0x00ccff, transparent: true, opacity: 0.4 });
  const line = new THREE.Mesh(lineGeo, lineMat);
  line.rotation.x = -Math.PI/2;
  line.position.set(LANES[i], 0.01, -FLOOR_LENGTH/2 + 10);
  scene.add(line);
}

// Bordas laterais brilhantes
const railMat = new THREE.MeshStandardMaterial({ color: 0xff00cc, emissive: 0xff00cc, emissiveIntensity: 0.6 });
for (let side of [-1, 1]) {
  const railGeo = new THREE.BoxGeometry(0.2, 0.6, FLOOR_LENGTH);
  const rail = new THREE.Mesh(railGeo, railMat);
  rail.position.set(side * (LANE_WIDTH + 1.5), 0.3, -FLOOR_LENGTH/2 + 10);
  rail.castShadow = true;
  scene.add(rail);
}

// ============ JOGADOR ============
const player = new THREE.Group();
player.position.set(0, 0.5, 0);

// Corpo
const bodyGeo = new THREE.BoxGeometry(0.7, 1.4, 0.5);
const bodyMat = new THREE.MeshStandardMaterial({ 
  color: 0x00e5ff, 
  emissive: 0x0088aa, 
  emissiveIntensity: 0.4,
  roughness: 0.3,
  metalness: 0.7
});
const body = new THREE.Mesh(bodyGeo, bodyMat);
body.position.y = 0.7;
body.castShadow = true;
player.add(body);

// Cabeça
const headGeo = new THREE.BoxGeometry(0.55, 0.55, 0.55);
const headMat = new THREE.MeshStandardMaterial({ 
  color: 0xffdd00, 
  emissive: 0xaa6600, 
  emissiveIntensity: 0.3,
  roughness: 0.4,
  metalness: 0.6
});
const head = new THREE.Mesh(headGeo, headMat);
head.position.y = 1.7;
head.castShadow = true;
player.add(head);

// Olhos
const eyeGeo = new THREE.BoxGeometry(0.12, 0.12, 0.05);
const eyeMat = new THREE.MeshBasicMaterial({ color: 0x000000 });
const eyeL = new THREE.Mesh(eyeGeo, eyeMat);
eyeL.position.set(-0.15, 1.75, 0.28);
player.add(eyeL);
const eyeR = eyeL.clone();
eyeR.position.x = 0.15;
player.add(eyeR);

// Braços animados
const armGeo = new THREE.BoxGeometry(0.2, 0.7, 0.2);
const armMat = new THREE.MeshStandardMaterial({ color: 0x00e5ff, emissive: 0x0088aa, emissiveIntensity: 0.3 });
const armL = new THREE.Mesh(armGeo, armMat);
armL.position.set(-0.5, 1.1, 0);
armL.castShadow = true;
player.add(armL);
const armR = new THREE.Mesh(armGeo, armMat);
armR.position.set(0.5, 1.1, 0);
armR.castShadow = true;
player.add(armR);

// Pernas animadas
const legGeo = new THREE.BoxGeometry(0.22, 0.6, 0.22);
const legMat = new THREE.MeshStandardMaterial({ color: 0xff00cc, emissive: 0x880066, emissiveIntensity: 0.3 });
const legL = new THREE.Mesh(legGeo, legMat);
legL.position.set(-0.18, 0.3, 0);
legL.castShadow = true;
player.add(legL);
const legR = new THREE.Mesh(legGeo, legMat);
legR.position.set(0.18, 0.3, 0);
legR.castShadow = true;
player.add(legR);

scene.add(player);

// ============ GERENCIAMENTO DE OBJETOS ============
const obstacles = [];
const coins = [];

const OBSTACLE_TYPES = ['block', 'low', 'tall'];

function createObstacle(lane, zPos, type) {
  const group = new THREE.Group();
  group.position.set(LANES[lane], 0, zPos);
  group.userData.lane = lane;
  group.userData.type = type;
  
  if (type === 'block') {
    // Bloco médio - desviar
    const geo = new THREE.BoxGeometry(2.2, 1.8, 2.2);
    const mat = new THREE.MeshStandardMaterial({ 
      color: 0xff3366, emissive: 0x881133, emissiveIntensity: 0.5, roughness: 0.3, metalness: 0.6 
    });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.y = 0.9;
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    group.add(mesh);
    
    // Detalhes neon
    const edgeGeo = new THREE.BoxGeometry(2.3, 0.1, 2.3);
    const edgeMat = new THREE.MeshBasicMaterial({ color: 0xff00aa });
    const edge = new THREE.Mesh(edgeGeo, edgeMat);
    edge.position.y = 1.8;
    group.add(edge);
    
    group.userData.height = 1.8;
    group.userData.width = 2.2;
  } 
  else if (type === 'low') {
    // Obstáculo baixo - pular
    const geo = new THREE.BoxGeometry(2.4, 0.6, 1.5);
    const mat = new THREE.MeshStandardMaterial({ 
      color: 0xffaa00, emissive: 0xaa5500, emissiveIntensity: 0.6, roughness: 0.3, metalness: 0.5 
    });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.y = 0.3;
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    group.add(mesh);
    
    group.userData.height = 0.6;
    group.userData.width = 2.4;
  }
  else {
    // Obstáculo alto - não pode pular (bloqueia)
    const geo = new THREE.BoxGeometry(2.2, 3.5, 1.2);
    const mat = new THREE.MeshStandardMaterial({ 
      color: 0xaa00ff, emissive: 0x550088, emissiveIntensity: 0.5, roughness: 0.3, metalness: 0.6 
    });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.y = 1.75;
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    group.add(mesh);
    
    group.userData.height = 3.5;
    group.userData.width = 2.2;
  }
  
  scene.add(group);
  obstacles.push(group);
  return group;
}

function createCoin(lane, zPos) {
  const geo = new THREE.CylinderGeometry(0.35, 0.35, 0.1, 16);
  const mat = new THREE.MeshStandardMaterial({ 
    color: 0xffdd00, emissive: 0xffaa00, emissiveIntensity: 0.8, roughness: 0.2, metalness: 0.9 
  });
  const coin = new THREE.Mesh(geo, mat);
  coin.rotation.x = Math.PI/2;
  coin.position.set(LANES[lane], 1.0, zPos);
  coin.castShadow = true;
  coin.userData.lane = lane;
  coin.userData.rotSpeed = 0.1;
  scene.add(coin);
  coins.push(coin);
  return coin;
}

// ============ ESTADO DO JOGO ============
const GAME = {
  running: false,
  over: false,
  speed: 0.35,
  baseSpeed: 0.35,
  maxSpeed: 0.9,
  score: 0,
  coins: 0,
  distance: 0,
  targetLane: 1,
  currentLane: 1,
  laneChangeSpeed: 0.15,
  isJumping: false,
  jumpVelocity: 0,
  jumpHeight: 0,
  gravity: 0.025,
  jumpPower: 0.28,
  spawnTimer: 0,
  spawnInterval: 60,
  coinTimer: 0,
  coinInterval: 40,
  lastTime: 0
};

const keys = { left: false, right: false, jump: false };
let jumpPressed = false;

// ============ CONTROLES ============
function handleKeyDown(e) {
  const k = e.key.toLowerCase();
  if (k === 'arrowleft' || k === 'a') { keys.left = true; e.preventDefault(); }
  if (k === 'arrowright' || k === 'd') { keys.right = true; e.preventDefault(); }
  if (k === 'arrowup' || k === 'w' || k === ' ') { 
    if (!keys.jump) jumpPressed = true;
    keys.jump = true; e.preventDefault(); 
  }
}
function handleKeyUp(e) {
  const k = e.key.toLowerCase();
  if (k === 'arrowleft' || k === 'a') keys.left = false;
  if (k === 'arrowright' || k === 'd') keys.right = false;
  if (k === 'arrowup' || k === 'w' || k === ' ') keys.jump = false;
}
window.addEventListener('keydown', handleKeyDown);
window.addEventListener('keyup', handleKeyUp);

// Touch controls
let touchStartX = 0, touchStartY = 0;
window.addEventListener('touchstart', (e) => {
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
}, { passive: true });
window.addEventListener('touchend', (e) => {
  const dx = e.changedTouches[0].clientX - touchStartX;
  const dy = e.changedTouches[0].clientY - touchStartY;
  if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 30) {
    if (dx < 0) moveLeft(); else moveRight();
  } else if (dy < -30) {
    jumpPressed = true;
  }
}, { passive: true });

function moveLeft() {
  if (GAME.targetLane > 0) GAME.targetLane--;
}
function moveRight() {
  if (GAME.targetLane < 2) GAME.targetLane++;
}

// ============ INICIAR / RESET ============
function resetGame() {
  // Limpar obstáculos e moedas
  obstacles.forEach(o => scene.remove(o));
  obstacles.length = 0;
  coins.forEach(c => scene.remove(c));
  coins.length = 0;
  
  // Reset jogador
  player.position.set(0, 0.5, 0);
  player.rotation.set(0, 0, 0);
  
  // Reset estado
  GAME.running = true;
  GAME.over = false;
  GAME.speed = GAME.baseSpeed;
  GAME.score = 0;
  GAME.coins = 0;
  GAME.distance = 0;
  GAME.targetLane = 1;
  GAME.currentLane = 1;
  GAME.isJumping = false;
  GAME.jumpVelocity = 0;
  GAME.jumpHeight = 0;
  GAME.spawnTimer = 0;
  GAME.coinTimer = 0;
  
  // UI
  document.getElementById('score').textContent = '0';
  document.getElementById('dist').textContent = '0';
  document.getElementById('overlay').style.display = 'none';
  document.getElementById('gameOver').style.display = 'none';
  
  // Spawn inicial
  for (let i = 0; i < 5; i++) {
    spawnRow(-i * 15 - 20);
  }
}

function gameOver() {
  GAME.running = false;
  GAME.over = true;
  document.getElementById('gameOver').style.display = 'flex';
  document.getElementById('finalScore').textContent = Math.floor(GAME.distance) + 'm';
  document.getElementById('finalCoins').textContent = '🪙 ' + GAME.coins + ' moedas';
}

// ============ SPAWN ============
function spawnRow(zPos) {
  // Escolhe 1 ou 2 pistas para ter obstáculo
  const numObstacles = Math.random() < 0.4 ? 2 : 1;
  const lanes = [0, 1, 2];
  const shuffled = lanes.sort(() => Math.random() - 0.5);
  const chosenLanes = shuffled.slice(0, numObstacles);
  
  chosenLanes.forEach(lane => {
    const type = OBSTACLE_TYPES[Math.floor(Math.random() * OBSTACLE_TYPES.length)];
    createObstacle(lane, zPos, type);
  });
  
  // Moedas nas pistas livres
  const freeLanes = lanes.filter(l => !chosenLanes.includes(l));
  freeLanes.forEach(lane => {
    if (Math.random() < 0.6) {
      createCoin(lane, zPos - 3);
      if (Math.random() < 0.5) createCoin(lane, zPos - 6);
    }
  });
}

// ============ LOOP ============
function animate() {
  requestAnimationFrame(animate);
  
  const now = performance.now();
  const dt = Math.min((now - GAME.lastTime) / 16.67, 3); // normalizado a 60fps
  GAME.lastTime = now;
  
  if (GAME.running) {
    // Aumenta velocidade gradualmente
    GAME.speed = Math.min(GAME.speed + 0.0001 * dt, GAME.maxSpeed);
    GAME.distance += GAME.speed * dt;
    
    // Atualizar UI
    document.getElementById('dist').textContent = Math.floor(GAME.distance);
    document.getElementById('score').textContent = GAME.coins;
    
    // Movimento lateral
    if (keys.left) moveLeft();
    if (keys.right) moveRight();
    
    GAME.currentLane += (GAME.targetLane - GAME.currentLane) * GAME.laneChangeSpeed * dt;
    player.position.x = LANES[0] + GAME.currentLane * LANE_WIDTH;
    
    // Pulo
    if (jumpPressed && !GAME.isJumping) {
      GAME.isJumping = true;
      GAME.jumpVelocity = GAME.jumpPower;
      jumpPressed = false;
    }
    if (!keys.jump) jumpPressed = false;
    
    if (GAME.isJumping) {
      GAME.jumpVelocity -= GAME.gravity * dt;
      GAME.jumpHeight += GAME.jumpVelocity * dt;
      
      if (GAME.jumpHeight <= 0) {
        GAME.jumpHeight = 0;
        GAME.jumpVelocity = 0;
        GAME.isJumping = false;
      }
    }
    
    player.position.y = 0.5 + GAME.jumpHeight;
    
    // Animação das pernas/braços
    const runCycle = now * 0.02;
    if (!GAME.isJumping) {
      legL.rotation.x = Math.sin(runCycle) * 0.6;
      legR.rotation.x = -Math.sin(runCycle) * 0.6;
      armL.rotation.x = -Math.sin(runCycle) * 0.5;
      armR.rotation.x = Math.sin(runCycle) * 0.5;
    } else {
      legL.rotation.x = 0.3;
      legR.rotation.x = -0.3;
      armL.rotation.x = -0.8;
      armR.rotation.x = -0.8;
    }
    
    // Rotação leve do jogador
    player.rotation.z = (GAME.currentLane - 1) * -0.15;
    
    // Spawn de obstáculos
    GAME.spawnTimer += dt;
    if (GAME.spawnTimer > GAME.spawnInterval - GAME.distance * 0.05) {
      GAME.spawnTimer = 0;
      spawnRow(-80);
    }
    
    // Mover e checar obstáculos
    for (let i = obstacles.length - 1; i >= 0; i--) {
      const obs = obstacles[i];
      obs.position.z += GAME.speed * dt;
      
      // Rotação decorativa
      obs.children.forEach(c => {
        if (c.material && c.material.emissive) {
          c.rotation.y += 0.02;
        }
      });
      
      // Remover se passou
      if (obs.position.z > 15) {
        scene.remove(obs);
        obstacles.splice(i, 1);
        continue;
      }
      
      // Colisão
      const dx = Math.abs(player.position.x - obs.position.x);
      const dz = Math.abs(player.position.z - obs.position.z);
      const obsWidth = obs.userData.width || 2;
      const obsHeight = obs.userData.height || 1.5;
      
      if (dx < obsWidth * 0.5 + 0.3 && dz < 1.2) {
        // Verifica colisão vertical
        const playerBottom = player.position.y - 0.5;
        const playerTop = player.position.y + 0.9;
        const obsTop = obsHeight;
        
        // Se o jogador está acima do obstáculo baixo, não colide
        if (obs.userData.type === 'low' && playerBottom > obsTop - 0.1) {
          // passou por cima
        } else {
          gameOver();
        }
      }
    }
    
    // Mover moedas
    for (let i = coins.length - 1; i >= 0; i--) {
      const coin = coins[i];
      coin.position.z += GAME.speed * dt;
      coin.rotation.z += 0.1 * dt;
      
      if (coin.position.z > 15) {
        scene.remove(coin);
        coins.splice(i, 1);
        continue;
      }
      
      // Coleta
      const dx = Math.abs(player.position.x - coin.position.x);
      const dz = Math.abs(player.position.z - coin.position.z);
      const dy = Math.abs(player.position.y - coin.position.y);
      
      if (dx < 1.0 && dz < 1.0 && dy < 1.5) {
        GAME.coins++;
        document.getElementById('score').textContent = GAME.coins;
        scene.remove(coin);
        coins.splice(i, 1);
      }
    }
    
    // Câmera segue suavemente
    camera.position.x += (player.position.x * 0.4 - camera.position.x) * 0.08;
    camera.position.z = player.position.z + 8;
    camera.position.y = 5 + GAME.jumpHeight * 0.5;
    camera.lookAt(player.position.x * 0.5, 1.5, player.position.z - 5);
  }
  
  renderer.render(scene, camera);
}

// ============ BOTÕES ============
document.getElementById('startBtn').addEventListener('click', resetGame);
document.getElementById('restartBtn').addEventListener('click', resetGame);

// ============ RESIZE ============
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ============ INICIAR ============
GAME.lastTime = performance.now();
animate();
</script>
</body>
</html>
