
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Goblox</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body {
      background: linear-gradient(135deg,#1e1b4b,#0f172a,#064e3b);
    }
    .hidden { display: none !important; }
  </style>
</head>
<body class="min-h-screen font-sans">

<section id="auth-screen" class="fixed inset-0 flex items-center justify-center p-4">
  <div class="w-full max-w-sm rounded-3xl border border-slate-700 bg-slate-900 p-8 text-center shadow-2xl">
    <h1 class="mb-6 text-5xl font-black text-red-500">goblox</h1>

    <div id="auth-message" class="hidden mb-4 rounded-xl p-3 text-sm"></div>

    <form id="login-form" class="space-y-4">
      <h2 class="text-lg font-bold text-white">Entrar na conta</h2>
      <input id="login-username" required placeholder="Nome de usuário"
        class="w-full rounded-xl bg-slate-800 p-4 text-white">
      <input id="login-password" type="password" required placeholder="Senha"
        class="w-full rounded-xl bg-slate-800 p-4 text-white">
      <button class="w-full rounded-xl bg-red-600 p-4 font-bold text-white">Entrar</button>
      <button id="show-signup" type="button"
        class="w-full rounded-xl bg-slate-700 p-3 text-white">Criar conta</button>
    </form>

    <form id="signup-form" class="hidden space-y-4">
      <h2 class="text-lg font-bold text-white">Criar conta</h2>
      <input id="signup-username" required minlength="3" maxlength="20"
        placeholder="Nome de usuário"
        class="w-full rounded-xl bg-slate-800 p-4 text-white">
      <input id="signup-password" type="password" required minlength="6"
        placeholder="Senha (mín. 6 caracteres)"
        class="w-full rounded-xl bg-slate-800 p-4 text-white">
      <input id="signup-password-confirm" type="password" required
        placeholder="Confirmar senha"
        class="w-full rounded-xl bg-slate-800 p-4 text-white">
      <button class="w-full rounded-xl bg-green-600 p-4 font-bold text-white">Criar conta</button>
      <button id="show-login" type="button"
        class="w-full rounded-xl bg-slate-700 p-3 text-white">Voltar</button>
    </form>

    <p class="mt-5 text-xs text-slate-500">Goblox • Login por usuário</p>
  </div>
</section>

<div id="main-app" class="hidden min-h-screen bg-slate-100">
  <header class="flex items-center justify-between bg-white p-4 shadow">
    <span class="text-3xl font-black text-red-600">GOBLOX</span>
    <div class="flex items-center gap-3">
      <span id="display-username" class="font-bold text-slate-800"></span>
      <button id="logout-button" class="rounded-lg bg-red-600 px-3 py-2 text-white">Sair</button>
    </div>
  </header>

  <main class="mx-auto max-w-7xl p-6">
    <div class="mb-8 rounded-2xl bg-gradient-to-r from-red-600 to-rose-700 p-8 text-white">
      <h1 id="welcome-title" class="text-3xl font-black">Bem-vindo ao Goblox!</h1>
      <p>Explore os mundos criados pela comunidade.</p>
    </div>

    <input id="search-input" placeholder="Buscar jogos..."
      class="mb-6 w-full rounded-xl border p-4 text-slate-800">

    <h2 class="mb-4 text-xl font-bold text-slate-900">Jogos em destaque</h2>
    <div id="games-grid" class="grid grid-cols-1 gap-6 sm:grid-cols-2 lg:grid-cols-4"></div>
  </main>
</div>

<script src="./lock.js" defer></script>
</body>
</html>
