<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GOBLOX — Lobby</title>
  <link rel="stylesheet" href="./global.css" />
  <link rel="stylesheet" href="./lobby.css" />
  <style>
    /* Estilo rápido para as moedas na topbar */
    .currency-container {
      display: flex;
      gap: 12px;
      align-items: center;
      background: rgba(0, 0, 0, 0.3);
      padding: 6px 12px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      font-size: 0.9rem;
      font-weight: bold;
    }
    .currency-item {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .currency-fbux { color: #facc15; }
    .currency-coins { color: #4ade80; }
  </style>
</head>
<body>
  <div class="bg"></div>

  <header class="topbar">
    <div class="logo">GOBLOX</div>

    <div class="user-box">
      <!-- Mostradores de Moedas e FBUX -->
      <div class="currency-container">
        <div class="currency-item currency-fbux" title="FBUX (Moeda Premium)">
          💎 <span id="valFbux">0</span> FBUX
        </div>
        <div class="currency-item currency-coins" title="Moedas do Jogo">
          🪙 <span id="valMoedas">0</span> Moedas
        </div>
      </div>

      <span id="boasVindas">Carregando...</span>
      <button id="btnPerfil" class="btn btn-light">Perfil</button>
      <button id="btnSair" class="btn btn-dark">Sair</button>
    </div>
  </header>

  <main class="container">
    <section class="panel">
      <p class="label">Modo de jogo</p>
      <h1>Escolha sua arena</h1>

      <div class="stats">
        <span>Rank: Bronze</span>
        <span>Vitórias: 0</span>
      </div>

      <div class="game-list">
        <button class="game-card" data-page="jogo-parkour.html">
          <span class="tag">Parkour</span>
          <strong>Parkour</strong>
          <small>Pule, corra e domine plataformas em movimento.</small>
        </button>

        <button class="game-card" data-page="jogo-3d.html">
          <span class="tag">3D</span>
          <strong>Arena 3D</strong>
          <small>Mapa com arena e mecânicas modernas.</small>
        </button>

        <button class="game-card" data-page="jogo-fps.html">
          <span class="tag">Multiplayer</span>
          <strong>FPS Arena</strong>
          <small>Modo de combate rápido com mira e tempo real.</small>
        </button>

        <button class="game-card" data-page="lock.html">
          <span class="tag">Sair</span>
          <strong>Logout</strong>
          <small>Voltar para a tela de login.</small>
        </button>
      </div>
    </section>
  </main>

  <div id="toast" class="toast" aria-live="polite"></div>

  <script type="module" src="./lobby.js"></script>
</body>
</html>
