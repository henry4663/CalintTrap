<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Goblox - Multiplayer Nativo</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
    user-select: none;
    -webkit-user-select: none;
}

body {
    min-height: 100vh;
    background: #080012;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
}

/* CANVAS DO JOGO */
#gameCanvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    background: radial-gradient(circle at center, #1a0b2e 0%, #080012 100%);
    z-index: 1;
}

/* HUD SUPERIOR */
.hud-top {
    position: absolute;
    top: 20px;
    left: 20px;
    z-index: 10;
    background: rgba(0, 0, 0, 0.6);
    border: 1px solid rgba(255, 255, 255, 0.2);
    padding: 10px 18px;
    border-radius: 12px;
    backdrop-filter: blur(5px);
}

.hud-top h2 {
    font-size: 1.2rem;
    color: #c5a4ff;
}

.hud-top p {
    font-size: 0.85rem;
    color: #4ade80;
}

/* BOTÃO VOLTAR AO LOBBY */
.btn-voltar {
    position: absolute;
    top: 20px;
    right: 20px;
    z-index: 10;
    background: rgba(239, 68, 68, 0.8);
    color: white;
    border: none;
    padding: 10px 16px;
    border-radius: 10px;
    font-weight: bold;
    cursor: pointer;
    font-size: 0.9rem;
}
.btn-voltar:hover {
    background: #dc2626;
}

/* === CONTROLES MOBILE === */
.mobile-controls {
    position: absolute;
    inset: 0;
    z-index: 20;
    pointer-events: none;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    padding: 30px;
}

/* JOYSTICK */
#joystick-base {
    position: relative;
    width: 130px;
    height: 130px;
    background: rgba(255, 255, 255, 0.08);
    border: 2px solid rgba(255, 255, 255, 0.2);
    border-radius: 50%;
    pointer-events: auto;
    touch-action: none;
    backdrop-filter: blur(4px);
}

#joystick-stick {
    position: absolute;
    top: 35px;
    left: 35px;
    width: 60px;
    height: 60px;
    background: linear-gradient(135deg, #7900ff, #b56cff);
    border-radius: 50%;
    box-shadow: 0 0 15px rgba(121, 0, 255, 0.6);
    transition: transform 0.05s linear;
}

/* BOTÃO DE PULO */
#btn-jump {
    width: 90px;
    height: 90px;
    background: linear-gradient(135deg, #ff4757, #ff6b81);
    border: none;
    border-radius: 50%;
    color: white;
    font-size: 1.1rem;
    font-weight: bold;
    box-shadow: 0 6px 20px rgba(255, 71, 87, 0.5);
    pointer-events: auto;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    touch-action: manipulation;
}
#btn-jump:active {
    transform: scale(0.9);
}
</style>
</head>

<body>

    <div class="hud-top">
        <h2 id="playerName">A carregar...</h2>
        <p>🟢 Multiplayer Ativo</p>
    </div>

    <button class="btn-voltar" onclick="sairDoJogo()">🏠 Sair</button>

    <canvas id="gameCanvas"></canvas>

    <div class="mobile-controls">
        <div id="joystick-base">
            <div id="joystick-stick"></div>
        </div>
        <button id="btn-jump">PULAR</button>
    </div>

<script type="module">
    import { db } from "./firebase.js";
    import { ref, set, onValue, remove, onDisconnect } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
    import { getCurrentNick } from "./authLocal.js";

    // 1. Verifica autenticação
    const nick = getCurrentNick() || "Jogador_" + Math.floor(Math.random() * 1000);
    document.getElementById("playerName").textContent = nick;

    // 2. Configuração do Canvas
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();

    // Posição local do jogador
    const player = {
        x: canvas.width / 2,
        y: canvas.height - 150,
        size: 40,
        speed: 4,
        vy: 0,
        isJumping: false
    };

    // ID único para esta aba/conexão no Firebase
    const clientId = 'player_' + Math.random().toString(36).substring(2, 9);
    const playerRef = ref(db, `forest_players/${clientId}`);

    // Garante que o player sai do Firebase ao fechar ou sair
    onDisconnect(playerRef).remove();

    // Lista de outros jogadores online
    let outrosJogadores = {};

    // Ouve em tempo real todos os jogadores no Firebase
    onValue(ref(db, "forest_players"), (snapshot) => {
        outrosJogadores = snapshot.val() || {};
    });

    // --- CONTROLO DO JOYSTICK ---
    const joystickBase = document.getElementById("joystick-base");
    const joystickStick = document.getElementById("joystick-stick");
    
    let joystickActive = false;
    let touchId = null;
    let moveVector = { x: 0, y: 0 };
    
    const centerX = 65;
    const centerY = 65;
    const maxDist = 45;

    joystickBase.addEventListener("touchstart", (e) => {
        e.preventDefault();
        const touch = e.changedTouches[0];
        touchId = touch.identifier;
        joystickActive = true;
    }, { passive: false });

    window.addEventListener("touchmove", (e) => {
        if (!joystickActive) return;
        
        for (let i = 0; i < e.changedTouches.length; i++) {
            const touch = e.changedTouches[i];
            if (touch.identifier === touchId) {
                const rect = joystickBase.getBoundingClientRect();
                const touchX = touch.clientX - rect.left;
                const touchY = touch.clientY - rect.top;

                let dx = touchX - centerX;
                let dy = touchY - centerY;
                const distance = Math.hypot(dx, dy);

                if (distance > maxDist) {
                    dx = (dx / distance) * maxDist;
                    dy = (dy / distance) * maxDist;
                }

                joystickStick.style.transform = `translate(${dx}px, ${dy}px)`;
                moveVector.x = dx / maxDist;
                moveVector.y = dy / maxDist;
            }
        }
    }, { passive: false });

    function resetJoystick() {
        joystickActive = false;
        touchId = null;
        moveVector = { x: 0, y: 0 };
        joystickStick.style.transform = `translate(0px, 0px)`;
    }

    window.addEventListener("touchend", (e) => {
        for (let i = 0; i < e.changedTouches.length; i++) {
            if (e.changedTouches[i].identifier === touchId) {
                resetJoystick();
            }
        }
    });

    // Botão de Pulo
    const btnJump = document.getElementById("btn-jump");
    btnJump.addEventListener("touchstart", (e) => {
        e.preventDefault();
        if (!player.isJumping) {
            player.vy = -12;
            player.isJumping = true;
        }
    }, { passive: false });

    // Função de saída
    window.sairDoJogo = function() {
        remove(playerRef).then(() => {
            window.location.href = "lobby.html";
        });
    };

    // --- LOOP DO JOGO ---
    function update() {
        player.x += moveVector.x * player.speed;
        player.y += moveVector.y * player.speed;

        // Gravidade e Solo
        player.y += player.vy;
        player.vy += 0.6;

        const groundLevel = canvas.height - 120;
        if (player.y > groundLevel) {
            player.y = groundLevel;
            player.vy = 0;
            player.isJumping = false;
        }

        // Limites da tela
        if (player.x < 30) player.x = 30;
        if (player.x > canvas.width - 30) player.x = canvas.width - 30;

        // Envia a posição atualizada para o Firebase em tempo real
        set(playerRef, {
            nome: nick,
            x: Math.round(player.x),
            y: Math.round(player.y),
            atualizadoEm: Date.now()
        }).catch(() => {});
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Desenha o chão
        ctx.fillStyle = "#2c1654";
        ctx.fillRect(0, canvas.height - 100, canvas.width, 100);

        // Desenha TODOS os jogadores online vindos do Firebase
        for (let id in outrosJogadores) {
            const p = outrosJogadores[id];
            const isLocal = (id === clientId);

            ctx.fillStyle = isLocal ? "#7900ff" : "#3b82f6";
            ctx.beginPath();
            ctx.arc(p.x, p.y, player.size / 2, 0, Math.PI * 2);
            ctx.fill();
            ctx.lineWidth = 3;
            ctx.strokeStyle = isLocal ? "#b56cff" : "#93c5fd";
            ctx.stroke();

            // Nome do jogador
            ctx.fillStyle = "white";
            ctx.font = "bold 13px Arial";
            ctx.textAlign = "center";
            ctx.fillText(p.nome || "Jogador", p.x, p.y - 30);
        }
    }

    function loop() {
        update();
        draw();
        requestAnimationFrame(loop);
    }

    loop();
</script>

</body>
</html>
