<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Goblox - Zombie Apocalypse Multiplayer</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
    user-select: none;
    -webkit-user-select: none;
}

body {
    min-height: 100vh;
    background: #080012;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
}

/* CANVAS DO JOGO */
#gameCanvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    background: #0d0614;
    z-index: 1;
}

/* HUD SUPERIOR */
.hud-top {
    position: absolute;
    top: 20px;
    left: 20px;
    z-index: 10;
    background: rgba(0, 0, 0, 0.7);
    border: 1px solid rgba(255, 255, 255, 0.2);
    padding: 12px 20px;
    border-radius: 14px;
    backdrop-filter: blur(5px);
    display: flex;
    flex-direction: column;
    gap: 4px;
}

.hud-top h2 {
    font-size: 1.1rem;
    color: #ff4757;
}

.hud-top p {
    font-size: 0.9rem;
    color: #f1c40f;
    font-weight: bold;
}

/* BOTÕES SUPERIORES */
.hud-buttons {
    position: absolute;
    top: 20px;
    right: 20px;
    z-index: 10;
    display: flex;
    gap: 10px;
}

.btn-hud {
    background: rgba(59, 130, 246, 0.8);
    color: white;
    border: none;
    padding: 10px 16px;
    border-radius: 10px;
    font-weight: bold;
    cursor: pointer;
    font-size: 0.9rem;
    backdrop-filter: blur(5px);
}
.btn-hud:hover { background: #2563eb; }

.btn-sair {
    background: rgba(239, 68, 68, 0.8);
}
.btn-sair:hover { background: #dc2626; }

/* === CONTROLES MOBILE === */
.mobile-controls {
    position: absolute;
    inset: 0;
    z-index: 20;
    pointer-events: none;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    padding: 30px;
}

/* JOYSTICK DE MOVIMENTO */
#joystick-base {
    position: relative;
    width: 130px;
    height: 130px;
    background: rgba(255, 255, 255, 0.08);
    border: 2px solid rgba(255, 255, 255, 0.2);
    border-radius: 50%;
    pointer-events: auto;
    touch-action: none;
    backdrop-filter: blur(4px);
}

#joystick-stick {
    position: absolute;
    top: 35px;
    left: 35px;
    width: 60px;
    height: 60px;
    background: linear-gradient(135deg, #7900ff, #b56cff);
    border-radius: 50%;
    box-shadow: 0 0 15px rgba(121, 0, 255, 0.6);
}

/* BOTÕES DE AÇÃO (ATIRAR + PULAR) */
.action-buttons {
    display: flex;
    flex-direction: column;
    gap: 15px;
    pointer-events: auto;
}

.btn-action {
    width: 80px;
    height: 80px;
    border: none;
    border-radius: 50%;
    color: white;
    font-size: 0.9rem;
    font-weight: bold;
    box-shadow: 0 6px 20px rgba(0,0,0,0.4);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    touch-action: manipulation;
}

#btn-shoot {
    background: linear-gradient(135deg, #f39c12, #e67e22);
    box-shadow: 0 6px 20px rgba(243, 156, 18, 0.5);
}
#btn-shoot:active { transform: scale(0.9); }

#btn-jump {
    background: linear-gradient(135deg, #3498db, #2980b9);
    box-shadow: 0 6px 20px rgba(52, 152, 219, 0.5);
}
#btn-jump:active { transform: scale(0.9); }

/* LOJA DE EVOLUÇÃO */
#shop-modal {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.8);
    z-index: 100;
    display: none;
    align-items: center;
    justify-content: center;
}

.shop-content {
    background: #1a0b2e;
    border: 2px solid #7900ff;
    padding: 30px;
    border-radius: 20px;
    width: 90%;
    max-width: 400px;
    text-align: center;
}

.shop-content h2 { color: #f1c40f; margin-bottom: 20px; }
.shop-item {
    background: rgba(255,255,255,0.05);
    padding: 15px;
    border-radius: 12px;
    margin-bottom: 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}
.shop-item button {
    background: #2ecc71;
    color: white;
    border: none;
    padding: 8px 14px;
    border-radius: 8px;
    font-weight: bold;
    cursor: pointer;
}
.shop-item button:hover { background: #27ae60; }
.btn-fechar-shop {
    margin-top: 15px;
    background: #e74c3c;
    color: white;
    border: none;
    padding: 10px 20px;
    border-radius: 10px;
    font-weight: bold;
    cursor: pointer;
}
</style>
</head>

<body>

    <div class="hud-top">
        <h2 id="playerName">A carregar...</h2>
        <p>💰 Dinheiro: $<span id="playerMoney">0</span> | Arma: <span id="weaponName">Pistola Básica</span></p>
    </div>

    <div class="hud-buttons">
        <button class="btn-hud" onclick="abrirLoja()">🛒 Loja</button>
        <button class="btn-hud btn-sair" onclick="sairDoJogo()">🏠 Sair</button>
    </div>

    <canvas id="gameCanvas"></canvas>

    <div class="mobile-controls">
        <div id="joystick-base">
            <div id="joystick-stick"></div>
        </div>
        <div class="action-buttons">
            <button class="btn-action" id="btn-shoot">💥 ATIRAR</button>
            <button class="btn-action" id="btn-jump">⬆ PULAR</button>
        </div>
    </div>

    <!-- MODAL DA LOJA -->
    <div id="shop-modal">
        <div class="shop-content">
            <h2>LOJA DE ARMAS & EVOLUÇÃO</h2>
            <div class="shop-item">
                <span>🔫 Metralhadora (Dano 2x)<br><b>$200</b></span>
                <button onclick="comprarArma('Metralhadora', 200, 2)">Comprar</button>
            </div>
            <div class="shop-item">
                <span>🔥 Bazuca Laser (Dano 5x)<br><b>$600</b></span>
                <button onclick="comprarArma('Bazuca Laser', 600, 5)">Comprar</button>
            </div>
            <button class="btn-fechar-shop" onclick="fecharLoja()">Fechar</button>
        </div>
    </div>

<script type="module">
    import { db } from "./firebase.js";
    import { ref, set, onValue, remove, onDisconnect } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
    import { getCurrentNick } from "./authLocal.js";

    const nick = getCurrentNick() || "Sobrevivente_" + Math.floor(Math.random() * 1000);
    document.getElementById("playerName").textContent = nick;

    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();

    // Dados do Jogador
    let player = {
        x: canvas.width / 2,
        y: canvas.height - 150,
        size: 40,
        speed: 4,
        vy: 0,
        isJumping: false,
        dinheiro: 0,
        danoArma: 1,
        nomeArma: "Pistola Básica"
    };

    const clientId = 'player_' + Math.random().toString(36).substring(2, 9);
    const playerRef = ref(db, `zombie_room/${clientId}`);
    onDisconnect(playerRef).remove();

    let outrosJogadores = {};
    onValue(ref(db, "zombie_room"), (snapshot) => {
        outrosJogadores = snapshot.val() || {};
    });

    // ZOMBIES
    let zombies = [
        { x: 100, y: canvas.height - 140, hp: 3, speed: 1.5, size: 35 },
        { x: canvas.width - 150, y: canvas.height - 140, hp: 3, speed: 1.2, size: 35 },
        { x: canvas.width / 2, y: canvas.height - 140, hp: 3, speed: 1.8, size: 35 }
    ];

    // BALAS DO JOGADOR
    let balas = [];

    // --- CONTROLO DO JOYSTICK ---
    const joystickBase = document.getElementById("joystick-base");
    const joystickStick = document.getElementById("joystick-stick");
    let joystickActive = false;
    let touchId = null;
    let moveVector = { x: 0, y: 0 };
    const centerX = 65, centerY = 65, maxDist = 45;

    joystickBase.addEventListener("touchstart", (e) => {
        e.preventDefault();
        const touch = e.changedTouches[0];
        touchId = touch.identifier;
        joystickActive = true;
    }, { passive: false });

    window.addEventListener("touchmove", (e) => {
        if (!joystickActive) return;
        for (let i = 0; i < e.changedTouches.length; i++) {
            const touch = e.changedTouches[i];
            if (touch.identifier === touchId) {
                const rect = joystickBase.getBoundingClientRect();
                let dx = touch.clientX - rect.left - centerX;
                let dy = touch.clientY - rect.top - centerY;
                const distance = Math.hypot(dx, dy);
                if (distance > maxDist) {
                    dx = (dx / distance) * maxDist;
                    dy = (dy / distance) * maxDist;
                }
                joystickStick.style.transform = `translate(${dx}px, ${dy}px)`;
                moveVector.x = dx / maxDist;
                moveVector.y = dy / maxDist;
            }
        }
    }, { passive: false });

    function resetJoystick() {
        joystickActive = false;
        touchId = null;
        moveVector = { x: 0, y: 0 };
        joystickStick.style.transform = `translate(0px, 0px)`;
    }
    window.addEventListener("touchend", (e) => {
        for (let i = 0; i < e.changedTouches.length; i++) {
            if (e.changedTouches[i].identifier === touchId) resetJoystick();
        }
    });

    // BOTÃO DE PULO
    document.getElementById("btn-jump").addEventListener("touchstart", (e) => {
        e.preventDefault();
        if (!player.isJumping) {
            player.vy = -12;
            player.isJumping = true;
        }
    }, { passive: false });

    // BOTÃO DE ATIRAR
    document.getElementById("btn-shoot").addEventListener("touchstart", (e) => {
        e.preventDefault();
        balas.push({
            x: player.x,
            y: player.y,
            vx: moveVector.x !== 0 ? Math.sign(moveVector.x) * 10 : 8,
            dano: player.danoArma
        });
    }, { passive: false });

    // LOJA FUNÇÕES
    window.abrirLoja = () => document.getElementById("shop-modal").style.display = "flex";
    window.fecharLoja = () => document.getElementById("shop-modal").style.display = "none";

    window.comprarArma = (nome, preco, dano) => {
        if (player.dinheiro >= preco) {
            player.dinheiro -= preco;
            player.danoArma = dano;
            player.nomeArma = nome;
            document.getElementById("playerMoney").textContent = player.dinheiro;
            document.getElementById("weaponName").textContent = nome;
            alert(`Compra efetuada! Agora tens a ${nome}!`);
            fecharLoja();
        } else {
            alert("Dinheiro insuficiente!");
        }
    };

    window.sairDoJogo = function() {
        remove(playerRef).then(() => window.location.href = "lobby.html");
    };

    // --- LOOP DO JOGO ---
    function update() {
        player.x += moveVector.x * player.speed;
        player.y += player.vy;
        player.vy += 0.6; // Gravidade

        const groundLevel = canvas.height - 120;
        if (player.y > groundLevel) {
            player.y = groundLevel;
            player.vy = 0;
            player.isJumping = false;
        }

        if (player.x < 30) player.x = 30;
        if (player.x > canvas.width - 30) player.x = canvas.width - 30;

        // Atualiza balas
        for (let i = balas.length - 1; i >= 0; i--) {
            balas[i].x += balas[i].vx;
            if (balas[i].x < 0 || balas[i].x > canvas.width) {
                balas.splice(i, 1);
                continue;
            }

            // Verifica colisão da bala com zombies
            for (let j = zombies.length - 1; j >= 0; j--) {
                let z = zombies[j];
                let dist = Math.hypot(balas[i].x - z.x, balas[i].y - z.y);
                if (dist < 30) {
                    z.hp -= balas[i].dano;
                    balas.splice(i, 1);
                    if (z.hp <= 0) {
                        player.dinheiro += 50; // Ganha dinheiro ao matar zombie
                        document.getElementById("playerMoney").textContent = player.dinheiro;
                        // Renasce o zombie noutro sítio
                        z.x = Math.random() < 0.5 ? 50 : canvas.width - 50;
                        z.hp = 3 + Math.floor(Math.random() * 3);
                    }
                    break;
                }
            }
        }

        // Movimento dos Zombies em direção ao jogador mais perto
        zombies.forEach(z => {
            if (z.x < player.x) z.x += z.speed;
            if (z.x > player.x) z.x -= z.speed;
        });

        // Sincroniza com Firebase
        set(playerRef, {
            nome: nick,
            x: Math.round(player.x),
            y: Math.round(player.y)
        }).catch(() => {});
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Chão
        ctx.fillStyle = "#1b102f";
        ctx.fillRect(0, canvas.height - 100, canvas.width, 100);

        // Desenha Zombies
        zombies.forEach(z => {
            ctx.fillStyle = "#27ae60";
            ctx.beginPath();
            ctx.arc(z.x, z.y, z.size / 2, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = "#2ecc71";
            ctx.lineWidth = 3;
            ctx.stroke();

            // Vida do Zombie
            ctx.fillStyle = "red";
            ctx.fillRect(z.x - 20, z.y - 30, 40, 6);
            ctx.fillStyle = "green";
            ctx.fillRect(z.x - 20, z.y - 30, (z.hp / 5) * 40, 6);
        });

        // Desenha Balas
        ctx.fillStyle = "#f1c40f";
        balas.forEach(b => {
            ctx.beginPath();
            ctx.arc(b.x, b.y, 5, 0, Math.PI * 2);
            ctx.fill();
        });

        // Desenha OUTROS JOGADORES (Multiplayer)
        for (let id in outrosJogadores) {
            if (id === clientId) continue;
            const p = outrosJogadores[id];
            ctx.fillStyle = "#3b82f6";
            ctx.beginPath();
            ctx.arc(p.x, p.y, player.size / 2, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = "#93c5fd";
            ctx.lineWidth = 3;
            ctx.stroke();

            ctx.fillStyle = "white";
            ctx.font = "bold 13px Arial";
            ctx.textAlign = "center";
            ctx.fillText(p.nome || "Aliado", p.x, p.y - 30);
        }

        // Desenha o PRÓPRIO JOGADOR
        ctx.fillStyle = "#7900ff";
        ctx.beginPath();
        ctx.arc(player.x, player.y, player.size / 2, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = "#b56cff";
        ctx.lineWidth = 3;
        ctx.stroke();

        ctx.fillStyle = "white";
        ctx.font = "bold 13px Arial";
        ctx.textAlign = "center";
        ctx.fillText(nick, player.x, player.y - 30);
    }

    function loop() {
        update();
        draw();
        requestAnimationFrame(loop);
    }

    loop();
</script>

</body>
</html>
