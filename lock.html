<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Goblox - Login</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

html {
    min-height: 100%;
    overflow-x: hidden;
    overflow-y: auto;
}

body {
    min-height: 100vh;
    min-height: 100svh;
    width: 100%;
    background: #080012;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow-x: hidden;
    overflow-y: auto;
    padding: 24px 0;
}

.container {
    width: min(90%, 550px);
    max-width: 550px;
    padding: 24px 0;
    margin: auto;
    text-align: center;
}

/* FUNDO */
.background {
    position: fixed;
    inset: 0;
    overflow: hidden;
    z-index: -1;
    background:
        radial-gradient(circle at 20% 20%, #390080 0%, transparent 35%),
        radial-gradient(circle at 80% 80%, #30006e 0%, transparent 35%),
        #080012;
}

.shape {
    position: absolute;
    width: 190px;
    height: 190px;
    border-radius: 25px;
    background: linear-gradient(135deg, #7900ff, #26005c);
    opacity: .25;
    transform: rotate(35deg);
    box-shadow: 0 0 50px #7200ff;
}

.shape:nth-child(1) { top: -80px; left: -50px; }
.shape:nth-child(2) { right: -80px; top: 20%; }
.shape:nth-child(3) { bottom: -100px; left: 15%; }
.shape:nth-child(4) { bottom: 10%; right: 15%; }

/* CONTAINER */
.container {
    width: 90%;
    max-width: 550px;
    padding: 30px;
    text-align: center;
}

/* LOGO */
.logo {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 20px;
    margin-bottom: 12px;
}

.logo-icon {
    width: 85px;
    height: 85px;
    background: white;
    transform: rotate(15deg);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #18002d;
    font-size: 45px;
    font-weight: bold;
    border-radius: 8px;
}

.logo h1 {
    font-size: 75px;
    font-weight: 900;
    letter-spacing: -3px;
}

.subtitle {
    color: #aaa0c9;
    font-size: 20px;
    margin-bottom: 45px;
}

/* CAMPOS */
.input-box {
    position: relative;
    margin-bottom: 18px;
}

.input-box input {
    width: 100%;
    height: 70px;
    border: 2px solid #7655a7;
    background: rgba(255,255,255,.035);
    border-radius: 20px;
    outline: none;
    padding: 0 60px;
    color: white;
    font-size: 19px;
    transition: .3s;
}

.input-box input:focus {
    border-color: #c18aff;
    box-shadow: 0 0 18px #7900ff55;
}

.input-icon {
    position: absolute;
    left: 20px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 24px;
    color: #aaa;
}

.eye {
    position: absolute;
    right: 20px;
    top: 50%;
    transform: translateY(-50%);
    cursor: pointer;
    font-size: 22px;
}

/* BOTÃO ENTRAR */
.login-button {
    width: 100%;
    height: 75px;
    border: none;
    border-radius: 20px;
    background: linear-gradient(120deg, #fff, #ded1ff);
    color: #160026;
    font-size: 27px;
    font-weight: bold;
    cursor: pointer;
    margin-top: 5px;
    transition: .3s;
}

.login-button:hover {
    transform: scale(1.02);
    box-shadow: 0 0 25px #a855ff88;
}

.links {
    margin-top: 30px;
    display: flex;
    justify-content: center;
    gap: 25px;
}

.links a {
    color: #c5a4ff;
    text-decoration: none;
    font-size: 17px;
    cursor: pointer;
}

.links a:hover {
    color: white;
    text-decoration: underline;
}

@media(max-width: 600px) {
    body { align-items: flex-start; padding: 14px 0; }
    .container { width: calc(100% - 28px); padding: 14px 0 24px; margin: auto; }
    .logo { gap: 12px; }
    .logo-icon { width: 58px; height: 58px; font-size: 32px; }
    .logo h1 { font-size: clamp(42px, 11vw, 54px); }
    .subtitle { margin-bottom: 26px; font-size: 16px; }
    .input-box input { height: 58px; font-size: 16px; }
    .login-button { height: 62px; font-size: 21px; }
    .links { flex-wrap: wrap; gap: 16px; margin-top: 22px; }
}
@media(max-height: 650px) and (min-width: 601px) {
    body { align-items: flex-start; }
}
</style>
</head>

<body>

<div class="background">
    <div class="shape"></div>
    <div class="shape"></div>
    <div class="shape"></div>
    <div class="shape"></div>
</div>

<div class="container">

    <div class="logo">
        <div class="logo-icon">◈</div>
        <h1>Goblox</h1>
    </div>

    <p class="subtitle">Jogue. Crie. Conecte-se.</p>

    <form id="loginForm">
        <div class="input-box">
            <span class="input-icon">♟</span>
            <input type="text" id="username" placeholder="Usuário ou Nickname" autocomplete="off" required>
        </div>

        <div class="input-box">
            <span class="input-icon">🔒</span>
            <input type="password" id="password" placeholder="Senha" required>
            <span class="eye" id="btnEye">◉</span>
        </div>

        <button class="login-button" type="submit">Entrar / Criar</button>
    </form>

    <div class="links">
        <a id="btnCriarDireto">Criar nova conta</a>
        <a id="btnRecuperar" href="#recoveryBox" role="button">Esqueci minha senha</a>
    </div>
    <section id="recoveryBox" style="display:none;margin-top:22px;text-align:left;background:#170b2b;border:1px solid #7655a7;border-radius:16px;padding:18px">
      <h2 style="font-size:20px;margin-bottom:8px">Recuperar conta</h2>
      <p style="color:#c5b6e5;font-size:14px;margin-bottom:12px">Informe seu nickname para solicitar ajuda à equipe Goblox.</p>
      <input id="recoveryUser" type="text" maxlength="20" placeholder="Seu nickname" style="width:100%;height:48px;border-radius:10px;padding:10px;background:#080012;color:white;border:1px solid #7655a7">
      <button id="sendRecovery" type="button" style="width:100%;margin-top:10px;padding:13px;border:0;border-radius:10px;background:#8b5cf6;color:white;font-weight:bold">Enviar solicitação</button>
      <p id="recoveryStatus" role="status" style="font-size:13px;color:#d8c8ff;margin-top:10px"></p>
      <div id="resetArea" style="display:none;margin-top:12px">
        <p id="resetCountdown" style="color:#86efac;font-weight:bold;margin-bottom:8px"></p>
        <input id="newRecoveryPassword" type="password" minlength="6" placeholder="Nova senha (mínimo 6 caracteres)" style="width:100%;height:48px;border-radius:10px;padding:10px;background:#080012;color:white;border:1px solid #7655a7">
        <button id="saveRecoveryPassword" type="button" style="width:100%;margin-top:10px;padding:13px;border:0;border-radius:10px;background:#16a34a;color:white;font-weight:bold">Salvar nova senha</button>
      </div>
    </section>

</div>

<script>
  // O painel abre mesmo se o módulo do Firebase demorar ou falhar ao carregar.
  document.getElementById("btnRecuperar").addEventListener("click", function () {
    const box = document.getElementById("recoveryBox");
    box.style.display = "block";
    box.scrollIntoView({ behavior: "smooth", block: "center" });
    document.getElementById("recoveryUser").focus();
  });
</script>

<script type="module">
  import { db, ref, get, set, onValue } from "./firebase.js";

  // Mostrar / Ocultar Senha
  document.getElementById("btnEye").addEventListener("click", () => {
    const p = document.getElementById("password");
    p.type = p.type === "password" ? "text" : "password";
  });

  // Função para ir pro lobby
  function entrarNoLobby(nick) {
    localStorage.setItem("goblox_player_nick", nick);
    localStorage.setItem("goblox_logged_user", nick);
    window.location.href = "lobby.html";
  }

  // Ação do Formulário (Entrar ou Criar automaticamente se não existir)
  document.getElementById("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const user = document.getElementById("username").value.trim();
    const pass = document.getElementById("password").value.trim();

    if (!user || !pass) {
      alert("Preencha o usuário e a senha!");
      return;
    }

    try {
      const userRef = ref(db, `users/${user}`);
      const snap = await get(userRef);

      if (!snap.exists()) {
        // Se a conta não existe, cria na hora
        await set(userRef, {
          senha: pass,
          fbux: 500,
          moedas: 200,
          criadoEm: Date.now()
        });
        alert("Conta criada com sucesso!");
        entrarNoLobby(user);
        return;
      }

      // Se existe, valida a senha
      const dados = snap.val();
      if (dados.senha !== pass) {
        alert("Senha incorreta!");
        return;
      }

      entrarNoLobby(user);

    } catch (err) {
      console.error(err);
      alert("Erro ao conectar com o Firebase. Verifique o console (F12).");
    }
  });

  // Botão rápido de criar conta
  document.getElementById("btnCriarDireto").addEventListener("click", async () => {
    const user = document.getElementById("username").value.trim();
    const pass = document.getElementById("password").value.trim();

    if (!user || !pass) {
      alert("Digite um usuário e senha nos campos acima para criar a conta!");
      return;
    }

    try {
      const userRef = ref(db, `users/${user}`);
      const snap = await get(userRef);

      if (snap.exists()) {
        alert("Este usuário já existe! Podes apenas clicar em Entrar.");
        return;
      }

      await set(userRef, {
        senha: pass,
        fbux: 500,
        moedas: 200,
        criadoEm: Date.now()
      });

      alert("Conta criada com sucesso!");
      entrarNoLobby(user);
    } catch (err) {
      alert("Erro ao criar conta.");
    }
  });

  const recoveryBox=document.getElementById("recoveryBox");
  const recoveryStatus=document.getElementById("recoveryStatus");
  const resetArea=document.getElementById("resetArea");
  let recoveryKey="", recoveryUsername="", recoveryTimer=null;
  function watchRecovery(username){
    recoveryUsername=username;
    recoveryKey=username.toLowerCase();
    onValue(ref(db,"recoveryAccess/"+recoveryKey),snap=>{
      const grant=snap.exists()?snap.val():null;
      if(!grant||grant.username!==username||Number(grant.expiresAt)<=Date.now()){
        resetArea.style.display="none"; if(grant) recoveryStatus.textContent="A autorização expirou. Solicite novamente."; return;
      }
      resetArea.style.display="block"; clearInterval(recoveryTimer);
      const tick=()=>{const left=Math.max(0,Math.ceil((Number(grant.expiresAt)-Date.now())/1000));document.getElementById("resetCountdown").textContent="Tempo para trocar a senha: "+left+"s";if(!left){clearInterval(recoveryTimer);resetArea.style.display="none";recoveryStatus.textContent="Tempo encerrado. Faça uma nova solicitação.";}};
      tick();recoveryTimer=setInterval(tick,200);
    },error=>{
      console.error("Falha ao acompanhar autorização:",error);
      recoveryStatus.textContent="Não foi possível acompanhar a aprovação: "+(error.code||error.message);
    });
  }
  document.getElementById("sendRecovery").addEventListener("click",async()=>{
    const username=document.getElementById("recoveryUser").value.trim();
    if(!/^[a-zA-Z0-9_]{3,20}$/.test(username)){recoveryStatus.textContent="Nickname inválido.";return;}
    const button=document.getElementById("sendRecovery");button.disabled=true;
    try{
      const account=await get(ref(db,"users/"+username));
      if(!account.exists()){recoveryStatus.textContent="Conta não encontrada. Confira o nickname.";return;}
      const key=username.toLowerCase();
      await set(ref(db,"recoveryRequests/"+key),{username,status:"pending",requestedAt:Date.now()});
      recoveryStatus.textContent="Pedido enviado! Abra ADM → Recuperação para aprovar. Esta tela avisará quando liberar.";
      watchRecovery(username);
    }catch(err){
      console.error("Falha na recuperação:",err);
      recoveryStatus.textContent="Falha: "+(err.code||err.message||"erro desconhecido")+". Verifique as permissões do Firebase.";
    }finally{button.disabled=false;}
  });
  document.getElementById("saveRecoveryPassword").addEventListener("click",async()=>{
    const password=document.getElementById("newRecoveryPassword").value;
    if(password.length<6){recoveryStatus.textContent="Use pelo menos 6 caracteres.";return;}
    const button=document.getElementById("saveRecoveryPassword");button.disabled=true;
    try{
      const snap=await get(ref(db,"recoveryAccess/"+recoveryKey));
      const grant=snap.exists()?snap.val():null;
      if(!grant||grant.username!==recoveryUsername||Number(grant.expiresAt)<=Date.now())throw Error("Autorização expirada. Solicite outra liberação.");
      await set(ref(db,"users/"+recoveryUsername+"/senha"),password);
      await set(ref(db,"recoveryRequests/"+recoveryKey+"/status"),"completed");
      await set(ref(db,"recoveryAccess/"+recoveryKey),null);
      recoveryStatus.textContent="Senha alterada! Você já pode entrar.";
      resetArea.style.display="none";
      document.getElementById("username").value=recoveryUsername;
      document.getElementById("password").value="";
      document.getElementById("newRecoveryPassword").value="";
    }catch(err){console.error(err);recoveryStatus.textContent=err.message||"Não foi possível trocar a senha.";}
    finally{button.disabled=false;}
  });
</script>

</body>
</html>
