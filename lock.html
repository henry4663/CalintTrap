<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Goblox - Login</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    min-height: 100vh;
    background: #080012;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
}

/* FUNDO */
.background {
    position: fixed;
    inset: 0;
    overflow: hidden;
    z-index: -1;
    background:
        radial-gradient(circle at 20% 20%, #390080 0%, transparent 35%),
        radial-gradient(circle at 80% 80%, #30006e 0%, transparent 35%),
        #080012;
}

.shape {
    position: absolute;
    width: 190px;
    height: 190px;
    border-radius: 25px;
    background: linear-gradient(135deg, #7900ff, #26005c);
    opacity: .25;
    transform: rotate(35deg);
    box-shadow: 0 0 50px #7200ff;
}

.shape:nth-child(1) { top: -80px; left: -50px; }
.shape:nth-child(2) { right: -80px; top: 20%; }
.shape:nth-child(3) { bottom: -100px; left: 15%; }
.shape:nth-child(4) { bottom: 10%; right: 15%; }

/* CONTAINER */
.container {
    width: 90%;
    max-width: 550px;
    padding: 30px;
    text-align: center;
}

/* LOGO */
.logo {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 20px;
    margin-bottom: 12px;
}

.logo-icon {
    width: 85px;
    height: 85px;
    background: white;
    transform: rotate(15deg);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #18002d;
    font-size: 45px;
    font-weight: bold;
    border-radius: 8px;
}

.logo h1 {
    font-size: 75px;
    font-weight: 900;
    letter-spacing: -3px;
}

.subtitle {
    color: #aaa0c9;
    font-size: 20px;
    margin-bottom: 45px;
}

/* CAMPOS */
.input-box {
    position: relative;
    margin-bottom: 18px;
}

.input-box input {
    width: 100%;
    height: 70px;
    border: 2px solid #7655a7;
    background: rgba(255,255,255,.035);
    border-radius: 20px;
    outline: none;
    padding: 0 60px;
    color: white;
    font-size: 19px;
    transition: .3s;
}

.input-box input:focus {
    border-color: #c18aff;
    box-shadow: 0 0 18px #7900ff55;
}

.input-icon {
    position: absolute;
    left: 20px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 24px;
    color: #aaa;
}

.eye {
    position: absolute;
    right: 20px;
    top: 50%;
    transform: translateY(-50%);
    cursor: pointer;
    font-size: 22px;
}

/* BOTÃO ENTRAR */
.login-button {
    width: 100%;
    height: 75px;
    border: none;
    border-radius: 20px;
    background: linear-gradient(120deg, #fff, #ded1ff);
    color: #160026;
    font-size: 27px;
    font-weight: bold;
    cursor: pointer;
    margin-top: 5px;
    transition: .3s;
}

.login-button:hover {
    transform: scale(1.02);
    box-shadow: 0 0 25px #a855ff88;
}

.links {
    margin-top: 30px;
    display: flex;
    justify-content: center;
    gap: 25px;
}

.links a {
    color: #c5a4ff;
    text-decoration: none;
    font-size: 17px;
    cursor: pointer;
}

.links a:hover {
    color: white;
    text-decoration: underline;
}

@media(max-width: 600px) {
    .container { padding: 15px; }
    .logo h1 { font-size: 49px; }
    .input-box input { height: 62px; font-size: 16px; }
    .login-button { height: 65px; font-size: 23px; }
}
</style>
</head>

<body>

<div class="background">
    <div class="shape"></div>
    <div class="shape"></div>
    <div class="shape"></div>
    <div class="shape"></div>
</div>

<div class="container">

    <div class="logo">
        <div class="logo-icon">◈</div>
        <h1>Goblox</h1>
    </div>

    <p class="subtitle">Jogue. Crie. Conecte-se.</p>

    <form id="loginForm">
        <div class="input-box">
            <span class="input-icon">♟</span>
            <input type="text" id="username" placeholder="Usuário ou Nickname" autocomplete="off" required>
        </div>

        <div class="input-box">
            <span class="input-icon">🔒</span>
            <input type="password" id="password" placeholder="Senha" required>
            <span class="eye" id="btnEye">◉</span>
        </div>

        <button class="login-button" type="submit">Entrar / Criar</button>
    </form>

    <div class="links">
        <a id="btnCriarDireto">Criar nova conta</a>
    </div>

</div>

<script type="module">
  import { db } from "./firebase.js";
  import { ref, get, set } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

  // Mostrar / Ocultar Senha
  document.getElementById("btnEye").addEventListener("click", () => {
    const p = document.getElementById("password");
    p.type = p.type === "password" ? "text" : "password";
  });

  // Função para ir pro lobby
  function entrarNoLobby(nick) {
    localStorage.setItem("goblox_player_nick", nick);
    localStorage.setItem("goblox_logged_user", nick);
    window.location.href = "lobby.html";
  }

  // Ação do Formulário (Entrar ou Criar automaticamente se não existir)
  document.getElementById("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const user = document.getElementById("username").value.trim();
    const pass = document.getElementById("password").value.trim();

    if (!user || !pass) {
      alert("Preencha o usuário e a senha!");
      return;
    }

    try {
      const userRef = ref(db, `users/${user}`);
      const snap = await get(userRef);

      if (!snap.exists()) {
        // Se a conta não existe, cria na hora
        await set(userRef, {
          senha: pass,
          fbux: 500,
          moedas: 200,
          criadoEm: Date.now()
        });
        alert("Conta criada com sucesso!");
        entrarNoLobby(user);
        return;
      }

      // Se existe, valida a senha
      const dados = snap.val();
      if (dados.senha !== pass) {
        alert("Senha incorreta!");
        return;
      }

      entrarNoLobby(user);

    } catch (err) {
      console.error(err);
      alert("Erro ao conectar com o Firebase. Verifique o console (F12).");
    }
  });

  // Botão rápido de criar conta
  document.getElementById("btnCriarDireto").addEventListener("click", async () => {
    const user = document.getElementById("username").value.trim();
    const pass = document.getElementById("password").value.trim();

    if (!user || !pass) {
      alert("Digite um usuário e senha nos campos acima para criar a conta!");
      return;
    }

    try {
      const userRef = ref(db, `users/${user}`);
      const snap = await get(userRef);

      if (snap.exists()) {
        alert("Este usuário já existe! Podes apenas clicar em Entrar.");
        return;
      }

      await set(userRef, {
        senha: pass,
        fbux: 500,
        moedas: 200,
        criadoEm: Date.now()
      });

      alert("Conta criada com sucesso!");
      entrarNoLobby(user);
    } catch (err) {
      alert("Erro ao criar conta.");
    }
  });
</script>

</body>
</html>
