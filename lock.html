<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Goblox — Login</title>
  <link rel="stylesheet" href="global.css">
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #1e1e2d;
      color: #fff;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .login-box {
      background: #2a2a3c;
      padding: 30px;
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      width: 320px;
    }
    h1 {
      margin-bottom: 20px;
      color: #35d995;
    }
    .input-group {
      margin-bottom: 15px;
      text-align: left;
    }
    .input-group label {
      display: block;
      font-size: 0.85rem;
      color: #aaa;
      margin-bottom: 5px;
    }
    input {
      width: 100%;
      padding: 10px;
      box-sizing: border-box;
      border-radius: 6px;
      border: 1px solid #444;
      background: #1e1e2d;
      color: #fff;
      font-size: 1rem;
    }
    .btn-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 20px;
    }
    button {
      width: 100%;
      padding: 11px;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
    }
    .btn-entrar {
      background: #35d995;
      color: #000;
    }
    .btn-entrar:hover {
      background: #2bc482;
    }
    .btn-criar {
      background: #3b82f6;
      color: #fff;
    }
    .btn-criar:hover {
      background: #2563eb;
    }
    #mensagemErro {
      margin-top: 12px;
      font-size: 0.85rem;
      color: #ef4444;
      min-height: 20px;
    }
  </style>
</head>
<body>

  <div class="login-box">
    <h1>GOBLOX</h1>
    
    <div class="input-group">
      <label>Nickname</label>
      <input type="text" id="inputNick" placeholder="Digite seu Nickname" autocomplete="off">
    </div>

    <div class="input-group">
      <label>Senha</label>
      <input type="password" id="inputSenha" placeholder="Digite sua senha">
    </div>

    <div class="btn-container">
      <button class="btn-entrar" id="btnEntrar">Entrar</button>
      <button class="btn-criar" id="btnCriar">Criar Conta</button>
    </div>

    <div id="mensagemErro"></div>
  </div>

  <script type="module">
    import { db } from "./firebase.js";
    import { ref, get, set } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

    const inputNick = document.getElementById("inputNick");
    const inputSenha = document.getElementById("inputSenha");
    const msgErro = document.getElementById("mensagemErro");

    function mostrarErro(texto, cor = "#ef4444") {
      msgErro.style.color = cor;
      msgErro.textContent = texto;
    }

    // 1. BOTÃO ENTRAR
    document.getElementById("btnEntrar").addEventListener("click", async () => {
      const nick = inputNick.value.trim();
      const senha = inputSenha.value.trim();

      if (!nick || !senha) {
        mostrarErro("Preencha o Nickname e a Senha!");
        return;
      }

      mostrarErro("A verificar conta...", "#fbbf24");

      try {
        // Verifica se o jogador está banido
        const banSnap = await get(ref(db, `bans/${nick}`));
        if (banSnap.exists()) {
          localStorage.setItem("goblox_player_nick", nick);
          window.location.href = "screenban.html";
          return;
        }

        // Verifica os dados da conta no Firebase
        const userSnap = await get(ref(db, `users/${nick}`));
        
        if (!userSnap.exists()) {
          mostrarErro("Conta não existe! Use o botão 'Criar Conta'.");
          return;
        }

        const dadosConta = userSnap.val();

        if (dadosConta.senha !== senha) {
          mostrarErro("Senha incorreta!");
          return;
        }

        // Sucesso no login
        localStorage.setItem("goblox_player_nick", nick);
        window.location.href = "lobby.html";

      } catch (err) {
        mostrarErro("Erro de ligação com o servidor.");
        console.error(err);
      }
    });

    // 2. BOTÃO CRIAR CONTA
    document.getElementById("btnCriar").addEventListener("click", async () => {
      const nick = inputNick.value.trim();
      const senha = inputSenha.value.trim();

      if (!nick || !senha) {
        mostrarErro("Digite um Nickname e uma Senha para criar a conta!");
        return;
      }

      if (nick.length < 3) {
        mostrarErro("O nick precisa de pelo menos 3 caracteres.");
        return;
      }

      mostrarErro("A criar conta...", "#fbbf24");

      try {
        const userRef = ref(db, `users/${nick}`);
        const userSnap = await get(userRef);

        if (userSnap.exists()) {
          mostrarErro("Este nickname já está em uso!");
          return;
        }

        // Cria a conta no Firebase com moedas e FBUX iniciais
        await set(userRef, {
          senha: senha,
          fbux: 500,
          moedas: 200,
          criadoEm: Date.now()
        });

        // Guarda localmente também
        localStorage.setItem(`goblox_fbux_${nick}`, 500);
        localStorage.setItem(`goblox_moedas_${nick}`, 200);
        localStorage.setItem("goblox_player_nick", nick);

        mostrarErro("Conta criada com sucesso! A entrar...", "#35d995");
        setTimeout(() => {
          window.location.href = "lobby.html";
        }, 1000);

      } catch (err) {
        mostrarErro("Erro ao criar conta no servidor.");
        console.error(err);
      }
    });
  </script>
</body>
</html>
