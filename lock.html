<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>GOBLOX — Entrar</title>
  <link rel="stylesheet" href="./global.css" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background: #090d16;
      color: #fff;
      font-family: 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* BACKGROUND COM ANIMAÇÃO GLOW NEON */
    .bg-glow {
      position: absolute;
      width: 350px;
      height: 350px;
      background: radial-gradient(circle, rgba(99, 223, 112, 0.25) 0%, rgba(38, 120, 237, 0.15) 50%, transparent 70%);
      filter: blur(60px);
      border-radius: 50%;
      z-index: 1;
      animation: pulseGlow 6s ease-in-out infinite alternate;
    }

    @keyframes pulseGlow {
      0% { transform: scale(1) translate(-20px, -20px); }
      100% { transform: scale(1.3) translate(20px, 20px); }
    }

    /* CARD DE LOGIN FUTURISTA */
    .login-card {
      position: relative;
      z-index: 10;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      padding: 40px 32px;
      border-radius: 24px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7), 0 0 20px rgba(99, 223, 112, 0.1);
      text-align: center;
    }

    .logo-title {
      font-size: 2.8rem;
      font-weight: 900;
      letter-spacing: 2px;
      background: linear-gradient(135deg, #63df70 0%, #2678ed 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
      text-shadow: 0 4px 20px rgba(99, 223, 112, 0.3);
    }

    .subtitle {
      color: #94a3b8;
      font-size: 0.95rem;
      margin-bottom: 30px;
      font-weight: 500;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 24px;
    }

    .input-box {
      position: relative;
      width: 100%;
    }

    .input-box input {
      width: 100%;
      background: rgba(0, 0, 0, 0.4);
      border: 2px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 14px 16px;
      color: #fff;
      font-size: 1rem;
      outline: none;
      transition: all 0.25s ease;
      text-align: center;
      font-weight: 600;
    }

    .input-box input:focus {
      border-color: #63df70;
      box-shadow: 0 0 15px rgba(99, 223, 112, 0.3);
      background: rgba(0, 0, 0, 0.6);
    }

    .input-box input::placeholder {
      color: #64748b;
      font-weight: normal;
    }

    /* BOTÃO PRINCIPAL */
    .btn-entrar {
      width: 100%;
      background: linear-gradient(135deg, #63df70 0%, #10b981 100%);
      color: #000;
      border: none;
      padding: 14px;
      border-radius: 12px;
      font-size: 1.1rem;
      font-weight: 800;
      cursor: pointer;
      letter-spacing: 1px;
      transition: all 0.2s ease;
      box-shadow: 0 6px 20px rgba(99, 223, 112, 0.4);
    }

    .btn-entrar:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(99, 223, 112, 0.6);
      background: linear-gradient(135deg, #7dff83 0%, #34d399 100%);
    }

    .btn-entrar:active {
      transform: translateY(0);
    }

    .footer-info {
      margin-top: 20px;
      font-size: 0.8rem;
      color: #64748b;
    }

    /* TOAST DE AVISO */
    .toast-msg {
      position: absolute;
      top: -50px;
      left: 50%;
      transform: translateX(-50%);
      background: #ef4444;
      color: #fff;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: bold;
      opacity: 0;
      transition: all 0.3s ease;
      pointer-events: none;
      white-space: nowrap;
    }

    .toast-msg.show {
      top: 15px;
      opacity: 1;
    }
  </style>
</head>
<body>

  <div class="bg-glow"></div>

  <div id="toast" class="toast-msg">Insira um nickname válido!</div>

  <div class="login-card">
    <div class="logo-title">GOBLOX</div>
    <div class="subtitle">Insira o seu Nickname para jogar</div>

    <form id="formLogin">
      <div class="form-group">
        <div class="input-box">
          <input type="text" id="playerNick" placeholder="Ex: henryDEV777!" maxlength="18" autocomplete="off" required>
        </div>
      </div>

      <button type="submit" class="btn-entrar">ENTRAR NO JOGO 🚀</button>
    </form>

    <div class="footer-info">
      Multiplayer Engine • v2.0
    </div>
  </div>

  <script type="module">
    import { db } from "./firebase.js";
    import { ref, get, set } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

    const form = document.getElementById("formLogin");
    const inputNick = document.getElementById("playerNick");
    const toast = document.getElementById("toast");

    function mostrarErro(msg) {
      toast.textContent = msg;
      toast.classList.add("show");
      setTimeout(() => toast.classList.remove("show"), 3000);
    }

    // Se o utilizador já tiver sessão iniciada e não estiver banido, entra direto
    const nickSalvo = localStorage.getItem("goblox_player_nick");
    if (nickSalvo) {
      inputNick.value = nickSalvo;
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const nick = inputNick.value.trim();

      if (!nick || nick.length < 3) {
        mostrarErro("O nickname precisa de ter pelo menos 3 caracteres!");
        return;
      }

      // 1. Verifica se a conta está banida antes de dar entrada
      try {
        const banSnap = await get(ref(db, `bans/${nick}`));
        if (banSnap.exists()) {
          localStorage.setItem("goblox_player_nick", nick);
          window.location.href = "screenban.html";
          return;
        }
      } catch (err) {
        console.warn("Aviso ao checar banimento:", err);
      }

      // 2. Regista / Inicializa a conta do utilizador no localStorage
      localStorage.setItem("goblox_player_nick", nick);

      // Inicializa moedas e FBUX se for a primeira vez
      const keyFbux = `goblox_fbux_${nick}`;
      const keyMoedas = `goblox_moedas_${nick}`;

      if (localStorage.getItem(keyFbux) === null) {
        localStorage.setItem(keyFbux, 500);
      }
      if (localStorage.getItem(keyMoedas) === null) {
        localStorage.setItem(keyMoedas, 200);
      }

      // 3. Cria/Atualiza a conta no Firebase
      try {
        await set(ref(db, `users/${nick}/ultimoLogin`), Date.now());
      } catch (e) {}

      // 4. Redireciona para o Lobby
      window.location.href = "lobby.html";
    });
  </script>
</body>
</html>
