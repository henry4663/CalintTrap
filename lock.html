<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Goblox — Login</title>
  <link rel="stylesheet" href="global.css">
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #1e1e2d;
      color: #fff;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .login-box {
      background: #2a2a3c;
      padding: 30px;
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      width: 300px;
    }
    h1 {
      margin-bottom: 20px;
      color: #35d995;
    }
    input {
      width: 90%;
      padding: 10px;
      margin-bottom: 15px;
      border-radius: 6px;
      border: 1px solid #444;
      background: #1e1e2d;
      color: #fff;
      font-size: 1rem;
    }
    button {
      width: 100%;
      padding: 10px;
      background: #35d995;
      color: #000;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
    }
    button:hover {
      background: #2bc482;
    }
  </style>
</head>
<body>

  <div class="login-box">
    <h1>GOBLOX</h1>
    <input type="text" id="inputNick" placeholder="Digite seu Nickname" autocomplete="off">
    <button id="btnEntrar">Entrar</button>
  </div>

  <script type="module">
    import { db } from "./firebase.js";
    import { ref, get } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

    document.getElementById("btnEntrar").addEventListener("click", async () => {
      const nick = document.getElementById("inputNick").value.trim();

      if (!nick) {
        alert("Por favor, digite um nickname!");
        return;
      }

      // Verifica se o jogador está banido antes de entrar
      try {
        const banSnap = await get(ref(db, `bans/${nick}`));
        if (banSnap.exists()) {
          localStorage.setItem("goblox_player_nick", nick);
          window.location.href = "screenban.html";
          return;
        }
      } catch (err) {
        console.error("Erro ao verificar banimento:", err);
      }

      // Salva o nick localmente e vai para o lobby
      localStorage.setItem("goblox_player_nick", nick);
      window.location.href = "lobby.html";
    });
  </script>
</body>
</html>
