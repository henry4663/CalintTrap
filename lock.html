<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login Local</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, sans-serif;
    background: linear-gradient(135deg, #667eea, #764ba2);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .card {
    background: #fff;
    padding: 32px;
    border-radius: 16px;
    width: 100%;
    max-width: 380px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.2);
  }
  h1 { text-align: center; margin-bottom: 24px; color: #333; }
  h1 span { font-size: 14px; color: #888; display: block; font-weight: normal; }
  input {
    width: 100%;
    padding: 12px;
    margin-bottom: 12px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 15px;
    outline: none;
    transition: border 0.2s;
  }
  input:focus { border-color: #667eea; }
  button {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 8px;
    background: #667eea;
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s;
  }
  button:hover { background: #5568d3; }
  button.secondary { background: #eee; color: #333; margin-top: 8px; }
  button.secondary:hover { background: #ddd; }
  .msg {
    text-align: center;
    margin-top: 12px;
    font-size: 14px;
    min-height: 20px;
  }
  .msg.ok { color: #28a745; }
  .msg.err { color: #dc3545; }
  .hidden { display: none; }
  .welcome {
    text-align: center;
    color: #333;
  }
  .welcome h2 { margin-bottom: 8px; }
  .welcome p { color: #666; margin-bottom: 20px; }
</style>
</head>
<body>

<div class="card">

  <!-- Tela de Login -->
  <div id="telaLogin">
    <h1>Entrar <span>Salvamento local no navegador</span></h1>
    <input type="text" id="loginUser" placeholder="Usuário" autocomplete="username">
    <input type="password" id="loginPass" placeholder="Senha" autocomplete="current-password">
    <button onclick="fazerLogin()">Entrar</button>
    <button class="secondary" onclick="trocarTela('cadastro')">Criar conta</button>
    <div class="msg" id="msgLogin"></div>
  </div>

  <!-- Tela de Cadastro -->
  <div id="telaCadastro" class="hidden">
    <h1>Cadastrar <span>Os dados ficam no seu navegador</span></h1>
    <input type="text" id="cadUser" placeholder="Escolha um usuário">
    <input type="password" id="cadPass" placeholder="Escolha uma senha (mín. 4)">
    <input type="password" id="cadPass2" placeholder="Confirme a senha">
    <button onclick="cadastrar()">Cadastrar</button>
    <button class="secondary" onclick="trocarTela('login')">Já tenho conta</button>
    <div class="msg" id="msgCad"></div>
  </div>

  <!-- Tela de Boas-vindas (logado) -->
  <div id="telaLogado" class="hidden">
    <div class="welcome">
      <h2>👋 Olá, <span id="nomeUsuario"></span>!</h2>
      <p>Você está logado localmente.</p>
      <button onclick="logout()">Sair</button>
    </div>
  </div>

</div>

<script>
// ============================================================
// CHAVE ÚNICA NO localStorage
// ============================================================
const STORAGE_KEY = "usuarios_locais";
const SESSION_KEY = "usuario_logado";

// ------------------------------------------------------------
// Utilitários
// ------------------------------------------------------------
function getUsuarios() {
  try {
    return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};
  } catch {
    return {};
  }
}

function setUsuarios(usuarios) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(usuarios));
}

// Gera um hash simples (NÃO é seguro para produção, só didático)
function hashSenha(senha) {
  let hash = 0;
  for (let i = 0; i < senha.length; i++) {
    hash = (hash << 5) - hash + senha.charCodeAt(i);
    hash |= 0;
  }
  return "h" + Math.abs(hash).toString(16);
}

function mostrarMsg(id, texto, tipo) {
  const el = document.getElementById(id);
  el.textContent = texto;
  el.className = "msg " + tipo;
}

function trocarTela(tela) {
  document.getElementById("telaLogin").classList.add("hidden");
  document.getElementById("telaCadastro").classList.add("hidden");
  document.getElementById("telaLogado").classList.add("hidden");

  if (tela === "login") document.getElementById("telaLogin").classList.remove("hidden");
  else if (tela === "cadastro") document.getElementById("telaCadastro").classList.remove("hidden");
  else if (tela === "logado") document.getElementById("telaLogado").classList.remove("hidden");
}

// ------------------------------------------------------------
// Cadastro
// ------------------------------------------------------------
function cadastrar() {
  const user = document.getElementById("cadUser").value.trim();
  const pass = document.getElementById("cadPass").value;
  const pass2 = document.getElementById("cadPass2").value;

  if (!user || !pass) {
    return mostrarMsg("msgCad", "Preencha todos os campos.", "err");
  }
  if (user.length < 3) {
    return mostrarMsg("msgCad", "Usuário deve ter ao menos 3 caracteres.", "err");
  }
  if (pass.length < 4) {
    return mostrarMsg("msgCad", "Senha deve ter ao menos 4 caracteres.", "err");
  }
  if (pass !== pass2) {
    return mostrarMsg("msgCad", "As senhas não coincidem.", "err");
  }

  const usuarios = getUsuarios();
  if (usuarios[user.toLowerCase()]) {
    return mostrarMsg("msgCad", "Este usuário já existe.", "err");
  }

  usuarios[user.toLowerCase()] = {
    nome: user,
    senha: hashSenha(pass),
    criadoEm: new Date().toISOString()
  };
  setUsuarios(usuarios);

  mostrarMsg("msgCad", "✅ Conta criada! Faça login.", "ok");
  document.getElementById("cadUser").value = "";
  document.getElementById("cadPass").value = "";
  document.getElementById("cadPass2").value = "";

  setTimeout(() => trocarTela("login"), 900);
}

// ------------------------------------------------------------
// Login
// ------------------------------------------------------------
function fazerLogin() {
  const user = document.getElementById("loginUser").value.trim().toLowerCase();
  const pass = document.getElementById("loginPass").value;

  if (!user || !pass) {
    return mostrarMsg("msgLogin", "Preencha usuário e senha.", "err");
  }

  const usuarios = getUsuarios();
  const conta = usuarios[user];

  if (!conta || conta.senha !== hashSenha(pass)) {
    return mostrarMsg("msgLogin", "Usuário ou senha inválidos.", "err");
  }

  // Salva sessão
  localStorage.setItem(SESSION_KEY, user);

  abrirPainel(conta.nome);
}

// ------------------------------------------------------------
// Logout
// ------------------------------------------------------------
function logout() {
  localStorage.removeItem(SESSION_KEY);
  document.getElementById("loginPass").value = "";
  mostrarMsg("msgLogin", "", "");
  trocarTela("login");
}

// ------------------------------------------------------------
// Painel logado
// ------------------------------------------------------------
function abrirPainel(nome) {
  document.getElementById("nomeUsuario").textContent = nome;
  trocarTela("logado");
}

// ------------------------------------------------------------
// Verifica sessão ao abrir a página
// ------------------------------------------------------------
(function iniciar() {
  const logado = localStorage.getItem(SESSION_KEY);
  const usuarios = getUsuarios();

  if (logado && usuarios[logado]) {
    abrirPainel(usuarios[logado].nome);
  } else {
    trocarTela("login");
  }
})();
</script>

</body>
</html>
