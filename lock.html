<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Goblox</title>
<style>
  :root {
    --bg: #0a0a0f;
    --card: #14141f;
    --card2: #1c1c2b;
    --accent: #7c3aed;
    --accent2: #06b6d4;
    --text: #fff;
    --muted: #8b8ba0;
    --danger: #ef4444;
    --success: #22c55e;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; -webkit-tap-highlight-color: transparent; }
  body {
    background: var(--bg); color: var(--text); min-height: 100vh;
    background-image: radial-gradient(circle at 20% 10%, rgba(124,58,237,.15) 0%, transparent 40%),
                      radial-gradient(circle at 80% 90%, rgba(6,182,212,.15) 0%, transparent 40%);
    background-attachment: fixed;
  }
  .hidden { display: none !important; }
  .center { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }

  /* ===== LOGIN ===== */
  .login-box {
    background: var(--card); padding: 36px 28px; border-radius: 20px;
    width: 100%; max-width: 380px; text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.05);
    position: relative; overflow: hidden;
  }
  .login-box::before {
    content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
    background: conic-gradient(from 0deg, transparent, var(--accent), transparent 30%);
    animation: spin 6s linear infinite; opacity: .08; z-index: 0;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .login-box > * { position: relative; z-index: 1; }
  .logo {
    font-size: 2.4rem; font-weight: 900; margin-bottom: 4px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    letter-spacing: -1px;
  }
  .logo-sub { color: var(--muted); font-size: .85rem; margin-bottom: 24px; }
  .input-group { position: relative; margin-bottom: 12px; }
  .input-group input {
    width: 100%; padding: 14px 16px; border: 1px solid rgba(255,255,255,.08);
    border-radius: 12px; background: var(--card2); color: var(--text);
    font-size: 1rem; transition: .2s;
  }
  .input-group input:focus {
    outline: none; border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(124,58,237,.2);
  }
  .btn {
    width: 100%; padding: 14px; border: none; border-radius: 12px;
    font-weight: 700; font-size: 1rem; cursor: pointer; transition: .2s;
    margin-bottom: 8px;
  }
  .btn-primary {
    background: linear-gradient(135deg, var(--accent), #9333ea);
    color: #fff; box-shadow: 0 4px 20px rgba(124,58,237,.4);
  }
  .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 24px rgba(124,58,237,.6); }
  .btn-primary:active { transform: translateY(0); }
  .btn-ghost {
    background: transparent; color: var(--accent); border: 1px solid var(--accent);
  }
  .btn-ghost:hover { background: rgba(124,58,237,.1); }
  .msg { margin-top: 12px; font-size: .85rem; min-height: 20px; color: var(--danger); }

  /* ===== HEADER ===== */
  header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 14px 20px; background: rgba(20,20,31,.85);
    backdrop-filter: blur(12px); border-bottom: 1px solid rgba(255,255,255,.06);
    position: sticky; top: 0; z-index: 50;
  }
  .header-logo {
    font-size: 1.4rem; font-weight: 900;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .header-right { display: flex; align-items: center; gap: 10px; }
  .avatar-small {
    width: 36px; height: 36px; border-radius: 50%; object-fit: cover;
    border: 2px solid var(--accent); background: var(--card2);
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 1rem; color: var(--accent);
  }
  .icon-btn {
    width: 40px; height: 40px; border: none; border-radius: 10px;
    background: var(--card2); color: var(--text); font-size: 1.2rem;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: .2s;
  }
  .icon-btn:hover { background: var(--accent); }

  /* ===== PERFIL ===== */
  .profile-container { max-width: 500px; margin: 0 auto; padding: 24px 20px; }
  .profile-card {
    background: var(--card); border-radius: 20px; padding: 32px 24px;
    text-align: center; box-shadow: 0 10px 40px rgba(0,0,0,.4);
    border: 1px solid rgba(255,255,255,.05);
  }
  .avatar-large {
    width: 120px; height: 120px; border-radius: 50%; margin: 0 auto 16px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    display: flex; align-items: center; justify-content: center;
    font-size: 3rem; font-weight: 900; color: #fff;
    position: relative; overflow: hidden; cursor: pointer;
    box-shadow: 0 8px 30px rgba(124,58,237,.4);
  }
  .avatar-large img { width: 100%; height: 100%; object-fit: cover; }
  .avatar-overlay {
    position: absolute; inset: 0; background: rgba(0,0,0,.6);
    display: flex; align-items: center; justify-content: center;
    font-size: 1.5rem; opacity: 0; transition: .2s;
  }
  .avatar-large:hover .avatar-overlay { opacity: 1; }
  .profile-name { font-size: 1.6rem; font-weight: 700; margin-bottom: 4px; }
  .profile-since { color: var(--muted); font-size: .85rem; margin-bottom: 20px; }
  .profile-stats {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px;
    margin-bottom: 20px;
  }
  .stat {
    background: var(--card2); padding: 14px 8px; border-radius: 12px;
    border: 1px solid rgba(255,255,255,.05);
  }
  .stat-num { font-size: 1.4rem; font-weight: 700; color: var(--accent); }
  .stat-label { font-size: .7rem; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }
  .profile-bio {
    background: var(--card2); padding: 12px 16px; border-radius: 12px;
    color: var(--muted); font-size: .9rem; margin-bottom: 16px;
    border: 1px solid rgba(255,255,255,.05); text-align: left;
  }
  .profile-bio:empty::before { content: 'Sem bio ainda...'; opacity: .5; }
  .btn-sm { padding: 10px 20px; width: auto; font-size: .9rem; }

  /* ===== LOBBY (placeholder, Parte 2) ===== */
  .lobby-placeholder { padding: 40px; text-align: center; color: var(--muted); }

  /* ===== TOAST ===== */
  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(100px);
    background: var(--card); padding: 14px 24px; border-radius: 12px;
    box-shadow: 0 10px 40px rgba(0,0,0,.6); border: 1px solid rgba(255,255,255,.1);
    transition: transform .3s; z-index: 999; font-size: .9rem;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }
  .toast.success { border-color: var(--success); }
  .toast.error { border-color: var(--danger); }

  /* ===== MOBILE ===== */
  @media (max-width: 500px) {
    .logo { font-size: 2rem; }
    .login-box { padding: 28px 20px; }
    .profile-name { font-size: 1.3rem; }
    .avatar-large { width: 100px; height: 100px; font-size: 2.5rem; }
  }
</style>
</head>
<body>

<!-- ========== TELA LOGIN ========== -->
<div id="telaLogin" class="center">
  <div class="login-box">
    <div class="logo">GOBLOX</div>
    <div class="logo-sub">Sua plataforma de jogos</div>

    <div class="input-group">
      <input id="inUser" type="text" placeholder="Nome de usuário" maxlength="16" autocomplete="username">
    </div>
    <div class="input-group">
      <input id="inPass" type="password" placeholder="Senha" autocomplete="current-password">
    </div>
    <button class="btn btn-primary" onclick="login()">Entrar</button>
    <button class="btn btn-ghost" onclick="registrar()">Criar conta</button>
    <p id="msgLogin" class="msg"></p>
  </div>
</div>

<!-- ========== TELA LOBBY ========== -->
<div id="telaLobby" class="hidden">
  <header>
    <div class="header-logo">GOBLOX</div>
    <div class="header-right">
      <button class="icon-btn" onclick="abrirPerfil()" title="Perfil">👤</button>
      <button class="icon-btn" onclick="sair()" title="Sair">⎋</button>
    </div>
  </header>
  <div class="lobby-placeholder">
    <h2>Lobby em construção</h2>
    <p style="margin-top:8px">Os jogos aparecerão aqui na Parte 2.</p>
  </div>
</div>

<!-- ========== TELA PERFIL ========== -->
<div id="telaPerfil" class="hidden">
  <header>
    <button class="icon-btn" onclick="voltarLobby()">←</button>
    <div class="header-logo">Perfil</div>
    <div style="width:40px"></div>
  </header>
  <div class="profile-container">
    <div class="profile-card">
      <div class="avatar-large" onclick="document.getElementById('fileAvatar').click()">
        <div id="avatarContent">?</div>
        <div class="avatar-overlay">📷</div>
        <input id="fileAvatar" type="file" accept="image/*" style="display:none" onchange="uploadAvatar(event)">
      </div>
      <div class="profile-name" id="profNome">-</div>
      <div class="profile-since" id="profDesde">-</div>

      <div class="profile-stats">
        <div class="stat"><div class="stat-num" id="statJogos">0</div><div class="stat-label">Jogos</div></div>
        <div class="stat"><div class="stat-num" id="statVitorias">0</div><div class="stat-label">Vitórias</div></div>
        <div class="stat"><div class="stat-num" id="statNivel">1</div><div class="stat-label">Nível</div></div>
      </div>

      <div class="profile-bio" id="profBio"></div>
      <button class="btn btn-primary btn-sm" onclick="editarBio()">✏️ Editar bio</button>
    </div>
  </div>
</div>

<!-- ========== TOAST ========== -->
<div id="toast" class="toast"></div>

<!-- ========== FIREBASE ========== -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, set, get, update } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

/* =========================================================
   COLE SEU firebaseConfig AQUI
   ========================================================= */
const firebaseConfig = {
  apiKey: "SUA_API_KEY",
  authDomain: "SEU.firebaseapp.com",
  databaseURL: "https://SEU-default-rtdb.firebaseio.com",
  projectId: "SEU",
  storageBucket: "SEU.appspot.com",
  messagingSenderId: "SEU",
  appId: "SEU"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const $ = id => document.getElementById(id);

/* =========================================================
   UTIL: TOAST
   ========================================================= */
function toast(msg, tipo = "") {
  const t = $("toast");
  t.textContent = msg;
  t.className = "toast show " + tipo;
  setTimeout(() => t.className = "toast " + tipo, 2500);
}

/* =========================================================
   NAVEGAÇÃO
   ========================================================= */
function mostrar(tela) {
  ["telaLogin","telaLobby","telaPerfil"].forEach(t => $(t).classList.add("hidden"));
  $(tela).classList.remove("hidden");
}

/* =========================================================
   AUTH
   ========================================================= */
async function registrar() {
  const u = $("inUser").value.trim();
  const p = $("inPass").value;
  const m = $("msgLogin");

  if (!u || u.length < 3) { m.textContent = "Usuário precisa ter 3+ caracteres"; return; }
  if (p.length < 4) { m.textContent = "Senha precisa ter 4+ caracteres"; return; }

  const snap = await get(ref(db, "users/" + u));
  if (snap.exists()) { m.textContent = "Esse usuário já existe"; return; }

  await set(ref(db, "users/" + u), {
    pass: p,
    criado: Date.now(),
    bio: "",
    avatar: "",
    jogos: 0,
    vitorias: 0,
    nivel: 1
  });

  m.style.color = "var(--success)";
  m.textContent = "Conta criada! Faça login.";
  toast("Conta criada com sucesso!", "success");
}

async function login() {
  const u = $("inUser").value.trim();
  const p = $("inPass").value;
  const m = $("msgLogin");

  const snap = await get(ref(db, "users/" + u));
  if (!snap.exists() || snap.val().pass !== p) {
    m.style.color = "var(--danger)";
    m.textContent = "Usuário ou senha incorretos";
    return;
  }

  localStorage.setItem("goblox_user", u);
  toast("Bem-vindo, " + u + "!", "success");
  abrirLobby();
}

function sair() {
  localStorage.removeItem("goblox_user");
  mostrar("telaLogin");
  toast("Saiu da conta");
}

/* =========================================================
   LOBBY
   ========================================================= */
function abrirLobby() {
  const u = localStorage.getItem("goblox_user");
  if (!u) { mostrar("telaLogin"); return; }
  mostrar("telaLobby");
}

/* =========================================================
   PERFIL
   ========================================================= */
async function abrirPerfil() {
  const u = localStorage.getItem("goblox_user");
  if (!u) return;

  const snap = await get(ref(db, "users/" + u));
  const d = snap.val() || {};

  $("profNome").textContent = u;
  const dataCriacao = d.criado ? new Date(d.criado).toLocaleDateString("pt-BR") : "hoje";
  $("profDesde").textContent = "Membro desde " + dataCriacao;
  $("statJogos").textContent = d.jogos || 0;
  $("statVitorias").textContent = d.vitorias || 0;
  $("statNivel").textContent = d.nivel || 1;
  $("profBio").textContent = d.bio || "";

  const av = $("avatarContent");
  if (d.avatar) {
    av.innerHTML = `<img src="${d.avatar}" alt="avatar">`;
  } else {
    av.textContent = u[0].toUpperCase();
    av.style.color = "#fff";
  }

  mostrar("telaPerfil");
}

function voltarLobby() { abrirLobby(); }

async function uploadAvatar(e) {
  const file = e.target.files[0];
  if (!file) return;
  if (file.size > 500000) { toast("Imagem muito grande (máx 500KB)", "error"); return; }

  const reader = new FileReader();
  reader.onload = async () => {
    const base64 = reader.result;
    const u = localStorage.getItem("goblox_user");
    await update(ref(db, "users/" + u), { avatar: base64 });
    $("avatarContent").innerHTML = `<img src="${base64}" alt="avatar">`;
    toast("Foto atualizada!", "success");
  };
  reader.readAsDataURL(file);
}

async function editarBio() {
  const atual = $("profBio").textContent || "";
  const nova = prompt("Nova bio (máx 100 caracteres):", atual);
  if (nova === null) return;
  if (nova.length > 100) { toast("Bio muito longa", "error"); return; }

  const u = localStorage.getItem("goblox_user");
  await update(ref(db, "users/" + u), { bio: nova });
  $("profBio").textContent = nova;
  toast("Bio salva!", "success");
}

/* =========================================================
   EXPÕE FUNÇÕES PARA O HTML
   ========================================================= */
Object.assign(window, {
  registrar, login, sair, abrirLobby, abrirPerfil, voltarLobby,
  uploadAvatar, editarBio
});

/* BOOT */
abrirLobby();
</script>
</body>
</html>
