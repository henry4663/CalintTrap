<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>goblox - Acesso</title>
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body {
      background: linear-gradient(135deg, #1e1b4b 0%, #0f172a 50%, #064e3b 100%);
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 relative overflow-hidden font-sans">

  <!-- Elementos decorativos de fundo -->
  <div class="absolute inset-0 opacity-10 pointer-events-none flex flex-wrap justify-between p-12">
    <i data-lucide="gamepad-2" class="w-24 h-24 text-white transform -rotate-12"></i>
    <i data-lucide="square" class="w-16 h-16 text-white transform rotate-45"></i>
    <i data-lucide="circle" class="w-20 h-20 text-white"></i>
    <i data-lucide="triangle" class="w-24 h-24 text-white transform rotate-12"></i>
  </div>

  <!-- Contentor principal -->
  <div class="w-full max-w-sm bg-slate-900/80 backdrop-blur-md rounded-3xl border border-slate-700/50 shadow-2xl p-8 relative z-10 text-center">
    
    <!-- Logo goblox -->
    <div class="mb-8 mt-4">
      <h1 class="text-5xl font-black text-amber-400 tracking-tight lowercase">
        goblox
      </h1>
    </div>

    <!-- FORMULÁRIO DE LOGIN -->
    <form id="login-form" onsubmit="handleLogin(event)" class="space-y-4">
      <h2 class="text-white font-bold text-lg mb-2">Entrar na sua conta</h2>
      
      <div class="relative">
        <input 
          type="text" 
          id="login-username"
          required
          placeholder="Enter Username" 
          class="w-full px-5 py-3.5 bg-slate-800/80 border border-slate-600 rounded-xl text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-red-500 transition text-base"
        >
      </div>

      <div class="relative">
        <input 
          type="password" 
          id="login-password"
          required
          placeholder="Enter Password" 
          class="w-full px-5 py-3.5 bg-slate-800/80 border border-slate-600 rounded-xl text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-red-500 transition text-base"
        >
      </div>

      <button 
        type="submit" 
        class="w-full mt-2 bg-red-600 hover:bg-red-700 text-white font-bold py-3.5 px-4 rounded-xl shadow-lg transition active:scale-95 text-lg"
      >
        Login
      </button>

      <button 
        type="button" 
        onclick="toggleForms()"
        class="w-full bg-slate-800 hover:bg-slate-700 text-slate-200 font-semibold py-3 px-4 rounded-xl border border-slate-600 transition active:scale-95 text-base flex items-center justify-center gap-2"
      >
        <i data-lucide="user-plus" class="w-4 h-4"></i>
        Criar Nova Conta
      </button>
    </form>

    <!-- FORMULÁRIO DE CRIAR CONTA (Oculto inicialmente) -->
    <form id="signup-form" onsubmit="handleSignup(event)" class="space-y-4 hidden">
      <h2 class="text-white font-bold text-lg mb-2">Criar nova conta</h2>
      
      <div class="relative">
        <input 
          type="text" 
          id="signup-username"
          required
          placeholder="Escolha um Username" 
          class="w-full px-5 py-3.5 bg-slate-800/80 border border-slate-600 rounded-xl text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-red-500 transition text-base"
        >
      </div>

      <div class="relative">
        <input 
          type="password" 
          id="signup-password"
          required
          placeholder="Crie uma Palavra-passe" 
          class="w-full px-5 py-3.5 bg-slate-800/80 border border-slate-600 rounded-xl text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-red-500 transition text-base"
        >
      </div>

      <button 
        type="submit" 
        class="w-full mt-2 bg-green-600 hover:bg-green-700 text-white font-bold py-3.5 px-4 rounded-xl shadow-lg transition active:scale-95 text-lg"
      >
        Registar Conta
      </button>

      <button 
        type="button" 
        onclick="toggleForms()"
        class="w-full bg-slate-800 hover:bg-slate-700 text-slate-200 font-semibold py-3 px-4 rounded-xl border border-slate-600 transition active:scale-95 text-base flex items-center justify-center gap-2"
      >
        <i data-lucide="arrow-left" class="w-4 h-4"></i>
        Já tenho conta (Login)
      </button>
    </form>

    <!-- Rodapé -->
    <div class="mt-6 text-xs text-slate-400">
      <a href="#" class="hover:underline">Ajuda com a conta</a>
    </div>

  </div>

  <script>
    // Inicializar ícones
    lucide.createIcons();

    // Alternar entre formulário de Login e Criar Conta
    function toggleForms() {
      const loginForm = document.getElementById('login-form');
      const signupForm = document.getElementById('signup-form');
      
      loginForm.classList.toggle('hidden');
      signupForm.classList.toggle('hidden');
    }

    // Ação ao clicar em Login
    function handleLogin(event) {
      event.preventDefault();
      const user = document.getElementById('login-username').value;
      alert(`Bem-vindo de volta ao goblox, ${user}!`);
    }

    // Ação ao clicar em Criar Conta
    function handleSignup(event) {
      event.preventDefault();
      const user = document.getElementById('signup-username').value;
      alert(`Conta criada com sucesso para ${user}! Bem-vindo ao goblox.`);
      toggleForms(); // Volta para o login após criar
    }
  </script>
</body>
</html>
