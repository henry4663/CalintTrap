<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Goblox - Login</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    min-height: 100vh;
    background: #080012;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
}

/* FUNDO */

.background {
    position: fixed;
    inset: 0;
    overflow: hidden;
    z-index: -1;
    background:
        radial-gradient(circle at 20% 20%, #390080 0%, transparent 35%),
        radial-gradient(circle at 80% 80%, #30006e 0%, transparent 35%),
        #080012;
}

.shape {
    position: absolute;
    width: 190px;
    height: 190px;
    border-radius: 25px;
    background: linear-gradient(135deg, #7900ff, #26005c);
    opacity: .25;
    transform: rotate(35deg);
    box-shadow: 0 0 50px #7200ff;
}

.shape:nth-child(1) { top: -80px; left: -50px; }
.shape:nth-child(2) { right: -80px; top: 20%; }
.shape:nth-child(3) { bottom: -100px; left: 15%; }
.shape:nth-child(4) { bottom: 10%; right: 15%; }

/* CONFIGURAÇÕES */

.settings {
    position: absolute;
    top: 25px;
    right: 30px;
    font-size: 30px;
    cursor: pointer;
    transition: .3s;
}

.settings:hover {
    color: #b56cff;
    transform: rotate(45deg);
}

/* CONTAINER */

.container {
    width: 90%;
    max-width: 550px;
    padding: 30px;
    text-align: center;
    animation: aparecer 1s ease;
}

/* LOGO */

.logo {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 20px;
    margin-bottom: 12px;
}

.logo-icon {
    width: 85px;
    height: 85px;
    background: white;
    transform: rotate(15deg);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #18002d;
    font-size: 45px;
    font-weight: bold;
    border-radius: 8px;
}

.logo h1 {
    font-size: 75px;
    font-weight: 900;
    letter-spacing: -3px;
}

.subtitle {
    color: #aaa0c9;
    font-size: 20px;
    margin-bottom: 45px;
}

/* CAMPOS */

.input-box {
    position: relative;
    margin-bottom: 18px;
}

.input-box input {
    width: 100%;
    height: 70px;
    border: 2px solid #7655a7;
    background: rgba(255,255,255,.035);
    border-radius: 20px;
    outline: none;
    padding: 0 60px;
    color: white;
    font-size: 19px;
    transition: .3s;
}

.input-box input:focus {
    border-color: #c18aff;
    box-shadow: 0 0 18px #7900ff55;
}

.input-box input::placeholder {
    color: #9690ac;
}

.input-icon {
    position: absolute;
    left: 20px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 24px;
    color: #aaa;
}

.eye {
    position: absolute;
    right: 20px;
    top: 50%;
    transform: translateY(-50%);
    cursor: pointer;
    font-size: 22px;
}

/* BOTÃO ENTRAR */

.login-button {
    width: 100%;
    height: 75px;
    border: none;
    border-radius: 20px;
    background: linear-gradient(120deg, #fff, #ded1ff);
    color: #160026;
    font-size: 27px;
    font-weight: bold;
    cursor: pointer;
    margin-top: 5px;
    transition: .3s;
}

.login-button:hover {
    transform: scale(1.02);
    box-shadow: 0 0 25px #a855ff88;
}

/* DIVISOR */

.divider {
    display: flex;
    align-items: center;
    gap: 20px;
    margin: 28px 0;
    color: #aaa0c9;
}

.divider::before,
.divider::after {
    content: "";
    height: 2px;
    flex: 1;
    background: #625276;
}

/* GOOGLE */

.google-button {
    width: 100%;
    height: 70px;
    border: 2px solid #c58aff;
    border-radius: 20px;
    background: transparent;
    color: white;
    font-size: 20px;
    cursor: pointer;
    transition: .3s;
}

.google-button:hover {
    background: #5100a022;
    box-shadow: 0 0 20px #8b00ff55;
}

.google {
    font-weight: bold;
    font-size: 28px;
    margin-right: 20px;
    background: conic-gradient(
        #4285F4 0deg 90deg,
        #34A853 90deg 180deg,
        #FBBC05 180deg 240deg,
        #EA4335 240deg 360deg
    );
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
}

/* LINKS */

.links {
    margin-top: 30px;
    display: flex;
    justify-content: center;
    gap: 25px;
    flex-wrap: wrap;
}

.links a {
    color: #c5a4ff;
    text-decoration: none;
    font-size: 17px;
    transition: .3s;
}

.links a:hover {
    color: white;
    text-decoration: underline;
}

.create {
    margin-top: 35px;
    color: #aaa0c9;
    font-size: 17px;
}

.create a {
    color: #a83cff;
    font-weight: bold;
    text-decoration: none;
    margin-left: 8px;
}

/* ANIMAÇÃO */

@keyframes aparecer {
    from {
        opacity: 0;
        transform: translateY(25px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* CELULAR */

@media(max-width: 600px) {
    .container { padding: 15px; }
    .logo-icon { width: 60px; height: 60px; font-size: 30px; }
    .logo h1 { font-size: 49px; }
    .subtitle { font-size: 16px; margin-bottom: 35px; }
    .input-box input { height: 62px; font-size: 16px; }
    .login-button { height: 65px; font-size: 23px; }
    .google-button { font-size: 16px; height: 62px; }
    .settings { top: 15px; right: 20px; }
}
</style>
</head>

<body>

<div class="background">
    <div class="shape"></div>
    <div class="shape"></div>
    <div class="shape"></div>
    <div class="shape"></div>
</div>

<div class="settings">⚙</div>

<div class="container">

    <div class="logo">
        <div class="logo-icon">◈</div>
        <h1>Goblox</h1>
    </div>

    <p class="subtitle">
        Jogue. Crie. Conecte-se.
    </p>

    <form id="loginForm">

        <div class="input-box">
            <span class="input-icon">♟</span>
            <input
                type="text"
                id="username"
                placeholder="Usuário ou Nickname"
                autocomplete="off"
                required
            >
        </div>

        <div class="input-box">
            <span class="input-icon">🔒</span>
            <input
                type="password"
                id="password"
                placeholder="Senha"
                required
            >
            <span class="eye" id="btnEye">
                ◉
            </span>
        </div>

        <button class="login-button" type="submit">
            Entrar
        </button>

    </form>

    <div class="divider">
        ou
    </div>

    <button class="google-button" id="btnGoogle">
        <span class="google">G</span>
        Continuar com Google
    </button>

    <div class="links">
        <a href="#" id="linkEsqueceu">
            Esqueceu a senha?
        </a>

        <a href="#" class="btnCriarContaLink">
            Criar conta
        </a>
    </div>

    <p class="create">
        Não tem uma conta?
        <a href="#" class="btnCriarContaLink">
            Criar conta
        </a>
    </p>

</div>

<!-- CARREGA O SCRIPT DE AUTENTICAÇÃO SEPARADO -->
<script type="module">
  import { togglePassword, realizarLogin, criarConta } from "./authLocal.js";

  // Mostrar / Ocultar Senha
  document.getElementById("btnEye").addEventListener("click", togglePassword);

  // Form de Login
  document.getElementById("loginForm").addEventListener("submit", (e) => {
    e.preventDefault();
    const user = document.getElementById("username").value.trim();
    const pass = document.getElementById("password").value.trim();
    realizarLogin(user, pass);
  });

  // Botões de Criar Conta
  document.querySelectorAll(".btnCriarContaLink").forEach(element => {
    element.addEventListener("click", (e) => {
      e.preventDefault();
      const user = document.getElementById("username").value.trim();
      const pass = document.getElementById("password").value.trim();
      criarConta(user, pass);
    });
  });

  // Google & Esqueceu a Senha
  document.getElementById("btnGoogle").addEventListener("click", () => alert("Integração com Google em desenvolvimento."));
  document.getElementById("linkEsqueceu").addEventListener("click", (e) => {
    e.preventDefault();
    const user = prompt("Digite seu nome de usuário para recuperação:");
    if (user) alert("Solicitação registrada para o usuário: " + user);
  });
</script>

</body>
</html>
