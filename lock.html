<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>goblox - Login</title>
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    /* Fundo com gradiente e padrões de ícones */
    body {
      background: linear-gradient(135deg, #1e1b4b 0%, #0f172a 50%, #064e3b 100%);
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 relative overflow-hidden font-sans">

  <!-- Elementos decorativos de fundo (Silhuetas/Padrões) -->
  <div class="absolute inset-0 opacity-10 pointer-events-none flex flex-wrap justify-between p-12">
    <i data-lucide="gamepad-2" class="w-24 h-24 text-white transform -rotate-12"></i>
    <i data-lucide="square" class="w-16 h-16 text-white transform rotate-45"></i>
    <i data-lucide="circle" class="w-20 h-20 text-white"></i>
    <i data-lucide="triangle" class="w-24 h-24 text-white transform rotate-12"></i>
  </div>

  <!-- Contentor principal / Mockup de telemóvel -->
  <div class="w-full max-w-sm bg-slate-900/80 backdrop-blur-md rounded-3xl border border-slate-700/50 shadow-2xl p-8 relative z-10 text-center">
    
    <!-- Logo goblox -->
    <div class="mb-10 mt-4">
      <h1 class="text-5xl font-black text-amber-400 tracking-tight lowercase">
        goblox
      </h1>
    </div>

    <!-- Formulário de Login -->
    <form onsubmit="handleLogin(event)" class="space-y-5">
      
      <!-- Campo Username -->
      <div class="relative">
        <input 
          type="text" 
          id="username"
          required
          placeholder="Enter Username" 
          class="w-full px-5 py-3.5 bg-slate-800/80 border border-slate-600 rounded-xl text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent transition text-base"
        >
      </div>

      <!-- Campo Password -->
      <div class="relative">
        <input 
          type="password" 
          id="password"
          required
          placeholder="Enter Password" 
          class="w-full px-5 py-3.5 bg-slate-800/80 border border-slate-600 rounded-xl text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent transition text-base"
        >
      </div>

      <!-- Botão Login -->
      <button 
        type="submit" 
        class="w-full mt-2 bg-red-600 hover:bg-red-700 text-white font-bold py-3.5 px-4 rounded-xl shadow-lg hover:shadow-red-600/30 transition duration-200 active:scale-95 text-lg"
      >
        Login
      </button>

    </form>

    <!-- Rodapé do Card -->
    <div class="mt-8 text-xs text-slate-400">
      <a href="#" class="hover:underline">Esqueceu-se da palavra-passe?</a>
    </div>

  </div>

  <script>
    // Inicializar ícones
    lucide.createIcons();

    // Ação ao clicar em Login
    function handleLogin(event) {
      event.preventDefault();
      const user = document.getElementById('username').value;
      alert(`Bem-vindo de volta ao goblox, ${user}!`);
    }
  </script>
</body>
</html>
