<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Goblox — Entrar</title>
<link rel="stylesheet" href="css/global.css">
<link rel="stylesheet" href="css/lock.css">
</head>
<body class="center">

<div class="login-box">
  <div class="logo">GOBLOX</div>
  <div class="logo-sub">Sua plataforma de jogos</div>

  <div class="input-group">
    <input id="inUser" type="text" placeholder="Nome de usuário" maxlength="16" autocomplete="username">
  </div>
  <div class="input-group">
    <input id="inPass" type="password" placeholder="Senha" autocomplete="current-password">
  </div>

  <button class="btn btn-primary" id="btnLogin">Entrar</button>
  <button class="btn btn-ghost" id="btnRegistrar">Criar conta</button>

  <p id="msgLogin" class="msg"></p>
</div>

<div id="toast" class="toast"></div>

<script type="module" src="js/lock.js"></script>
</body>
</html>
