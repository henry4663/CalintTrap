```html
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Goblox - Login</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>

<div class="background"></div>

<main class="login-container">
    <div class="logo">GO<span>BLOX</span></div>
    <p class="subtitle">Entre no seu universo.</p>

    <form id="loginForm">
        <label>Usuário</label>
        <input type="text" id="username" placeholder="Seu nome de usuário" required>

        <label>Senha</label>
        <input type="password" id="password" placeholder="Sua senha" required>

        <button type="submit">ENTRAR</button>
    </form>

    <p id="message"></p>

    <div class="footer">
        Não tem uma conta?
        <a href="../cadastro/cadastro.html">Criar conta</a>
    </div>
</main>

<script src="login.js"></script>
</body>
</html>
