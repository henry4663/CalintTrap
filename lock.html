<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Goblox - Login</title>
    <link rel="stylesheet" href="global.css">
    <link rel="stylesheet" href="lock.css">
</head>
<body>

<div class="lock-background"></div>

<main class="lock-container">

    <div class="logo">GO<span>BLOX</span></div>
    <p class="subtitle">Seu universo começa aqui.</p>

    <form id="authForm">

        <div id="nameGroup" hidden>
            <label>Nome de usuário</label>
            <input id="username" type="text"
                placeholder="Escolha seu usuário"
                maxlength="20">
        </div>

        <label>Usuário</label>
        <input id="loginUsername" type="text"
            placeholder="Seu nome de usuário"
            maxlength="20" required>

        <label>Senha</label>
        <input id="password" type="password"
            placeholder="Sua senha"
            minlength="6" required>

        <button id="submitButton" type="submit">
            ENTRAR
        </button>

    </form>

    <p id="message"></p>

    <div class="links">
        <p>
            <span id="switchText">Não tem uma conta?</span>
            <button id="switchMode" type="button">Criar conta</button>
        </p>
    </div>

</main>

<script type="module" src="lock.js"></script>
</body>
</html>
