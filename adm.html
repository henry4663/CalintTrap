<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GOBLOX — Painel Administrativo</title>
  <link rel="stylesheet" href="./global.css" />
  <link rel="stylesheet" href="./lobby.css" />
  <style>
    .adm-container {
      max-width: 900px;
      margin: 40px auto;
      padding: 24px;
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
    }
    .adm-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      padding-bottom: 15px;
    }
    .adm-header h1 {
      color: #ef4444;
      font-size: 1.8rem;
    }
    .tabela-jogadores {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
    }
    .tabela-jogadores th, .tabela-jogadores td {
      padding: 12px;
      text-align: left;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      font-size: 0.95rem;
    }
    .tabela-jogadores th {
      color: #94a3b8;
      background: rgba(0,0,0,0.3);
    }
    .tabela-jogadores tr:hover {
      background: rgba(255,255,255,0.03);
    }
    .btn-kick {
      background: #ef4444;
      color: #fff;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.2s;
    }
    .btn-kick:hover {
      background: #dc2626;
    }
    .badge-online {
      background: #22c55e;
      color: #000;
      padding: 3px 8px;
      border-radius: 12px;
      font-size: 0.75rem;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="bg"></div>

  <div class="container">
    <div class="adm-container">
      <div class="adm-header">
        <div>
          <h1>⚙️ Painel ADM</h1>
          <p style="color: #94a3b8; font-size: 0.9rem;">Controlo e moderação de servidores do Goblox</p>
        </div>
        <button class="btn btn-light" onclick="window.location.href='lobby.html'">Voltar ao Lobby</button>
      </div>

      <section>
        <h3 style="color: #fff; margin-bottom: 10px;">Jogadores Online na Arena (Parkour / Servidor)</h3>
        <div style="overflow-x: auto;">
          <table class="tabela-jogadores">
            <thead>
              <tr>
                <th>Estado</th>
                <th>Nome / Nick</th>
                <th>ID da Sessão</th>
                <th>Posição (X, Y, Z)</th>
                <th>Ações</th>
              </tr>
            </thead>
            <tbody id="listaJogadoresOnline">
              <tr>
                <td colspan="5" style="text-align: center; color: #888;">A carregar dados do servidor...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>
    </div>
  </div>

  <div id="toast" class="toast" aria-live="polite"></div>

  <script type="module" src="./adm.js"></script>
</body>
</html>
