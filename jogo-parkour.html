<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Goblox — Parkour Multiplayer</title>
<link rel="stylesheet" href="global.css">
<style>
  body {
    margin: 0;
    overflow: hidden;
    background-color: #87caff;
    user-select: none;
    touch-action: none;
    font-family: Arial, sans-serif;
  }
  #status {
    position: absolute;
    top: 20px;
    left: 20px;
    color: #fff;
    font-size: 1.2rem;
    font-weight: bold;
    z-index: 10;
    text-shadow: 0 2px 4px rgba(0,0,0,0.5);
  }
  #btnVoltar {
    position: absolute;
    top: 20px;
    right: 20px;
    padding: 10px 18px;
    background: #1e1e2d;
    border: 1px solid rgba(255,255,255,0.3);
    color: #fff;
    border-radius: 10px;
    font-weight: bold;
    cursor: pointer;
    z-index: 20;
    text-decoration: none;
  }

  /* BOTÕES DE CONTROLE MOBILE */
  #controlesMobile {
    position: absolute;
    bottom: 30px;
    left: 30px;
    display: none;
    z-index: 20;
    gap: 15px;
    align-items: center;
  }
  .d-pad {
    display: grid;
    grid-template-columns: repeat(3, 50px);
    grid-template-rows: repeat(3, 50px);
    gap: 5px;
  }
  .move {
    background: rgba(255, 255, 255, 0.3);
    border: 2px solid rgba(255, 255, 255, 0.6);
    border-radius: 12px;
    color: white;
    font-size: 1.2rem;
    font-weight: bold;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  .move:active { background: rgba(255, 255, 255, 0.6); }
  
  #btnPularMobile {
    width: 85px;
    height: 85px;
    background: radial-gradient(circle, #35d995 0%, #047857 100%);
    border: 3px solid #6ee7b7;
    border-radius: 50%;
    color: white;
    font-weight: 900;
    font-size: 1rem;
    box-shadow: 0 0 20px rgba(53, 217, 149, 0.6);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    position: absolute;
    bottom: 40px;
    right: 40px;
    z-index: 20;
  }
  #btnPularMobile:active { transform: scale(0.92); }

  #mensagem {
    position: absolute;
    top: 40%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(0,0,0,0.85);
    color: #4ade80;
    padding: 30px 50px;
    border-radius: 20px;
    font-size: 2rem;
    font-weight: bold;
    display: none;
    z-index: 30;
    text-align: center;
    border: 2px solid #4ade80;
    box-shadow: 0 0 30px rgba(74, 222, 128, 0.5);
  }
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.170.0/build/three.module.js"
  }
}
</script>
</head>
<body>

<div id="status">A carregar motor 3D...</div>
<div id="mensagem">VICTORY! 🎉</div>
<a href="lobby.html" id="btnVoltar">⎋ Sair</a>

<!-- CONTROLES MOBILE -->
<div id="controlesMobile">
  <div class="d-pad">
    <div></div>
    <button class="move" data-key="KeyW" style="grid-column: 2; grid-row: 1;">▲</button>
    <div></div>
    <button class="move" data-key="KeyA" style="grid-column: 1; grid-row: 2;">◀</button>
    <div></div>
    <button class="move" data-key="KeyD" style="grid-column: 3; grid-row: 2;">▶</button>
    <div></div>
    <button class="move" data-key="KeyS" style="grid-column: 2; grid-row: 3;">▼</button>
    <div></div>
  </div>
</div>
<button id="btnPularMobile">PULAR</button>

<script type="module">
import * as THREE from 'three';
import { db as database } from './firebase.js';
import { ref, set, remove, onValue, onDisconnect } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
import { criarPersonagem } from './personagem.js';

const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || window.innerWidth < 768;

if (isMobile) {
  document.getElementById("controlesMobile").style.display = "flex";
}

(async function iniciarParkour() {
  const status = document.getElementById("status");
  status.textContent = "Preparando cenário...";

  // CENA
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x87caff);
  scene.fog = new THREE.Fog(0x87caff, 35, 110);

  const camera = new THREE.PerspectiveCamera(
    70, innerWidth / innerHeight, 0.1, 200
  );

  const renderer = new THREE.WebGLRenderer({
    antialias: true,
    powerPreference: "high-performance"
  });

  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.outputColorSpace = THREE.SRGBColorSpace;

  document.body.appendChild(renderer.domElement);

  // ILUMINAÇÃO
  scene.add(new THREE.HemisphereLight(0xffffff, 0x53647d, 2));

  const sol = new THREE.DirectionalLight(0xffffff, 2.5);
  sol.position.set(-15, 25, 12);
  sol.castShadow = true;
  sol.shadow.mapSize.set(1024, 1024);
  scene.add(sol);

  // MATERIAIS
  function material(cor, metalness = 0) {
    return new THREE.MeshStandardMaterial({
      color: cor,
      roughness: 0.75,
      metalness
    });
  }

  const cores = {
    verde: material(0x35d995),
    roxo: material(0x7955ff),
    azul: material(0x269cff),
    amarelo: material(0xffcb45),
    vermelho: material(0xff5369),
    branco: material(0xffffff),
    chao: material(0x29394e)
  };

  function criarBloco(x, y, z, sx, sy, sz, mat) {
    const objeto = new THREE.Mesh(
      new THREE.BoxGeometry(sx, sy, sz),
      mat
    );
    objeto.position.set(x, y, z);
    objeto.castShadow = true;
    objeto.receiveShadow = true;
    scene.add(objeto);
    return objeto;
  }

  // CHÃO
  criarBloco(0, -2, -25, 200, 1, 200, cores.chao);

  // PLATAFORMAS
  const plataformas = [];

  function plataforma(x, y, z, largura, profundidade, mat) {
    const objeto = criarBloco(x, y, z, largura, 0.7, profundidade, mat);

    plataformas.push({
      minX: x - largura/2 - 0.5,
      maxX: x + largura/2 + 0.5,
      minZ: z - profundidade/2 - 0.5,
      maxZ: z + profundidade/2 + 0.5,
      y: y + 0.35
    });

    criarBloco(x, y - 0.36, z, largura + 0.15, 0.12, profundidade + 0.15, cores.branco);
    return objeto;
  }

  plataforma(0, 0, 0, 10, 10, cores.verde);
  plataforma(0, 1, -10, 5, 5, cores.roxo);
  plataforma(5, 2, -17, 4, 4, cores.azul);
  plataforma(0, 3, -24, 4, 4, cores.amarelo);
  plataforma(-5, 4, -31, 4, 4, cores.verde);
  plataforma(-5, 5, -39, 6, 6, cores.roxo);
  plataforma(2, 6, -47, 4, 4, cores.azul);
  plataforma(8, 7, -55, 6, 6, cores.amarelo);

  // CHECKPOINT E BANDEIRA
  criarBloco(-5, 5.4, -39, 1.7, 0.15, 1.7, cores.verde);
  criarBloco(8, 7.42, -55, 2, 0.12, 2, cores.verde);
  criarBloco(8, 9, -55, 0.25, 3, 0.25, cores.vermelho);
  criarBloco(9, 10.2, -55, 2, 0.8, 0.15, cores.amarelo);

  // MULTIPLAYER E ANTI-FANTASMA
  const meuId = 'player_parkour_' + Math.random().toString(36).substr(2, 9);
  const jogadorRef = ref(database, 'parkour_jogadores/' + meuId);
  const todosJogadoresRef = ref(database, 'parkour_jogadores');
  const outrosJogadores = {};

  function sairDoJogoLimpo() {
    remove(jogadorRef).catch(() => {});
  }

  onDisconnect(jogadorRef).remove();
  window.addEventListener('beforeunload', sairDoJogoLimpo);
  window.addEventListener('pagehide', sairDoJogoLimpo);

  document.getElementById('btnVoltar').addEventListener('click', (e) => {
    e.preventDefault();
    sairDoJogoLimpo();
    setTimeout(() => { window.location.href = 'lobby.html'; }, 100);
  });

  // PERSONAGEM LOCAL
  const jogador = criarPersonagem();
  scene.add(jogador);
  jogador.position.set(0, 0.36, 0);

  set(jogadorRef, { x: 0, y: 0.36, z: 0 });

  // ESCUTA OUTROS JOGADORES
  onValue(todosJogadoresRef, (snapshot) => {
    const data = snapshot.val() || {};

    for (let id in outrosJogadores) {
      if (!data[id]) {
        scene.remove(outrosJogadores[id].mesh);
        delete outrosJogadores[id];
      }
    }

    for (let id in data) {
      if (id === meuId) continue;
      let pos = data[id];

      if (!outrosJogadores[id]) {
        const meshOutro = criarPersonagem();
        scene.add(meshOutro);
        outrosJogadores[id] = { id: id, mesh: meshOutro };
      }

      if (pos && typeof pos.x === 'number') {
        outrosJogadores[id].mesh.position.set(pos.x, pos.y, pos.z);
      }
    }
  });

  // ESTADO
  let velocidadeY = 0;
  let noChao = false;
  let venceu = false;
  let anguloCamera = 0;
  let checkpoint = new THREE.Vector3(0, 0.36, 0);

  const velocidade = 7;
  const gravidade = 22;
  const forcaPulo = 10;
  const teclas = {};

  // TECLADO
  addEventListener("keydown", e => {
    teclas[e.code] = true;
    if (e.code === "Space") {
      e.preventDefault();
      pular();
    }
  });

  addEventListener("keyup", e => {
    teclas[e.code] = false;
  });

  function pular() {
    if (noChao && !venceu) {
      velocidadeY = forcaPulo;
      noChao = false;
    }
  }

  // CONTROLES MOBILE (D-PAD)
  document.querySelectorAll(".move").forEach(botao => {
    const tecla = botao.dataset.key;
    botao.addEventListener("pointerdown", e => {
      e.preventDefault();
      teclas[tecla] = true;
      botao.setPointerCapture(e.pointerId);
    });
    function soltar() { teclas[tecla] = false; }
    botao.addEventListener("pointerup", soltar);
    botao.addEventListener("pointercancel", soltar);
    botao.addEventListener("lostpointercapture", soltar);
  });

  document.getElementById("btnPularMobile").addEventListener("pointerdown", e => {
    e.preventDefault();
    pular();
  });

  // ROTAÇÃO DE CÂMERA POR TOQUE / MOUSE
  let arrastando = false;
  let ultimaX = 0;

  renderer.domElement.addEventListener("pointerdown", e => {
    arrastando = true;
    ultimaX = e.clientX;
    renderer.domElement.setPointerCapture(e.pointerId);
  });

  renderer.domElement.addEventListener("pointermove", e => {
    if (!arrastando) return;
    anguloCamera -= (e.clientX - ultimaX) * 0.006;
    ultimaX = e.clientX;
  });

  function pararCamera() { arrastando = false; }
  renderer.domElement.addEventListener("pointerup", pararCamera);
  renderer.domElement.addEventListener("pointercancel", pararCamera);

  // ATUALIZAÇÃO E COLISÃO
  function atualizar(dt) {
    if (venceu) return;

    const frente = (teclas.KeyW || teclas.ArrowUp ? 1 : 0) - (teclas.KeyS || teclas.ArrowDown ? 1 : 0);
    const lado = (teclas.KeyD || teclas.ArrowRight ? 1 : 0) - (teclas.KeyA || teclas.ArrowLeft ? 1 : 0);

    const direcao = new THREE.Vector3(lado, 0, -frente);

    if (direcao.lengthSq() > 0) {
      direcao.normalize();
      direcao.applyAxisAngle(new THREE.Vector3(0, 1, 0), anguloCamera);

      jogador.position.x += direcao.x * velocidade * dt;
      jogador.position.z += direcao.z * velocidade * dt;
      jogador.rotation.y = Math.atan2(direcao.x, direcao.z) + Math.PI;
    }

    velocidadeY -= gravidade * dt;
    jogador.position.y += velocidadeY * dt;

    noChao = false;

    // COLISÕES COM PLATAFORMAS
    for (const p of plataformas) {
      if (
        jogador.position.x >= p.minX && jogador.position.x <= p.maxX &&
        jogador.position.z >= p.minZ && jogador.position.z <= p.maxZ &&
        velocidadeY <= 0 &&
        jogador.position.y >= p.y - 0.5 && jogador.position.y <= p.y + 0.5
      ) {
        jogador.position.y = p.y;
        velocidadeY = 0;
        noChao = true;
      }
    }

    // CHECKPOINT
    if (jogador.position.z < -36 && jogador.position.z > -42 && jogador.position.x < -2 && jogador.position.x > -8 && noChao) {
      checkpoint.set(jogador.position.x, jogador.position.y, jogador.position.z);
      status.textContent = "Checkpoint ativado!";
    }

    // VITÓRIA
    if (jogador.position.z < -57 && jogador.position.x > 5) {
      venceu = true;
      document.getElementById("mensagem").style.display = "block";
      status.textContent = "Você venceu!";
    }

    // QUEDA
    if (jogador.position.y < -12) {
      jogador.position.copy(checkpoint);
      velocidadeY = 0;
      noChao = false;
    }

    jogador.position.x = THREE.MathUtils.clamp(jogador.position.x, -20, 20);
  }

  // CÂMERA EM TERCEIRA PESSOA
  function atualizarCamera(dt) {
    const distancia = 8;
    const destino = new THREE.Vector3(
      jogador.position.x + Math.sin(anguloCamera) * distancia,
      jogador.position.y + 3.5,
      jogador.position.z + Math.cos(anguloCamera) * distancia
    );

    camera.position.lerp(destino, 1 - Math.exp(-6 * dt));
    camera.lookAt(jogador.position.x, jogador.position.y + 1.5, jogador.position.z);
  }

  const relogio = new THREE.Clock();
  let ultimoEnvio = 0;

  function animar(tempo) {
    requestAnimationFrame(animar);

    const dt = Math.min(relogio.getDelta(), 0.04);

    atualizar(dt);
    atualizarCamera(dt);

    if (tempo - ultimoEnvio > 50) {
      set(jogadorRef, {
        x: Number(jogador.position.x.toFixed(2)),
        y: Number(jogador.position.y.toFixed(2)),
        z: Number(jogador.position.z.toFixed(2))
      }).catch(() => {});
      ultimoEnvio = tempo;
    }

    renderer.render(scene, camera);
  }

  addEventListener("resize", () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });

  status.textContent = "Chegue até a bandeira final!";
  animar(0);
})();
</script>
</body>
</html>
