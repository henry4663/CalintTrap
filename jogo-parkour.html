<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Goblox — Parkour</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #9ad9ff;
      font-family: Arial, Helvetica, sans-serif;
      user-select: none;
      touch-action: none;
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      background: linear-gradient(#aee8ff, #dff8ff);
    }

    #status {
      position: absolute;
      left: 18px;
      top: 18px;
      z-index: 30;
      background: rgba(10, 16, 24, 0.72);
      color: white;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      padding: 10px 14px;
      font-weight: bold;
      font-size: 14px;
      display: none;
    }

    #mensagem {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      z-index: 40;
      background: rgba(0,0,0,0.7);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 16px;
      padding: 18px 22px;
      color: white;
      font-weight: 700;
      text-align: center;
      display: none;
    }

    #btnVoltar {
      position: absolute;
      top: 18px;
      right: 18px;
      z-index: 30;
      text-decoration: none;
      color: white;
      background: rgba(10, 16, 24, 0.72);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 12px;
      padding: 10px 14px;
      font-weight: 700;
    }

    .mobile-controls {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 150px;
      display: none;
      z-index: 25;
    }

    .move {
      position: absolute;
      width: 68px;
      height: 68px;
      border-radius: 50%;
      border: 0;
      background: rgba(255,255,255,0.1);
      color: white;
      font-weight: bold;
      font-size: 18px;
      border: 1px solid rgba(255,255,255,0.15);
    }

    #moveW { left: 22px; bottom: 82px; }
    #moveS { left: 22px; bottom: 12px; }
    #moveA { left: 96px; bottom: 12px; }
    #moveD { left: 96px; bottom: 82px; }

    #pular {
      position: absolute;
      right: 26px;
      bottom: 24px;
      width: 90px;
      height: 90px;
      border-radius: 50%;
      border: none;
      background: linear-gradient(135deg, #38bdf8, #0ea5e9);
      color: white;
      font-weight: 900;
      font-size: 0.8rem;
      box-shadow: 0 0 18px rgba(56, 189, 248, 0.35);
    }

    @media (max-width: 768px) {
      .mobile-controls { display: block; }
    }
  </style>
</head>
<body>
  <div id="status">Parkour</div>
  <div id="mensagem">Você venceu!<br><small>Voltando ao lobby...</small></div>
  <a href="lobby.html" id="btnVoltar">Sair</a>

  <div class="mobile-controls">
    <button id="moveW" class="move" data-key="KeyW">W</button>
    <button id="moveS" class="move" data-key="KeyS">S</button>
    <button id="moveA" class="move" data-key="KeyA">A</button>
    <button id="moveD" class="move" data-key="KeyD">D</button>
    <button id="pular">PULAR</button>
  </div>

  <script type="module">
    const status = document.getElementById("status");
    const mensagem = document.getElementById("mensagem");

    let THREE;

    try {
      THREE = await import("https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js");
    } catch {
      try {
        THREE = await import("https://unpkg.com/three@0.170.0/build/three.module.js");
      } catch {
        if (status) {
          status.style.display = "block";
          status.textContent = "Erro ao carregar 3D.";
        }
        console.error("Three.js falhou ao carregar.");
        return;
      }
    }

    const isMobile = /Android|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || window.innerWidth < 768;

    status.style.display = "none";

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x9ad9ff);
    scene.fog = new THREE.Fog(0x9ad9ff, 30, 150);

    const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 220);
    scene.add(camera);

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.body.appendChild(renderer.domElement);

    const hemi = new THREE.HemisphereLight(0xffffff, 0x7a8fa8, 1.5);
    scene.add(hemi);

    const sol = new THREE.DirectionalLight(0xffffff, 2.2);
    sol.position.set(-15, 25, 10);
    sol.castShadow = true;
    sol.shadow.mapSize.set(1024, 1024);
    scene.add(sol);

    function makeMaterial(color, roughness = 0.7, metalness = 0.1) {
      return new THREE.MeshStandardMaterial({ color, roughness, metalness });
    }

    const cores = {
      chao: makeMaterial(0x2d3b4d),
      verde: makeMaterial(0x34d399),
      roxo: makeMaterial(0x7c3aed),
      azul: makeMaterial(0x2563eb),
      amarelo: makeMaterial(0xfbbf24),
      vermelho: makeMaterial(0xef4444),
      branco: makeMaterial(0xffffff),
      pele: makeMaterial(0xffd2a6),
      roupa: makeMaterial(0x4f46e5),
      calca: makeMaterial(0x1f2937),
      cabelo: makeMaterial(0x2a1c20)
    };

    function criarBloco(x, y, z, sx, sy, sz, mat) {
      const mesh = new THREE.Mesh(new THREE.BoxGeometry(sx, sy, sz), mat);
      mesh.position.set(x, y, z);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      scene.add(mesh);
      return mesh;
    }

    const platforms = [];
    function plataforma(x, y, z, sx, sy, sz, mat = cores.verde) {
      const mesh = criarBloco(x, y, z, sx, sy, sz, mat);
      platforms.push({ x, y, z, w: sx, h: sy, d: sz, top: y + sy / 2 });
      return mesh;
    }

    criarBloco(0, -2, 0, 200, 1, 200, cores.chao);

    plataforma(0, 0, 0, 10, 1, 10, cores.verde);
    plataforma(0, 1.2, -10, 5, 1, 5, cores.roxo);
    plataforma(5, 2.4, -17, 5, 1, 5, cores.azul);
    plataforma(0, 3.6, -24, 4, 1, 4, cores.amarelo);
    plataforma(-5, 4.8, -32, 5, 1, 5, cores.verde);
    plataforma(-5, 5.9, -40, 6, 1, 6, cores.roxo);
    plataforma(2, 7.2, -48, 6, 1, 6, cores.azul);
    plataforma(8, 8.5, -56, 7, 1, 7, cores.amarelo);

    const finish = criarBloco(8, 9.4, -56, 2.2, 0.3, 2.2, cores.verde);

    const jogador = new THREE.Group();
    scene.add(jogador);

    const corpo = new THREE.Mesh(
      new THREE.BoxGeometry(1, 1.4, 1),
      new THREE.MeshStandardMaterial({
        color: 0x8b5cf6,
        emissive: 0x4c1d95,
        emissiveIntensity: 0.2
      })
    );
    corpo.position.y = 1.2;
    corpo.castShadow = true;
    corpo.receiveShadow = true;
    jogador.add(corpo);

    const cabeca = new THREE.Mesh(
      new THREE.BoxGeometry(0.8, 0.8, 0.8),
      new THREE.MeshStandardMaterial({ color: 0xffd7b5 })
    );
    cabeca.position.y = 2.2;
    cabeca.castShadow = true;
    cabeca.receiveShadow = true;
    jogador.add(cabeca);

    const olhoMat = new THREE.MeshBasicMaterial({ color: 0x111827 });
    const olhoEsq = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.08, 0.04), olhoMat);
    olhoEsq.position.set(-0.18, 2.25, 0.42);
    jogador.add(olhoEsq);

    const olhoDir = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.08, 0.04), olhoMat);
    olhoDir.position.set(0.18, 2.25, 0.42);
    jogador.add(olhoDir);

    function criarNomeNoPlayer(nome = "nick") {
      const canvas = document.createElement("canvas");
      canvas.width = 512;
      canvas.height = 128;

      const ctx = canvas.getContext("2d");
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "rgba(0,0,0,0.35)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.font = "700 42px Arial";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillStyle = "#ffffff";
      ctx.fillText(nome, canvas.width / 2, canvas.height / 2);

      const tex = new THREE.CanvasTexture(canvas);
      const material = new THREE.SpriteMaterial({ map: tex, transparent: true });
      const sprite = new THREE.Sprite(material);
      sprite.scale.set(2.8, 0.7, 1);
      sprite.position.set(0, 3.2, 0);

      return sprite;
    }

    const nameTag = criarNomeNoPlayer("nick");
    jogador.add(nameTag);

    jogador.position.set(0, 0.5, 6);

    let velocidadeY = 0;
    let noChao = false;
    let anguloCamera = 0;
    let venceu = false;
    let tempo = 0;

    const teclas = {};
    const moveState = { forward: false, backward: false, left: false, right: false };

    function pular() {
      if (noChao && !venceu) {
        velocidadeY = 10;
        noChao = false;
      }
    }

    document.addEventListener("keydown", (e) => {
      if (e.code === "KeyW" || e.code === "ArrowUp") moveState.forward = true;
      if (e.code === "KeyS" || e.code === "ArrowDown") moveState.backward = true;
      if (e.code === "KeyA" || e.code === "ArrowLeft") moveState.left = true;
      if (e.code === "KeyD" || e.code === "ArrowRight") moveState.right = true;
      if (e.code === "Space") pular();
      teclas[e.code] = true;
    });

    document.addEventListener("keyup", (e) => {
      if (e.code === "KeyW" || e.code === "ArrowUp") moveState.forward = false;
      if (e.code === "KeyS" || e.code === "ArrowDown") moveState.backward = false;
      if (e.code === "KeyA" || e.code === "ArrowLeft") moveState.left = false;
      if (e.code === "KeyD" || e.code === "ArrowRight") moveState.right = false;
      teclas[e.code] = false;
    });

    document.querySelectorAll(".move").forEach((botao) => {
      const key = botao.dataset.key;
      botao.addEventListener("pointerdown", (e) => {
        e.preventDefault();
        moveState[key] = true;
      });
      botao.addEventListener("pointerup", () => {
        moveState[key] = false;
      });
      botao.addEventListener("pointercancel", () => {
        moveState[key] = false;
      });
      botao.addEventListener("pointerleave", () => {
        moveState[key] = false;
      });
    });

    document.getElementById("pular").addEventListener("pointerdown", (e) => {
      e.preventDefault();
      pular();
    });

    let drag = false;
    let ultimaX = 0;

    renderer.domElement.addEventListener("pointerdown", (e) => {
      drag = true;
      ultimaX = e.clientX;
    });

    renderer.domElement.addEventListener("pointermove", (e) => {
      if (!drag) return;
      const delta = e.clientX - ultimaX;
      anguloCamera -= delta * 0.006;
      ultimaX = e.clientX;
    });

    renderer.domElement.addEventListener("pointerup", () => { drag = false; });
    renderer.domElement.addEventListener("pointerleave", () => { drag = false; });

    function atualizarJogador(dt) {
      if (venceu) return;

      let dirX = 0;
      let dirZ = 0;

      if (moveState.forward) dirZ -= 1;
      if (moveState.backward) dirZ += 1;
      if (moveState.left) dirX -= 1;
      if (moveState.right) dirX += 1;

      if (dirX !== 0 || dirZ !== 0) {
        const len = Math.hypot(dirX, dirZ) || 1;
        dirX /= len;
        dirZ /= len;

        const frente = new THREE.Vector3(Math.sin(anguloCamera), 0, Math.cos(anguloCamera)).normalize();
        const lado = new THREE.Vector3(Math.cos(anguloCamera), 0, -Math.sin(anguloCamera)).normalize();

        const moveDir = new THREE.Vector3();
        moveDir.addScaledVector(frente, -dirZ);
        moveDir.addScaledVector(lado, dirX);

        const speed = 8;
        jogador.position.x += moveDir.x * speed * dt;
        jogador.position.z += moveDir.z * speed * dt;
      }

      velocidadeY -= 20 * dt;
      jogador.position.y += velocidadeY * dt;

      noChao = false;

      for (const p of platforms) {
        const dentroX = jogador.position.x >= p.x - p.w / 2 && jogador.position.x <= p.x + p.w / 2;
        const dentroZ = jogador.position.z >= p.z - p.d / 2 && jogador.position.z <= p.z + p.d / 2;

        const topo = p.top + 0.7;

        if (dentroX && dentroZ && jogador.position.y <= topo && jogador.position.y >= topo - 1.4 && velocidadeY <= 0) {
          jogador.position.y = topo;
          velocidadeY = 0;
          noChao = true;
        }
      }

      if (jogador.position.y < -12) {
        jogador.position.set(0, 0.5, 6);
        velocidadeY = 0;
        noChao = false;
      }

      if (jogador.position.distanceTo(new THREE.Vector3(8, 9.4, -56)) < 2.5) {
        venceu = true;
        mensagem.style.display = "block";
        setTimeout(() => {
          window.location.href = "jogo-3d.html";
        }, 1200);
      }
    }

    function atualizarCamera() {
      const distancia = 8;
      const alvo = new THREE.Vector3(
        jogador.position.x + Math.sin(anguloCamera) * distancia,
        jogador.position.y + 3.2,
        jogador.position.z + Math.cos(anguloCamera) * distancia
      );

      camera.position.lerp(alvo, 1 - Math.exp(-8 * 0.016));
      camera.lookAt(jogador.position.x, jogador.position.y + 1.3, jogador.position.z);
    }

    let last = performance.now();

    function animate() {
      requestAnimationFrame(animate);

      const delta = Math.min(0.033, (performance.now() - last) / 1000);
      last = performance.now();

      tempo += delta;
      document.getElementById("status").textContent = `Tempo: ${tempo.toFixed(1)}s`;

      atualizarJogador(delta);
      atualizarCamera();
      renderer.render(scene, camera);
    }

    status.textContent = "Parkour ativo";
    animate();
  })();
  </script>
</body>
</html>
