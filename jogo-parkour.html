<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Goblox — Parkour Multiplayer</title>
<link rel="stylesheet" href="global.css">
<style>
  body {
    margin: 0;
    overflow: hidden;
    background-color: #87caff;
    user-select: none;
    touch-action: none;
    font-family: Arial, sans-serif;
  }
  #status {
    position: absolute;
    top: 20px;
    left: 20px;
    color: #fff;
    font-size: 1.2rem;
    font-weight: bold;
    z-index: 10;
    text-shadow: 0 2px 4px rgba(0,0,0,0.5);
  }
  #btnVoltar {
    position: absolute;
    top: 20px;
    right: 20px;
    padding: 10px 18px;
    background: #1e1e2d;
    border: 1px solid rgba(255,255,255,0.3);
    color: #fff;
    border-radius: 10px;
    font-weight: bold;
    cursor: pointer;
    z-index: 20;
    text-decoration: none;
  }

  /* JOYSTICK VIRTUAL MOBILE */
  #joystickBase {
    position: absolute;
    bottom: 40px;
    left: 40px;
    width: 120px;
    height: 120px;
    background: rgba(255, 255, 255, 0.2);
    border: 2px solid rgba(255, 255, 255, 0.5);
    border-radius: 50%;
    z-index: 20;
    display: none;
    touch-action: none;
  }
  #joystickStick {
    position: absolute;
    top: 35px;
    left: 35px;
    width: 50px;
    height: 50px;
    background: radial-gradient(circle, #35d995 0%, #047857 100%);
    border: 2px solid #6ee7b7;
    border-radius: 50%;
    pointer-events: none;
    box-shadow: 0 0 15px rgba(53, 217, 149, 0.6);
  }

  /* BOTÃO DE PULAR MOBILE */
  #btnPularMobile {
    width: 85px;
    height: 85px;
    background: radial-gradient(circle, #35d995 0%, #047857 100%);
    border: 3px solid #6ee7b7;
    border-radius: 50%;
    color: white;
    font-weight: 900;
    font-size: 1rem;
    box-shadow: 0 0 20px rgba(53, 217, 149, 0.6);
    cursor: pointer;
    display: none;
    align-items: center;
    justify-content: center;
    position: absolute;
    bottom: 40px;
    right: 40px;
    z-index: 20;
    touch-action: none;
  }
  #btnPularMobile:active { transform: scale(0.92); }

  #mensagem {
    position: absolute;
    top: 40%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(0,0,0,0.85);
    color: #4ade80;
    padding: 30px 50px;
    border-radius: 20px;
    font-size: 2rem;
    font-weight: bold;
    display: none;
    z-index: 30;
    text-align: center;
    border: 2px solid #4ade80;
    box-shadow: 0 0 30px rgba(74, 222, 128, 0.5);
  }
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.170.0/build/three.module.js"
  }
}
</script>
</head>
<body>

<div id="status">A carregar motor 3D...</div>
<div id="mensagem">VICTORY! 🎉</div>
<a href="lobby.html" id="btnVoltar">⎋ Sair</a>

<!-- CONTROLES MOBILE (JOYSTICK + PULO) -->
<div id="joystickBase">
  <div id="joystickStick"></div>
</div>
<button id="btnPularMobile">PULAR</button>

<script type="module">
import * as THREE from 'three';
import { db as database } from './firebase.js';
import { ref, set, remove, onValue, onDisconnect } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
import { criarPersonagem } from './personagem.js';

const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || window.innerWidth < 768;

if (isMobile) {
  document.getElementById("joystickBase").style.display = "block";
  document.getElementById("btnPularMobile").style.display = "flex";
}

(async function iniciarParkour() {
  const status = document.getElementById("status");
  status.textContent = "Preparando cenário...";

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x87caff);
  scene.fog = new THREE.Fog(0x87caff, 35, 110);

  const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.1, 200);

  const renderer = new THREE.WebGLRenderer({
    antialias: true,
    powerPreference: "high-performance"
  });

  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.outputColorSpace = THREE.SRGBColorSpace;

  document.body.appendChild(renderer.domElement);

  scene.add(new THREE.HemisphereLight(0xffffff, 0x53647d, 2));

  const sol = new THREE.DirectionalLight(0xffffff, 2.5);
  sol.position.set(-15, 25, 12);
  sol.castShadow = true;
  sol.shadow.mapSize.set(1024, 1024);
  scene.add(sol);

  function material(cor, metalness = 0) {
    return new THREE.MeshStandardMaterial({ color: cor, roughness: 0.75, metalness });
  }

  const cores = {
    verde: material(0x35d995),
    roxo: material(0x7955ff),
    azul: material(0x269cff),
    amarelo: material(0xffcb45),
    vermelho: material(0xff5369),
    branco: material(0xffffff),
    chao: material(0x29394e)
  };

  function criarBloco(x, y, z, sx, sy, sz, mat) {
    const objeto = new THREE.Mesh(new THREE.BoxGeometry(sx, sy, sz), mat);
    objeto.position.set(x, y, z);
    objeto.castShadow = true;
    objeto.receiveShadow = true;
    scene.add(objeto);
    return objeto;
  }

  criarBloco(0, -2, -25, 200, 1, 200, cores.chao);

  const plataformas = [];

  function plataforma(x, y, z, largura, profundidade, mat) {
    criarBloco(x, y, z, largura, 0.7, profundidade, mat);

    plataformas.push({
      minX: x - largura/2 - 0.5,
      maxX: x + largura/2 + 0.5,
      minZ: z - profundidade/2 - 0.5,
      maxZ: z + profundidade/2 + 0.5,
      y: y + 0.35
    });

    criarBloco(x, y - 0.36, z, largura + 0.15, 0.12, profundidade + 0.15, cores.branco);
  }

  plataforma(0, 0, 0, 10, 10, cores.verde);
  plataforma(0, 1, -10, 5, 5, cores.roxo);
  plataforma(5, 2, -17, 4, 4, cores.azul);
  plataforma(0, 3, -24, 4, 4, cores.amarelo);
  plataforma(-5, 4, -31, 4, 4, cores.verde);
  plataforma(-5, 5, -39, 6, 6, cores.roxo);
  plataforma(2, 6, -47, 4, 4, cores.azul);
  plataforma(8, 7, -55, 6, 6, cores.amarelo);

  criarBloco(-5, 5.4, -39, 1.7, 0.15, 1.7, cores.verde);
  criarBloco(8, 7.42, -55, 2, 0.12, 2, cores.verde);
  criarBloco(8, 9, -55, 0.25, 3, 0.25, cores.vermelho);
  criarBloco(9, 10.2, -55, 2, 0.8, 0.15, cores.amarelo);

  const meuId = 'player_parkour_' + Math.random().toString(36).substr(2, 9);
  const jogadorRef = ref(database, 'parkour_jogadores/' + meuId);
  const todosJogadoresRef = ref(database, 'parkour_jogadores');
  const outrosJogadores = {};

  function sairDoJogoLimpo() {
    remove(jogadorRef).catch(() => {});
  }

  onDisconnect(jogadorRef).remove();
  window.addEventListener('beforeunload', sairDoJogoLimpo);
  window.addEventListener('pagehide', sairDoJogoLimpo);

  document.getElementById('btnVoltar').addEventListener('click', (e) => {
    e.preventDefault();
    sairDoJogoLimpo();
    setTimeout(() => { window.location.href = 'lobby.html'; }, 100);
  });

  const jogador = criarPersonagem();
  scene.add(jogador);
  jogador.position.set(0, 0.36, 0);

  set(jogadorRef, { x: 0, y: 0.36, z: 0 });

  onValue(todosJogadoresRef, (snapshot) => {
    const data = snapshot.val() || {};

    for (let id in outrosJogadores) {
      if (!data[id]) {
        scene.remove(outrosJogadores[id].mesh);
        delete outrosJogadores[id];
      }
    }

    for (let id in data) {
      if (id === meuId) continue;
      let pos = data[id];

      if (!outrosJogadores[id]) {
        const meshOutro = criarPersonagem();
        scene.add(meshOutro);
        outrosJogadores[id] = { id: id, mesh: meshOutro };
      }

      if (pos && typeof pos.x === 'number') {
        outrosJogadores[id].mesh.position.set(pos.x, pos.y, pos.z);
      }
    }
  });

  let velocidadeY = 0;
  let noChao = false;
  let venceu = false;
  let anguloCamera = 0;
  let checkpoint = new THREE.Vector3(0, 0.36, 0);

  const velocidade = 7;
  const gravidade = 22;
  const forcaPulo = 10;
  const teclas = {};

  addEventListener("keydown", e => {
    teclas[e.code] = true;
    if (e.code === "Space") {
      e.preventDefault();
      pular();
    }
  });

  addEventListener("keyup", e => {
    teclas[e.code] = false;
  });

  function pular() {
    if (noChao && !venceu) {
      velocidadeY = forcaPulo;
      noChao = false;
    }
  }

  document.getElementById("btnPularMobile").addEventListener("pointerdown", e => {
    e.preventDefault();
    pular();
  });

  // CONTROLE DO JOYSTICK VIRTUAL E ROTAÇÃO DA CÂMERA (MULTITOQUE)
  const joystickBase = document.getElementById('joystickBase');
  const joystickStick = document.getElementById('joystickStick');
  let joystickTouchId = null;
  let cameraTouchId = null;
  let joyX = 0, joyY = 0;
  let lastTouchX = 0, lastTouchY = 0;

  window.addEventListener('touchstart', (e) => {
    if (!isMobile) return;
    for (let i = 0; i < e.changedTouches.length; i++) {
      const touch = e.changedTouches[i];
      const target = document.elementFromPoint(touch.clientX, touch.clientY);
      
      if (target && (target.closest('#btnPularMobile') || target.closest('#btnVoltar'))) {
        continue;
      }

      // Lado esquerdo = Joystick
      if (joystickTouchId === null && touch.clientX < window.innerWidth / 2) {
        joystickTouchId = touch.identifier;
      } 
      // Lado direito = Rotação de câmera
      else if (cameraTouchId === null && touch.clientX >= window.innerWidth / 2) {
        cameraTouchId = touch.identifier;
        lastTouchX = touch.clientX;
        lastTouchY = touch.clientY;
      }
    }
  }, { passive: false });

  window.addEventListener('touchmove', (e) => {
    if (!isMobile) return;
    for (let i = 0; i < e.changedTouches.length; i++) {
      const touch = e.changedTouches[i];

      if (touch.identifier === joystickTouchId) {
        const rect = joystickBase.getBoundingClientRect();
        const centroX = rect.left + rect.width / 2;
        const centroY = rect.top + rect.height / 2;
        let deltaX = touch.clientX - centroX;
        let deltaY = touch.clientY - centroY;
        const distancia = Math.min(50, Math.sqrt(deltaX * deltaX + deltaY * deltaY));
        const angulo = Math.atan2(deltaY, deltaX);
        joyX = Math.cos(angulo) * (distancia / 50);
        joyY = Math.sin(angulo) * (distancia / 50);
        joystickStick.style.transform = `translate(${Math.cos(angulo) * distancia}px, ${Math.sin(angulo) * distancia}px)`;
      }

      if (touch.identifier === cameraTouchId) {
        const deltaX = touch.clientX - lastTouchX;
        const deltaY = touch.clientY - lastTouchY;
        anguloCamera -= deltaX * 0.006;
        lastTouchX = touch.clientX;
        lastTouchY = touch.clientY;
      }
    }
  }, { passive: false });

  window.addEventListener('touchend', (e) => {
    if (!isMobile) return;
    for (let i = 0; i < e.changedTouches.length; i++) {
      const touch = e.changedTouches[i];
      if (touch.identifier === joystickTouchId) {
        joystickTouchId = null;
        joyX = 0; joyY = 0;
        joystickStick.style.transform = `translate(0px, 0px)`;
      }
      if (touch.identifier === cameraTouchId) {
        cameraTouchId = null;
      }
    }
  });

  // Para PC (arrastar com o rato)
  let arrastando = false;
  let ultimaX = 0;
  renderer.domElement.addEventListener("pointerdown", e => {
    if (isMobile) return;
    arrastando = true;
    ultimaX = e.clientX;
    renderer.domElement.setPointerCapture(e.pointerId);
  });
  renderer.domElement.addEventListener("pointermove", e => {
    if (!arrastando || isMobile) return;
    anguloCamera -= (e.clientX - ultimaX) * 0.006;
    ultimaX = e.clientX;
  });
  function pararCamera() { arrastando = false; }
  renderer.domElement.addEventListener("pointerup", pararCamera);
  renderer.domElement.addEventListener("pointercancel", pararCamera);

  function atualizar(dt) {
    if (venceu) return;

    const frente = (teclas.KeyW || teclas.ArrowUp ? 1 : 0) - (teclas.KeyS || teclas.ArrowDown ? 1 : 0);
    const lado = (teclas.KeyD || teclas.ArrowRight ? 1 : 0) - (teclas.KeyA || teclas.ArrowLeft ? 1 : 0);

    const direcao = new THREE.Vector3(lado, 0, -frente);

    if (direcao.lengthSq() > 0) {
      direcao.normalize();
      direcao.applyAxisAngle(new THREE.Vector3(0, 1, 0), anguloCamera);

      jogador.position.x += direcao.x * velocidade * dt;
      jogador.position.z += direcao.z * velocidade * dt;
      jogador.rotation.y = Math.atan2(direcao.x, direcao.z) + Math.PI;
    }

    // Movimento via Joystick Mobile
    if (joystickTouchId !== null) {
      const dirFrente = new THREE.Vector3(-Math.sin(anguloCamera), 0, -Math.cos(anguloCamera)).normalize();
      const dirLado = new THREE.Vector3(Math.cos(anguloCamera), 0, -Math.sin(anguloCamera)).normalize();
      
      jogador.position.x += (dirFrente.x * (-joyY) + dirLado.x * joyX) * velocidade * dt;
      jogador.position.z += (dirFrente.z * (-joyY) + dirLado.z * joyX) * velocidade * dt;

      if (joyX !== 0 || joyY !== 0) {
        const moveDir = new THREE.Vector3(dirFrente.x * (-joyY) + dirLado.x * joyX, 0, dirFrente.z * (-joyY) + dirLado.z * joyX).normalize();
        jogador.rotation.y = Math.atan2(moveDir.x, moveDir.z) + Math.PI;
      }
    }

    velocidadeY -= gravidade * dt;
    jogador.position.y += velocidadeY * dt;

    noChao = false;

    for (const p of plataformas) {
      if (
        jogador.position.x >= p.minX && jogador.position.x <= p.maxX &&
        jogador.position.z >= p.minZ && jogador.position.z <= p.maxZ &&
        velocidadeY <= 0 &&
        jogador.position.y >= p.y - 0.5 && jogador.position.y <= p.y + 0.5
      ) {
        jogador.position.y = p.y;
        velocidadeY = 0;
        noChao = true;
      }
    }

    if (jogador.position.z < -36 && jogador.position.z > -42 && jogador.position.x < -2 && jogador.position.x > -8 && noChao) {
      checkpoint.set(jogador.position.x, jogador.position.y, jogador.position.z);
      status.textContent = "Checkpoint ativado!";
    }

    if (jogador.position.z < -57 && jogador.position.x > 5) {
      venceu = true;
      document.getElementById("mensagem").style.display = "block";
      status.textContent = "Você venceu!";
    }

    if (jogador.position.y < -12) {
      jogador.position.copy(checkpoint);
      velocidadeY = 0;
      noChao = false;
    }

    jogador.position.x = THREE.MathUtils.clamp(jogador.position.x, -20, 20);
  }

  function atualizarCamera(dt) {
    const distancia = 8;
    const destino = new THREE.Vector3(
      jogador.position.x + Math.sin(anguloCamera) * distancia,
      jogador.position.y + 3.5,
      jogador.position.z + Math.cos(anguloCamera) * distancia
    );

    camera.position.lerp(destino, 1 - Math.exp(-6 * dt));
    camera.lookAt(jogador.position.x, jogador.position.y + 1.5, jogador.position.z);
  }

  const relogio = new THREE.Clock();
  let ultimoEnvio = 0;

  function animar(tempo) {
    requestAnimationFrame(animar);

    const dt = Math.min(relogio.getDelta(), 0.04);

    atualizar(dt);
    atualizarCamera(dt);

    if (tempo - ultimoEnvio > 50) {
      set(jogadorRef, {
        x: Number(jogador.position.x.toFixed(2)),
        y: Number(jogador.position.y.toFixed(2)),
        z: Number(jogador.position.z.toFixed(2))
      }).catch(() => {});
      ultimoEnvio = tempo;
    }

    renderer.render(scene, camera);
  }

  addEventListener("resize", () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });

  status.textContent = "Chegue até a bandeira final!";
  animar(0);
})();
</script>
</body>
</html>
