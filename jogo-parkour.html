<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Goblox — Parkour Multiplayer</title>
<link rel="stylesheet" href="global.css">
<style>
  body{margin:0;overflow:hidden;background:#87caff;user-select:none;touch-action:none;font-family:Arial,sans-serif}
  #status{position:absolute;top:20px;left:20px;color:#fff;font-size:1.1rem;font-weight:bold;z-index:10;text-shadow:0 2px 4px rgba(0,0,0,.5);max-width:45vw}
  #hud{position:absolute;top:20px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.6);color:#facc15;padding:8px 16px;border-radius:10px;font-weight:bold;z-index:10;text-align:center;font-size:.95rem}
  #btnVoltar{position:absolute;top:20px;right:20px;padding:10px 18px;background:#1e1e2d;border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:10px;font-weight:bold;cursor:pointer;z-index:20;text-decoration:none}
  #joystickBase{position:absolute;bottom:40px;left:40px;width:120px;height:120px;background:rgba(255,255,255,.2);border:2px solid rgba(255,255,255,.5);border-radius:50%;z-index:20;display:none;touch-action:none}
  #joystickStick{position:absolute;top:35px;left:35px;width:50px;height:50px;background:radial-gradient(circle,#35d995,#047857);border:2px solid #6ee7b7;border-radius:50%;pointer-events:none;box-shadow:0 0 15px rgba(53,217,149,.6)}
  #btnPularMobile{width:85px;height:85px;background:radial-gradient(circle,#35d995,#047857);border:3px solid #6ee7b7;border-radius:50%;color:#fff;font-weight:900;font-size:1rem;box-shadow:0 0 20px rgba(53,217,149,.6);display:none;align-items:center;justify-content:center;position:absolute;bottom:40px;right:40px;z-index:20;touch-action:none}
  #btnPularMobile:active{transform:scale(.92)}
  #mensagem{position:absolute;top:40%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.85);color:#4ade80;padding:30px 50px;border-radius:20px;font-size:2rem;font-weight:bold;display:none;z-index:30;text-align:center;border:2px solid #4ade80;box-shadow:0 0 30px rgba(74,222,128,.5)}
</style>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.170.0/build/three.module.js" } }
</script>
</head>
<body>

<div id="status">A carregar motor 3D...</div>
<div id="hud"></div>
<div id="mensagem"></div>
<a href="lobby.html" id="btnVoltar">⎋ Sair</a>
