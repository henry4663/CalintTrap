
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Goblox — Parkour</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: #101426;
      color: white;
    }
    canvas { display: block; }
    #hud {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 5;
      background: #101426dd;
      padding: 15px 20px;
      border: 1px solid #7655ff;
      border-radius: 12px;
      pointer-events: none;
    }
    #hud strong { color: #a994ff; }
    #hud p { margin: 7px 0 0; font-size: 13px; }
    #voltar {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 5;
      background: #7655ff;
      color: white;
      border: 0;
      border-radius: 9px;
      padding: 12px 18px;
      cursor: pointer;
    }
    #mensagem {
      position: fixed;
      top: 40%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: #11182eee;
      padding: 25px 35px;
      border: 1px solid #7655ff;
      border-radius: 15px;
      text-align: center;
      display: none;
      z-index: 10;
    }
    #mobile {
      display: none;
      position: fixed;
      bottom: 25px;
      left: 20px;
      z-index: 6;
      gap: 10px;
      align-items: center;
    }
    .move {
      width: 55px;
      height: 55px;
      border: 1px solid #ffffff55;
      background: #222b45dd;
      color: white;
      border-radius: 14px;
      font-size: 20px;
      touch-action: none;
    }
    #pular {
      position: fixed;
      right: 25px;
      bottom: 35px;
      z-index: 6;
      width: 75px;
      height: 75px;
      border-radius: 50%;
      border: 2px solid #ffffff66;
      background: #7655ffee;
      color: white;
      font-weight: bold;
      display: none;
      touch-action: none;
    }
    @media (pointer: coarse) {
      #mobile { display: flex; }
      #pular { display: block; }
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"
      }
    }
  </script>
</head>
<body>

  <div id="hud">
    <strong>GOBLOX PARKOUR</strong>
    <p id="fase">Fase 1 — Iniciante</p>
    <p id="status">Carregando...</p>
    <p>WASD para andar • Espaço para pular</p>
  </div>

  <button id="voltar" onclick="location.href='lobby.html'">VOLTAR</button>

  <div id="mensagem">
    <h2>🏆 Você venceu!</h2>
    <p>Você completou o Parkour!</p>
    <button onclick="location.reload()">Jogar novamente</button>
  </div>

  <div id="mobile">
    <button class="move" data-key="KeyW">▲</button>
    <button class="move" data-key="KeyA">◀</button>
    <button class="move" data-key="KeyS">▼</button>
    <button class="move" data-key="KeyD">▶</button>
  </div>

  <button id="pular">PULAR</button>

  <script type="module" src="./personagem.js"></script>
</body>
</html>
