<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Goblox — Parkour Multiplayer</title>
<link rel="stylesheet" href="global.css">
<style>
  body {
    margin: 0;
    overflow: hidden;
    background-color: #87caff;
    user-select: none;
    touch-action: none;
    font-family: Arial, sans-serif;
  }
  #status {
    position: absolute;
    top: 20px;
    left: 20px;
    color: #fff;
    font-size: 1.2rem;
    font-weight: bold;
    z-index: 10;
    text-shadow: 0 2px 4px rgba(0,0,0,0.5);
  }
  #btnVoltar {
    position: absolute;
    top: 20px;
    right: 20px;
    padding: 10px 18px;
    background: #1e1e2d;
    border: 1px solid rgba(255,255,255,0.3);
    color: #fff;
    border-radius: 10px;
    font-weight: bold;
    cursor: pointer;
    z-index: 20;
    text-decoration: none;
  }

  /* JOYSTICK VIRTUAL MOBILE */
  #joystickBase {
    position: absolute;
    bottom: 40px;
    left: 40px;
    width: 120px;
    height: 120px;
    background: rgba(255, 255, 255, 0.2);
    border: 2px solid rgba(255, 255, 255, 0.5);
    border-radius: 50%;
    z-index: 20;
    display: none;
    touch-action: none;
  }
  #joystickStick {
    position: absolute;
    top: 35px;
    left: 35px;
    width: 50px;
    height: 50px;
    background: radial-gradient(circle, #35d995 0%, #047857 100%);
    border: 2px solid #6ee7b7;
    border-radius: 50%;
    pointer-events: none;
    box-shadow: 0 0 15px rgba(53, 217, 149, 0.6);
  }

  /* BOTÃO DE PULAR MOBILE */
  #btnPularMobile {
    width: 85px;
    height: 85px;
    background: radial-gradient(circle, #35d995 0%, #047857 100%);
    border: 3px solid #6ee7b7;
    border-radius: 50%;
    color: white;
    font-weight: 900;
    font-size: 1rem;
    box-shadow: 0 0 20px rgba(53, 217, 149, 0.6);
    cursor: pointer;
    display: none;
    align-items: center;
    justify-content: center;
    position: absolute;
    bottom: 40px;
    right: 40px;
    z-index: 20;
    touch-action: none;
  }
  #btnPularMobile:active { transform: scale(0.92); }

  #mensagem {
    position: absolute;
    top: 40%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(0,0,0,0.85);
    color: #4ade80;
    padding: 30px 50px;
    border-radius: 20px;
    font-size: 2rem;
    font-weight: bold;
    display: none;
    z-index: 30;
    text-align: center;
    border: 2px solid #4ade80;
    box-shadow: 0 0 30px rgba(74, 222, 128, 0.5);
  }
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.170.0/build/three.module.js"
  }
}
</script>
</head>
<body>

<div id="status">A carregar motor 3D...</div>
<div id="mensagem">VICTORY! 🎉<br><span style="font-size: 1.1rem; color: #facc15;">+20 FBUX | +40 Moedas</span></div>
<a href="lobby.html" id="btnVoltar">⎋ Sair</a>

<!-- CONTROLES MOBILE (JOYSTICK + PULO) -->
<div id="joystickBase">
  <div id="joystickStick"></div>
</div>
<button id="btnPularMobile">PULAR</button>

<script type="module">
import * as THREE from 'three';
import { criarPersonagem } from './personagem.js';
import { iniciarClienteGoblox } from './client.js';
import { db } from './firebase.js';
import { ref, update } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || window.innerWidth < 768;

if (isMobile) {
  document.getElementById("joystickBase").style.display = "block";
  document.getElementById("btnPularMobile").style.display = "flex";
}

(async function iniciarParkour() {
  const status = document.getElementById("status");
  status.textContent = "Preparando cenário...";

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x87caff);
  scene.fog = new THREE.Fog(0x87caff, 45, 130);

  const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.1, 250);

  const renderer = new THREE.WebGLRenderer({
    antialias: true,
    powerPreference: "high-performance"
  });

  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.outputColorSpace = THREE.SRGBColorSpace;

  document.body.appendChild(renderer.domElement);

  scene.add(new THREE.HemisphereLight(0xffffff, 0x53647d, 2));

  const sol = new THREE.DirectionalLight(0xffffff, 2.5);
  sol.position.set(-15, 25, 12);
  sol.castShadow = true;
  sol.shadow.mapSize.set(1024, 1024);
  scene.add(sol);

  function material(cor, metalness = 0) {
    return new THREE.MeshStandardMaterial({ color: cor, roughness: 0.75, metalness });
  }

  const cores = {
    verde: material(0x35d995),
    roxo: material(0x7955ff),
    azul: material(0x269cff),
    amarelo: material(0xffcb45),
    vermelho: material(0xff5369),
    branco: material(0xffffff),
    chao: material(0x29394e),
    laranja: material(0xff9f43),
    rosa: material(0xff6b81),
    lava: material(0xff3838, 0.2) // Estilo killbrick / lava
  };

  function criarBloco(x, y, z, sx, sy, sz, mat) {
    const objeto = new THREE.Mesh(new THREE.BoxGeometry(sx, sy, sz), mat);
    objeto.position.set(x, y, z);
    objeto.castShadow = true;
    objeto.receiveShadow = true;
    scene.add(objeto);
    return objeto;
  }

  // Chão debaixo do obby (com "lava" mortal simulada por baixo)
  criarBloco(0, -2, -60, 200, 1, 300, cores.chao);

  const plataformas = [];
  const obstaculosMoveis = [];
  const killBricks = []; // Blocos mortais que reiniciam no checkpoint

  function plataforma(x, y, z, largura, profundidade, mat) {
    criarBloco(x, y, z, largura, 0.7, profundidade, mat);

    plataformas.push({
      minX: x - largura/2 - 0.5,
      maxX: x + largura/2 + 0.5,
      minZ: z - profundidade/2 - 0.5,
      maxZ: z + profundidade/2 + 0.5,
      y: y + 0.35
    });

    criarBloco(x, y - 0.36, z, largura + 0.15, 0.12, profundidade + 0.15, cores.branco);
  }

  function killBrick(x, y, z, largura, altura, profundidade) {
    const kb = criarBloco(x, y, z, largura, altura, profundidade, cores.lava);
    killBricks.push({
      minX: x - largura/2 - 0.3,
      maxX: x + largura/2 + 0.3,
      minY: y - altura/2 - 0.3,
      maxY: y + altura/2 + 0.3,
      minZ: z - profundidade/2 - 0.3,
      maxZ: z + profundidade/2 + 0.3
    });
    return kb;
  }

  // --- MAPA FACILITADO COM OBSTÁCULOS CLÁSSICOS DE ROBLOX ---
  plataforma(0, 0, 0, 10, 10, cores.verde);
  plataforma(0, 1, -10, 6, 6, cores.roxo); // Plataforma mais larga
  plataforma(0, 2, -19, 5, 5, cores.azul);
  plataforma(0, 3, -28, 5, 5, cores.amarelo);

  // Obstáculo clássico 1: Killbricks (Paredes/Blocos de fogo/lava que você desvia)
  killBrick(0, 3.5, -34, 4, 1.5, 0.6);
  plataforma(0, 4, -40, 6, 6, cores.verde);

  // Obstáculo clássico 2: Spinner (Barra giratória obstáculo de Roblox)
  const spinnerMesh = criarBloco(0, 5, -49, 7, 0.4, 1, cores.vermelho);
  obstaculosMoveis.push({ mesh: spinnerMesh, tipo: 'girar', velocidade: 2.5 });
  plataforma(0, 5, -57, 6, 6, cores.roxo);

  // Parte final mais acessível
  plataforma(0, 6, -66, 5, 5, cores.laranja);
  plataforma(0, 7, -75, 5, 5, cores.rosa);
  plataforma(0, 8, -85, 7, 7, cores.verde); // Plataforma de vitória final

  // Checkpoints
  criarBloco(0, 4.4, -40, 2, 0.12, 2, cores.verde); // Checkpoint 1
  criarBloco(0, 5.4, -57, 2, 0.12, 2, cores.verde); // Checkpoint 2

  // Bandeira final
  criarBloco(0, 10, -85, 0.25, 3, 0.25, cores.vermelho);
  criarBloco(1, 11.2, -85, 2, 0.8, 0.15, cores.amarelo);

  // CLIENTE MULTIPLAYER
  const remotePlayers = new Map();
  let meuClientId = null;

  const cliente = iniciarClienteGoblox((clientId, data) => {
    meuClientId = clientId;

    for (let id of remotePlayers.keys()) {
      if (!data[id]) {
        scene.remove(remotePlayers.get(id));
        remotePlayers.delete(id);
      }
    }

    for (let id in data) {
      if (id === clientId) continue;
      let p = data[id];

      if (!remotePlayers.has(id)) {
        const meshOutro = criarPersonagem(p.nome, p.itens || []);
        scene.add(meshOutro);
        remotePlayers.set(id, meshOutro);
      }

      if (p && typeof p.x === 'number') {
        remotePlayers.get(id).position.set(p.x, p.y, p.z);
      }
    }
  });

  document.getElementById('btnVoltar').addEventListener('click', (e) => {
    e.preventDefault();
    cliente.removerDoServidor();
    setTimeout(() => { window.location.href = 'lobby.html'; }, 100);
  });

  const jogador = criarPersonagem(cliente.nickLocal);
  scene.add(jogador);
  jogador.position.set(0, 0.36, 0);

  let velocidadeY = 0;
  let noChao = false;
  let venceu = false;
  let anguloCamera = 0;
  let checkpoint = new THREE.Vector3(0, 0.36, 0);

  const velocidade = 7;
  const gravidade = 22;
  const forcaPulo = 10;
  const teclas = {};

  addEventListener("keydown", e => {
    teclas[e.code] = true;
    if (e.code === "Space") {
      e.preventDefault();
      pular();
    }
  });

  addEventListener("keyup", e => {
    teclas[e.code] = false;
  });

  function pular() {
    if (noChao && !venceu) {
      velocidadeY = forcaPulo;
      noChao = false;
    }
  }

  document.getElementById("btnPularMobile").addEventListener("pointerdown", e => {
    e.preventDefault();
    pular();
  });

  const joystickBase = document.getElementById('joystickBase');
  const joystickStick = document.getElementById('joystickStick');
  let joystickTouchId = null;
  let cameraTouchId = null;
  let joyX = 0, joyY = 0;
  let lastTouchX = 0, lastTouchY = 0;

  window.addEventListener('touchstart', (e) => {
    if (!isMobile) return;
    for (let i = 0; i < e.changedTouches.length; i++) {
      const touch = e.changedTouches[i];
      const target = document.elementFromPoint(touch.clientX, touch.clientY);

      if (target && (target.closest('#btnPularMobile') || target.closest('#btnVoltar'))) {
        continue;
      }

      if (joystickTouchId === null && touch.clientX < window.innerWidth / 2) {
        joystickTouchId = touch.identifier;
      } 
      else if (cameraTouchId === null && touch.clientX >= window.innerWidth / 2) {
        cameraTouchId = touch.identifier;
        lastTouchX = touch.clientX;
        lastTouchY = touch.clientY;
      }
    }
  }, { passive: false });

  window.addEventListener('touchmove', (e) => {
    if (!isMobile) return;
    for (let i = 0; i < e.changedTouches.length; i++) {
      const touch = e.changedTouches[i];

      if (touch.identifier === joystickTouchId) {
        const rect = joystickBase.getBoundingClientRect();
        const centroX = rect.left + rect.width / 2;
        const centroY = rect.top + rect.height / 2;
        let deltaX = touch.clientX - centroX;
        let deltaY = touch.clientY - centroY;
        const distancia = Math.min(50, Math.sqrt(deltaX * deltaX + deltaY * deltaY));
        const angulo = Math.atan2(deltaY, deltaX);
        joyX = Math.cos(angulo) * (distancia / 50);
        joyY = Math.sin(angulo) * (distancia / 50);
        joystickStick.style.transform = `translate(${Math.cos(angulo) * distancia}px, ${Math.sin(angulo) * distancia}px)`;
      }

      if (touch.identifier === cameraTouchId) {
        const deltaX = touch.clientX - lastTouchX;
        const deltaY = touch.clientY - lastTouchY;
        anguloCamera -= deltaX * 0.006;
        lastTouchX = touch.clientX;
        lastTouchY = touch.clientY;
      }
    }
  }, { passive: false });

  window.addEventListener('touchend', (e) => {
    if (!isMobile) return;
    for (let i = 0; i < e.changedTouches.length; i++) {
      const touch = e.changedTouches[i];
      if (touch.identifier === joystickTouchId) {
        joystickTouchId = null;
        joyX = 0; joyY = 0;
        joystickStick.style.transform = `translate(0px, 0px)`;
      }
      if (touch.identifier === cameraTouchId) {
        cameraTouchId = null;
      }
    }
  });

  let arrastando = false;
  let ultimaX = 0;
  renderer.domElement.addEventListener("pointerdown", e => {
    if (isMobile) return;
    arrastando = true;
    ultimaX = e.clientX;
    renderer.domElement.setPointerCapture(e.pointerId);
  });
  renderer.domElement.addEventListener("pointermove", e => {
    if (!arrastando || isMobile) return;
    anguloCamera -= (e.clientX - ultimaX) * 0.006;
    ultimaX = e.clientX;
  });
  function pararCamera() { arrastando = false; }
  renderer.domElement.addEventListener("pointerup", pararCamera);
  renderer.domElement.addEventListener("pointercancel", pararCamera);

  function darRecompensaVitoria() {
    const nick = cliente.nickLocal;
    const keyFbux = `goblox_fbux_${nick}`;
    const keyMoedas = `goblox_moedas_${nick}`;

    let fbuxAtuais = parseInt(localStorage.getItem(keyFbux) || 0);
    let moedasAtuais = parseInt(localStorage.getItem(keyMoedas) || 0);

    let novosFbux = fbuxAtuais + 20;
    let novasMoedas = moedasAtuais + 40;

    localStorage.setItem(keyFbux, novosFbux);
    localStorage.setItem(keyMoedas, novasMoedas);

    update(ref(db, `users/${nick}`), { fbux: novosFbux, moedas: novasMoedas }).catch(() => {});
  }

  function atualizar(dt) {
    if (venceu) return;

    // Atualiza obstáculos móveis (ex: spinner giratório)
    for (let obs of obstaculosMoveis) {
      if (obs.tipo === 'girar') {
        obs.mesh.rotation.y += obs.velocidade * dt;
      }
    }

    const frente = (teclas.KeyW || teclas.ArrowUp ? 1 : 0) - (teclas.KeyS || teclas.ArrowDown ? 1 : 0);
    const lado = (teclas.KeyD || teclas.ArrowRight ? 1 : 0) - (teclas.KeyA || teclas.ArrowLeft ? 1 : 0);

    const direcao = new THREE.Vector3(lado, 0, -frente);
    let estaMovendo = false;

    if (direcao.lengthSq() > 0) {
      direcao.normalize();
      direcao.applyAxisAngle(new THREE.Vector3(0, 1, 0), anguloCamera);

      jogador.position.x += direcao.x * velocidade * dt;
      jogador.position.z += direcao.z * velocidade * dt;
      jogador.rotation.y = Math.atan2(direcao.x, direcao.z) + Math.PI;
      estaMovendo = true;
    }

    if (joystickTouchId !== null) {
      const dirFrente = new THREE.Vector3(-Math.sin(anguloCamera), 0, -Math.cos(anguloCamera)).normalize();
      const dirLado = new THREE.Vector3(Math.cos(anguloCamera), 0, -Math.sin(anguloCamera)).normalize();

      jogador.position.x += (dirFrente.x * (-joyY) + dirLado.x * joyX) * velocidade * dt;
      jogador.position.z += (dirFrente.z * (-joyY) + dirLado.z * joyX) * velocidade * dt;

      if (joyX !== 0 || joyY !== 0) {
        const moveDir = new THREE.Vector3(dirFrente.x * (-joyY) + dirLado.x * joyX, 0, dirFrente.z * (-joyY) + dirLado.z * joyX).normalize();
        jogador.rotation.y = Math.atan2(moveDir.x, moveDir.z) + Math.PI;
        estaMovendo = true;
      }
    }

    velocidadeY -= gravidade * dt;
    jogador.position.y += velocidadeY * dt;

    noChao = false;

    for (const p of plataformas) {
      if (
        jogador.position.x >= p.minX && jogador.position.x <= p.maxX &&
        jogador.position.z >= p.minZ && jogador.position.z <= p.maxZ &&
        velocidadeY <= 0 &&
        jogador.position.y >= p.y - 0.5 && jogador.position.y <= p.y + 0.5
      ) {
        jogador.position.y = p.y;
        velocidadeY = 0;
        noChao = true;
      }
    }

    // Colisão com kill bricks / obstáculos mortais
    for (const kb of killBricks) {
      if (
        jogador.position.x >= kb.minX && jogador.position.x <= kb.maxX &&
        jogador.position.y >= kb.minY && jogador.position.y <= kb.maxY &&
        jogador.position.z >= kb.minZ && jogador.position.z <= kb.maxZ
      ) {
        jogador.position.copy(checkpoint);
        velocidadeY = 0;
        noChao = false;
        status.textContent = "Ouch! Voltou para o checkpoint.";
      }
    }

    if (jogador.atualizarAnimacao) {
      jogador.atualizarAnimacao(performance.now() * 0.001, estaMovendo);
    }

    // CHECKPOINTS ATUALIZADOS
    if (jogador.position.z < -38 && jogador.position.z > -42 && noChao) {
      checkpoint.set(0, 4.36, -40);
      status.textContent = "Checkpoint 1 ativado!";
    }
    if (jogador.position.z < -55 && jogador.position.z > -59 && noChao) {
      checkpoint.set(0, 5.36, -57);
      status.textContent = "Checkpoint 2 ativado!";
    }

    // CONDIÇÃO DE VITÓRIA
    if (jogador.position.z < -83) {
      venceu = true;
      darRecompensaVitoria();
      document.getElementById("mensagem").style.display = "block";
      status.textContent = "Você venceu! +20 FBUX | +40 Moedas";
    }

    if (jogador.position.y < -12) {
      jogador.position.copy(checkpoint);
      velocidadeY = 0;
      noChao = false;
    }

    jogador.position.x = THREE.MathUtils.clamp(jogador.position.x, -20, 20);
  }

  function atualizarCamera(dt) {
    const distancia = 8;
    const destino = new THREE.Vector3(
      jogador.position.x + Math.sin(anguloCamera) * distancia,
      jogador.position.y + 3.5,
      jogador.position.z + Math.cos(anguloCamera) * distancia
    );

    camera.position.lerp(destino, 1 - Math.exp(-6 * dt));
    camera.lookAt(jogador.position.x, jogador.position.y + 1.5, jogador.position.z);
  }

  const relogio = new THREE.Clock();
  let ultimoEnvio = 0;

  function animar(tempo) {
    requestAnimationFrame(animar);

    const dt = Math.min(relogio.getDelta(), 0.04);

    atualizar(dt);
    atualizarCamera(dt);

    if (tempo - ultimoEnvio > 50) {
      cliente.sincronizarPosicao(jogador.position.x, jogador.position.y, jogador.position.z);
      ultimoEnvio = tempo;
    }

    renderer.render(scene, camera);
  }

  addEventListener("resize", () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });

  status.textContent = "Desvie da barra giratória e chegue ao topo!";
  animar(0);
})();
</script>
</body>
</html>
