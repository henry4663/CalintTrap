<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Goblox — Parkour</title>
  <style>
    :root {
      --bg1: #bfe8ff;
      --bg2: #dff7ff;
      --text: #ffffff;
      --panel: rgba(16, 20, 30, 0.65);
      --line: rgba(255,255,255,0.12);
      --purple: #8b5cf6;
      --cyan: #38bdf8;
      --green: #22c55e;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: linear-gradient(var(--bg1), var(--bg2));
      font-family: Arial, Helvetica, sans-serif;
      touch-action: none;
      user-select: none;
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      background: linear-gradient(#aee8ff, #eafaff);
    }

    #hud {
      position: absolute;
      top: 18px;
      left: 18px;
      z-index: 20;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px 14px;
      color: white;
      font-size: 0.95rem;
      line-height: 1.5;
    }

    #btnVoltar {
      position: absolute;
      top: 18px;
      right: 18px;
      z-index: 20;
      color: white;
      text-decoration: none;
      background: rgba(12, 16, 24, 0.7);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px 14px;
      font-weight: 700;
    }

    #joystickBase {
      position: absolute;
      left: 26px;
      bottom: 26px;
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: rgba(255,255,255,0.08);
      border: 2px solid rgba(255,255,255,0.16);
      display: none;
      z-index: 20;
      touch-action: none;
    }

    #joystickStick {
      position: absolute;
      left: 34px;
      top: 34px;
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: radial-gradient(circle, var(--purple) 0%, #5b21b6 100%);
      border: 2px solid rgba(255,255,255,0.18);
      box-shadow: 0 0 18px rgba(139,92,246,0.5);
    }

    #btnPular {
      position: absolute;
      right: 26px;
      bottom: 110px;
      width: 84px;
      height: 84px;
      border-radius: 50%;
      border: none;
      background: radial-gradient(circle, var(--cyan) 0%, #0ea5e9 100%);
      color: white;
      font-weight: 900;
      font-size: 0.8rem;
      display: none;
      z-index: 20;
      touch-action: none;
    }

    #instrucao {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(10,15,20,0.65);
      border: 1px solid rgba(139,92,246,0.5);
      border-radius: 16px;
      padding: 20px 26px;
      text-align: center;
      font-weight: 700;
      color: white;
      z-index: 30;
      display: none;
    }

    @media (max-width: 768px) {
      #joystickBase, #btnPular {
        display: block;
      }
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
      }
    }
  </script>
</head>
<body>
  <div id="hud">
    <div>Tempo: <strong id="tempo">0.0s</strong></div>
    <div>Checkpoint: <strong id="checkpoint">1</strong></div>
  </div>

  <a href="lobby.html" id="btnVoltar">⎋ Sair</a>

  <div id="joystickBase">
    <div id="joystickStick"></div>
  </div>

  <button id="btnPular">PULAR</button>

  <div id="instrucao">
    Clique para iniciar<br>
    <small style="color:#dfe7f4; font-weight: normal;">WASD / Mouse / Touch</small>
  </div>

  <script type="module">
    import * as THREE from 'three';

    const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || window.innerWidth < 768;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xbfe8ff);
    scene.fog = new THREE.Fog(0xbfe8ff, 40, 180);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 300);
    camera.position.set(0, 3, 10);
    scene.add(camera);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    const hemi = new THREE.HemisphereLight(0xffffff, 0x9bb2c5, 1.2);
    scene.add(hemi);

    const sun = new THREE.DirectionalLight(0xffffff, 1.4);
    sun.position.set(30, 50, 15);
    sun.castShadow = true;
    sun.shadow.mapSize.set(1024, 1024);
    scene.add(sun);

    const skySun = new THREE.Mesh(
      new THREE.SphereGeometry(4, 20, 20),
      new THREE.MeshStandardMaterial({
        color: 0xffd166,
        emissive: 0xffb703,
        emissiveIntensity: 0.5
      })
    );
    skySun.position.set(40, 40, -30);
    scene.add(skySun);

    const world = new THREE.Group();
    scene.add(world);

    const ground = new THREE.Mesh(
      new THREE.BoxGeometry(140, 2, 140),
      new THREE.MeshStandardMaterial({
        color: 0x9fe07d,
        roughness: 0.95,
        metalness: 0.04
      })
    );
    ground.position.set(0, -1, 0);
    ground.receiveShadow = true;
    world.add(ground);

    const platforms = [];
    function addPlatform(x, y, z, w, h, d, color = 0x7b8794) {
      const mesh = new THREE.Mesh(
        new THREE.BoxGeometry(w, h, d),
        new THREE.MeshStandardMaterial({ color, roughness: 0.75, metalness: 0.1 })
      );
      mesh.position.set(x, y, z);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      world.add(mesh);

      platforms.push({
        x, y, z, w, h, d,
        top: y + h / 2
      });
    }

    // subir em z negativo
    addPlatform(0, 0.9, 0, 18, 1.4, 18, 0x7c8ca2);
    addPlatform(4, 2.0, -8, 8, 1.1, 8, 0x7d8f9c);
    addPlatform(10, 3.3, -16, 7, 1.1, 7, 0x7389ad);
    addPlatform(18, 4.8, -26, 7, 1.1, 7, 0x7e8db8);
    addPlatform(26, 6.5, -36, 9, 1.2, 9, 0x8196b3);

    const finish = new THREE.Mesh(
      new THREE.BoxGeometry(5, 1, 5),
      new THREE.MeshStandardMaterial({
        color: 0x22c55e,
        emissive: 0x14532d,
        emissiveIntensity: 0.8
      })
    );
    finish.position.set(32, 8.4, -48);
    finish.castShadow = true;
    finish.receiveShadow = true;
    scene.add(finish);

    function makeNameTexture(name) {
      const canvas = document.createElement("canvas");
      canvas.width = 512;
      canvas.height = 128;
      const ctx = canvas.getContext("2d");

      ctx.fillStyle = "rgba(0,0,0,0.35)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.font = "700 42px Arial";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillStyle = "#ffffff";
      ctx.fillText(name, canvas.width / 2, canvas.height / 2);

      const tex = new THREE.CanvasTexture(canvas);
      return tex;
    }

    const player = {
      pos: new THREE.Vector3(0, 1.7, 6),
      vel: new THREE.Vector3(),
      yaw: 0,
      grounded: false,
      checkpoint: 1,
      name: "nick"
    };

    const group = new THREE.Group();
    const body = new THREE.Mesh(
      new THREE.BoxGeometry(1, 1, 1),
      new THREE.MeshStandardMaterial({
        color: 0x8b5cf6,
        emissive: 0x4c1d95,
        emissiveIntensity: 0.2
      })
    );
    body.castShadow = true;
    body.receiveShadow = true;
    group.add(body);

    const tagTexture = makeNameTexture(player.name);
    const tag = new THREE.Sprite(
      new THREE.SpriteMaterial({ map: tagTexture, transparent: true })
    );
    tag.scale.set(3.2, 0.8, 1);
    tag.position.set(0, 1.7, 0);
    group.add(tag);

    scene.add(group);

    const keyState = {};
    document.addEventListener("keydown", (e) => {
      keyState[e.code] = true;
    });
    document.addEventListener("keyup", (e) => {
      keyState[e.code] = false;
    });

    let jumpQueued = false;
    let started = false;
    let elapsed = 0;
    const moveState = { forward: false, backward: false, left: false, right: false };

    const instrucao = document.getElementById("instrucao");

    function startGame() {
      started = true;
      instrucao.style.display = "none";
      if (!isMobile && document.body.requestPointerLock) {
        document.body.requestPointerLock();
      }
    }

    instrucao.addEventListener("click", startGame);
    document.body.addEventListener("click", (e) => {
      if (!isMobile && e.target.id !== "btnVoltar" && document.pointerLockElement !== document.body) {
        startGame();
      }
    });

    document.addEventListener("keydown", (e) => {
      if (e.code === "KeyW" || e.code === "ArrowUp") moveState.forward = true;
      if (e.code === "KeyS" || e.code === "ArrowDown") moveState.backward = true;
      if (e.code === "KeyA" || e.code === "ArrowLeft") moveState.left = true;
      if (e.code === "KeyD" || e.code === "ArrowRight") moveState.right = true;
      if (e.code === "Space") jumpQueued = true;
    });

    document.addEventListener("keyup", (e) => {
      if (e.code === "KeyW" || e.code === "ArrowUp") moveState.forward = false;
      if (e.code === "KeyS" || e.code === "ArrowDown") moveState.backward = false;
      if (e.code === "KeyA" || e.code === "ArrowLeft") moveState.left = false;
      if (e.code === "KeyD" || e.code === "ArrowRight") moveState.right = false;
    });

    const joystickBase = document.getElementById("joystickBase");
    const joystickStick = document.getElementById("joystickStick");
    const btnPular = document.getElementById("btnPular");

    let joyActive = false;
    let joyX = 0;
    let joyY = 0;

    function updateJoyFromTouch(touch) {
      const rect = joystickBase.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height / 2;

      let dx = touch.clientX - cx;
      let dy = touch.clientY - cy;
      let dist = Math.min(42, Math.hypot(dx, dy));
      const ang = Math.atan2(dy, dx);

      joyX = Math.cos(ang) * (dist / 42);
      joyY = Math.sin(ang) * (dist / 42);

      const moveX = Math.cos(ang) * dist;
      const moveY = Math.sin(ang) * dist;

      joystickStick.style.transform = `translate(${moveX}px, ${moveY}px)`;
    }

    joystickBase.addEventListener("touchstart", (e) => {
      joyActive = true;
      updateJoyFromTouch(e.touches[0]);
    }, { passive: true });

    joystickBase.addEventListener("touchmove", (e) => {
      if (!joyActive) return;
      updateJoyFromTouch(e.touches[0]);
    }, { passive: true });

    window.addEventListener("touchend", () => {
      joyActive = false;
      joyX = 0;
      joyY = 0;
      joystickStick.style.transform = "translate(0px, 0px)";
    });

    btnPular.addEventListener("click", () => {
      jumpQueued = true;
    });

    document.addEventListener("mousemove", (e) => {
      if (!isMobile && document.pointerLockElement === document.body && started) {
        player.yaw -= e.movementX * 0.0024;
      }
    });

    function updatePlayer(dt) {
      if (!started) return;

      let dirX = 0;
      let dirZ = 0;

      if (moveState.forward) dirZ -= 1;
      if (moveState.backward) dirZ += 1;
      if (moveState.left) dirX -= 1;
      if (moveState.right) dirX += 1;

      if (isMobile) {
        dirX += joyX;
        dirZ += joyY;
      }

      if (dirX !== 0 || dirZ !== 0) {
        const len = Math.hypot(dirX, dirZ) || 1;
        dirX /= len;
        dirZ /= len;

        const forward = new THREE.Vector3(Math.sin(player.yaw), 0, Math.cos(player.yaw)).normalize();
        const right = new THREE.Vector3(Math.cos(player.yaw), 0, -Math.sin(player.yaw)).normalize();

        const move = new THREE.Vector3();
        move.addScaledVector(forward, -dirZ);
        move.addScaledVector(right, dirX);

        const speed = 8.5;
        player.pos.x += move.x * speed * dt;
        player.pos.z += move.z * speed * dt;
      }

      if (jumpQueued && player.grounded) {
        player.vel.y = 9.7;
        player.grounded = false;
        jumpQueued = false;
      }

      player.vel.y -= 20 * dt;
      player.pos.y += player.vel.y * dt;

      let groundedPlatform = null;

      for (const p of platforms) {
        const inX = player.pos.x >= p.x - p.w / 2 && player.pos.x <= p.x + p.w / 2;
        const inZ = player.pos.z >= p.z - p.d / 2 && player.pos.z <= p.z + p.d / 2;

        if (inX && inZ) {
          const top = p.top + 0.7;

          if (player.pos.y <= top && player.pos.y >= top - 1.5) {
            if (player.vel.y < 0) {
              player.pos.y = top;
              player.vel.y = 0;
              player.grounded = true;
              groundedPlatform = p;
            }
          }
        }
      }

      if (!player.grounded && player.pos.y < -10) {
        player.pos.set(0, 1.7, 6);
        player.vel.set(0, 0, 0);
        player.grounded = true;
      }

      if (!groundedPlatform && player.pos.y < 0.7) {
        player.pos.y = 0.8;
        player.vel.y = 0;
        player.grounded = true;
      }

      const finishDistance = player.pos.distanceTo(new THREE.Vector3(32, 8.4, -48));
      if (finishDistance < 3) {
        alert("Você concluiu o Parkour!");
        window.location.href = "jogo-3d.html";
      }

      group.position.copy(player.pos);
      group.position.y = player.pos.y;
      group.rotation.y = player.yaw;
    }

    function updateCamera() {
      const behind = new THREE.Vector3(
        Math.sin(player.yaw) * -7,
        3.5,
        Math.cos(player.yaw) * -7
      );

      const target = new THREE.Vector3(
        player.pos.x + behind.x,
        player.pos.y + 2.2,
        player.pos.z + behind.z
      );

      camera.position.lerp(target, 0.12);
      camera.lookAt(player.pos.x, player.pos.y + 1.3, player.pos.z);
    }

    let last = performance.now();

    function animate(now) {
      const dt = Math.min(0.03, (now - last) / 1000);
      last = now;

      if (started) {
        elapsed += dt;
        document.getElementById("tempo").textContent = `${elapsed.toFixed(1)}s`;
        document.getElementById("checkpoint").textContent = String(player.checkpoint);
        updatePlayer(dt);
      }

      updateCamera();
      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }

    requestAnimationFrame(animate);

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
