<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Goblox — Parkour Extremo</title>
<link rel="stylesheet" href="global.css">
<style>
  body {
    margin: 0;
    overflow: hidden;
    background-color: #050508;
    user-select: none;
    touch-action: none;
    font-family: Arial, sans-serif;
  }
  #hud {
    position: absolute;
    top: 20px;
    left: 20px;
    color: #fff;
    font-size: 1.2rem;
    font-weight: bold;
    z-index: 10;
    text-shadow: 0 2px 4px rgba(0,0,0,0.8);
  }
  #btnVoltar {
    position: absolute;
    top: 20px;
    right: 20px;
    padding: 10px 18px;
    background: #1e1e2d;
    border: 1px solid rgba(255,255,255,0.2);
    color: #fff;
    border-radius: 10px;
    font-weight: bold;
    cursor: pointer;
    z-index: 20;
    text-decoration: none;
  }
  
  /* JOYSTICK VIRTUAL MOBILE */
  #joystickBase {
    position: absolute;
    bottom: 40px;
    left: 40px;
    width: 120px;
    height: 120px;
    background: rgba(255, 255, 255, 0.1);
    border: 2px solid rgba(255, 255, 255, 0.3);
    border-radius: 50%;
    z-index: 20;
    display: none;
    touch-action: none;
  }
  #joystickStick {
    position: absolute;
    top: 35px;
    left: 35px;
    width: 50px;
    height: 50px;
    background: radial-gradient(circle, #8b5cf6 0%, #6d28d9 100%);
    border: 2px solid #c4b5fd;
    border-radius: 50%;
    pointer-events: none;
    box-shadow: 0 0 15px rgba(139, 92, 246, 0.6);
  }

  /* BOTÃO DE PULAR MOBILE */
  #btnPular {
    position: absolute;
    bottom: 50px;
    right: 40px;
    width: 85px;
    height: 85px;
    border-radius: 50%;
    background: radial-gradient(circle, #10b981 0%, #047857 100%);
    border: 3px solid #6ee7b7;
    color: white;
    font-weight: 900;
    font-size: 1.1rem;
    box-shadow: 0 0 20px rgba(16, 185, 129, 0.6);
    cursor: pointer;
    z-index: 20;
    display: none;
    align-items: center;
    justify-content: center;
  }
  #btnPular:active { transform: scale(0.92); }
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  }
}
</script>
</head>
<body>

<div id="hud">
  <div>Altura (Topo): <span id="scoreAltura" style="color: #4ade80;">0</span>m</div>
</div>

<!-- CONTROLES MOBILE -->
<div id="joystickBase">
  <div id="joystickStick"></div>
</div>
<button id="btnPular">⬆ PULAR</button>

<a href="lobby.html" id="btnVoltar">⎋ Sair</a>

<script type="module">
import * as THREE from 'three';
import { db as database } from './firebase.js';
import { ref, set, remove, onValue, onDisconnect } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
import { criarPersonagem } from './personagem.js';

const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || window.innerWidth < 768;

if (isMobile) {
  document.getElementById('joystickBase').style.display = 'block';
  document.getElementById('btnPular').style.display = 'flex';
}

// 1. CENA, CÂMERA E RENDERER
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0a14);
scene.fog = new THREE.FogExp2(0x0a0a14, 0.015);

const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

// ILUMINAÇÃO
const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
scene.add(ambientLight);

const dirLight = new THREE.DirectionalLight(0xa855f7, 1.2);
dirLight.position.set(30, 50, 30);
dirLight.castShadow = true;
scene.add(dirLight);

// 2. TORRE DE PLATAFORMAS DE PARKOUR
const plataformas = [];

function criarBlocoParkour(x, y, z, w, h, d, cor = 0x8b5cf6) {
  const geo = new THREE.BoxGeometry(w, h, d);
  const mat = new THREE.MeshStandardMaterial({ color: cor, roughness: 0.3 });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.set(x, y, z);
  mesh.receiveShadow = true;
  mesh.castShadow = true;
  scene.add(mesh);
  
  mesh.userData = { minX: x - w/2 - 1, maxX: x + w/2 + 1, minZ: z - d/2 - 1, maxZ: z + d/2 + 1, topY: y + h/2 };
  plataformas.push(mesh);
}

criarBlocoParkour(0, 0, 0, 25, 2, 25, 0x181824);

let alturaAtual = 4;
for (let i = 0; i < 30; i++) {
  const offsetX = (Math.sin(i * 1.5) * 9);
  const offsetZ = (Math.cos(i * 1.2) * 9);
  criarBlocoParkour(offsetX, alturaAtual, offsetZ, 6, 1.2, 6, i % 2 === 0 ? 0x6366f1 : 0xa855f7);
  alturaAtual += 3.5;
}

// 3. MULTIPLAYER E JOGADOR COM ANTI-FANTASMA
const meuId = 'player_parkour_' + Math.random().toString(36).substr(2, 9);
const jogadorRef = ref(database, 'parkour_jogadores/' + meuId);
const todosJogadoresRef = ref(database, 'parkour_jogadores');

let playerPos = { x: 0, y: 3, z: 0 };
let velY = 0;
const gravidade = -0.012;
const forcaPulo = 0.35;
let noChao = false;
const outrosJogadores = {};

function sairDoJogoLimpo() {
  remove(jogadorRef).catch(() => {});
}

onDisconnect(jogadorRef).remove();
window.addEventListener('beforeunload', sairDoJogoLimpo);
window.addEventListener('pagehide', sairDoJogoLimpo);

document.getElementById('btnVoltar').addEventListener('click', (e) => {
  e.preventDefault();
  sairDoJogoLimpo();
  setTimeout(() => { window.location.href = 'lobby.html'; }, 100);
});

set(jogadorRef, { x: playerPos.x, y: playerPos.y, z: playerPos.z });

onValue(todosJogadoresRef, (snapshot) => {
  const data = snapshot.val() || {};

  for (let id in outrosJogadores) {
    if (!data[id]) {
      scene.remove(outrosJogadores[id].mesh);
      delete outrosJogadores[id];
    }
  }

  for (let id in data) {
    if (id === meuId) continue;
    let pos = data[id];

    if (!outrosJogadores[id]) {
      const meshOutro = criarPersonagem();
      scene.add(meshOutro);
      outrosJogadores[id] = { id: id, mesh: meshOutro };
    }

    if (pos && typeof pos.x === 'number') {
      outrosJogadores[id].mesh.position.set(pos.x, pos.y, pos.z);
    }
  }
});

// 4. CONTROLES DE CÂMERA E MOVIMENTO
if (!isMobile) {
  renderer.domElement.addEventListener('click', () => {
    if (document.pointerLockElement !== renderer.domElement) {
      renderer.domElement.requestPointerLock();
    }
  });
}

let rotationX = 0;
let rotationY = 0;

document.addEventListener('mousemove', (e) => {
  if (!isMobile && document.pointerLockElement === renderer.domElement) {
    const sensitivity = 0.0022;
    rotationY -= e.movementX * sensitivity;
    rotationX -= e.movementY * sensitivity;
    rotationX = Math.max(-Math.PI / 2.2, Math.min(Math.PI / 2.2, rotationX));
  }
});

// Joystick Mobile
const joystickBase = document.getElementById('joystickBase');
const joystickStick = document.getElementById('joystickStick');
let joystickAtivo = false;
let joyX = 0, joyY = 0;

joystickBase.addEventListener('touchstart', () => { joystickAtivo = true; });

window.addEventListener('touchmove', (e) => {
  if (!joystickAtivo) return;
  const touch = e.touches[0];
  const rect = joystickBase.getBoundingClientRect();
  const centroX = rect.left + rect.width / 2;
  const centroY = rect.top + rect.height / 2;
  
  let deltaX = touch.clientX - centroX;
  let deltaY = touch.clientY - centroY;
  const distancia = Math.min(50, Math.sqrt(deltaX * deltaX + deltaY * deltaY));
  const angulo = Math.atan2(deltaY, deltaX);

  joyX = Math.cos(angulo) * (distancia / 50);
  joyY = Math.sin(angulo) * (distancia / 50);

  joystickStick.style.transform = `translate(${Math.cos(angulo) * distancia}px, ${Math.sin(angulo) * distancia}px)`;
});

window.addEventListener('touchend', () => {
  joystickAtivo = false;
  joyX = 0;
  joyY = 0;
  joystickStick.style.transform = `translate(0px, 0px)`;
});

let lastTouchX = 0, lastTouchY = 0;
window.addEventListener('touchstart', (e) => {
  if (isMobile && e.touches[0].target.id !== 'joystickBase' && e.touches[0].target.id !== 'btnPular') {
    lastTouchX = e.touches[0].clientX;
    lastTouchY = e.touches[0].clientY;
  }
});
window.addEventListener('touchmove', (e) => {
  if (isMobile && e.touches[0].target.id !== 'joystickBase' && e.touches[0].target.id !== 'btnPular') {
    const deltaX = e.touches[0].clientX - lastTouchX;
    const deltaY = e.touches[0].clientY - lastTouchY;
    rotationY -= deltaX * 0.004;
    rotationX -= deltaY * 0.004;
    rotationX = Math.max(-Math.PI / 2.2, Math.min(Math.PI / 2.2, rotationX));
    lastTouchX = e.touches[0].clientX;
    lastTouchY = e.touches[0].clientY;
  }
});

document.getElementById('btnPular').addEventListener('click', () => {
  if (noChao) {
    velY = forcaPulo;
    noChao = false;
  }
});

window.addEventListener('keydown', (e) => {
  if (e.code === 'Escape') {
    sairDoJogoLimpo();
    if (!isMobile && document.pointerLockElement) document.exitPointerLock();
    setTimeout(() => { window.location.href = 'lobby.html'; }, 100);
  }
  if (e.code === 'Space' && noChao) {
    velY = forcaPulo;
    noChao = false;
  }
});

const keys = {};
window.addEventListener('keydown', (e) => keys[e.code] = true);
window.addEventListener('keyup', (e) => keys[e.code] = false);

// 5. LOOP PRINCIPAL
let ultimoEnvio = 0;

function animate(tempo) {
  requestAnimationFrame(animate);

  camera.rotation.order = 'YXZ';
  camera.rotation.y = rotationY;
  camera.rotation.x = rotationX;

  const dirFrente = new THREE.Vector3(-Math.sin(rotationY), 0, -Math.cos(rotationY)).normalize();
  const dirLado = new THREE.Vector3(Math.cos(rotationY), 0, -Math.sin(rotationY)).normalize();
  const vel = 0.22;

  if (keys['KeyW'] || keys['ArrowUp']) { playerPos.x += dirFrente.x * vel; playerPos.z += dirFrente.z * vel; }
  if (keys['KeyS'] || keys['ArrowDown']) { playerPos.x -= dirFrente.x * vel; playerPos.z -= dirFrente.z * vel; }
  if (keys['KeyA'] || keys['ArrowLeft']) { playerPos.x -= dirLado.x * vel; playerPos.z -= dirLado.z * vel; }
  if (keys['KeyD'] || keys['ArrowRight']) { playerPos.x += dirLado.x * vel; playerPos.z += dirLado.z * vel; }

  if (joystickAtivo) {
    playerPos.x += (dirFrente.x * (-joyY) + dirLado.x * joyX) * vel;
    playerPos.z += (dirFrente.z * (-joyY) + dirLado.z * joyX) * vel;
  }

  velY += gravidade;
  playerPos.y += velY;

  let alturaSolo = 2;
  for (let plat of plataformas) {
    const b = plat.userData;
    if (playerPos.x >= b.minX && playerPos.x <= b.maxX && playerPos.z >= b.minZ && playerPos.z <= b.maxZ) {
      if (b.topY + 1.6 > alturaSolo && playerPos.y >= b.topY - 0.5 && velY <= 0) {
        alturaSolo = b.topY + 1.6;
      }
    }
  }

  if (playerPos.y <= alturaSolo) {
    playerPos.y = alturaSolo;
    velY = 0;
    noChao = true;
  } else {
    noChao = false;
  }

  if (playerPos.y < -15) {
    playerPos = { x: 0, y: 3, z: 0 };
    velY = 0;
  }

  camera.position.set(playerPos.x, playerPos.y, playerPos.z);
  document.getElementById('scoreAltura').innerText = Math.max(0, Math.floor(playerPos.y));

  if (tempo - ultimoEnvio > 50) {
    set(jogadorRef, {
      x: Number(playerPos.x.toFixed(2)),
      y: Number(playerPos.y.toFixed(2)),
      z: Number(playerPos.z.toFixed(2))
    }).catch(() => {});
    ultimoEnvio = tempo;
  }

  renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

animate(0);
</script>
</body>
</html>
