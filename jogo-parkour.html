<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Goblox — Parkour Multiplayer</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
  body { overflow: hidden; background: #000; font-family: system-ui, sans-serif; }
  #gameCanvas { display: block; width: 100vw; height: 100vh; }

  /* Interface */
  .hud {
    position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
    color: #fff; font-size: 1.5rem; font-weight: 900; z-index: 10;
    text-shadow: 0 2px 10px rgba(0,0,0,0.8); pointer-events: none;
  }
  .btn-voltar {
    position: absolute; top: 20px; left: 20px; z-index: 10;
    background: rgba(20,20,31,.8); color: #fff; border: 1px solid rgba(255,255,255,.2);
    padding: 10px 16px; border-radius: 12px; font-weight: 700; cursor: pointer;
    text-decoration: none; backdrop-filter: blur(8px);
  }
  
  /* Tela de Game Over Local */
  #gameOver {
    position: absolute; inset: 0; background: rgba(0,0,0,0.75);
    display: none; flex-direction: column; align-items: center; justify-content: center;
    z-index: 20; color: #fff; text-align: center; backdrop-filter: blur(4px);
  }
  #gameOver h1 { font-size: 3rem; color: #ef4444; margin-bottom: 10px; }
  #gameOver p { font-size: 1.2rem; margin-bottom: 20px; color: #ccc; }
  #gameOver button {
    padding: 12px 30px; font-size: 1.2rem; font-weight: 700;
    background: #22c55e; color: #000; border: none; border-radius: 12px; cursor: pointer;
  }

  /* Controls Mobile */
  #joystick-zone {
    position: absolute; bottom: 30px; left: 30px; z-index: 10;
    width: 120px; height: 120px; background: rgba(255,255,255,.05);
    border: 2px solid rgba(255,255,255,.1); border-radius: 50%;
    touch-action: none; display: none;
  }
  #joystick-knob {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: 50px; height: 50px; background: #7c3aed;
    border-radius: 50%; box-shadow: 0 0 15px rgba(124,58,237,.8);
    pointer-events: none;
  }
  #btnPulo {
    position: absolute; bottom: 40px; right: 30px; z-index: 10;
    width: 80px; height: 80px; background: rgba(124,58,237,.8);
    border-radius: 50%; color: #fff; font-weight: 900; font-size: 1.2rem;
    display: none; align-items: center; justify-content: center;
    border: 2px solid #fff; touch-action: none;
  }

  @media (hover: none) and (pointer: coarse) {
    #joystick-zone { display: block; }
    #btnPulo { display: flex; }
  }
</style>
</head>
<body>

  <a href="lobby.html" class="btn-voltar">← Lobby</a>
  <div class="hud">Altura: <span id="altura">0</span>m</div>

  <div id="gameOver">
    <h1>Você caiu!</h1>
    <p>Alcance: <span id="alturaFinal">0</span>m</p>
    <button id="btnRenascer">Tentar Novamente</button>
  </div>

  <div id="joystick-zone"><div id="joystick-knob"></div></div>
  <div id="btnPulo">PULAR</div>

  <canvas id="gameCanvas"></canvas>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { criarPersonagem } from './personagem.js';
    import { iniciarMultiplayer } from './multiplayer.js';

    // ==========================================
    // CONFIGURAÇÃO DA CENA
    // ==========================================
    const canvas = document.getElementById('gameCanvas');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87CEEB);
    scene.fog = new THREE.Fog(0x87CEEB, 20, 60);

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 100);

    // Luzes
    scene.add(new THREE.AmbientLight(0xffffff, 0.6));
    const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
    dirLight.position.set(10, 20, 10);
    dirLight.castShadow = true;
    scene.add(dirLight);

    // ==========================================
    // PERSONAGEM
    // ==========================================
    const player = criarPersonagem();
    scene.add(player);

    const playerState = {
      x: 0, y: 0.5, z: 0,
      vx: 0, vy: 0, vz: 0,
      noChao: false,
      velocidade: 9,
      forcaPulo: 13.5,
      gravidade: 30,
      vivo: true
    };

    // Conecta ao Multiplayer
    const conexaoMultiplayer = iniciarMultiplayer(scene);

    // ==========================================
    // GERADOR DE PLATAFORMAS (FIXO E SEGURO)
    // ==========================================
    const plataformas = [];
    
    // Plataforma Inicial
    const chaoGeo = new THREE.BoxGeometry(6, 1, 6);
    const chaoMat = new THREE.MeshStandardMaterial({ color: 0x333333 });
    const chao = new THREE.Mesh(chaoGeo, chaoMat);
    chao.position.set(0, -0.5, 0);
    chao.receiveShadow = true;
    scene.add(chao);
    plataformas.push({ mesh: chao, x: 0, y: -0.5, z: 0, w: 6, h: 1, d: 6 });

    // Gera 100 plataformas com posições matemáticas alcançáveis
    let lastY = 0, lastZ = 0, lastX = 0;
    for (let i = 0; i < 100; i++) {
      lastY += 1.5 + (i * 0.01); // Aumenta gradualmente a dificuldade
      lastZ -= 2.5;
      
      const w = Math.max(1.8, 3.0 - (i * 0.01)); // Plataformas ficam levemente menores no topo
      const d = 2.5;
      
      lastX += (Math.sin(i) * 2.5); // Caminho suave em padrão de S
      lastX = Math.max(-4, Math.min(4, lastX));
      
      const pGeo = new THREE.BoxGeometry(w, 0.5, d);
      const pMat = new THREE.MeshStandardMaterial({ color: (i % 2 === 0) ? 0x06b6d4 : 0x3b82f6 });
      const p = new THREE.Mesh(pGeo, pMat);
      
      p.position.set(lastX, lastY, lastZ);
      p.receiveShadow = true;
      p.castShadow = true;
      scene.add(p);
      
      plataformas.push({ mesh: p, x: lastX, y: lastY, z: lastZ, w: w, h: 0.5, d: d });
    }

    // ==========================================
    // RESSUSCITAR JOGADOR (LOCAL)
    // ==========================================
    function renascer() {
      playerState.x = 0;
      playerState.y = 0.5;
      playerState.z = 0;
      playerState.vx = 0;
      playerState.vy = 0;
      playerState.vz = 0;
      playerState.vivo = true;
      document.getElementById('gameOver').style.display = 'none';
    }

    document.getElementById('btnRenascer').addEventListener('click', renascer);

    // ==========================================
    // CONTROLES
    // ==========================================
    const keys = { w: false, a: false, s: false, d: false };
    window.addEventListener('keydown', e => {
      if (e.key === 'w' || e.key === 'ArrowUp') keys.w = true;
      if (e.key === 's' || e.key === 'ArrowDown') keys.s = true;
      if (e.key === 'a' || e.key === 'ArrowLeft') keys.a = true;
      if (e.key === 'd' || e.key === 'ArrowRight') keys.d = true;
      if (e.key === ' ') { e.preventDefault(); pular(); }
    });
    window.addEventListener('keyup', e => {
      if (e.key === 'w' || e.key === 'ArrowUp') keys.w = false;
      if (e.key === 's' || e.key === 'ArrowDown') keys.s = false;
      if (e.key === 'a' || e.key === 'ArrowLeft') keys.a = false;
      if (e.key === 'd' || e.key === 'ArrowRight') keys.d = false;
    });

    let joyX = 0, joyZ = 0;
    const zone = document.getElementById('joystick-zone');
    const knob = document.getElementById('joystick-knob');
    
    zone.addEventListener('pointerdown', e => { zone.setPointerCapture(e.pointerId); });
    zone.addEventListener('pointermove', e => {
      if (e.buttons === 0) return;
      const rect = zone.getBoundingClientRect();
      let dx = e.clientX - (rect.left + rect.width / 2);
      let dz = e.clientY - (rect.top + rect.height / 2);
      const max = 35;
      const dist = Math.sqrt(dx*dx + dz*dz);
      if (dist > max) { dx = (dx/dist)*max; dz = (dz/dist)*max; }
      knob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dz}px))`;
      joyX = dx / max;
      joyZ = dz / max;
    });
    zone.addEventListener('pointerup', e => {
      knob.style.transform = `translate(-50%, -50%)`;
      joyX = 0; joyZ = 0;
    });

    document.getElementById('btnPulo').addEventListener('pointerdown', e => { e.preventDefault(); pular(); });

    function pular() {
      if (playerState.noChao && playerState.vivo) {
        playerState.vy = playerState.forcaPulo;
        playerState.noChao = false;
      }
    }

    // ==========================================
    // LOOP DE ANIMAÇÃO E FÍSICA
    // ==========================================
    const clock = new THREE.Clock();
    const alturaEl = document.getElementById('altura');

    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), 0.1);

      if (playerState.vivo) {
        let moveX = 0, moveZ = 0;
        if (keys.w) moveZ -= 1;
        if (keys.s) moveZ += 1;
        if (keys.a) moveX -= 1;
        if (keys.d) moveX += 1;
        
        moveX += joyX;
        moveZ += joyZ;

        if (moveX !== 0 || moveZ !== 0) {
          const len = Math.sqrt(moveX*moveX + moveZ*moveZ);
          playerState.vx = (moveX / len) * playerState.velocidade;
          playerState.vz = (moveZ / len) * playerState.velocidade;
        } else {
          playerState.vx = 0;
          playerState.vz = 0;
        }

        playerState.vy -= playerState.gravidade * dt;

        playerState.x += playerState.vx * dt;
        playerState.y += playerState.vy * dt;
        playerState.z += playerState.vz * dt;

        // Colisão AABB
        playerState.noChao = false;
        const pMinX = playerState.x - 0.5, pMaxX = playerState.x + 0.5;
        const pMinY = playerState.y - 0.5, pMaxY = playerState.y + 0.5;
        const pMinZ = playerState.z - 0.5, pMaxZ = playerState.z + 0.5;

        for (let plat of plataformas) {
          const w = plat.w / 2, h = plat.h / 2, d = plat.d / 2;
          if (pMaxX > plat.x - w && pMinX < plat.x + w &&
              pMaxY > plat.y - h && pMinY < plat.y + h &&
              pMaxZ > plat.z - d && pMinZ < plat.z + d) {
            
            if (playerState.vy <= 0 && pMinY < plat.y + h && pMinY > plat.y + h - 1.2) {
              playerState.y = plat.y + h + 0.5;
              playerState.vy = 0;
              playerState.noChao = true;
            }
          }
        }

        // Queda / Morte individual
        if (playerState.y < -10) {
          playerState.vivo = false;
          document.getElementById('alturaFinal').textContent = Math.max(0, Math.floor(playerState.y + 10));
          document.getElementById('gameOver').style.display = 'flex';
        }

        // Atualiza posição do modelo local
        player.position.set(playerState.x, playerState.y, playerState.z);
        alturaEl.textContent = Math.max(0, Math.floor(playerState.y + 0.5));

        // Transmite a posição individual para o Firebase
        if (conexaoMultiplayer && conexaoMultiplayer.atualizarPosicao) {
          conexaoMultiplayer.atualizarPosicao(playerState.x, playerState.y, playerState.z);
        }
      }

      // Câmera Acompanha o jogador
      camera.position.x += (playerState.x - camera.position.x) * 5 * dt;
      camera.position.y += (playerState.y + 4 - camera.position.y) * 5 * dt;
      camera.position.z = playerState.z + 8;
      camera.lookAt(playerState.x, playerState.y, playerState.z);

      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
  </script>
</body>
</html>
