<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Goblox — Parkour</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
  body { overflow: hidden; background: #000; font-family: system-ui, sans-serif; }
  #gameCanvas { display: block; width: 100vw; height: 100vh; }

  /* Interface */
  .hud {
    position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
    color: #fff; font-size: 1.5rem; font-weight: 900; z-index: 10;
    text-shadow: 0 2px 10px rgba(0,0,0,0.8); pointer-events: none;
  }
  .btn-voltar {
    position: absolute; top: 20px; left: 20px; z-index: 10;
    background: rgba(20,20,31,.8); color: #fff; border: 1px solid rgba(255,255,255,.2);
    padding: 10px 16px; border-radius: 12px; font-weight: 700; cursor: pointer;
    text-decoration: none; backdrop-filter: blur(8px);
  }
  
  /* Tela de Game Over */
  #gameOver {
    position: absolute; inset: 0; background: rgba(0,0,0,0.8);
    display: none; flex-direction: column; align-items: center; justify-content: center;
    z-index: 20; color: #fff; text-align: center;
  }
  #gameOver h1 { font-size: 3rem; color: #ef4444; margin-bottom: 10px; }
  #gameOver p { font-size: 1.2rem; margin-bottom: 20px; color: #ccc; }
  #gameOver button {
    padding: 12px 30px; font-size: 1.2rem; font-weight: 700;
    background: #22c55e; color: #000; border: none; border-radius: 12px; cursor: pointer;
  }

  /* Joystick Mobile */
  #joystick-zone {
    position: absolute; bottom: 30px; left: 30px; z-index: 10;
    width: 120px; height: 120px; background: rgba(255,255,255,.05);
    border: 2px solid rgba(255,255,255,.1); border-radius: 50%;
    touch-action: none; display: none;
  }
  #joystick-knob {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: 50px; height: 50px; background: #7c3aed;
    border-radius: 50%; box-shadow: 0 0 15px rgba(124,58,237,.8);
    pointer-events: none;
  }
  /* Botão de Pulo Mobile */
  #btnPulo {
    position: absolute; bottom: 40px; right: 30px; z-index: 10;
    width: 80px; height: 80px; background: rgba(124,58,237,.8);
    border-radius: 50%; color: #fff; font-weight: 900; font-size: 1.2rem;
    display: none; align-items: center; justify-content: center;
    border: 2px solid #fff; touch-action: none;
  }

  @media (hover: none) and (pointer: coarse) {
    #joystick-zone { display: block; }
    #btnPulo { display: flex; }
  }
</style>
</head>
<body>

  <a href="lobby.html" class="btn-voltar">← Lobby</a>
  <div class="hud">Altura: <span id="altura">0</span>m</div>

  <div id="gameOver">
    <h1>Você caiu!</h1>
    <p>Alcance: <span id="alturaFinal">0</span>m</p>
    <button onclick="location.reload()">Tentar Novamente</button>
  </div>

  <div id="joystick-zone"><div id="joystick-knob"></div></div>
  <div id="btnPulo">PULAR</div>

  <canvas id="gameCanvas"></canvas>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';

    // ==========================================
    // CONFIGURAÇÃO DA CENA
    // ==========================================
    const canvas = document.getElementById('gameCanvas');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87CEEB);
    scene.fog = new THREE.Fog(0x87CEEB, 20, 60);

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 100);

    // Luzes
    scene.add(new THREE.AmbientLight(0xffffff, 0.6));
    const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
    dirLight.position.set(10, 20, 10);
    dirLight.castShadow = true;
    scene.add(dirLight);

    // ==========================================
    // FÍSICA BÁSICA DO JOGADOR
    // ==========================================
    const player = new THREE.Mesh(
      new THREE.BoxGeometry(1, 1, 1),
      new THREE.MeshStandardMaterial({ color: 0x7c3aed })
    );
    player.castShadow = true;
    scene.add(player);

    const playerState = {
      x: 0, y: 0.5, z: 0,
      vx: 0, vy: 0, vz: 0,
      noChao: false,
      velocidade: 9,       // Aumentado levemente para melhorar a fluidez
      forcaPulo: 13.5,     // Aumentado para garantir saltos confortáveis
      gravidade: 30
    };

    // ==========================================
    // GERADOR DE PLATAFORMAS (OBSTÁCULOS)
    // ==========================================
    const plataformas = [];
    
    // Chão inicial
    const chaoGeo = new THREE.BoxGeometry(6, 1, 6);
    const chaoMat = new THREE.MeshStandardMaterial({ color: 0x333333 });
    const chao = new THREE.Mesh(chaoGeo, chaoMat);
    chao.position.set(0, -0.5, 0);
    chao.receiveShadow = true;
    scene.add(chao);
    plataformas.push({ mesh: chao, x: 0, y: -0.5, z: 0, w: 6, h: 1, d: 6 });

    // Gera plataformas subindo de forma garantida
    let lastY = 0;
    let lastZ = 0;
    let lastX = 0;

    for (let i = 0; i < 100; i++) {
      // Limita a altura e a distância para nunca gerar um salto impossível
      lastY += 1.5 + Math.random() * 1.2; // Sobe de 1.5 a 2.7m (garantido pelo pulo de 13.5)
      lastZ -= 2.2 + Math.random() * 1.0; // Distância pra frente controlada
      
      const w = 2.2 + Math.random() * 1.2;
      const d = 2.2 + Math.random() * 1.2;
      
      // Mantém as plataformas dentro de um raio que o jogador consegue alcançar pros lados
      lastX += (Math.random() - 0.5) * 3.5;
      lastX = Math.max(-4, Math.min(4, lastX)); // Limita as bordas laterais
      
      const pGeo = new THREE.BoxGeometry(w, 0.5, d);
      const pMat = new THREE.MeshStandardMaterial({ color: 0x06b6d4 });
      const p = new THREE.Mesh(pGeo, pMat);
      
      p.position.set(lastX, lastY, lastZ);
      p.receiveShadow = true;
      p.castShadow = true;
      scene.add(p);
      
      plataformas.push({ 
        mesh: p, 
        x: lastX, y: lastY, z: lastZ, 
        w: w, h: 0.5, d: d 
      });
    }

    // ==========================================
    // CONTROLES (TECLADO E MOBILE)
    // ==========================================
    const keys = { w: false, a: false, s: false, d: false };
    window.addEventListener('keydown', e => {
      if (e.key === 'w' || e.key === 'ArrowUp') keys.w = true;
      if (e.key === 's' || e.key === 'ArrowDown') keys.s = true;
      if (e.key === 'a' || e.key === 'ArrowLeft') keys.a = true;
      if (e.key === 'd' || e.key === 'ArrowRight') keys.d = true;
      if (e.key === ' ') { e.preventDefault(); pular(); }
    });
    window.addEventListener('keyup', e => {
      if (e.key === 'w' || e.key === 'ArrowUp') keys.w = false;
      if (e.key === 's' || e.key === 'ArrowDown') keys.s = false;
      if (e.key === 'a' || e.key === 'ArrowLeft') keys.a = false;
      if (e.key === 'd' || e.key === 'ArrowRight') keys.d = false;
    });

    // Joystick Mobile
    let joyX = 0, joyZ = 0;
    const zone = document.getElementById('joystick-zone');
    const knob = document.getElementById('joystick-knob');
    
    zone.addEventListener('pointerdown', e => { zone.setPointerCapture(e.pointerId); });
    zone.addEventListener('pointermove', e => {
      if (e.buttons === 0) return;
      const rect = zone.getBoundingClientRect();
      let dx = e.clientX - (rect.left + rect.width / 2);
      let dz = e.clientY - (rect.top + rect.height / 2);
      const max = 35;
      const dist = Math.sqrt(dx*dx + dz*dz);
      if (dist > max) { dx = (dx/dist)*max; dz = (dz/dist)*max; }
      knob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dz}px))`;
      joyX = dx / max;
      joyZ = dz / max;
    });
    zone.addEventListener('pointerup', e => {
      knob.style.transform = `translate(-50%, -50%)`;
      joyX = 0; joyZ = 0;
    });

    // Botão de Pulo
    const btnPulo = document.getElementById('btnPulo');
    btnPulo.addEventListener('pointerdown', e => { e.preventDefault(); pular(); });

    function pular() {
      if (playerState.noChao) {
        playerState.vy = playerState.forcaPulo;
        playerState.noChao = false;
      }
    }

    // ==========================================
    // LOOP DE ANIMAÇÃO E FÍSICA
    // ==========================================
    const clock = new THREE.Clock();
    const alturaEl = document.getElementById('altura');

    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), 0.1);

      // Movimento Horizontal
      let moveX = 0, moveZ = 0;
      if (keys.w) moveZ -= 1;
      if (keys.s) moveZ += 1;
      if (keys.a) moveX -= 1;
      if (keys.d) moveX += 1;
      
      moveX += joyX;
      moveZ += joyZ;

      if (moveX !== 0 || moveZ !== 0) {
        const len = Math.sqrt(moveX*moveX + moveZ*moveZ);
        playerState.vx = (moveX / len) * playerState.velocidade;
        playerState.vz = (moveZ / len) * playerState.velocidade;
      } else {
        playerState.vx = 0;
        playerState.vz = 0;
      }

      // Gravidade
      playerState.vy -= playerState.gravidade * dt;

      // Aplica velocidades
      playerState.x += playerState.vx * dt;
      playerState.y += playerState.vy * dt;
      playerState.z += playerState.vz * dt;

      // Colisão com Plataformas
      playerState.noChao = false;
      
      const pMinX = playerState.x - 0.5;
      const pMaxX = playerState.x + 0.5;
      const pMinY = playerState.y - 0.5;
      const pMaxY = playerState.y + 0.5;
      const pMinZ = playerState.z - 0.5;
      const pMaxZ = playerState.z + 0.5;

      for (let plat of plataformas) {
        const w = plat.w / 2;
        const h = plat.h / 2;
        const d = plat.d / 2;
        
        const bMinX = plat.x - w;
        const bMaxX = plat.x + w;
        const bMinY = plat.y - h;
        const bMaxY = plat.y + h;
        const bMinZ = plat.z - d;
        const bMaxZ = plat.z + d;

        if (pMaxX > bMinX && pMinX < bMaxX &&
            pMaxY > bMinY && pMinY < bMaxY &&
            pMaxZ > bMinZ && pMinZ < bMaxZ) {
          
          if (playerState.vy <= 0 && pMinY < bMaxY && pMinY > bMaxY - 1.2) {
            playerState.y = bMaxY + 0.5;
            playerState.vy = 0;
            playerState.noChao = true;
          }
        }
      }

      // Se cair do mapa, Game Over
      if (playerState.y < -10) {
        document.getElementById('alturaFinal').textContent = Math.max(0, Math.floor(playerState.y + 10));
        document.getElementById('gameOver').style.display = 'flex';
        return;
      }

      player.position.set(playerState.x, playerState.y, playerState.z);
      alturaEl.textContent = Math.max(0, Math.floor(playerState.y + 0.5));

      // Câmera Segue
      const camDist = 8;
      const camHeight = 4;
      
      camera.position.x += (playerState.x - camera.position.x) * 5 * dt;
      camera.position.y += (playerState.y + camHeight - camera.position.y) * 5 * dt;
      camera.position.z = playerState.z + camDist;
      
      camera.lookAt(playerState.x, playerState.y, playerState.z);

      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
  </script>
</body>
</html>
