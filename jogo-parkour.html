<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Goblox — Parkour Extremo</title>
<link rel="stylesheet" href="global.css">
<style>
  body {
    margin: 0;
    overflow: hidden;
    background-color: #050508;
    user-select: none;
    touch-action: none;
    font-family: Arial, sans-serif;
  }
  #hud {
    position: absolute;
    top: 20px;
    left: 20px;
    color: #fff;
    font-size: 1.2rem;
    font-weight: bold;
    z-index: 10;
    text-shadow: 0 2px 4px rgba(0,0,0,0.8);
  }
  #btnVoltar {
    position: absolute;
    top: 20px;
    right: 20px;
    padding: 10px 18px;
    background: #1e1e2d;
    border: 1px solid rgba(255,255,255,0.2);
    color: #fff;
    border-radius: 10px;
    font-weight: bold;
    cursor: pointer;
    z-index: 20;
    text-decoration: none;
  }
  #instrucaoMouse {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: #fff;
    font-size: 1.4rem;
    font-weight: bold;
    background: rgba(0,0,0,0.85);
    padding: 24px 36px;
    border-radius: 16px;
    z-index: 30;
    text-align: center;
    border: 2px solid rgba(139, 92, 246, 0.5);
    box-shadow: 0 0 20px rgba(0,0,0,0.8);
    cursor: pointer;
  }
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  }
}
</script>
</head>
<body>

<div id="hud">
  <div>Altura (Topo): <span id="scoreAltura" style="color: #4ade80;">0</span>m</div>
</div>

<div id="instrucaoMouse">CLICA AQUI PARA JOGAR<br><small style="font-size: 0.9rem; color: #aaa;">WASD para mover • Espaço para saltar • ESC para sair</small></div>
<a href="lobby.html" id="btnVoltar">⎋ Sair</a>

<script type="module">
import * as THREE from 'three';
import { db as database } from './firebase.js';
import { ref, set, remove, onValue, onDisconnect } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
import { criarPersonagem } from './personagem.js';

const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || window.innerWidth < 768;

// 1. CENA, CÂMERA E RENDERER
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0a14);
scene.fog = new THREE.FogExp2(0x0a0a14, 0.015);

const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

// ILUMINAÇÃO
const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
scene.add(ambientLight);

const dirLight = new THREE.DirectionalLight(0xa855f7, 1.2);
dirLight.position.set(30, 50, 30);
dirLight.castShadow = true;
scene.add(dirLight);

// 2. TORRE DE PLATAFORMAS DE PARKOUR
const plataformas = [];

function criarBlocoParkour(x, y, z, w, h, d, cor = 0x8b5cf6) {
  const geo = new THREE.BoxGeometry(w, h, d);
  const mat = new THREE.MeshStandardMaterial({ color: cor, roughness: 0.3 });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.set(x, y, z);
  mesh.receiveShadow = true;
  mesh.castShadow = true;
  scene.add(mesh);
  
  // Margem segura para nunca emperrar os passos
  mesh.userData = { minX: x - w/2 - 0.8, maxX: x + w/2 + 0.8, minZ: z - d/2 - 0.8, maxZ: z + d/2 + 0.8, topY: y + h/2 };
  plataformas.push(mesh);
}

// Base Inicial
criarBlocoParkour(0, 0, 0, 20, 2, 20, 0x181824);

// Torre de Obstáculos Subindo
let alturaAtual = 4;
for (let i = 0; i < 25; i++) {
  const offsetX = (Math.sin(i * 1.5) * 8);
  const offsetZ = (Math.cos(i * 1.2) * 8);
  criarBlocoParkour(offsetX, alturaAtual, offsetZ, 6, 1.2, 6, i % 2 === 0 ? 0x6366f1 : 0xa855f7);
  alturaAtual += 3.5;
}

// 3. MULTIPLAYER E JOGADOR COM ANTI-FANTASMA
const meuId = 'player_parkour_' + Math.random().toString(36).substr(2, 9);
const jogadorRef = ref(database, 'parkour_jogadores/' + meuId);
const todosJogadoresRef = ref(database, 'parkour_jogadores');

let playerPos = { x: 0, y: 3, z: 0 };
let velY = 0;
const gravidade = -0.012;
const forcaPulo = 0.32;
let noChao = false;
const outrosJogadores = {};

function sairDoJogoLimpo() {
  remove(jogadorRef).catch(() => {});
}

onDisconnect(jogadorRef).remove();
window.addEventListener('beforeunload', sairDoJogoLimpo);
window.addEventListener('pagehide', sairDoJogoLimpo);

document.getElementById('btnVoltar').addEventListener('click', (e) => {
  e.preventDefault();
  sairDoJogoLimpo();
  setTimeout(() => {
    window.location.href = 'lobby.html';
  }, 100);
});

set(jogadorRef, { x: playerPos.x, y: playerPos.y, z: playerPos.z });

// ESCUTA OUTROS JOGADORES NO FIREBASE
onValue(todosJogadoresRef, (snapshot) => {
  const data = snapshot.val() || {};

  for (let id in outrosJogadores) {
    if (!data[id]) {
      scene.remove(outrosJogadores[id].mesh);
      delete outrosJogadores[id];
    }
  }

  for (let id in data) {
    if (id === meuId) continue;
    let pos = data[id];

    if (!outrosJogadores[id]) {
      const meshOutro = criarPersonagem();
      scene.add(meshOutro);
      outrosJogadores[id] = { id: id, mesh: meshOutro };
    }

    if (pos && typeof pos.x === 'number') {
      outrosJogadores[id].mesh.position.set(pos.x, pos.y, pos.z);
    }
  }
});

// 4. CONTROLES DE MOUSE E TECLADO
const instrucaoMouse = document.getElementById('instrucaoMouse');

function solicitarPointerLock() {
  if (!isMobile) {
    document.body.requestPointerLock();
  }
}

instrucaoMouse.addEventListener('click', solicitarPointerLock);
document.body.addEventListener('click', (e) => {
  if (!isMobile && e.target.id !== 'btnVoltar' && document.pointerLockElement !== document.body) {
    solicitarPointerLock();
  }
});

document.addEventListener('pointerlockchange', () => {
  if (!isMobile) {
    if (document.pointerLockElement === document.body) {
      instrucaoMouse.style.display = 'none';
    } else {
      instrucaoMouse.style.display = 'block';
    }
  }
});

let rotationX = 0;
let rotationY = 0;

document.addEventListener('mousemove', (e) => {
  if (!isMobile && document.pointerLockElement === document.body) {
    const sensitivity = 0.0022;
    rotationY -= e.movementX * sensitivity;
    rotationX -= e.movementY * sensitivity;
    rotationX = Math.max(-Math.PI / 2.2, Math.min(Math.PI / 2.2, rotationX));
  }
});

window.addEventListener('keydown', (e) => {
  if (e.code === 'Escape') {
    sairDoJogoLimpo();
    if (!isMobile && document.pointerLockElement) document.exitPointerLock();
    setTimeout(() => {
      window.location.href = 'lobby.html';
    }, 100);
  }
  // Pular com espaço
  if ((e.code === 'Space' || e.code === 'KeyW') && noChao) {
    if (e.code === 'Space') {
      velY = forcaPulo;
      noChao = false;
    }
  }
});

const keys = {};
window.addEventListener('keydown', (e) => keys[e.code] = true);
window.addEventListener('keyup', (e) => keys[e.code] = false);

// 5. LOOP PRINCIPAL DO PARKOUR
let ultimoEnvio = 0;

function animate(tempo) {
  requestAnimationFrame(animate);

  camera.rotation.order = 'YXZ';
  camera.rotation.y = rotationY;
  camera.rotation.x = rotationX;

  const dirFrente = new THREE.Vector3(-Math.sin(rotationY), 0, -Math.cos(rotationY)).normalize();
  const dirLado = new THREE.Vector3(Math.cos(rotationY), 0, -Math.sin(rotationY)).normalize();
  const vel = 0.18;

  if (keys['KeyW'] || keys['ArrowUp']) { playerPos.x += dirFrente.x * vel; playerPos.z += dirFrente.z * vel; }
  if (keys['KeyS'] || keys['ArrowDown']) { playerPos.x -= dirFrente.x * vel; playerPos.z -= dirFrente.z * vel; }
  if (keys['KeyA'] || keys['ArrowLeft']) { playerPos.x -= dirLado.x * vel; playerPos.z -= dirLado.z * vel; }
  if (keys['KeyD'] || keys['ArrowRight']) { playerPos.x += dirLado.x * vel; playerPos.z += dirLado.z * vel; }

  // Física de Gravidade
  velY += gravidade;
  playerPos.y += velY;

  // Verificação de piso nas plataformas do Parkour
  let chaoEncontrado = false;
  for (let plat of plataformas) {
    const b = plat.userData;
    if (playerPos.x >= b.minX && playerPos.x <= b.maxX && playerPos.z >= b.minZ && playerPos.z <= b.maxZ) {
      if (playerPos.y <= b.topY + 1.6 && playerPos.y >= b.topY - 0.6 && velY <= 0) {
        playerPos.y = b.topY + 1.6;
        velY = 0;
        noChao = true;
        chaoEncontrado = true;
        break;
      }
    }
  }

  if (!chaoEncontrado) {
    noChao = false;
  }

  // Queda fora da torre (Respawn embaixo)
  if (playerPos.y < -10) {
    playerPos = { x: 0, y: 3, z: 0 };
    velY = 0;
  }

  camera.position.set(playerPos.x, playerPos.y, playerPos.z);

  // Atualiza marcador de altura na tela
  document.getElementById('scoreAltura').innerText = Math.max(0, Math.floor(playerPos.y));

  if (tempo - ultimoEnvio > 50) {
    set(jogadorRef, {
      x: Number(playerPos.x.toFixed(2)),
      y: Number(playerPos.y.toFixed(2)),
      z: Number(playerPos.z.toFixed(2))
    }).catch(() => {});
    ultimoEnvio = tempo;
  }

  renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

animate(0);
</script>
</body>
</html>
