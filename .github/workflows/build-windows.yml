name: Build Goblox para Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - "1.1/**"
      - "package.json"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Instalar dependências
        run: npm install

      - name: Criar instalador do Goblox
        run: npm run build:windows -- --publish never

      - name: Disponibilizar instalador como artifact
        uses: actions/upload-artifact@v4
        with:
          name: Goblox-Windows
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 14

      - name: Publicar instalador no GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view desktop-latest >/dev/null 2>&1; then
            gh release upload desktop-latest dist/*.exe --clobber
          else
            gh release create desktop-latest dist/*.exe \
              --title "Goblox para Windows - Última versão" \
              --notes "Instalador Windows gerado automaticamente pelo GitHub Actions. Baixe o arquivo .exe em Assets."
          fi
