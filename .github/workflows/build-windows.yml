name: Build Goblox para Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - "1.1/**"
      - "package.json"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4
        with:
          node-version: 24

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Instalar dependências
        run: npm install

      - name: Criar instalador do Goblox
        run: npm run build:windows -- --publish never

      - name: Disponibilizar instalador
        uses: actions/upload-artifact@v4
        with:
          name: Goblox-Windows
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 14
