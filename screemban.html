<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GOBLOX — Conta Suspensa</title>
  <link rel="stylesheet" href="./global.css" />
  <link rel="stylesheet" href="./lobby.css" />
  <style>
    body {
      background: #090d16;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      font-family: Arial, sans-serif;
    }
    .ban-card {
      background: rgba(20, 10, 15, 0.95);
      border: 2px solid #ef4444;
      border-radius: 16px;
      padding: 40px;
      max-width: 450px;
      width: 100%;
      text-align: center;
      box-shadow: 0 0 40px rgba(239, 68, 68, 0.4);
    }
    .ban-icon {
      font-size: 60px;
      margin-bottom: 20px;
    }
    .ban-card h1 {
      color: #ef4444;
      font-size: 2rem;
      margin-bottom: 10px;
    }
    .ban-details {
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      padding: 15px;
      margin: 20px 0;
      text-align: left;
    }
    .ban-details p {
      margin: 8px 0;
      font-size: 0.95rem;
      color: #cbd5e1;
    }
    .ban-details strong {
      color: #fff;
    }
    .btn-sair {
      background: #ef4444;
      color: #fff;
      border: none;
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      font-size: 1rem;
      transition: background 0.2s;
    }
    .btn-sair:hover {
      background: #dc2626;
    }
  </style>
</head>
<body>
  <div class="bg"></div>

  <div class="ban-card">
    <div class="ban-icon">⛔</div>
    <h1>CONTA SUSPENSA</h1>
    <p style="color: #94a3b8; font-size: 0.9rem;">O acesso a esta conta foi restringido por violação das regras.</p>

    <div class="ban-details">
      <p><strong>Motivo:</strong> <span id="txtMotivo" style="color: #f87171;">Carregando...</span></p>
      <p><strong>Tipo:</strong> <span id="txtTipo">Carregando...</span></p>
      <p id="blocoTempo" style="display: none;"><strong>Expira em:</strong> <span id="txtTempo" style="color: #fbbf24;">Carregando...</span></p>
    </div>

    <button class="btn-sair" onclick="voltarLogin()">Voltar ao Início</button>
  </div>

  <script type="module">
    import { db } from "./firebase.js";
    import { ref, get } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
    import { getCurrentNick } from "./authLocal.js";

    const nick = getCurrentNick() || localStorage.getItem("goblox_player_nick");

    async function verificarStatusBan() {
      if (!nick) {
        document.getElementById("txtMotivo").textContent = "Nenhum utilizador logado.";
        document.getElementById("txtTipo").textContent = "Desconhecido";
        return;
      }

      // Verifica no Firebase se a conta continua banida
      const banRef = ref(db, `bans/${nick}`);
      const snap = await get(banRef);

      if (!snap.exists()) {
        // Se já não estiver banido no servidor, manda de volta para o lobby
        window.location.href = "lobby.html";
        return;
      }

      const banData = snap.val();
      document.getElementById("txtMotivo").textContent = banData.motivo || "Conduta inadequada.";
      
      if (banData.tipo === "permanente") {
        document.getElementById("txtTipo").textContent = "Permanente 🚫";
        document.getElementById("blocoTempo").style.display = "none";
      } else {
        document.getElementById("txtTipo").textContent = "Temporário ⏳";
        document.getElementById("blocoTempo").style.display = "block";

        // Atualiza a contagem regressiva do tempo
        const expiraEm = banData.expiraEm || 0;
        const intervalo = setInterval(() => {
          const agora = Date.now();
          const restante = expiraEm - agora;

          if (restante <= 0) {
            clearInterval(intervalo);
            // O banimento expirou, remove do Firebase e redireciona
            window.location.href = "lobby.html";
          } else {
            const minutos = Math.floor(restante / (1000 * 60));
            const segundos = Math.floor((restante % (1000 * 60)) / 1000);
            document.getElementById("txtTempo").textContent = `${minutos}m ${segundos}s`;
          }
        }, 1000);
      }
    }

    window.voltarLogin = function() {
      localStorage.removeItem("goblox_player_nick");
      window.location.href = "index.html"; // ou a tua tela de login
    };

    verificarStatusBan();
  </script>
</body>
</html>
