
<!DOCTYPE html>
<html lang="pt-BR">
<head>

  <title>GOBLOX — Conta Suspensa</title>

  <style>

      font-family: Arial, sans-serif;
    }

    }
    .ban-icon {

      margin-bottom: 20px;

    }

      font-size: 0.95rem;
      color: #cbd5e1;
    }

    }
    .btn-sair {
      background: #ef4444;
      color: #fff;
      border: none;
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      font-size: 1rem;
      transition: background 0.2s;
    }
    .btn-sair:hover {

    }
  </style>
</head>
