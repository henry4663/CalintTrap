<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Goblox 3D - Teste</title>
    <style>
        body { margin: 0; overflow: hidden; background: #111; }
        #joystick-container {
            position: absolute; bottom: 30px; left: 30px;
            width: 120px; height: 120px;
            background: rgba(255,255,255,0.1); border-radius: 50%;
            touch-action: none;
        }
        #joystick-knob {
            position: absolute; top: 50%; left: 50%;
            width: 50px; height: 50px; background: #4ade80;
            border-radius: 50%; transform: translate(-50%, -50%);
        }
    </style>
</head>
<body>
    <div id="joystick-container"><div id="joystick-knob"></div></div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // 1. Cena, Câmera e Renderer
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x111122);
        const camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.1, 1000);
        camera.position.set(0, 5, 10);
        camera.lookAt(0, 0, 0);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(innerWidth, innerHeight);
        document.body.appendChild(renderer.domElement);

        // 2. Luz
        const light = new THREE.DirectionalLight(0xffffff, 1);
        light.position.set(5, 10, 7);
        scene.add(light);
        scene.add(new THREE.AmbientLight(0x404040));

        // 3. Cubo (Jogador)
        const geometry = new THREE.BoxGeometry(1, 1, 1);
        const material = new THREE.MeshStandardMaterial({ color: 0x4ade80 });
        const player = new THREE.Mesh(geometry, material);
        scene.add(player);

        // Chão
        const floorGeo = new THREE.PlaneGeometry(20, 20);
        const floorMat = new THREE.MeshStandardMaterial({ color: 0x222222 });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.position.y = -0.5;
        scene.add(floor);

        // 4. Joystick (Lógica)
        let moveX = 0, moveZ = 0;
        const container = document.getElementById('joystick-container');
        const knob = document.getElementById('joystick-knob');
        const maxDist = 35;

        container.addEventListener('pointerdown', (e) => {
            container.setPointerCapture(e.pointerId);
            container.addEventListener('pointermove', onMove);
        });
        container.addEventListener('pointerup', (e) => {
            container.removeEventListener('pointermove', onMove);
            knob.style.transform = `translate(-50%, -50%)`;
            moveX = 0; moveZ = 0;
        });

        function onMove(e) {
            const rect = container.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            let dx = e.clientX - centerX;
            let dy = e.clientY - centerY;
            const dist = Math.sqrt(dx*dx + dy*dy);
            if (dist > maxDist) {
                dx = (dx / dist) * maxDist;
                dy = (dy / dist) * maxDist;
            }
            knob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
            moveX = dx / maxDist;
            moveZ = dy / maxDist;
        }

        // 5. Loop de Animação
        function animate() {
            requestAnimationFrame(animate);
            // Movimento
            player.position.x += moveX * 0.1;
            player.position.z += moveZ * 0.1;

            renderer.render(scene, camera);
        }
        animate();

        // Responsividade
        addEventListener('resize', () => {
            camera.aspect = innerWidth / innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(innerWidth, innerHeight);
        });
    </script>
</body>
</html>
