
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GOBLOX</title>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#11151f;color:white;font-family:Arial}
button,input{padding:12px;border:0;border-radius:8px}
button{background:#2878ed;color:white;cursor:pointer;font-weight:bold}
button:hover{background:#4592ff}
header{height:65px;background:#202b40;display:flex;align-items:center;justify-content:space-between;padding:0 22px}
.logo{font-size:27px;font-weight:900}
.logo span{color:#42d6d0}
#login{position:fixed;inset:0;background:#111827;display:grid;place-items:center;z-index:5}
.login{background:#202b40;padding:30px;border-radius:16px;width:min(350px,90%)}
.login input{width:100%;margin:8px 0;background:#111827;color:white}
.login button{width:100%}
.layout{display:flex;min-height:calc(100vh - 65px)}
nav{width:190px;background:#1a2333;padding:15px}
nav button{width:100%;margin-bottom:9px;text-align:left}
main{padding:25px;flex:1}
.games{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:17px}
.game{background:#202b40;border-radius:13px;padding:18px}
.icon{font-size:48px}
.game p{color:#aab8ca}
.game button{width:100%}
.panel{background:#202b40;padding:18px;border-radius:13px;margin-top:20px}
input{background:#111827;color:white}
#play{display:none;position:fixed;inset:0;background:#101722;z-index:10}
#world{width:100%;height:100%;display:block}
.hud{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;pointer-events:none}
.hud button{pointer-events:auto}
.hud div{background:#172438;padding:12px;border-radius:9px}
#hint{position:absolute;bottom:15px;left:50%;transform:translateX(-50%);background:#172438;padding:12px;border-radius:10px;text-align:center}
.hidden{display:none!important}
@media(max-width:650px){.layout{display:block}nav{width:100%;display:flex;overflow:auto}nav button{min-width:100px}main{padding:14px}}
</style>
</head>
<body>

<div id="login">
<div class="login">
<h1 class="logo">GO<span>BLOX</span></h1>
<p>PLAY · CREATE · CONNECT</p>
<input id="name" placeholder="Nome do jogador" maxlength="16">
<button onclick="login()">ENTRAR NO GOBLOX</button>
</div>
</div>

<header>
<div class="logo">GO<span>BLOX</span></div>
<div id="user"></div>
<button onclick="logout()">SAIR</button>
</header>

<div class="layout">
<nav>
<button onclick="page('home')">🏠 Início</button>
<button onclick="page('games')">🎮 Jogos</button>
<button onclick="page('profile')">👤 Perfil</button>
</nav>

<main>
<section id="home">
<h1>Bem-vindo ao Goblox!</h1>
<p>Escolha uma experiência e comece a jogar.</p>
<div class="games" id="featured"></div>

<div class="panel">
<h2>🌐 Multiplayer</h2>
<button onclick="createRoom()">CRIAR SALA</button>
<p>Compartilhe seu código com amigos.</p>
<input id="room" placeholder="Código da sala">
<button onclick="joinRoom()">ENTRAR NA SALA</button>
<p id="status">Desconectado</p>
</div>
</section>

<section id="games" class="hidden">
<h1>Todos os jogos</h1>
<div class="games" id="catalog"></div>
</section>

<section id="profile" class="hidden">
<h1>Perfil</h1>
<div class="panel">
<div style="font-size:55px">🧑</div>
<h2 id="profileName"></h2>
<p>Nível 1</p>
<p>Jogador Goblox</p>
</div>
</section>
</main>
</div>

<div id="play">
<canvas id="world"></canvas>
<div class="hud">
<div id="gameName">GOBLOX</div>
<button onclick="exitGame()">VOLTAR</button>
</div>
<div id="hint">WASD para movimentar · ESPAÇO para pular</div>
</div>

<script>
let username="";
let peer=null;
let connections=[];
let players={};
let scene,camera,renderer,character;
let keys={};
let velocity=0;
let jumping=false;
let yaw=0;
let currentGame="";
let running=false;
let lastSend=0;

const games=[
{id:"obby",name:"Goblox Obby",icon:"🧗",description:"Parkour 3D multiplayer"},
{id:"arena",name:"Goblox Arena",icon:"⚔️",description:"Arena 3D"},
{id:"racing",name:"Goblox Racing",icon:"🏎️",description:"Corrida 3D"},
{id:"football",name:"Goblox Football",icon:"⚽",description:"Futebol 3D"}
];

function login(){
let n=document.getElementById("name").value.trim();
if(n.length<3)return alert("Digite pelo menos 3 letras");
username=n;
localStorage.setItem("goblox_user",n);
document.getElementById("login").style.display="none";
document.getElementById("user").textContent="👤 "+n;
document.getElementById("profileName").textContent=n;
renderGames();
}
function logout(){
localStorage.removeItem("goblox_user");
location.reload();
}

if(localStorage.getItem("goblox_user")){
document.getElementById("name").value=localStorage.getItem("goblox_user");
}

function page(p){
["home","games","profile"].forEach(x=>{
document.getElementById(x).classList.toggle("hidden",x!==p);
});
}

function renderGames(){
let html=games.map(g=>`
<div class="game">
<div class="icon">${g.icon}</div>
<h2>${g.name}</h2>
<p>${g.description}</p>
<button onclick="startGame('${g.id}')">JOGAR</button>
</div>`).join("");
document.getElementById("featured").innerHTML=html;
document.getElementById("catalog").innerHTML=html;
}

async function createRoom(){
try{
if(peer)peer.destroy();
connections=[];
peer=new Peer();
peer.on("open",id=>{
document.getElementById("room").value=id;
document.getElementById("status").textContent="Sala criada: "+id;
});
peer.on("connection",conn=>{
connections.push(conn);
setupConnection(conn);
});
}catch(e){alert("Erro ao criar sala")}
}

function joinRoom(){
let id=document.getElementById("room").value.trim();
if(!id)return alert("Digite o código");
if(peer)peer.destroy();
connections=[];
peer=new Peer();
peer.on("open",()=>{
let conn=peer.connect(id);
conn.on("open",()=>{
connections.push(conn);
setupConnection(conn);
conn.send({type:"hello",name:username});
document.getElementById("status").textContent="Conectado!";
});
});
peer.on("error",()=>alert("Não foi possível conectar"));
}

function setupConnection(conn){
conn.on("data",data=>{
if(data.type==="hello"){
addPlayer(conn.peer,data.name);
}
if(data.type==="move"){
if(!players[conn.peer])addPlayer(conn.peer,"Jogador");
players[conn.peer].position.set(data.x,data.y,data.z);
players[conn.peer].rotation.y=data.yaw;
}
});
conn.on("close",()=>{
if(players[conn.peer]){
scene.remove(players[conn.peer]);
delete players[conn.peer];
}
});
}

function sendAll(data){
connections.forEach(c=>{
if(c.open)c.send(data);
});
}

function addPlayer(id,name){
if(!scene||players[id])return;
let p=makeCharacter(0,0,0,0x20d6b8);
scene.add(p);
players[id]=p;
}

function makeCharacter(x,y,z,color){
let group=new THREE.Group();
let body=new THREE.Mesh(
new THREE.BoxGeometry(0.9,1.1,0.5),
new THREE.MeshStandardMaterial({color})
);
body.position.y=1.3;
group.add(body);

let head=new THREE.Mesh(
new THREE.BoxGeometry(0.7,0.7,0.7),
new THREE.MeshStandardMaterial({color:0xffc795})
);
head.position.y=2.2;
group.add(head);

for(let s of [-1,1]){
let leg=new THREE.Mesh(
new THREE.BoxGeometry(0.35,0.85,0.4),
new THREE.MeshStandardMaterial({color:0x263d75})
);
leg.position.set(s*0.23,0.42,0);
group.add(leg);
}
group.position.set(x,y,z);
return group;
}

function box(x,y,z,w,h,d,color){
let m=new THREE.Mesh(
new THREE.BoxGeometry(w,h,d),
new THREE.MeshStandardMaterial({color})
);
m.position.set(x,y,z);
scene.add(m);
return m;
}

function startGame(id){
currentGame=id;
document.getElementById("play").style.display="block";
document.getElementById("gameName").textContent=
games.find(g=>g.id===id).name;
buildWorld();
running=true;
animate();
}

function buildWorld(){
scene=new THREE.Scene();
scene.background=new THREE.Color(0x87c8f0);

camera=new THREE.PerspectiveCamera(
70,innerWidth/innerHeight,0.1,300
);

renderer=new THREE.WebGLRenderer({
canvas:document.getElementById("world"),
antialias:true
});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));

scene.add(new THREE.HemisphereLight(0xffffff,0x667788,2));

let light=new THREE.DirectionalLight(0xffffff,2);
light.position.set(10,20,10);
scene.add(light);

box(0,-0.5,0,100,1,100,
currentGame==="football"?0x369c50:0x58ad59);

character=makeCharacter(0,0,5,0x2878ed);
scene.add(character);

if(currentGame==="obby"){
for(let i=0;i<15;i++){
box((i%3-1)*4,0.3,-i*4,
3.5,0.6,3.5,
[0xffb43b,0x38b8ee,0xa77df5][i%3]);
}
}
if(currentGame==="arena"){
for(let i=0;i<15;i++){
let a=i*Math.PI*2/15;
box(Math.cos(a)*12,1,Math.sin(a)*12,2,2,2,0xb3a16b);
}
}
if(currentGame==="racing"){
for(let i=0;i<24;i++){
let a=i*Math.PI/12;
let m=box(Math.cos(a)*12,0.1,Math.sin(a)*12,5,.2,2,0x333b4c);
m.rotation.y=-a;
}
}
if(currentGame==="football"){
box(0,0.05,0,35,.1,23,0x42ae59);
box(0,0.12,0,.15,.1,23,0xffffff);
}

for(let i=0;i<12;i++){
let x=(i%4-2)*12;
let z=-Math.floor(i/4)*15-10;
box(x,1,z,.8,2,.8,0x80512f);
box(x,3,z,3,3,3,0x25874c);
}

camera.position.set(0,5,12);
}

function animate(){
if(!running)return;
requestAnimationFrame(animate);

let forward=(keys.w||keys.arrowup?1:0)-
(keys.s||keys.arrowdown?1:0);
let side=(keys.d||keys.arrowright?1:0)-
(keys.a||keys.arrowleft?1:0);

let speed=0.15;
character.position.x+=side*speed;
character.position.z-=forward*speed;

if(forward||side)character.rotation.y=Math.atan2(side,forward);

if(keys[" "]&&!jumping){
velocity=.28;
jumping=true;
}
character.position.y+=velocity;
velocity-=.015;

if(character.position.y<0){
character.position.y=0;
velocity=0;
jumping=false;
}

camera.position.x=character.position.x;
camera.position.y=character.position.y+5;
camera.position.z=character.position.z+9;
camera.lookAt(character.position.x,character.position.y+1,character.position.z);

if(Date.now()-lastSend>70){
lastSend=Date.now();
sendAll({
type:"move",
x:character.position.x,
y:character.position.y,
z:character.position.z,
yaw:character.rotation.y
});
}
renderer.render(scene,camera);
}

document.addEventListener("keydown",e=>{
keys[e.key.toLowerCase()]=true;
});
document.addEventListener("keyup",e=>{
keys[e.key.toLowerCase()]=false;
});

function exitGame(){
running=false;
document.getElementById("play").style.display="none";
if(renderer)renderer.dispose();
scene=null;
players={};
}

window.addEventListener("resize",()=>{
if(camera&&renderer){
camera.aspect=innerWidth/innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(innerWidth,innerHeight);
}
});
</script>
</body>
</html>
