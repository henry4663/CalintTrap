<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arena 3D — Goblox</title>
  <link rel="stylesheet" href="global.css">
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .panel {
      width: min(540px, 100%);
      background: rgba(20, 20, 31, 0.92);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 24px;
      box-shadow: 0 18px 40px rgba(0,0,0,0.45);
      padding: 28px;
      text-align: center;
    }
    h1 {
      font-size: clamp(2rem, 5vw, 3rem);
      margin-bottom: 12px;
      color: #a78bfa;
    }
    p {
      color: #d4d4d8;
      margin-bottom: 24px;
      line-height: 1.6;
    }
    .actions {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .btn {
      width: auto;
      min-width: 180px;
    }
  </style>
</head>
<body>
  <main class="panel">
    <h1>Arena 3D</h1>
    <p>Este modo está em desenvolvimento e já está pronto para receber o próximo mapa 3D. Enquanto isso, você pode voltar ao lobby e continuar sua experiência.</p>
    <div class="actions">
      <a class="btn btn-primary" href="lobby.html">Voltar ao Lobby</a>
      <a class="btn btn-ghost" href="lock.html">Sair</a>
    </div>
  </main>
</body>
</html>
