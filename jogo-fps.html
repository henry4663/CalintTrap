<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Goblox FPS - Forest Arena</title>

<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  overflow: hidden;
  background: #101820;
  font-family: Arial, sans-serif;
  user-select: none;
  touch-action: none;
}
canvas { display: block; }

#hud {
  position: absolute;
  top: 15px;
  left: 15px;
  color: white;
  font-weight: bold;
  font-size: 17px;
  z-index: 10;
  text-shadow: 1px 2px 4px black;
  pointer-events: none;
}
#hud div { margin-bottom: 7px; }

#mira {
  position: absolute;
  top: 50%;
  left: 50%;
  width: 16px;
  height: 16px;
  transform: translate(-50%,-50%);
  border: 2px solid white;
  border-radius: 50%;
  z-index: 10;
  pointer-events: none;
}
#mira::after {
  content: "";
  position: absolute;
  width: 4px;
  height: 4px;
  background: red;
  border-radius: 50%;
  top: 4px;
  left: 4px;
}

#inventario {
  position: absolute;
  bottom: 15px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 7px;
  padding: 7px;
  background: #0009;
  border-radius: 12px;
  z-index: 20;
}
.slot-arma {
  width: 65px;
  height: 60px;
  border: 2px solid #777;
  background: #222d;
  border-radius: 9px;
  color: white;
  font-weight: bold;
  font-size: 12px;
}
.slot-arma.ativo {
  border-color: #ef4444;
  background: #ef444455;
}

#joystickBase {
  display: none;
  position: absolute;
  left: 25px;
  bottom: 30px;
  width: 120px;
  height: 120px;
  border-radius: 50%;
  background: #ffffff22;
  border: 2px solid #ffffff66;
  z-index: 20;
  touch-action: none;
}
#joystickStick {
  position: absolute;
  left: 35px;
  top: 35px;
  width: 50px;
  height: 50px;
  border-radius: 50%;
  background: #ef4444;
  border: 2px solid white;
  pointer-events: none;
}

.mobileButton {
  display: none;
  position: absolute;
  justify-content: center;
  align-items: center;
  border-radius: 50%;
  color: white;
  font-weight: bold;
  border: 2px solid white;
  z-index: 20;
  touch-action: none;
}
#btnAtirar {
  right: 25px;
  bottom: 35px;
  width: 80px;
  height: 80px;
  background: #dc2626;
}
#btnPular {
  right: 40px;
  bottom: 130px;
  width: 60px;
  height: 60px;
  background: #2563eb;
}
#btnVoltar {
  position: absolute;
  right: 15px;
  top: 15px;
  padding: 10px 15px;
  background: #222;
  color: white;
  text-decoration: none;
  border-radius: 8px;
  z-index: 30;
}
#aviso {
  position: absolute;
  top: 100px;
  left: 15px;
  color: white;
  font-size: 12px;
  z-index: 10;
}
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.170.0/build/three.module.js"
  }
}
</script>
</head>

<body>

<div id="hud">
  <div>Kills: <span id="kills">0</span></div>
  <div>Vida: <span id="vida">100</span>%</div>
  <div>Jogadores: <span id="players">1</span></div>
</div>

<div id="aviso">Goblox FPS - Forest Arena</div>
<div id="mira"></div>

<div id="inventario">
  <button class="slot-arma ativo" data-index="0">💥<br>Pistola</button>
  <button class="slot-arma" data-index="1">🎯<br>Rifle</button>
  <button class="slot-arma" data-index="2">⚡<br>SMG</button>
</div>

<div id="joystickBase">
  <div id="joystickStick"></div>
</div>

<button id="btnPular" class="mobileButton">PULAR</button>
<button id="btnAtirar" class="mobileButton">FIRE</button>
<a href="lobby.html" id="btnVoltar">⎋ Sair</a>

<script type="module">
import * as THREE from 'three';
import { db } from './firebase.js';
import {
  ref, set, remove, onValue, onDisconnect
} from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js';
import { criarPersonagem } from './personagem.js';

// CONFIGURAÇÃO
const mobile =
  /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) ||
  window.innerWidth < 768;

if (mobile) {
  document.getElementById('joystickBase').style.display = 'block';
  document.querySelectorAll('.mobileButton').forEach(b => b.style.display = 'flex');
}

// CENA
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87b9d1);
scene.fog = new THREE.FogExp2(0x87b9d1, 0.006);

const camera = new THREE.PerspectiveCamera(
  75, window.innerWidth / window.innerHeight, 0.1, 500
);

const renderer = new THREE.WebGLRenderer({
  antialias: !mobile,
  powerPreference: 'high-performance'
});

renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, mobile ? 1 : 1.5));
renderer.shadowMap.enabled = !mobile;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0xffffff, 0.8));

const dirLight = new THREE.DirectionalLight(0xfff0cc, 1.4);
dirLight.position.set(40, 70, 30);
dirLight.castShadow = !mobile;
scene.add(dirLight);

// MUNDO
const plataformas = [];
const obstaculos = [];

function adicionarBloco(x,y,z,w,h,d,cor,solido=true) {
  const mesh = new THREE.Mesh(
    new THREE.BoxGeometry(w,h,d),
    new THREE.MeshStandardMaterial({color:cor, roughness:0.9})
  );

  mesh.position.set(x,y,z);
  mesh.castShadow = !mobile;
  mesh.receiveShadow = true;
  scene.add(mesh);

  if (solido) {
    obstaculos.push({x,z,rx:w/2,rz:d/2});
  }

  mesh.userData = {
    minX:x-w/2-0.5,
    maxX:x+w/2+0.5,
    minZ:z-d/2-0.5,
    maxZ:z+d/2+0.5,
    topY:y+h/2
  };

  plataformas.push(mesh);
  return mesh;
}

// GRAMA
adicionarBloco(0,0,0,120,2,120,0x376d36,false);

// TERRA
function caminho(x,z,w,d) {
  const mesh = new THREE.Mesh(
    new THREE.PlaneGeometry(w,d),
    new THREE.MeshStandardMaterial({color:0x806044})
  );
  mesh.rotation.x=-Math.PI/2;
  mesh.position.set(x,1.02,z);
  scene.add(mesh);
}

caminho(0,0,8,120);
caminho(0,0,120,8);

// CONSTRUÇÕES
adicionarBloco(-30,3,-30,20,4,4,0x526b80);
adicionarBloco(30,3,30,20,4,4,0x526b80);
adicionarBloco(-30,3,30,4,4,20,0x6366f1);
adicionarBloco(30,3,-30,4,4,20,0x6366f1);
adicionarBloco(0,5,0,16,2,16,0x8b5cf6);

// ÁRVORES
function arvore(x,z,s=1) {
  const grupo = new THREE.Group();

  const tronco = new THREE.Mesh(
    new THREE.CylinderGeometry(.25*s,.4*s,3*s,7),
    new THREE.MeshStandardMaterial({color:0x754322})
  );
  tronco.position.y=1.5*s;
  grupo.add(tronco);

  for(let i=0;i<3;i++) {
    const folhas = new THREE.Mesh(
      new THREE.ConeGeometry((2-i*.3)*s,3*s,7),
      new THREE.MeshStandardMaterial({
        color:[0x176b35,0x228b22,0x2e7d32][i]
      })
    );
    folhas.position.y=(3+i*1.1)*s;
    grupo.add(folhas);
  }

  grupo.position.set(x,1,z);
  grupo.rotation.y=Math.random()*6;
  scene.add(grupo);

  obstaculos.push({x,z,rx:.65*s,rz:.65*s});
}

// PEDRAS
function pedra(x,z,s) {
  const mesh = new THREE.Mesh(
    new THREE.DodecahedronGeometry(s,0),
    new THREE.MeshStandardMaterial({
      color:0x777b7d,
      flatShading:true,
      roughness:1
    })
  );

  mesh.position.set(x,1+s*.45,z);
  mesh.scale.set(1.2,.8,1);
  mesh.rotation.set(Math.random(),Math.random(),Math.random());
  mesh.castShadow=!mobile;
  scene.add(mesh);

  obstaculos.push({x,z,rx:s,rz:s});
}

// ARBUSTOS
function arbusto(x,z) {
  const grupo=new THREE.Group();

  for(let i=0;i<4;i++) {
    const m=new THREE.Mesh(
      new THREE.SphereGeometry(.55,7,6),
      new THREE.MeshStandardMaterial({color:0x267a32})
    );
    m.position.set((Math.random()-.5),.5,(Math.random()-.5));
    grupo.add(m);
  }

  grupo.position.set(x,1,z);
  scene.add(grupo);
}

// DISTRIBUIÇÃO
for(let i=0;i<45;i++) {
  const x=(Math.random()-.5)*108;
  const z=(Math.random()-.5)*108;

  if(Math.abs(x)<15 && Math.abs(z)<15) continue;
  arvore(x,z,.8+Math.random()*.6);
}

for(let i=0;i<35;i++) {
  const x=(Math.random()-.5)*105;
  const z=(Math.random()-.5)*105;

  if(Math.abs(x)<12 && Math.abs(z)<12) continue;
  pedra(x,z,.5+Math.random()*1.2);
}

for(let i=0;i<35;i++) {
  const x=(Math.random()-.5)*105;
  const z=(Math.random()-.5)*105;
  arbusto(x,z);
}

// PEDRAS DECORATIVAS EXTRAS
for(let i=0;i<20;i++) {
  const x=(Math.random()-.5)*100;
  const z=(Math.random()-.5)*100;
  pedra(x,z,.25+Math.random()*.35);
}

// JOGADOR
let playerPos={x:0,y:2.6,z:45};
let velY=0;
let noChao=false;
let vida=100;
let kills=0;

const gravidade=-0.012;
const forcaPulo=.32;
const velocidade=.22;

// FIREBASE
const meuId='player_fps_'+Math.random().toString(36).slice(2,11);
const jogadorRef=ref(db,'fps_tatico/'+meuId);
const todosRef=ref(db,'fps_tatico');

const outrosJogadores={};
const MAX_INATIVIDADE=15000;

function sair() {
  remove(jogadorRef).catch(()=>{});
}

onDisconnect(jogadorRef).remove();
window.addEventListener('pagehide',sair);

set(jogadorRef,{
  x:playerPos.x,
  y:playerPos.y,
  z:playerPos.z,
  vida,
  lastSeen:Date.now()
});

// ARMA
const gunGroup=new THREE.Group();

const materiais=[
  new THREE.MeshStandardMaterial({color:0x333333,metalness:.7}),
  new THREE.MeshStandardMaterial({color:0x4f46e5,metalness:.7}),
  new THREE.MeshStandardMaterial({color:0x10b981,metalness:.7})
];

const gunMesh=new THREE.Mesh(
  new THREE.BoxGeometry(.15,.2,.6),
  materiais[0]
);
gunMesh.position.set(.3,-.25,-.5);
gunGroup.add(gunMesh);
camera.add(gunGroup);
scene.add(camera);

let armaAtual=0;

function selecionarArma(i) {
  armaAtual=i;
  gunMesh.material=materiais[i];

  document.querySelectorAll('.slot-arma').forEach((el,index)=>{
    el.classList.toggle('ativo',index===i);
  });
}

document.querySelectorAll('.slot-arma').forEach(el=>{
  el.addEventListener('click',()=>{
    selecionarArma(Number(el.dataset.index));
  });
});

// BOTS
const bots=[];

function criarBot(x,z) {
  const grupo=new THREE.Group();

  const corpo=new THREE.Mesh(
    new THREE.CapsuleGeometry(.6,1.2,4,8),
    new THREE.MeshStandardMaterial({color:0xef4444})
  );

  corpo.position.y=1.2;
  grupo.add(corpo);
  grupo.position.set(x,1,z);
  scene.add(grupo);

  bots.push({
    mesh:grupo,
    vida:3,
    velocidade:.025
  });
}

criarBot(-35,-35);
criarBot(35,35);
criarBot(-35,35);
criarBot(35,-35);

// MULTIPLAYER
onValue(todosRef,snapshot=>{
  const data=snapshot.val()||{};

  for(const id in data) {
    if(id===meuId) continue;

    const p=data[id];
    if(!p || typeof p.x!=='number') continue;

    if(typeof p.lastSeen==='number' &&
       Date.now()-p.lastSeen>MAX_INATIVIDADE) {
      remove(ref(db,'fps_tatico/'+id)).catch(()=>{});
      continue;
    }

    if(!outrosJogadores[id]) {
      const mesh=criarPersonagem();
      scene.add(mesh);
      outrosJogadores[id]={mesh,vida:p.vida||100};
    }

    outrosJogadores[id].mesh.position.set(p.x,p.y-1.6,p.z);
    outrosJogadores[id].vida=p.vida??100;
  }

  for(const id in outrosJogadores) {
    if(!data[id]) {
      scene.remove(outrosJogadores[id].mesh);
      delete outrosJogadores[id];
    }
  }

  document.getElementById('players').innerText=
    Object.keys(outrosJogadores).length+1;

  if(data[meuId] && typeof data[meuId].vida==='number') {
    vida=data[meuId].vida;
    document.getElementById('vida').innerText=vida;

    if(vida<=0) {
      playerPos={x:0,y:2.6,z:45};
      velY=0;
      vida=100;
      set(jogadorRef,{
        x:playerPos.x,y:playerPos.y,z:playerPos.z,
        vida,lastSeen:Date.now()
      });
    }
  }
});

// TIROS
const projeteis=[];

function atirar() {
  if(armaAtual===2 && Date.now()-ultimoTiro<140) return;
  if(armaAtual===1 && Date.now()-ultimoTiro<350) return;
  if(armaAtual===0 && Date.now()-ultimoTiro<250) return;

  ultimoTiro=Date.now();

  gunGroup.position.z=.08;
  setTimeout(()=>gunGroup.position.z=0,70);

  const bullet=new THREE.Mesh(
    new THREE.SphereGeometry(.13,6,6),
    new THREE.MeshBasicMaterial({
      color:[0xfacc15,0x6366f1,0x10b981][armaAtual]
    })
  );

  const dir=new THREE.Vector3();
  camera.getWorldDirection(dir);

  bullet.position.copy(camera.position).add(dir.clone().multiplyScalar(.8));
  scene.add(bullet);

  projeteis.push({
    mesh:bullet,
    dir,
    vida:100,
    dano:[25,35,20][armaAtual]
  });
}

let ultimoTiro=0;

// CONTROLES
let rotationX=0;
let rotationY=0;

if(!mobile) {
  renderer.domElement.addEventListener('click',()=>{
    if(document.pointerLockElement!==renderer.domElement) {
      renderer.domElement.requestPointerLock();
    }
  });

  document.addEventListener('mousemove',e=>{
    if(document.pointerLockElement===renderer.domElement) {
      rotationY-=e.movementX*.0022;
      rotationX-=e.movementY*.0022;
      rotationX=THREE.MathUtils.clamp(rotationX,-1.3,1.3);
    }
  });
}

const keys={};

window.addEventListener('keydown',e=>{
  keys[e.code]=true;

  if(e.code==='Space' && noChao) {
    velY=forcaPulo;
    noChao=false;
  }

  if(e.code==='Digit1') selecionarArma(0);
  if(e.code==='Digit2') selecionarArma(1);
  if(e.code==='Digit3') selecionarArma(2);

  if(e.code==='Escape') {
    sair();
    window.location.href='lobby.html';
  }
});

window.addEventListener('keyup',e=>keys[e.code]=false);

window.addEventListener('mousedown',e=>{
  if(!mobile && e.button===0 &&
     document.pointerLockElement===renderer.domElement) {
    atirar();
  }
});

// JOYSTICK
const joystickBase=document.getElementById('joystickBase');
const joystickStick=document.getElementById('joystickStick');

let joyX=0,joyY=0;
let joystickTouchId=null;
let cameraTouchId=null;
let lastX=0,lastY=0;

window.addEventListener('touchstart',e=>{
  if(!mobile) return;

  for(const t of e.changedTouches) {
    const el=document.elementFromPoint(t.clientX,t.clientY);

    if(el && el.closest('#btnPular,#btnAtirar,#inventario,#btnVoltar')) continue;

    if(t.clientX<window.innerWidth/2 && joystickTouchId===null) {
      joystickTouchId=t.identifier;
    } else if(t.clientX>=window.innerWidth/2 && cameraTouchId===null) {
      cameraTouchId=t.identifier;
      lastX=t.clientX;
      lastY=t.clientY;
    }
  }
},{passive:false});

window.addEventListener('touchmove',e=>{
  if(!mobile) return;

  for(const t of e.changedTouches) {
    if(t.identifier===joystickTouchId) {
      const rect=joystickBase.getBoundingClientRect();
      let dx=t.clientX-(rect.left+rect.width/2);
      let dy=t.clientY-(rect.top+rect.height/2);

      const distancia=Math.min(50,Math.hypot(dx,dy));
      const angulo=Math.atan2(dy,dx);

      joyX=Math.cos(angulo)*distancia/50;
      joyY=Math.sin(angulo)*distancia/50;

      joystickStick.style.transform=
        `translate(${Math.cos(angulo)*distancia}px,${Math.sin(angulo)*distancia}px)`;
    }

    if(t.identifier===cameraTouchId) {
      rotationY-=(t.clientX-lastX)*.004;
      rotationX-=(t.clientY-lastY)*.004;
      rotationX=THREE.MathUtils.clamp(rotationX,-1.3,1.3);

      lastX=t.clientX;
      lastY=t.clientY;
    }
  }
},{passive:false});

function terminarToque(e) {
  for(const t of e.changedTouches) {
    if(t.identifier===joystickTouchId) {
      joystickTouchId=null;
      joyX=0;
      joyY=0;
      joystickStick.style.transform='translate(0,0)';
    }
    if(t.identifier===cameraTouchId) cameraTouchId=null;
  }
}

window.addEventListener('touchend',terminarToque);
window.addEventListener('touchcancel',terminarToque);

// BOTÕES
document.getElementById('btnPular').addEventListener('pointerdown',e=>{
  e.preventDefault();
  if(noChao) {
    velY=forcaPulo;
    noChao=false;
  }
});

document.getElementById('btnAtirar').addEventListener('pointerdown',e=>{
  e.preventDefault();
  atirar();
});

// COLISÃO
function colidiu(x,z) {
  return obstaculos.some(o=>
    Math.abs(x-o.x)<o.rx+.5 &&
    Math.abs(z-o.z)<o.rz+.5
  );
}

function mover(dx,dz) {
  const nx=playerPos.x+dx;
  const nz=playerPos.z+dz;

  if(Math.abs(nx)<59 && !colidiu(nx,playerPos.z)) {
    playerPos.x=nx;
  }

  if(Math.abs(nz)<59 && !colidiu(playerPos.x,nz)) {
    playerPos.z=nz;
  }
}

// LOOP
let ultimoEnvio=0;

function animate(tempo) {
  requestAnimationFrame(animate);

  camera.rotation.order='YXZ';
  camera.rotation.y=rotationY;
  camera.rotation.x=rotationX;

  const frente=new THREE.Vector3(
    -Math.sin(rotationY),0,-Math.cos(rotationY)
  );

  const lado=new THREE.Vector3(
    Math.cos(rotationY),0,-Math.sin(rotationY)
  );

  let dx=0,dz=0;

  if(keys.KeyW || keys.ArrowUp) { dx+=frente.x; dz+=frente.z; }
  if(keys.KeyS || keys.ArrowDown) { dx-=frente.x; dz-=frente.z; }
  if(keys.KeyA || keys.ArrowLeft) { dx-=lado.x; dz-=lado.z; }
  if(keys.KeyD || keys.ArrowRight) { dx+=lado.x; dz+=lado.z; }

  dx+=frente.x*(-joyY)+lado.x*joyX;
  dz+=frente.z*(-joyY)+lado.z*joyX;

  const comprimento=Math.hypot(dx,dz);

  if(comprimento>0) {
    mover(dx/comprimento*velocidade,dz/comprimento*velocidade);
  }

  velY+=gravidade;
  playerPos.y+=velY;

  let alturaSolo=2;

  for(const plat of plataformas) {
    const b=plat.userData;

    if(playerPos.x>=b.minX && playerPos.x<=b.maxX &&
       playerPos.z>=b.minZ && playerPos.z<=b.maxZ) {
      alturaSolo=Math.max(alturaSolo,b.topY+1.6);
    }
  }

  if(playerPos.y<=alturaSolo) {
    playerPos.y=alturaSolo;
    velY=0;
    noChao=true;
  } else {
    noChao=false;
  }

  if(playerPos.y<-20) {
    playerPos={x:0,y:2.6,z:45};
    velY=0;
    vida=Math.max(0,vida-25);
  }

  camera.position.set(playerPos.x,playerPos.y,playerPos.z);

  // ENVIO MULTIPLAYER
  if(tempo-ultimoEnvio>150) {
    set(jogadorRef,{
      x:Number(playerPos.x.toFixed(2)),
      y:Number(playerPos.y.toFixed(2)),
      z:Number(playerPos.z.toFixed(2)),
      vida,
      lastSeen:Date.now()
    }).catch(()=>{});

    ultimoEnvio=tempo;
  }

  // PROJÉTEIS
  for(let i=projeteis.length-1;i>=0;i--) {
    const p=projeteis[i];

    p.mesh.position.add(p.dir.clone().multiplyScalar(1.2));
    p.vida--;

    let acertou=false;

    // BOTS
    for(let j=bots.length-1;j>=0;j--) {
      const b=bots[j];

      if(p.mesh.position.distanceTo(b.mesh.position)<1.8) {
        b.vida--;
        acertou=true;

        if(b.vida<=0) {
          scene.remove(b.mesh);
          bots.splice(j,1);

          kills++;
          document.getElementById('kills').innerText=kills;

          setTimeout(()=>{
            criarBot(
              (Math.random()-.5)*85,
              (Math.random()-.5)*85
            );
          },2500);
        }
        break;
      }
    }

    // OUTROS JOGADORES
    if(!acertou) {
      for(const id in outrosJogadores) {
        const outro=outrosJogadores[id];

        if(p.mesh.position.distanceTo(outro.mesh.position)<1.8) {
          const novaVida=Math.max(0,outro.vida-p.dano);

          set(ref(db,'fps_tatico/'+id+'/vida'),novaVida).catch(()=>{});

          if(novaVida===0) {
            kills++;
            document.getElementById('kills').innerText=kills;
          }

          acertou=true;
          break;
        }
      }
    }

    if(acertou || p.vida<=0) {
      scene.remove(p.mesh);
      projeteis.splice(i,1);
    }
  }

  // MOVIMENTO DOS BOTS
  for(const bot of bots) {
    const direcao=new THREE.Vector3().subVectors(
      camera.position,bot.mesh.position
    );

    direcao.y=0;

    if(direcao.length()>2) {
      direcao.normalize();
      const nx=bot.mesh.position.x+direcao.x*bot.velocidade;
      const nz=bot.mesh.position.z+direcao.z*bot.velocidade;

      if(!colidiu(nx,nz)) {
        bot.mesh.position.x=nx;
        bot.mesh.position.z=nz;
      }
    }

    bot.mesh.lookAt(camera.position.x,bot.mesh.position.y,camera.position.z);
  }

  renderer.render(scene,camera);
}

requestAnimationFrame(animate);

// SAIR
document.getElementById('btnVoltar').addEventListener('click',e=>{
  e.preventDefault();
  sair();
  window.location.href='lobby.html';
});

// REDIMENSIONAMENTO
window.addEventListener('resize',()=>{
  camera.aspect=window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth,window.innerHeight);
});

</script>
