<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Goblox — FPS Arena Multiplayer</title>
<link rel="stylesheet" href="global.css">
<style>
  body {
    margin: 0;
    overflow: hidden;
    background-color: #050508;
    user-select: none;
    touch-action: none;
    font-family: Arial, sans-serif;
  }
  #hud {
    position: absolute;
    top: 20px;
    left: 20px;
    color: #fff;
    font-size: 1.2rem;
    font-weight: bold;
    z-index: 10;
    text-shadow: 0 2px 4px rgba(0,0,0,0.8);
  }
  #mira {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 12px;
    height: 12px;
    margin-left: -6px;
    margin-top: -6px;
    border: 2px solid rgba(255, 255, 255, 0.8);
    border-radius: 50%;
    pointer-events: none;
    z-index: 10;
  }
  #mira::after {
    content: '';
    position: absolute;
    top: 4px;
    left: 4px;
    width: 4px;
    height: 4px;
    background: #ef4444;
    border-radius: 50%;
  }

  /* BOTÕES MOBILE */
  #joystickBase {
    position: absolute;
    bottom: 40px;
    left: 40px;
    width: 120px;
    height: 120px;
    background: rgba(255, 255, 255, 0.1);
    border: 2px solid rgba(255, 255, 255, 0.3);
    border-radius: 50%;
    z-index: 20;
    display: none;
    touch-action: none;
  }
  #joystickStick {
    position: absolute;
    top: 35px;
    left: 35px;
    width: 50px;
    height: 50px;
    background: radial-gradient(circle, #ef4444 0%, #991b1b 100%);
    border: 2px solid #fca5a5;
    border-radius: 50%;
    pointer-events: none;
    box-shadow: 0 0 15px rgba(239, 68, 68, 0.6);
  }

  #btnAtirar {
    position: absolute;
    bottom: 40px;
    right: 40px;
    width: 85px;
    height: 85px;
    border-radius: 50%;
    background: radial-gradient(circle, #ef4444 0%, #991b1b 100%);
    border: 3px solid #fca5a5;
    color: white;
    font-weight: 900;
    font-size: 1.1rem;
    box-shadow: 0 0 20px rgba(239, 68, 68, 0.6);
    cursor: pointer;
    z-index: 20;
    display: none;
    align-items: center;
    justify-content: center;
  }
  #btnAtirar:active { transform: scale(0.92); }

  #btnPular {
    position: absolute;
    bottom: 140px;
    right: 50px;
    width: 65px;
    height: 65px;
    border-radius: 50%;
    background: radial-gradient(circle, #3b82f6 0%, #1d4ed8 100%);
    border: 2px solid #93c5fd;
    color: white;
    font-weight: 900;
    font-size: 0.9rem;
    cursor: pointer;
    z-index: 20;
    display: none;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 15px rgba(59, 130, 246, 0.6);
  }
  #btnPular:active { transform: scale(0.92); }

  #btnVoltar {
    position: absolute;
    top: 20px;
    right: 20px;
    padding: 10px 18px;
    background: #1e1e2d;
    border: 1px solid rgba(255,255,255,0.2);
    color: #fff;
    border-radius: 10px;
    font-weight: bold;
    cursor: pointer;
    z-index: 20;
    text-decoration: none;
  }
  
  #instrucaoMouse {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: #fff;
    font-size: 1.4rem;
    font-weight: bold;
    background: rgba(0,0,0,0.85);
    padding: 24px 36px;
    border-radius: 16px;
    z-index: 30;
    text-align: center;
    border: 2px solid rgba(239, 68, 68, 0.5);
    box-shadow: 0 0 20px rgba(0,0,0,0.8);
    cursor: pointer;
    display: none;
  }
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  }
}
</script>
</head>
<body>

<div id="hud">
  <div>Kills: <span id="scoreKills" style="color: #4ade80;">0</span></div>
  <div>Vida: <span id="scoreVida" style="color: #ef4444;">100</span>%</div>
</div>

<div id="mira"></div>
<div id="instrucaoMouse">CLICA AQUI PARA JOGAR<br><small style="font-size: 0.9rem; color: #aaa;">Mova o rato • WASD para andar • ESC para sair</small></div>

<!-- CONTROLES MOBILE -->
<div id="joystickBase">
  <div id="joystickStick"></div>
</div>
<button id="btnPular">PULAR</button>
<button id="btnAtirar">🔫</button>

<a href="lobby.html" id="btnVoltar">⎋ Sair</a>

<script type="module">
import * as THREE from 'three';
import { db as database } from './firebase.js';
import { ref, set, remove, onValue, onDisconnect } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
import { criarPersonagem } from './personagem.js';

const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || window.innerWidth < 768;

if (isMobile) {
  document.getElementById('joystickBase').style.display = 'block';
  document.getElementById('btnPular').style.display = 'flex';
  document.getElementById('btnAtirar').style.display = 'flex';
} else {
  document.getElementById('instrucaoMouse').style.display = 'block';
}

// 1. CENA, CÂMERA E RENDERER
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0a14);
scene.fog = new THREE.FogExp2(0x0a0a14, 0.012);

const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

// ILUMINAÇÃO
const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
scene.add(ambientLight);

const dirLight = new THREE.DirectionalLight(0xa855f7, 1.2);
dirLight.position.set(50, 80, 50);
dirLight.castShadow = true;
scene.add(dirLight);

// 2. MAPA E PLATAFORMAS (Movimentação livre sem travar)
const plataformas = [];

function criarPlataforma(x, y, z, w, h, d, cor = 0x1e1e2e) {
  const geo = new THREE.BoxGeometry(w, h, d);
  const mat = new THREE.MeshStandardMaterial({ color: cor, roughness: 0.4 });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.set(x, y, z);
  mesh.receiveShadow = true;
  mesh.castShadow = true;
  scene.add(mesh);
  
  mesh.userData = { minX: x - w/2 - 1, maxX: x + w/2 + 1, minZ: z - d/2 - 1, maxZ: z + d/2 + 1, topY: y + h/2 };
  plataformas.push(mesh);
}

criarPlataforma(0, 0, 0, 100, 2, 100, 0x181824);
criarPlataforma(-35, 5, -35, 25, 2, 25, 0x312e81);
criarPlataforma(35, 5, 35, 25, 2, 25, 0x312e81);
criarPlataforma(-35, 8, 35, 25, 2, 25, 0x4c1d95);
criarPlataforma(35, 8, -35, 25, 2, 25, 0x4c1d95);
criarPlataforma(0, 12, 0, 30, 2, 30, 0x5b21b6);

// 3. MULTIPLAYER COM SISTEMA ANTI-FANTASMA BLINDADO
const meuId = 'player_fps_' + Math.random().toString(36).substr(2, 9);
const jogadorRef = ref(database, 'fps_jogadores/' + meuId);
const todosJogadoresRef = ref(database, 'fps_jogadores');

let playerPos = { x: 0, y: 3, z: 40 };
let velY = 0;
const gravidade = -0.012;
const forcaPulo = 0.32;
let noChao = false;
let kills = 0;
let vida = 100;
const outrosJogadores = {};

function sairDoJogoLimpo() {
  remove(jogadorRef).catch(() => {});
}

onDisconnect(jogadorRef).remove();
window.addEventListener('beforeunload', sairDoJogoLimpo);
window.addEventListener('pagehide', sairDoJogoLimpo);

document.getElementById('btnVoltar').addEventListener('click', (e) => {
  e.preventDefault();
  sairDoJogoLimpo();
  setTimeout(() => { window.location.href = 'lobby.html'; }, 100);
});

set(jogadorRef, { x: playerPos.x, y: playerPos.y, z: playerPos.z, vida: vida });

// ARMA 3D NA CÂMERA
const gunGroup = new THREE.Group();
const gunBody = new THREE.Mesh(
  new THREE.BoxGeometry(0.15, 0.2, 0.7),
  new THREE.MeshStandardMaterial({ color: 0x111111, metalness: 0.8 })
);
gunBody.position.set(0.3, -0.25, -0.5);
const gunBarrel = new THREE.Mesh(
  new THREE.CylinderGeometry(0.04, 0.04, 0.4),
  new THREE.MeshStandardMaterial({ color: 0x333333, metalness: 0.9 })
);
gunBarrel.rotation.x = Math.PI / 2;
gunBarrel.position.set(0.3, -0.2, -0.85);
gunGroup.add(gunBody, gunBarrel);
camera.add(gunGroup);
scene.add(camera);

// BOTS
const bots = [];
function criarBot(x, y, z) {
  const botGroup = new THREE.Group();
  const corpo = new THREE.Mesh(
    new THREE.CapsuleGeometry(0.6, 1.2, 4, 8),
    new THREE.MeshStandardMaterial({ color: 0xef4444 })
  );
  corpo.position.y = 1.2;
  botGroup.add(corpo);
  botGroup.position.set(x, y, z);
  scene.add(botGroup);

  bots.push({ mesh: botGroup, vida: 3, speed: 0.04 });
}
criarBot(-30, 2, -30);
criarBot(30, 2, 30);

// ESCUTA OUTROS JOGADORES (REMOVE FANTASMAS INSTANTANEAMENTE)
onValue(todosJogadoresRef, (snapshot) => {
  const data = snapshot.val() || {};

  for (let id in outrosJogadores) {
    if (!data[id]) {
      scene.remove(outrosJogadores[id].mesh);
      delete outrosJogadores[id];
    }
  }

  for (let id in data) {
    if (id === meuId) continue;
    let pos = data[id];

    if (!outrosJogadores[id]) {
      const meshOutro = criarPersonagem();
      scene.add(meshOutro);
      outrosJogadores[id] = { id: id, mesh: meshOutro, vida: pos.vida || 100 };
    }

    if (pos && typeof pos.x === 'number') {
      outrosJogadores[id].mesh.position.set(pos.x, pos.y, pos.z);
      outrosJogadores[id].vida = pos.vida || 100;
    }
  }
});

// 4. TIROS
const projetes = [];

function atirar() {
  gunGroup.position.z += 0.08;
  setTimeout(() => gunGroup.position.z = 0, 80);

  const bulletGeo = new THREE.SphereGeometry(0.2, 8, 8);
  const bulletMat = new THREE.MeshBasicMaterial({ color: 0xfacc15 });
  const bullet = new THREE.Mesh(bulletGeo, bulletMat);

  const dir = new THREE.Vector3();
  camera.getWorldDirection(dir);

  bullet.position.copy(camera.position).add(dir.clone().multiplyScalar(0.8));
  scene.add(bullet);

  projetes.push({ mesh: bullet, dir: dir, life: 120 });
}

// 5. CONTROLES DE MOUSE E ESC
const instrucaoMouse = document.getElementById('instrucaoMouse');

function solicitarPointerLock() {
  if (!isMobile) {
    document.body.requestPointerLock();
  }
}

instrucaoMouse.addEventListener('click', solicitarPointerLock);
document.body.addEventListener('click', (e) => {
  if (!isMobile && e.target.id !== 'btnVoltar' && document.pointerLockElement !== document.body) {
    solicitarPointerLock();
  }
});

document.addEventListener('pointerlockchange', () => {
  if (!isMobile) {
    if (document.pointerLockElement === document.body) {
      instrucaoMouse.style.display = 'none';
    } else {
      instrucaoMouse.style.display = 'block';
    }
  }
});

let rotationX = 0;
let rotationY = 0;

document.addEventListener('mousemove', (e) => {
  if (!isMobile && document.pointerLockElement === document.body) {
    const sensitivity = 0.0022;
    rotationY -= e.movementX * sensitivity;
    rotationX -= e.movementY * sensitivity;
    rotationX = Math.max(-Math.PI / 2.2, Math.min(Math.PI / 2.2, rotationX));
  }
});

// Joystick Mobile
const joystickBase = document.getElementById('joystickBase');
const joystickStick = document.getElementById('joystickStick');
let joystickAtivo = false;
let joyX = 0, joyY = 0;

joystickBase.addEventListener('touchstart', () => { joystickAtivo = true; });

window.addEventListener('touchmove', (e) => {
  if (!joystickAtivo) return;
  const touch = e.touches[0];
  const rect = joystickBase.getBoundingClientRect();
  const centroX = rect.left + rect.width / 2;
  const centroY = rect.top + rect.height / 2;
  
  let deltaX = touch.clientX - centroX;
  let deltaY = touch.clientY - centroY;
  const distancia = Math.min(50, Math.sqrt(deltaX * deltaX + deltaY * deltaY));
  const angulo = Math.atan2(deltaY, deltaX);

  joyX = Math.cos(angulo) * (distancia / 50);
  joyY = Math.sin(angulo) * (distancia / 50);

  joystickStick.style.transform = `translate(${Math.cos(angulo) * distancia}px, ${Math.sin(angulo) * distancia}px)`;
});

window.addEventListener('touchend', () => {
  joystickAtivo = false;
  joyX = 0;
  joyY = 0;
  joystickStick.style.transform = `translate(0px, 0px)`;
});

// Rotação de câmera por toque na tela (Mobile)
let lastTouchX = 0, lastTouchY = 0;
window.addEventListener('touchstart', (e) => {
  if (isMobile && e.touches[0].target.id !== 'joystickBase' && e.touches[0].target.id !== 'btnAtirar' && e.touches[0].target.id !== 'btnPular') {
    lastTouchX = e.touches[0].clientX;
    lastTouchY = e.touches[0].clientY;
  }
});
window.addEventListener('touchmove', (e) => {
  if (isMobile && e.touches[0].target.id !== 'joystickBase' && e.touches[0].target.id !== 'btnAtirar' && e.touches[0].target.id !== 'btnPular') {
    const deltaX = e.touches[0].clientX - lastTouchX;
    const deltaY = e.touches[0].clientY - lastTouchY;
    rotationY -= deltaX * 0.004;
    rotationX -= deltaY * 0.004;
    rotationX = Math.max(-Math.PI / 2.2, Math.min(Math.PI / 2.2, rotationX));
    lastTouchX = e.touches[0].clientX;
    lastTouchY = e.touches[0].clientY;
  }
});

document.getElementById('btnPular').addEventListener('click', () => {
  if (noChao) {
    velY = forcaPulo;
    noChao = false;
  }
});

document.getElementById('btnAtirar').addEventListener('click', atirar);

window.addEventListener('keydown', (e) => {
  if (e.code === 'Escape') {
    sairDoJogoLimpo();
    if (!isMobile && document.pointerLockElement) document.exitPointerLock();
    setTimeout(() => { window.location.href = 'lobby.html'; }, 100);
  }
  if (e.code === 'Space' && noChao) {
    velY = forcaPulo;
    noChao = false;
  }
});

window.addEventListener('mousedown', (e) => {
  if (!isMobile && document.pointerLockElement === document.body && e.button === 0) {
    atirar();
  }
});

const keys = {};
window.addEventListener('keydown', (e) => keys[e.code] = true);
window.addEventListener('keyup', (e) => keys[e.code] = false);

// 6. LOOP PRINCIPAL
let ultimoEnvio = 0;

function animate(tempo) {
  requestAnimationFrame(animate);

  camera.rotation.order = 'YXZ';
  camera.rotation.y = rotationY;
  camera.rotation.x = rotationX;

  const dirFrente = new THREE.Vector3(-Math.sin(rotationY), 0, -Math.cos(rotationY)).normalize();
  const dirLado = new THREE.Vector3(Math.cos(rotationY), 0, -Math.sin(rotationY)).normalize();
  const vel = 0.22;

  if (keys['KeyW'] || keys['ArrowUp']) { playerPos.x += dirFrente.x * vel; playerPos.z += dirFrente.z * vel; }
  if (keys['KeyS'] || keys['ArrowDown']) { playerPos.x -= dirFrente.x * vel; playerPos.z -= dirFrente.z * vel; }
  if (keys['KeyA'] || keys['ArrowLeft']) { playerPos.x -= dirLado.x * vel; playerPos.z -= dirLado.z * vel; }
  if (keys['KeyD'] || keys['ArrowRight']) { playerPos.x += dirLado.x * vel; playerPos.z += dirLado.z * vel; }

  if (joystickAtivo) {
    playerPos.x += (dirFrente.x * (-joyY) + dirLado.x * joyX) * vel;
    playerPos.z += (dirFrente.z * (-joyY) + dirLado.z * joyX) * vel;
  }

  velY += gravidade;
  playerPos.y += velY;

  let alturaSolo = 2;
  for (let plat of plataformas) {
    const b = plat.userData;
    if (playerPos.x >= b.minX && playerPos.x <= b.maxX && playerPos.z >= b.minZ && playerPos.z <= b.maxZ) {
      if (b.topY + 1.6 > alturaSolo) {
        alturaSolo = b.topY + 1.6;
      }
    }
  }

  if (playerPos.y <= alturaSolo) {
    playerPos.y = alturaSolo;
    velY = 0;
    noChao = true;
  } else {
    noChao = false;
  }

  if (playerPos.y < -20) {
    playerPos = { x: 0, y: 5, z: 0 };
    velY = 0;
    vida = Math.max(0, vida - 20);
    document.getElementById('scoreVida').innerText = vida;
  }

  camera.position.set(playerPos.x, playerPos.y, playerPos.z);

  if (tempo - ultimoEnvio > 50) {
    set(jogadorRef, {
      x: Number(playerPos.x.toFixed(2)),
      y: Number(playerPos.y.toFixed(2)),
      z: Number(playerPos.z.toFixed(2)),
      vida: vida
    }).catch(() => {});
    ultimoEnvio = tempo;
  }

  // ATUALIZAÇÃO DOS TIROS E IMPACTOS
  for (let i = projetes.length - 1; i >= 0; i--) {
    const p = projetes[i];
    p.mesh.position.add(p.dir.clone().multiplyScalar(1.2));
    p.life--;

    let acertou = false;

    for (let j = bots.length - 1; j >= 0; j--) {
      const b = bots[j];
      if (p.mesh.position.distanceTo(b.mesh.position) < 1.8) {
        b.vida--;
        acertou = true;

        if (b.vida <= 0) {
          scene.remove(b.mesh);
          bots.splice(j, 1);
          kills++;
          document.getElementById('scoreKills').innerText = kills;
          setTimeout(() => criarBot((Math.random() - 0.5) * 60, 4, (Math.random() - 0.5) * 60), 2000);
        }
        break;
      }
    }

    if (!acertou) {
      for (let id in outrosJogadores) {
        const outro = outrosJogadores[id];
        if (p.mesh.position.distanceTo(outro.mesh.position) < 1.8) {
          const outroRef = ref(database, 'fps_jogadores/' + id + '/vida');
          set(outroRef, Math.max(0, outro.vida - 25)).catch(() => {});
          kills++;
          document.getElementById('scoreKills').innerText = kills;
          acertou = true;
          break;
        }
      }
    }

    if (acertou || p.life <= 0) {
      scene.remove(p.mesh);
      projetes.splice(i, 1);
    }
  }

  bots.forEach(bot => {
    const dirBot = new THREE.Vector3().subVectors(camera.position, bot.mesh.position);
    dirBot.y = 0;
    dirBot.normalize();
    bot.mesh.position.add(dirBot.multiplyScalar(bot.speed));
    bot.mesh.lookAt(camera.position.x, camera.position.y, camera.position.z);
  });

  renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

animate(0);
</script>
</body>
</html>
