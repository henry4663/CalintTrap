<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Goblox — FPS Tático</title>
<link rel="stylesheet" href="global.css">
<style>
  body {
    margin: 0;
    overflow: hidden;
    background-color: #050508;
    user-select: none;
    touch-action: none;
    font-family: Arial, sans-serif;
  }
  #hud {
    position: absolute;
    top: 20px;
    left: 20px;
    color: #fff;
    font-size: 1.2rem;
    font-weight: bold;
    z-index: 10;
    text-shadow: 0 2px 4px rgba(0,0,0,0.8);
  }
  #mira {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 12px;
    height: 12px;
    margin-left: -6px;
    margin-top: -6px;
    border: 2px solid rgba(255, 255, 255, 0.8);
    border-radius: 50%;
    pointer-events: none;
    z-index: 10;
  }
  #mira::after {
    content: '';
    position: absolute;
    top: 4px;
    left: 4px;
    width: 4px;
    height: 4px;
    background: #ef4444;
    border-radius: 50%;
  }

  /* MINI INVENTÁRIO EMBAIXO */
  #inventario {
    position: absolute;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 12px;
    z-index: 20;
    background: rgba(0, 0, 0, 0.5);
    padding: 10px;
    border-radius: 16px;
    border: 1px solid rgba(255, 255, 255, 0.2);
  }
  .slot-arma {
    width: 65px;
    height: 65px;
    background: rgba(30, 30, 45, 0.8);
    border: 2px solid rgba(255, 255, 255, 0.3);
    border-radius: 12px;
    color: white;
    font-size: 0.8rem;
    font-weight: bold;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.2s;
  }
  .slot-arma.ativo {
    border-color: #ef4444;
    background: rgba(239, 68, 68, 0.3);
    box-shadow: 0 0 15px rgba(239, 68, 68, 0.6);
  }

  /* BOTÕES MOBILE */
  #joystickBase {
    position: absolute;
    bottom: 30px;
    left: 30px;
    width: 120px;
    height: 120px;
    background: rgba(255, 255, 255, 0.1);
    border: 2px solid rgba(255, 255, 255, 0.3);
    border-radius: 50%;
    z-index: 20;
    display: none;
    touch-action: none;
  }
  #joystickStick {
    position: absolute;
    top: 35px;
    left: 35px;
    width: 50px;
    height: 50px;
    background: radial-gradient(circle, #ef4444 0%, #991b1b 100%);
    border: 2px solid #fca5a5;
    border-radius: 50%;
    pointer-events: none;
  }

  #btnAtirar {
    position: absolute;
    bottom: 30px;
    right: 30px;
    width: 80px;
    height: 80px;
    border-radius: 50%;
    background: radial-gradient(circle, #ef4444 0%, #991b1b 100%);
    border: 3px solid #fca5a5;
    color: white;
    font-weight: 900;
    font-size: 1rem;
    box-shadow: 0 0 20px rgba(239, 68, 68, 0.6);
    cursor: pointer;
    z-index: 20;
    display: none;
    align-items: center;
    justify-content: center;
    touch-action: none;
  }
  #btnAtirar:active { transform: scale(0.92); }

  #btnPular {
    position: absolute;
    bottom: 125px;
    right: 40px;
    width: 60px;
    height: 60px;
    border-radius: 50%;
    background: radial-gradient(circle, #3b82f6 0%, #1d4ed8 100%);
    border: 2px solid #93c5fd;
    color: white;
    font-weight: 900;
    font-size: 0.8rem;
    cursor: pointer;
    z-index: 20;
    display: none;
    align-items: center;
    justify-content: center;
    touch-action: none;
  }

  #btnVoltar {
    position: absolute;
    top: 20px;
    right: 20px;
    padding: 10px 18px;
    background: #1e1e2d;
    border: 1px solid rgba(255,255,255,0.2);
    color: #fff;
    border-radius: 10px;
    font-weight: bold;
    cursor: pointer;
    z-index: 20;
    text-decoration: none;
  }
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.170.0/build/three.module.js"
  }
}
</script>
</head>
<body>

<div id="hud">
  <div>Kills: <span id="scoreKills" style="color: #4ade80;">0</span></div>
  <div>Vida: <span id="scoreVida" style="color: #ef4444;">100</span>%</div>
</div>

<div id="mira"></div>

<!-- MINI INVENTÁRIO (Armas) -->
<div id="inventario">
  <div class="slot-arma ativo" data-index="0">🔫<br>Pistola</div>
  <div class="slot-arma" data-index="1">🎯<br>Rifle</div>
  <div class="slot-arma" data-index="2">⚡<br>SMG</div>
</div>

<!-- CONTROLES MOBILE -->
<div id="joystickBase">
  <div id="joystickStick"></div>
</div>
<button id="btnPular">PULAR</button>
<button id="btnAtirar">FIRE</button>

<a href="lobby.html" id="btnVoltar">⎋ Sair</a>

<script type="module">
import * as THREE from 'three';
import { db as database } from './firebase.js';
import { ref, set, remove, onValue, onDisconnect } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
import { criarPersonagem } from './personagem.js';

const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || window.innerWidth < 768;

if (isMobile) {
  document.getElementById('joystickBase').style.display = 'block';
  document.getElementById('btnPular').style.display = 'flex';
  document.getElementById('btnAtirar').style.display = 'flex';
}

// 1. CENA, CÂMERA E RENDERER
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0d0d1a);
scene.fog = new THREE.FogExp2(0x0d0d1a, 0.012);

const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0xffffff, 0.6));
const dirLight = new THREE.DirectionalLight(0xa855f7, 1.2);
dirLight.position.set(40, 70, 40);
dirLight.castShadow = true;
scene.add(dirLight);

// 2. MAPA TÁTICO
const plataformas = [];

function criarBlocoTatico(x, y, z, w, h, d, cor = 0x1e1e2e) {
  const geo = new THREE.BoxGeometry(w, h, d);
  const mat = new THREE.MeshStandardMaterial({ color: cor, roughness: 0.5 });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.set(x, y, z);
  mesh.receiveShadow = true;
  mesh.castShadow = true;
  scene.add(mesh);
  
  mesh.userData = { minX: x - w/2 - 1, maxX: x + w/2 + 1, minZ: z - d/2 - 1, maxZ: z + d/2 + 1, topY: y + h/2 };
  plataformas.push(mesh);
}

criarBlocoTatico(0, 0, 0, 120, 2, 120, 0x14141f);
criarBlocoTatico(-30, 3, -30, 20, 4, 4, 0x3b82f6);
criarBlocoTatico(30, 3, 30, 20, 4, 4, 0x3b82f6);
criarBlocoTatico(-30, 3, 30, 4, 4, 20, 0x6366f1);
criarBlocoTatico(30, 3, -30, 4, 4, 20, 0x6366f1);
criarBlocoTatico(0, 5, 0, 16, 2, 16, 0x8b5cf6);

// 3. MULTIPLAYER E ANTI-FANTASMA
const meuId = 'player_fps_' + Math.random().toString(36).substr(2, 9);
const jogadorRef = ref(database, 'fps_tatico/' + meuId);
const todosJogadoresRef = ref(database, 'fps_tatico');

let playerPos = { x: 0, y: 3, z: 45 };
let velY = 0;
const gravidade = -0.012;
const forcaPulo = 0.32;
let noChao = false;
let kills = 0;
let vida = 100;
const outrosJogadores = {};

function sairDoJogoLimpo() {
  remove(jogadorRef).catch(() => {});
}

onDisconnect(jogadorRef).remove();
window.addEventListener('beforeunload', sairDoJogoLimpo);
window.addEventListener('pagehide', sairDoJogoLimpo);

document.getElementById('btnVoltar').addEventListener('click', (e) => {
  e.preventDefault();
  sairDoJogoLimpo();
  setTimeout(() => { window.location.href = 'lobby.html'; }, 100);
});

set(jogadorRef, { x: playerPos.x, y: playerPos.y, z: playerPos.z, vida: vida });

// ARMA 3D NA CÂMERA
const gunGroup = new THREE.Group();
const materialArmas = [
  new THREE.MeshStandardMaterial({ color: 0x333333, metalness: 0.9 }),
  new THREE.MeshStandardMaterial({ color: 0x4f46e5, metalness: 0.8 }),
  new THREE.MeshStandardMaterial({ color: 0x10b981, metalness: 0.8 })
];

const gunMesh = new THREE.Mesh(
  new THREE.BoxGeometry(0.15, 0.2, 0.6),
  materialArmas[0]
);
gunMesh.position.set(0.3, -0.25, -0.5);
gunGroup.add(gunMesh);
camera.add(gunGroup);
scene.add(camera);

let armaAtual = 0;
function selecionarArma(index) {
  armaAtual = index;
  gunMesh.material = materialArmas[index];
  document.querySelectorAll('.slot-arma').forEach((slot, i) => {
    if (i === index) slot.classList.add('ativo');
    else slot.classList.remove('ativo');
  });
}

document.querySelectorAll('.slot-arma').forEach(slot => {
  slot.addEventListener('click', () => {
    selecionarArma(parseInt(slot.dataset.index));
  });
});

// BOTS TÁTICOS
const bots = [];
function criarBot(x, y, z) {
  const botGroup = new THREE.Group();
  const corpo = new THREE.Mesh(
    new THREE.CapsuleGeometry(0.6, 1.2, 4, 8),
    new THREE.MeshStandardMaterial({ color: 0xef4444 })
  );
  corpo.position.y = 1.2;
  botGroup.add(corpo);
  botGroup.position.set(x, y, z);
  scene.add(botGroup);
  bots.push({ mesh: botGroup, vida: 3, speed: 0.035 });
}
criarBot(-35, 2, -35);
criarBot(35, 2, 35);

// ESCUTA OUTROS JOGADORES
onValue(todosJogadoresRef, (snapshot) => {
  const data = snapshot.val() || {};
  for (let id in outrosJogadores) {
    if (!data[id]) {
      scene.remove(outrosJogadores[id].mesh);
      delete outrosJogadores[id];
    }
  }
  for (let id in data) {
    if (id === meuId) continue;
    let pos = data[id];
    if (!outrosJogadores[id]) {
      const meshOutro = criarPersonagem();
      scene.add(meshOutro);
      outrosJogadores[id] = { id: id, mesh: meshOutro, vida: pos.vida || 100 };
    }
    if (pos && typeof pos.x === 'number') {
      outrosJogadores[id].mesh.position.set(pos.x, pos.y - 1.6, pos.z);
      outrosJogadores[id].vida = pos.vida || 100;
    }
  }
});

// 4. TIROS
const projetes = [];
function atirar() {
  gunGroup.position.z += 0.08;
  setTimeout(() => gunGroup.position.z = 0, 80);

  const bulletGeo = new THREE.SphereGeometry(0.2, 8, 8);
  const bulletMat = new THREE.MeshBasicMaterial({ color: armaAtual === 1 ? 0x6366f1 : (armaAtual === 2 ? 0x10b981 : 0xfacc15) });
  const bullet = new THREE.Mesh(bulletGeo, bulletMat);

  const dir = new THREE.Vector3();
  camera.getWorldDirection(dir);
  bullet.position.copy(camera.position).add(dir.clone().multiplyScalar(0.8));
  scene.add(bullet);

  projetes.push({ mesh: bullet, dir: dir, life: 120, dano: armaAtual === 1 ? 2 : 1 });
}

// 5. CONTROLES MULTI-TOQUE LIVRE PARA MOBILE E MOUSE PARA PC
if (!isMobile) {
  renderer.domElement.addEventListener('click', () => {
    if (document.pointerLockElement !== renderer.domElement) {
      renderer.domElement.requestPointerLock();
    }
  });
}

let rotationX = 0;
let rotationY = 0;

document.addEventListener('mousemove', (e) => {
  if (!isMobile && document.pointerLockElement === renderer.domElement) {
    const sensitivity = 0.0022;
    rotationY -= e.movementX * sensitivity;
    rotationX -= e.movementY * sensitivity;
    rotationX = Math.max(-Math.PI / 2.2, Math.min(Math.PI / 2.2, rotationX));
  }
});

// SISTEMA MULTI-TOQUE PERFEITO (Joystick + Câmera + Botões Independentes)
const joystickBase = document.getElementById('joystickBase');
const joystickStick = document.getElementById('joystickStick');
let joystickTouchId = null;
let cameraTouchId = null;
let joyX = 0, joyY = 0;
let lastTouchX = 0, lastTouchY = 0;

window.addEventListener('touchstart', (e) => {
  if (!isMobile) return;
  for (let i = 0; i < e.changedTouches.length; i++) {
    const touch = e.changedTouches[i];
    const target = document.elementFromPoint(touch.clientX, touch.clientY);
    
    // Ignora se o toque começou em cima de botões ou inventário
    if (target && (target.closest('#btnPular') || target.closest('#btnAtirar') || target.closest('#inventario') || target.closest('#btnVoltar'))) {
      continue;
    }

    // Lado esquerdo da tela controla o Joystick
    if (joystickTouchId === null && touch.clientX < window.innerWidth / 2) {
      joystickTouchId = touch.identifier;
    } 
    // Lado direito da tela controla a Câmera
    else if (cameraTouchId === null && touch.clientX >= window.innerWidth / 2) {
      cameraTouchId = touch.identifier;
      lastTouchX = touch.clientX;
      lastTouchY = touch.clientY;
    }
  }
}, { passive: false });

window.addEventListener('touchmove', (e) => {
  if (!isMobile) return;
  for (let i = 0; i < e.changedTouches.length; i++) {
    const touch = e.changedTouches[i];

    if (touch.identifier === joystickTouchId) {
      const rect = joystickBase.getBoundingClientRect();
      const centroX = rect.left + rect.width / 2;
      const centroY = rect.top + rect.height / 2;
      let deltaX = touch.clientX - centroX;
      let deltaY = touch.clientY - centroY;
      const distancia = Math.min(50, Math.sqrt(deltaX * deltaX + deltaY * deltaY));
      const angulo = Math.atan2(deltaY, deltaX);
      joyX = Math.cos(angulo) * (distancia / 50);
      joyY = Math.sin(angulo) * (distancia / 50);
      joystickStick.style.transform = `translate(${Math.cos(angulo) * distancia}px, ${Math.sin(angulo) * distancia}px)`;
    }

    if (touch.identifier === cameraTouchId) {
      const deltaX = touch.clientX - lastTouchX;
      const deltaY = touch.clientY - lastTouchY;
      rotationY -= deltaX * 0.004;
      rotationX -= deltaY * 0.004;
      rotationX = Math.max(-Math.PI / 2.2, Math.min(Math.PI / 2.2, rotationX));
      lastTouchX = touch.clientX;
      lastTouchY = touch.clientY;
    }
  }
}, { passive: false });

window.addEventListener('touchend', (e) => {
  if (!isMobile) return;
  for (let i = 0; i < e.changedTouches.length; i++) {
    const touch = e.changedTouches[i];
    if (touch.identifier === joystickTouchId) {
      joystickTouchId = null;
      joyX = 0; joyY = 0;
      joystickStick.style.transform = `translate(0px, 0px)`;
    }
    if (touch.identifier === cameraTouchId) {
      cameraTouchId = null;
    }
  }
});

// Botões de Ação com pointerdown para não bloquear o multi-toque
document.getElementById('btnPular').addEventListener('pointerdown', (e) => {
  e.preventDefault();
  if (noChao) { velY = forcaPulo; noChao = false; }
});

document.getElementById('btnAtirar').addEventListener('pointerdown', (e) => {
  e.preventDefault();
  atirar();
});

window.addEventListener('keydown', (e) => {
  if (e.code === 'Escape') {
    sairDoJogoLimpo();
    if (!isMobile && document.pointerLockElement) document.exitPointerLock();
    setTimeout(() => { window.location.href = 'lobby.html'; }, 100);
  }
  if (e.code === 'Space' && noChao) { velY = forcaPulo; noChao = false; }
  if (e.code === 'Digit1') selecionarArma(0);
  if (e.code === 'Digit2') selecionarArma(1);
  if (e.code === 'Digit3') selecionarArma(2);
});

window.addEventListener('mousedown', (e) => {
  if (!isMobile && document.pointerLockElement === renderer.domElement && e.button === 0) {
    atirar();
  }
});

const keys = {};
window.addEventListener('keydown', (e) => keys[e.code] = true);
window.addEventListener('keyup', (e) => keys[e.code] = false);

// 6. LOOP PRINCIPAL
let ultimoEnvio = 0;
function animate(tempo) {
  requestAnimationFrame(animate);

  camera.rotation.order = 'YXZ';
  camera.rotation.y = rotationY;
  camera.rotation.x = rotationX;

  const dirFrente = new THREE.Vector3(-Math.sin(rotationY), 0, -Math.cos(rotationY)).normalize();
  const dirLado = new THREE.Vector3(Math.cos(rotationY), 0, -Math.sin(rotationY)).normalize();
  const vel = 0.22;

  if (keys['KeyW'] || keys['ArrowUp']) { playerPos.x += dirFrente.x * vel; playerPos.z += dirFrente.z * vel; }
  if (keys['KeyS'] || keys['ArrowDown']) { playerPos.x -= dirFrente.x * vel; playerPos.z -= dirFrente.z * vel; }
  if (keys['KeyA'] || keys['ArrowLeft']) { playerPos.x -= dirLado.x * vel; playerPos.z -= dirLado.z * vel; }
  if (keys['KeyD'] || keys['ArrowRight']) { playerPos.x += dirLado.x * vel; playerPos.z += dirLado.z * vel; }

  if (joystickTouchId !== null) {
    playerPos.x += (dirFrente.x * (-joyY) + dirLado.x * joyX) * vel;
    playerPos.z += (dirFrente.z * (-joyY) + dirLado.z * joyX) * vel;
  }

  velY += gravidade;
  playerPos.y += velY;

  let alturaSolo = 2;
  for (let plat of plataformas) {
    const b = plat.userData;
    if (playerPos.x >= b.minX && playerPos.x <= b.maxX && playerPos.z >= b.minZ && playerPos.z <= b.maxZ) {
      if (b.topY + 1.6 > alturaSolo) {
        alturaSolo = b.topY + 1.6;
      }
    }
  }

  if (playerPos.y <= alturaSolo) {
    playerPos.y = alturaSolo;
    velY = 0;
    noChao = true;
  } else {
    noChao = false;
  }

  if (playerPos.y < -20) {
    playerPos = { x: 0, y: 5, z: 0 };
    velY = 0;
    vida = Math.max(0, vida - 20);
    document.getElementById('scoreVida').innerText = vida;
  }

  camera.position.set(playerPos.x, playerPos.y, playerPos.z);

  if (tempo - ultimoEnvio > 50) {
    set(jogadorRef, {
      x: Number(playerPos.x.toFixed(2)),
      y: Number(playerPos.y.toFixed(2)),
      z: Number(playerPos.z.toFixed(2)),
      vida: vida
    }).catch(() => {});
    ultimoEnvio = tempo;
  }

  for (let i = projetes.length - 1; i >= 0; i--) {
    const p = projetes[i];
    p.mesh.position.add(p.dir.clone().multiplyScalar(1.2));
    p.life--;

    let acertou = false;
    for (let j = bots.length - 1; j >= 0; j--) {
      const b = bots[j];
      if (p.mesh.position.distanceTo(b.mesh.position) < 1.8) {
        b.vida -= p.dano;
        acertou = true;
        if (b.vida <= 0) {
          scene.remove(b.mesh);
          bots.splice(j, 1);
          kills++;
          document.getElementById('scoreKills').innerText = kills;
          setTimeout(() => criarBot((Math.random() - 0.5) * 80, 2, (Math.random() - 0.5) * 80), 2000);
        }
        break;
      }
    }

    if (!acertou) {
      for (let id in outrosJogadores) {
        const outro = outrosJogadores[id];
        if (p.mesh.position.distanceTo(outro.mesh.position) < 1.8) {
          const outroRef = ref(database, 'fps_tatico/' + id + '/vida');
          set(outroRef, Math.max(0, outro.vida - (p.dano * 15))).catch(() => {});
          kills++;
          document.getElementById('scoreKills').innerText = kills;
          acertou = true;
          break;
        }
      }
    }

    if (acertou || p.life <= 0) {
      scene.remove(p.mesh);
      projetes.splice(i, 1);
    }
  }

  bots.forEach(bot => {
    const dirBot = new THREE.Vector3().subVectors(camera.position, bot.mesh.position);
    dirBot.y = 0;
    dirBot.normalize();
    bot.mesh.position.add(dirBot.multiplyScalar(bot.speed));
    bot.mesh.lookAt(camera.position.x, camera.position.y, camera.position.z);
  });

  renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

animate(0);
</script>
</body>
</html>
