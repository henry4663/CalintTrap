<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Goblox — Floresta Densa & Carros Quebrados</title>
<link rel="stylesheet" href="global.css">
<style>
:root {
  --ui-bg: rgba(8, 13, 18, .78);
  --ui-border: rgba(255,255,255,.22);
  --ui-text: #fff;
  --ui-accent: #7dff83;
  --danger: #ff5555;
}
* { box-sizing: border-box; }
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #0d1710;
  color: var(--ui-text);
  font-family: Arial, Helvetica, sans-serif;
  touch-action: none;
  user-select: none;
}
canvas {
  display: block;
  width: 100%;
  height: 100%;
}
#game {
  position: fixed;
  inset: 0;
}
#hud {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 5;
}
.panel {
  background: var(--ui-bg);
  border: 1px solid var(--ui-border);
  border-radius: 12px;
  padding: 9px 12px;
  text-shadow: 0 1px 2px #000;
  backdrop-filter: blur(5px);
}
#topLeft {
  position: absolute;
  top: 12px;
  left: 12px;
  min-width: 150px;
}
#healthLabel {
  font-weight: bold;
  margin-bottom: 5px;
}
#healthOuter {
  width: 160px;
  height: 12px;
  border-radius: 10px;
  overflow: hidden;
  background: #333;
  border: 1px solid #aaa;
}
#healthInner {
  height: 100%;
  width: 100%;
  background: #4fe36b;
  transition: width .15s;
}
#ammo {
  position: absolute;
  right: 12px;
  top: 12px;
  font-weight: bold;
  min-width: 105px;
  text-align: center;
}
#status {
  position: absolute;
  top: 65px;
  left: 50%;
  transform: translateX(-50%);
  text-align: center;
  min-width: 150px;
  font-size: 13px;
}
#crosshair {
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  width: 18px;
  height: 18px;
  pointer-events: none;
}
#crosshair::before, #crosshair::after {
  content: "";
  position: absolute;
  background: white;
  box-shadow: 0 0 3px #000;
}
#crosshair::before {
  width: 2px;
  height: 18px;
  left: 8px;
  top: 0;
}
#crosshair::after {
  height: 2px;
  width: 18px;
  top: 8px;
  left: 0;
}
#bottomLeft {
  position: absolute;
  left: 15px;
  bottom: 15px;
  width: 130px;
  height: 130px;
  pointer-events: auto;
}
#stickBase {
  position: absolute;
  left: 0;
  bottom: 0;
  width: 130px;
  height: 130px;
  border-radius: 50%;
  border: 2px solid rgba(255,255,255,.38);
  background: rgba(0,0,0,.22);
}
#stickKnob {
  position: absolute;
  width: 52px;
  height: 52px;
  border-radius: 50%;
  left: 39px;
  top: 39px;
  background: rgba(255,255,255,.48);
  border: 2px solid rgba(255,255,255,.75);
}
#bottomRight {
  position: absolute;
  right: 18px;
  bottom: 20px;
  width: 175px;
  height: 160px;
  pointer-events: auto;
}
.action {
  position: absolute;
  border: 2px solid rgba(255,255,255,.65);
  color: white;
  background: rgba(0,0,0,.4);
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-weight: bold;
  user-select: none;
}
#fireButton {
  width: 76px;
  height: 76px;
  right: 0;
  bottom: 8px;
  background: rgba(170,35,35,.55);
}
#jumpButton {
  width: 58px;
  height: 58px;
  right: 86px;
  bottom: 0;
  background: rgba(59,130,246,.55);
}
#reloadButton {
  width: 48px;
  height: 48px;
  right: 87px;
  bottom: 75px;
  font-size: 11px;
}
#weaponBar {
  position: absolute;
  left: 50%;
  bottom: 12px;
  transform: translateX(-50%);
  display: flex;
  gap: 6px;
  pointer-events: auto;
}
.weapon {
  min-width: 58px;
  padding: 8px 7px;
  border-radius: 9px;
  color: white;
  border: 1px solid #aaa;
  background: rgba(0,0,0,.65);
  font-size: 11px;
  cursor: pointer;
}
.weapon.active {
  border: 2px solid var(--ui-accent);
  background: rgba(28,85,35,.8);
}
#startScreen {
  position: fixed;
  inset: 0;
  z-index: 20;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 12px;
  background: radial-gradient(circle, rgba(15,35,20,.96), rgba(2,6,4,.99));
  text-align: center;
  padding: 20px;
}
#startScreen h1 {
  font-size: clamp(34px, 8vw, 64px);
  margin: 0;
  color: #a4ff9b;
  text-shadow: 0 4px 15px #000;
}
#startScreen p {
  max-width: 560px;
  line-height: 1.5;
  color: #e8f4e8;
}
#startButton, #menuButton {
  border: 0;
  border-radius: 12px;
  padding: 13px 24px;
  background: #63df70;
  color: #09200c;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}
#menuButton {
  position: absolute;
  top: 12px;
  right: 12px;
  pointer-events: auto;
  font-size: 12px;
  padding: 9px 12px;
}
#notice {
  position: fixed;
  z-index: 30;
  bottom: 185px;
  left: 50%;
  transform: translateX(-50%);
  padding: 8px 12px;
  border-radius: 8px;
  background: rgba(0,0,0,.75);
  color: white;
  font-size: 13px;
  pointer-events: none;
  opacity: 0;
  transition: opacity .2s;
}
@media (hover:hover) and (pointer:fine) {
  #bottomLeft, #bottomRight { display: none; }
}
</style>
</head>
<body>
<div id="game"></div>

<div id="hud">
  <div id="topLeft" class="panel">
    <div id="healthLabel">VIDA: 100</div>
    <div id="healthOuter"><div id="healthInner"></div></div>
    <div id="scoreLabel" style="margin-top: 6px; font-size: 12px;">ELIMINAÇÕES: 0</div>
  </div>
  <div id="ammo" class="panel">RIFLE: 30 / 120</div>
  <div id="status" class="panel">Floresta Densa & Carros</div>
  <div id="crosshair"></div>
  <button id="menuButton">MENU</button>
  
  <div id="bottomLeft">
    <div id="stickBase"><div id="stickKnob"></div></div>
  </div>
  <div id="bottomRight">
    <div id="reloadButton" class="action">RECAR</div>
    <div id="jumpButton" class="action">PULAR</div>
    <div id="fireButton" class="action">FIRE</div>
  </div>
  
  <div id="weaponBar">
    <button class="weapon active" data-weapon="rifle">RIFLE</button>
    <button class="weapon" data-weapon="pistol">PISTOLA</button>
    <button class="weapon" data-weapon="shotgun">ESCOPETA</button>
  </div>
</div>

<div id="notice"></div>

<div id="startScreen">
  <h1>GOBLOX</h1>
  <p>FLORESTA DENSA — SOBREVIVÊNCIA & PVP<br>Explore a mata fechada entre árvores detalhadas, pedras gigantes e carros abandonados. Cuidado com os inimigos!</p>
  <button id="startButton">ENTRAR NA FLORESTA</button>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  }
}
</script>

<script type="module">
import * as THREE from "three";
import { db } from "./firebase.js";
import { criarPersonagem } from "./personagem.js";
import {
  ref,
  set,
  remove,
  onValue,
  onDisconnect
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const CONFIG = {
  worldSize: 200,
  playerHeight: 1.7,
  playerRadius: 0.45,
  walkSpeed: 7.2,
  jumpPower: 7.8,
  gravity: 20,
  mouseSensitivity: 0.0022,
  bulletLifetime: 1.8,
  maxHealth: 100
};

const WEAPONS = {
  rifle: { label: "RIFLE", magazine: 30, reserve: 120, damage: 25, delay: 130, reload: 1.45 },
  pistol: { label: "PISTOLA", magazine: 12, reserve: 72, damage: 34, delay: 290, reload: 1.1 },
  shotgun: { label: "ESCOPETA", magazine: 6, reserve: 36, damage: 45, delay: 650, reload: 1.7 }
};

const gameRoot = document.getElementById("game");
const healthLabel = document.getElementById("healthLabel");
const healthInner = document.getElementById("healthInner");
const scoreLabel = document.getElementById("scoreLabel");
const ammoLabel = document.getElementById("ammo");
const startScreen = document.getElementById("startScreen");
const startButton = document.getElementById("startButton");
const menuButton = document.getElementById("menuButton");
const noticeElement = document.getElementById("notice");
const fireButton = document.getElementById("fireButton");
const jumpButton = document.getElementById("jumpButton");
const reloadButton = document.getElementById("reloadButton");
const stickBase = document.getElementById("stickBase");
const stickKnob = document.getElementById("stickKnob");

let noticeTimer = null;
function showNotice(message, duration = 1500) {
  noticeElement.textContent = message;
  noticeElement.style.opacity = "1";
  clearTimeout(noticeTimer);
  noticeTimer = setTimeout(() => { noticeElement.style.opacity = "0"; }, duration);
}

function updateHealthUI() {
  const safeHealth = Math.max(0, Math.min(CONFIG.maxHealth, health));
  healthLabel.textContent = `VIDA: ${Math.round(safeHealth)}`;
  healthInner.style.width = `${safeHealth}%`;
}

function updateAmmoUI() {
  const weapon = WEAPONS[currentWeapon];
  ammoLabel.textContent = `${weapon.label}: ${magazines[currentWeapon]} / ${reserves[currentWeapon]}`;
}

function updateScoreUI() {
  scoreLabel.textContent = `ELIMINAÇÕES: ${kills}`;
}

// CENA E RENDERER
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x6b95a8);
scene.fog = new THREE.FogExp2(0x6b95a8, 0.008);

const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 260);
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
gameRoot.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xd9efff, 0x2b3822, 1.2));
const sun = new THREE.DirectionalLight(0xfff5e6, 1.6);
sun.position.set(-50, 70, 40);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
scene.add(sun);

// MATERIAIS
const materials = {
  grass: new THREE.MeshStandardMaterial({ color: 0x3d6b30, roughness: 0.9 }),
  bark: new THREE.MeshStandardMaterial({ color: 0x543822, roughness: 0.8 }),
  leaf1: new THREE.MeshStandardMaterial({ color: 0x1e4f24, roughness: 0.7 }),
  leaf2: new THREE.MeshStandardMaterial({ color: 0x2d6a34, roughness: 0.7 }),
  rock: new THREE.MeshStandardMaterial({ color: 0x6e736e, roughness: 0.7 }),
  carBody: new THREE.MeshStandardMaterial({ color: 0x992b2b, metalness: 0.7, roughness: 0.3 }),
  carRust: new THREE.MeshStandardMaterial({ color: 0x5e3322, roughness: 0.9 }),
  glass: new THREE.MeshStandardMaterial({ color: 0x112233, transparent: true, opacity: 0.6, roughness: 0.1 })
};

// CHÃO DA FLORESTA DENSA
const ground = new THREE.Mesh(new THREE.PlaneGeometry(CONFIG.worldSize, CONFIG.worldSize), materials.grass);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

const solidObstacles = [];

// 1. MODELO DE ÁRVORE DETALHADA (COMPLEXA)
function criarArvore(x, z) {
  const treeGroup = new THREE.Group();
  treeGroup.position.set(x, 0, z);

  // Tronco Principal
  const trunkHeight = 4.5 + Math.random() * 2;
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.55, trunkHeight, 7), materials.bark);
  trunk.position.y = trunkHeight / 2;
  trunk.castShadow = true;
  trunk.receiveShadow = true;
  treeGroup.add(trunk);

  // Galhos / Camadas de Folhagem volumosas
  const layers = 3;
  for (let i = 0; i < layers; i++) {
    const radius = 2.2 - i * 0.45;
    const height = 2.0;
    const crown = new THREE.Mesh(
      new THREE.ConeGeometry(radius, height, 6),
      Math.random() > 0.5 ? materials.leaf1 : materials.leaf2
    );
    crown.position.y = (trunkHeight * 0.6) + (i * 1.3);
    crown.castShadow = true;
    crown.receiveShadow = true;
    treeGroup.add(crown);
  }

  scene.add(treeGroup);
  solidObstacles.push({ x, z, radius: 0.7 });
}

// 2. MODELO DE PEDRA / ROCHA GIGANTE
function criarPedra(x, z) {
  const scale = 1.2 + Math.random() * 2.2;
  const rockMesh = new THREE.Mesh(
    new THREE.DodecahedronGeometry(scale, 1),
    materials.rock
  );
  rockMesh.position.set(x, scale * 0.5, z);
  rockMesh.rotation.set(Math.random(), Math.random(), Math.random());
  rockMesh.castShadow = true;
  rockMesh.receiveShadow = true;
  scene.add(rockMesh);

  solidObstacles.push({ x, z, radius: scale * 0.8 });
}

// 3. MODELO DE CARRO QUEBRADO / ABANDONADO
function criarCarroQuebrado(x, z, rotacaoY = 0) {
  const carGroup = new THREE.Group();
  carGroup.position.set(x, 0, z);
  carGroup.rotation.y = rotacaoY;

  // Chassi / Corpo do Carro
  const body = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.9, 4.2), materials.carBody);
  body.position.y = 0.6;
  body.castShadow = true;
  body.receiveShadow = true;
  carGroup.add(body);

  // Teto amassado / cabine
  const cabin = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.7, 2.2), materials.carRust);
  cabin.position.set(0, 1.25, -0.2);
  cabin.castShadow = true;
  carGroup.add(cabin);

  // Vidros quebrados (frente)
  const windshield = new THREE.Mesh(new THREE.BoxGeometry(1.7, 0.6, 0.1), materials.glass);
  windshield.position.set(0, 1.2, 0.9);
  windshield.rotation.x = -0.3;
  carGroup.add(windshield);

  // Rodas destruídas
  const wheelGeo = new THREE.CylinderGeometry(0.4, 0.4, 0.3, 10);
  wheelGeo.rotateZ(Math.PI / 2);
  const posRodas = [
    [-1.1, 0.4, 1.4], [1.1, 0.4, 1.4],
    [-1.1, 0.4, -1.4], [1.1, 0.4, -1.4]
  ];
  posRodas.forEach(p => {
    const wheel = new THREE.Mesh(wheelGeo, materials.carRust);
    wheel.position.set(...p);
    carGroup.add(wheel);
  });

  scene.add(carGroup);
  solidObstacles.push({ x, z, radius: 2.1 });
}

// DISTRIBUIR ELEMENTOS PELO MAPA (FLORESTA MUITO DENSA)
for (let i = 0; i < 75; i++) {
  const x = (Math.random() - 0.5) * (CONFIG.worldSize - 25);
  const z = (Math.random() - 0.5) * (CONFIG.worldSize - 25);
  if (Math.abs(x) < 7 && Math.abs(z) < 7) continue;
  criarArvore(x, z);
}

for (let i = 0; i < 35; i++) {
  const x = (Math.random() - 0.5) * (CONFIG.worldSize - 20);
  const z = (Math.random() - 0.5) * (CONFIG.worldSize - 20);
  if (Math.abs(x) < 7 && Math.abs(z) < 7) continue;
  criarPedra(x, z);
}

// Espalhar carros abandonados estratégicos
criarCarroQuebrado(-15, -20, 0.5);
criarCarroQuebrado(22, 18, -1.2);
criarCarroQuebrado(-28, 30, 2.1);
criarCarroQuebrado(35, -25, 0.8);

// ESTADOS DO JOGADOR & MULTIPLAYER
let gameStarted = false;
let health = CONFIG.maxHealth;
let kills = 0;
let currentWeapon = "rifle";
let isReloading = false;
let lastShotTime = 0;
let playerVelocityY = 0;
let isGrounded = false;
let playerYaw = 0;
let playerPitch = 0;
const playerId = "player_" + Math.random().toString(36).slice(2, 11);
const meuNick = localStorage.getItem("goblox_player_nick") || "Sobrevivente";

const magazines = { rifle: 30, pistol: 12, shotgun: 6 };
const reserves = { rifle: 120, pistol: 72, shotgun: 36 };
const bullets = [];
const remotePlayers = new Map();

function selectWeapon(name) {
  if (!WEAPONS[name]) return;
  currentWeapon = name;
  document.querySelectorAll(".weapon").forEach(button => {
    button.classList.toggle("active", button.dataset.weapon === name);
  });
  updateAmmoUI();
  showNotice(`Arma: ${WEAPONS[name].label}`);
}

document.querySelectorAll(".weapon").forEach(button => {
  button.addEventListener("click", () => selectWeapon(button.dataset.weapon));
});

// FIREBASE MULTIPLAYER SYNC
const playerRef = ref(db, `forest_players/${playerId}`);
const allPlayersRef = ref(db, "forest_players");
onDisconnect(playerRef).remove();

onValue(allPlayersRef, (snapshot) => {
  const data = snapshot.val() || {};

  if (data[playerId] && typeof data[playerId].vida === "number") {
    health = data[playerId].vida;
    updateHealthUI();
    if (health <= 0) {
      camera.position.set(0, CONFIG.playerHeight, 20);
      health = CONFIG.maxHealth;
      updateHealthUI();
      showNotice("Você foi eliminado!");
      set(playerRef, { x: camera.position.x, y: camera.position.y, z: camera.position.z, vida: health, nome: meuNick });
    }
  }

  for (let id of remotePlayers.keys()) {
    if (!data[id]) {
      scene.remove(remotePlayers.get(id));
      remotePlayers.delete(id);
    }
  }

  for (let id in data) {
    if (id === playerId) continue;
    let pos = data[id];
    if (!remotePlayers.has(id)) {
      const remoteChar = criarPersonagem(pos.nome || "Outro Jogador");
      scene.add(remoteChar);
      remotePlayers.set(id, remoteChar);
    }
    const char = remotePlayers.get(id);
    char.position.set(pos.x, pos.y - 1.6, pos.z);
  }
});

// CONTROLES E INPUTS
const keys = {};
window.addEventListener("keydown", (e) => {
  keys[e.code] = true;
  if (e.code === "Digit1") selectWeapon("rifle");
  if (e.code === "Digit2") selectWeapon("pistol");
  if (e.code === "Digit3") selectWeapon("shotgun");
  if (e.code === "KeyR") recarregarArma();
});
window.addEventListener("keyup", (e) => { keys[e.code] = false; });

window.addEventListener("mousemove", (e) => {
  if (!gameStarted || document.pointerLockElement !== renderer.domElement) return;
  playerYaw -= e.movementX * CONFIG.mouseSensitivity;
  playerPitch -= e.movementY * CONFIG.mouseSensitivity;
  playerPitch = Math.max(-Math.PI / 2.2, Math.min(Math.PI / 2.2, playerPitch));
});

renderer.domElement.addEventListener("click", () => {
  if (gameStarted && document.pointerLockElement !== renderer.domElement) {
    renderer.domElement.requestPointerLock();
  }
});

// MULTI-TOQUE MOBILE LIVRE
let joystickTouchId = null;
let cameraTouchId = null;
let joyX = 0, joyY = 0;
let lastTouchX = 0, lastTouchY = 0;

window.addEventListener("touchstart", (e) => {
  if (!gameStarted) return;
  for (let i = 0; i < e.changedTouches.length; i++) {
    const touch = e.changedTouches[i];
    const target = document.elementFromPoint(touch.clientX, touch.clientY);
    
    if (target && (target.closest("#bottomRight") || target.closest("#weaponBar") || target.closest("#menuButton"))) {
      continue;
    }

    if (joystickTouchId === null && touch.clientX < window.innerWidth / 2) {
      joystickTouchId = touch.identifier;
    } else if (cameraTouchId === null && touch.clientX >= window.innerWidth / 2) {
      cameraTouchId = touch.identifier;
      lastTouchX = touch.clientX;
      lastTouchY = touch.clientY;
    }
  }
}, { passive: false });

window.addEventListener("touchmove", (e) => {
  if (!gameStarted) return;
  for (let i = 0; i < e.changedTouches.length; i++) {
    const touch = e.changedTouches[i];

    if (touch.identifier === joystickTouchId) {
      const rect = stickBase.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height / 2;
      let dx = touch.clientX - cx;
      let dy = touch.clientY - cy;
      const dist = Math.min(50, Math.hypot(dx, dy));
      const angle = Math.atan2(dy, dx);
      joyX = Math.cos(angle) * (dist / 50);
      joyY = Math.sin(angle) * (dist / 50);
      stickKnob.style.transform = `translate(${Math.cos(angle)*dist}px, ${Math.sin(angle)*dist}px)`;
    }

    if (touch.identifier === cameraTouchId) {
      const deltaX = touch.clientX - lastTouchX;
      const deltaY = touch.clientY - lastTouchY;
      playerYaw -= deltaX * 0.004;
      playerPitch -= deltaY * 0.004;
      playerPitch = Math.max(-Math.PI / 2.2, Math.min(Math.PI / 2.2, playerPitch));
      lastTouchX = touch.clientX;
      lastTouchY = touch.clientY;
    }
  }
}, { passive: false });

window.addEventListener("touchend", (e) => {
  for (let i = 0; i < e.changedTouches.length; i++) {
    const touch = e.changedTouches[i];
    if (touch.identifier === joystickTouchId) {
      joystickTouchId = null;
      joyX = 0; joyY = 0;
      stickKnob.style.transform = "translate(0px, 0px)";
    }
    if (touch.identifier === cameraTouchId) {
      cameraTouchId = null;
    }
  }
});

function shoot() {
  if (!gameStarted || isReloading) return;
  const now = performance.now();
  const weapon = WEAPONS[currentWeapon];
  if (now - lastShotTime < weapon.delay) return;

  if (magazines[currentWeapon] <= 0) {
    showNotice("Sem munição! Recarregue.");
    return;
  }

  magazines[currentWeapon]--;
  updateAmmoUI();
  lastShotTime = now;

  const bulletMesh = new THREE.Mesh(
    new THREE.SphereGeometry(0.15, 6, 6),
    new THREE.MeshBasicMaterial({ color: 0xffea00 })
  );
  bulletMesh.position.copy(camera.position);
  scene.add(bulletMesh);

  const dir = new THREE.Vector3();
  camera.getWorldDirection(dir);
  bullets.push({ mesh: bulletMesh, dir: dir, life: CONFIG.bulletLifetime, damage: weapon.damage });
}

function recarregarArma() {
  if (isReloading) return;
  isReloading = true;
  showNotice("Recarregando...");
  setTimeout(() => {
    magazines[currentWeapon] = WEAPONS[currentWeapon].magazine;
    updateAmmoUI();
    isReloading = false;
    showNotice("Pronto!");
  }, WEAPONS[currentWeapon].reload * 1000);
}

fireButton.addEventListener("pointerdown", (e) => { e.preventDefault(); shoot(); });
jumpButton.addEventListener("pointerdown", (e) => {
  e.preventDefault();
  if (isGrounded) { playerVelocityY = CONFIG.jumpPower; isGrounded = false; }
});
reloadButton.addEventListener("pointerdown", (e) => { e.preventDefault(); recarregarArma(); });

window.addEventListener("mousedown", (e) => {
  if (gameStarted && document.pointerLockElement === renderer.domElement && e.button === 0) {
    shoot();
  }
});

// INICIALIZAÇÃO
startButton.addEventListener("click", () => {
  startScreen.style.display = "none";
  gameStarted = true;
  renderer.domElement.requestPointerLock();
  updateHealthUI();
  updateAmmoUI();
  updateScoreUI();
});

menuButton.addEventListener("click", () => {
  startScreen.style.display = "flex";
  gameStarted = false;
  if (document.exitPointerLock) document.exitPointerLock();
});

const clock = new THREE.Clock();
camera.position.set(0, CONFIG.playerHeight, 20);

function animate() {
  requestAnimationFrame(animate);
  if (!gameStarted) return;

  const dt = Math.min(clock.getDelta(), 0.1);

  const moveDir = new THREE.Vector3();
  if (keys["KeyW"] || keys["ArrowUp"]) moveDir.z -= 1;
  if (keys["KeyS"] || keys["ArrowDown"]) moveDir.z += 1;
  if (keys["KeyA"] || keys["ArrowLeft"]) moveDir.x -= 1;
  if (keys["KeyD"] || keys["ArrowRight"]) moveDir.x += 1;

  if (joystickTouchId !== null) {
    moveDir.x += joyX;
    moveDir.z += joyY;
  }

  moveDir.normalize();
  moveDir.applyAxisAngle(new THREE.Vector3(0, 1, 0), playerYaw);

  let nextX = camera.position.x + moveDir.x * CONFIG.walkSpeed * dt;
  let nextZ = camera.position.z + moveDir.z * CONFIG.walkSpeed * dt;

  // COLISÃO COM OS OBSTÁCULOS (ÁRVORES, PEDRAS E CARROS)
  let collided = false;
  for (let obs of solidObstacles) {
    const dist = Math.hypot(nextX - obs.x, nextZ - obs.z);
    if (dist < CONFIG.playerRadius + obs.radius) {
      collided = true;
      break;
    }
  }

  if (!collided) {
    camera.position.x = nextX;
    camera.position.z = nextZ;
  }

  playerVelocityY -= CONFIG.gravity * dt;
  camera.position.y += playerVelocityY * dt;

  if (camera.position.y <= CONFIG.playerHeight) {
    camera.position.y = CONFIG.playerHeight;
    playerVelocityY = 0;
    isGrounded = true;
  }

  camera.rotation.order = "YXZ";
  camera.rotation.y = playerYaw;
  camera.rotation.x = playerPitch;

  // ATUALIZAR PROJÉTEIS & COLISÃO PVP
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    b.mesh.position.addScaledVector(b.dir, 40 * dt);
    b.life -= dt;

    let acertou = false;
    for (let [id, char] of remotePlayers.entries()) {
      if (b.mesh.position.distanceTo(char.position) < 1.8) {
        const targetRef = ref(db, `forest_players/${id}/vida`);
        onValue(targetRef, (snap) => {
          let vidaAtual = snap.val() ?? CONFIG.maxHealth;
          set(targetRef, Math.max(0, vidaAtual - b.damage));
        }, { onlyOnce: true });

        kills++;
        updateScoreUI();
        acertou = true;
        break;
      }
    }

    if (acertou || b.life <= 0) {
      scene.remove(b.mesh);
      bullets.splice(i, 1);
    }
  }

  // ENVIAR DADOS PARA O FIREBASE
  if (Math.random() < 0.25) {
    set(playerRef, {
      x: Number(camera.position.x.toFixed(2)),
      y: Number(camera.position.y.toFixed(2)),
      z: Number(camera.position.z.toFixed(2)),
      vida: health,
      nome: meuNick
    }).catch(() => {});
  }

  renderer.render(scene, camera);
}

window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

animate();
</script>
</body>
</html>
