<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>FUT-ONLINE 2D</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { touch-action: none; user-select: none; }
  </style>
</head>
<body class="bg-slate-950 text-white font-sans min-h-screen flex flex-col items-center justify-center p-2 overflow-hidden">

  <!-- Placar Superior -->
  <header class="w-full max-w-5xl bg-slate-900 border border-slate-800 rounded-xl px-4 py-2 mb-3 flex items-center justify-between shadow-lg">
    <div class="flex items-center space-x-3">
      <div class="bg-emerald-600 p-2 rounded-lg text-white font-bold">⚽</div>
      <div>
        <h1 class="font-extrabold text-base text-emerald-400">FUT-ONLINE 2D</h1>
        <div class="flex items-center space-x-1.5 text-xs text-slate-300">
          <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
          <span>Firebase Conectado</span>
        </div>
      </div>
    </div>
    <button onclick="navigator.clipboard.writeText(window.location.href); alert('Link da sala copiado!');" class="bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold px-3 py-2 rounded-lg shadow transition">
      🔗 Convidar
    </button>
  </header>

  <!-- Container do Jogo -->
  <div class="w-full max-w-5xl grid grid-cols-1 lg:grid-cols-4 gap-3 items-start">
    <div class="lg:col-span-3 relative w-full aspect-[16/9] bg-emerald-700 rounded-xl shadow-2xl border-4 border-slate-800 overflow-hidden">
      <canvas id="gameCanvas" class="w-full h-full block"></canvas>
      
      <!-- Joystick Analógico -->
      <div id="joystickZone" class="absolute bottom-4 left-4 w-28 h-28 bg-white/15 backdrop-blur-sm rounded-full border border-white/30 flex items-center justify-center touch-none z-20">
        <div id="joystickKnob" class="w-10 h-10 bg-white/80 rounded-full shadow-md transition-transform duration-75"></div>
      </div>
    </div>

    <!-- Painel Lateral -->
    <div class="lg:col-span-1 flex flex-col space-y-3">
      <div class="bg-slate-900 border border-slate-800 rounded-xl p-3 shadow">
        <div class="flex items-center justify-between mb-2">
          <span class="text-xs font-bold text-slate-300">👥 JOGADORES</span>
          <span id="playerCount" class="text-xs bg-slate-800 text-slate-400 px-2 py-0.5 rounded font-mono">1/6</span>
        </div>
        <div class="bg-slate-950 border border-slate-800 rounded-lg p-2 flex items-center justify-between">
          <span id="myNameDisplay" class="text-xs font-medium text-white">Você</span>
          <span id="myTeamBadge" class="text-[10px] font-bold text-blue-400">AZUL</span>
        </div>
      </div>

      <div class="bg-slate-900 border border-slate-800 rounded-xl p-3 shadow">
        <div class="text-xs font-bold text-slate-300 mb-2">🎮 CONTROLES</div>
        <button onclick="toggleTeam()" class="w-full bg-slate-800 hover:bg-slate-700 text-emerald-400 font-bold text-xs py-2 rounded border border-slate-700 transition">
          Trocar de Time
        </button>
      </div>
    </div>
  </div>

  <!-- Script Firebase & Jogo -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, setDoc, onSnapshot, collection, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // COLE AS SUAS CONFIGURAÇÕES DO FIREBASE AQUI
    const firebaseConfig = {
      apiKey: "SUA_API_KEY",
      authDomain: "seu-projeto.firebaseapp.com",
      projectId: "seu-projeto-id",
      storageBucket: "seu-projeto.appspot.com",
      messagingSenderId: "SEU_SENDER_ID",
      appId: "SEU_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const playerId = 'Player_' + Math.floor(Math.random() * 900 + 100);
    const roomId = 'sala_principal';
    let myTeam = 'AZUL';

    document.getElementById('myNameDisplay').innerText = playerId;

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    canvas.width = 800;
    canvas.height = 450;

    const player = {
      x: Math.random() * 400 + 200,
      y: Math.random() * 200 + 100,
      radius: 14,
      speed: 4.5
    };

    const inputState = { vx: 0, vy: 0 };
    let remotePlayers = {};

    // Referência do jogador no Firestore
    const playerRef = doc(db, 'rooms', roomId, 'players', playerId);

    async function syncPosition() {
      try {
        await setDoc(playerRef, {
          x: player.x,
          y: player.y,
          team: myTeam,
          lastActive: Date.now()
        }, { merge: true });
      } catch (e) {
        console.error("Erro ao sincronizar dados:", e);
      }
    }

    function listenPlayers() {
      const playersCol = collection(db, 'rooms', roomId, 'players');
      onSnapshot(playersCol, (snapshot) => {
        remotePlayers = {};
        let count = 0;
        snapshot.forEach((docSnap) => {
          count++;
          if (docSnap.id !== playerId) {
            remotePlayers[docSnap.id] = docSnap.data();
          }
        });
        document.getElementById('playerCount').innerText = `${count}/6`;
      });
    }

    listenPlayers();
    setInterval(syncPosition, 45);

    window.addEventListener('beforeunload', () => {
      deleteDoc(playerRef);
    });

    // Joystick Analógico
    const joystickZone = document.getElementById('joystickZone');
    const joystickKnob = document.getElementById('joystickKnob');
    let joystickActive = false;
    let joystickTouchId = null;
    let originX = 0, originY = 0;
    const maxRadius = 36;

    function handleJoystickStart(e) {
      const touch = e.changedTouches ? e.changedTouches[0] : e;
      joystickActive = true;
      joystickTouchId = touch.identifier ?? 'mouse';
      const rect = joystickZone.getBoundingClientRect();
      originX = rect.left + rect.width / 2;
      originY = rect.top + rect.height / 2;
      updateJoystick(touch);
    }

    function handleJoystickMove(e) {
      if (!joystickActive) return;
      let touch = null;
      if (e.changedTouches) {
        for (let i = 0; i < e.changedTouches.length; i++) {
          if (e.changedTouches[i].identifier === joystickTouchId) { touch = e.changedTouches[i]; break; }
        }
      } else { touch = e; }
      if (touch) updateJoystick(touch);
    }

    function handleJoystickEnd() {
      joystickActive = false;
      joystickTouchId = null;
      joystickKnob.style.transform = `translate(0px, 0px)`;
      inputState.vx = 0; inputState.vy = 0;
    }

    function updateJoystick(touch) {
      const dx = touch.clientX - originX;
      const dy = touch.clientY - originY;
      const dist = Math.hypot(dx, dy);
      const angle = Math.atan2(dy, dx);
      const clampedDist = Math.min(dist, maxRadius);
      const knobX = Math.cos(angle) * clampedDist;
      const knobY = Math.sin(angle) * clampedDist;
      joystickKnob.style.transform = `translate(${knobX}px, ${knobY}px)`;
      inputState.vx = knobX / maxRadius;
      inputState.vy = knobY / maxRadius;
    }

    joystickZone.addEventListener('touchstart', handleJoystickStart, { passive: false });
    window.addEventListener('touchmove', handleJoystickMove, { passive: false });
    window.addEventListener('touchend', handleJoystickEnd, { passive: false });
    joystickZone.addEventListener('mousedown', handleJoystickStart);
    window.addEventListener('mousemove', handleJoystickMove);
    window.addEventListener('mouseup', handleJoystickEnd);

    const keys = {};
    window.addEventListener('keydown', (e) => { keys[e.key.toLowerCase()] = true; });
    window.addEventListener('keyup', (e) => { keys[e.key.toLowerCase()] = false; });

    window.toggleTeam = function() {
      myTeam = myTeam === 'AZUL' ? 'VERMELHO' : 'AZUL';
      const badge = document.getElementById('myTeamBadge');
      badge.innerText = myTeam;
      badge.className = `text-[10px] font-bold ${myTeam === 'AZUL' ? 'text-blue-400' : 'text-red-400'}`;
    }

    // Loop do Jogo
    function gameLoop() {
      let moveX = inputState.vx;
      let moveY = inputState.vy;

      if (moveX === 0 && moveY === 0) {
        if (keys['a'] || keys['arrowleft']) moveX = -1;
        if (keys['d'] || keys['arrowright']) moveX = 1;
        if (keys['w'] || keys['arrowup']) moveY = -1;
        if (keys['s'] || keys['arrowdown']) moveY = 1;
      }

      player.x += moveX * player.speed;
      player.y += moveY * player.speed;

      const border = 25;
      player.x = Math.max(border + player.radius, Math.min(canvas.width - border - player.radius, player.x));
      player.y = Math.max(border + player.radius, Math.min(canvas.height - border - player.radius, player.y));

      // Desenhar Campo
      ctx.fillStyle = '#047857';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.strokeStyle = "rgba(255, 255, 255, 0.7)";
      ctx.lineWidth = 2;
      ctx.strokeRect(border, border, canvas.width - (border * 2), canvas.height - (border * 2));
      ctx.beginPath();
      ctx.moveTo(canvas.width / 2, border);
      ctx.lineTo(canvas.width / 2, canvas.height - border);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(canvas.width / 2, canvas.height / 2, 55, 0, Math.PI * 2);
      ctx.stroke();

      // Renderizar Outros Jogadores
      for (let id in remotePlayers) {
        let p = remotePlayers[id];
        ctx.beginPath();
        ctx.arc(p.x, p.y, 14, 0, Math.PI * 2);
        ctx.fillStyle = p.team === 'AZUL' ? '#3b82f6' : '#ef4444';
        ctx.fill();
        ctx.lineWidth = 2;
        ctx.strokeStyle = '#ffffff';
        ctx.stroke();

        ctx.fillStyle = '#ffffff';
        ctx.font = '10px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(id, p.x, p.y - 18);
      }

      // Renderizar Jogador Local
      ctx.beginPath();
      ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
      ctx.fillStyle = myTeam === 'AZUL' ? '#3b82f6' : '#ef4444';
      ctx.fill();
      ctx.lineWidth = 2;
      ctx.strokeStyle = '#ffffff';
      ctx.stroke();

      ctx.fillStyle = '#ffffff';
      ctx.font = '10px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(playerId + ' (Você)', player.x, player.y - player.radius - 4);

      requestAnimationFrame(gameLoop);
    }

    gameLoop();
  </script>
</body>
</html>
