<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Goblox Futebol</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07111f;color:#fff;font-family:Arial,sans-serif;touch-action:none}
body{display:flex;flex-direction:column;align-items:center;padding:10px;gap:10px}
header{width:min(1100px,100%);display:flex;align-items:center;justify-content:space-between;gap:10px;background:#101d30;border:1px solid #263b58;border-radius:14px;padding:10px 14px}
h1{font-size:18px;margin:0;color:#7cf5b2}#status{font-size:12px;color:#a9bed4;margin-top:4px}
button{border:0;border-radius:10px;padding:10px 13px;background:#263b58;color:white;font-weight:700;cursor:pointer}
button:active{transform:scale(.97)}#layout{width:min(1100px,100%);display:grid;grid-template-columns:minmax(0,1fr) 190px;gap:10px;min-height:0;flex:1}
#gameWrap{position:relative;min-height:260px;max-height:calc(100vh - 100px);align-self:center;width:100%;aspect-ratio:16/9;background:#087b48;border:4px solid #263b58;border-radius:14px;overflow:hidden}
canvas{display:block;width:100%;height:100%}
#side{display:flex;flex-direction:column;gap:10px}
.panel{background:#101d30;border:1px solid #263b58;border-radius:12px;padding:12px}
.panel h2{font-size:12px;color:#a9bed4;margin:0 0 10px}
.score{font-size:28px;font-weight:900;text-align:center}.blue{color:#60a5fa}.red{color:#fb7185}
#players{font-size:12px;line-height:1.8;max-height:180px;overflow:auto}
#joystick{position:absolute;left:14px;bottom:14px;width:104px;height:104px;border:2px solid #ffffff66;background:#ffffff22;border-radius:50%;display:none;align-items:center;justify-content:center;z-index:3;touch-action:none}
#knob{width:42px;height:42px;border-radius:50%;background:#ffffffcc;box-shadow:0 2px 8px #0008}
#shoot{position:absolute;right:18px;bottom:22px;width:78px;height:78px;border-radius:50%;background:#f59e0b;color:#241300;border:3px solid #fff9;display:none;z-index:3}
#hint{font-size:11px;color:#9fb3c8;line-height:1.5}
@media(max-width:760px){body{padding:6px;gap:6px}header{padding:8px 10px}h1{font-size:15px}#layout{display:flex;flex-direction:column;gap:6px}#gameWrap{min-height:0;max-height:none;flex:none;width:100%;aspect-ratio:16/9}#side{display:grid;grid-template-columns:1fr 1fr;gap:6px}.panel{padding:8px}.panel h2{margin-bottom:4px}.score{font-size:20px}#players{max-height:56px}#joystick,#shoot{display:flex}#hint{display:none}}
</style>
</head>
<body>
<header>
 <div><h1>⚽ GOBLOX FUTEBOL</h1><div id="status">Conectando à partida...</div></div>
 <div style="display:flex;gap:7px"><button id="teamBtn">Trocar time</button><button id="exitBtn">Sair</button></div>
</header>
<div id="layout">
 <div id="gameWrap">
  <canvas id="game" width="960" height="540"></canvas>
  <div id="joystick"><div id="knob"></div></div>
  <button id="shoot">CHUTAR</button>
 </div>
 <aside id="side">
  <section class="panel"><h2>PLACAR</h2><div class="score"><span class="blue" id="blueScore">0</span> <span style="color:#8294aa">×</span> <span class="red" id="redScore">0</span></div><div style="display:flex;justify-content:space-between;font-size:10px"><span class="blue">AZUL</span><span class="red">VERMELHO</span></div></section>
  <section class="panel"><h2>JOGADORES NA SALA</h2><div id="players">Carregando...</div></section>
  <section class="panel" id="hint">PC: WASD ou setas para andar. Espaço para chutar. Celular: use o controle e o botão CHUTAR. Encoste na bola para conduzi-la.</section>
</aside>
</div>
<script type="module">
import { db, ref, set, onValue, remove } from "./firebase.js";
import { getCurrentNick } from "./authLocal.js";

const $ = id => document.getElementById(id);
const canvas = $("game"), ctx = canvas.getContext("2d");
const room = "goblox_futebol_v2";
const nick = getCurrentNick() || "Jogador";
const playerId = (crypto.randomUUID ? crypto.randomUUID() : "p"+Math.random().toString(36).slice(2));
const playersRef = ref(db, "games/"+room+"/players");
const myRef = ref(db, "games/"+room+"/players/"+playerId);
const ballRef = ref(db, "games/"+room+"/ball");
const scoreRef = ref(db, "games/"+room+"/score");
let team = Math.random() < .5 ? "AZUL" : "VERMELHO";
let players = {};
let ball = {x:480,y:270,vx:0,vy:0};
let score = {blue:0,red:0};
let keys = {}, move = {x:0,y:0}, facing = {x:1,y:0};
let lastPublish=0,lastBallPublish=0,lastShot=0,goalLock=0,host=false,alive=true;
const me={x:team==="AZUL"?220:740,y:270,r:17,speed:230};
$("status").textContent = "Entrando na sala...";
$("teamBtn").onclick=async()=>{team=team==="AZUL"?"VERMELHO":"AZUL";await publishPlayer();};
$("exitBtn").onclick=()=>{location.href="lobby.html";};
function publishPlayer(){return set(myRef,{nick:String(nick).slice(0,24),team,x:me.x,y:me.y,active:true,updatedAt:Date.now()});}
onValue(playersRef,snap=>{
 players={};snap.forEach(child=>{const p=child.val();if(p&&p.active&&Date.now()-(p.updatedAt||0)<20000)players[child.key]=p;});
 const ids=Object.keys(players).sort();host=ids.length>0&&ids[0]===playerId;
 $("players").innerHTML=ids.map(id=>{const p=players[id];return '<div><span style="color:'+(p.team==="AZUL"?'#60a5fa':'#fb7185')+'">●</span> '+escapeHtml(p.nick||"Jogador")+(id===playerId?' (você)':'')+'</div>';}).join("")||"Você está sozinho";
 $("status").textContent=host?"Partida online • você mantém a bola":"Partida online • sala "+ids.length+"/12";
});
onValue(ballRef,snap=>{if(snap.exists()&&!host){const b=snap.val();if(Number.isFinite(b.x)&&Number.isFinite(b.y)){ball.x=b.x;ball.y=b.y;ball.vx=b.vx||0;ball.vy=b.vy||0;}}});
onValue(scoreRef,snap=>{if(snap.exists()){score=snap.val();$("blueScore").textContent=score.blue||0;$("redScore").textContent=score.red||0;}});
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
window.addEventListener("keydown",e=>{keys[e.key.toLowerCase()]=true;if([" ","arrowup","arrowdown","arrowleft","arrowright"].includes(e.key.toLowerCase()))e.preventDefault();if(e.code==="Space")shoot();});
window.addEventListener("keyup",e=>keys[e.key.toLowerCase()]=false);
function shoot(){const now=performance.now();if(now-lastShot<380)return;lastShot=now;const d=Math.hypot(ball.x-me.x,ball.y-me.y);if(d<66){let dx=ball.x-me.x,dy=ball.y-me.y,l=Math.hypot(dx,dy)||1;if(l<10){dx=facing.x;dy=facing.y;l=Math.hypot(dx,dy)||1;}ball.vx=dx/l*570;ball.vy=dy/l*570;if(host)publishBall();}}
$("shoot").addEventListener("pointerdown",e=>{e.preventDefault();shoot();});
const joy=$("joystick"),knob=$("knob");let joyPointer=null;
joy.addEventListener("pointerdown",e=>{joyPointer=e.pointerId;joy.setPointerCapture(joyPointer);joyMove(e);});
joy.addEventListener("pointermove",e=>{if(e.pointerId===joyPointer)joyMove(e);});
function joyMove(e){const r=joy.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),d=Math.hypot(dx,dy),m=32,x=d?dx/d*Math.min(d,m):0,y=d?dy/d*Math.min(d,m):0;knob.style.transform='translate('+x+'px,'+y+'px)';move.x=x/m;move.y=y/m;}
function joyEnd(){joyPointer=null;move={x:0,y:0};knob.style.transform="translate(0,0)";}
joy.addEventListener("pointerup",joyEnd);joy.addEventListener("pointercancel",joyEnd);
async function publishBall(){try{await set(ballRef,{x:ball.x,y:ball.y,vx:ball.vx,vy:ball.vy,at:Date.now()});}catch(e){console.warn("Falha ao sincronizar bola",e);}}
function draw(){
 ctx.clearRect(0,0,960,540);ctx.fillStyle="#087b48";ctx.fillRect(0,0,960,540);
 ctx.strokeStyle="#eafff0";ctx.lineWidth=4;ctx.strokeRect(28,25,904,490);ctx.beginPath();ctx.moveTo(480,25);ctx.lineTo(480,515);ctx.stroke();ctx.beginPath();ctx.arc(480,270,75,0,Math.PI*2);ctx.stroke();
 ctx.strokeRect(28,175,105,190);ctx.strokeRect(827,175,105,190);
 ctx.fillStyle="#d1fae5";ctx.fillRect(0,218,29,104);ctx.fillRect(931,218,29,104);
 for(const [id,p] of Object.entries(players)){if(id===playerId)continue;drawPlayer(p.x,p.y,p.team,p.nick);}
 drawPlayer(me.x,me.y,team,nick+" (Você)");
 ctx.beginPath();ctx.arc(ball.x,ball.y,11,0,Math.PI*2);ctx.fillStyle="#fff";ctx.fill();ctx.strokeStyle="#172033";ctx.lineWidth=2;ctx.stroke();ctx.beginPath();ctx.arc(ball.x,ball.y,4,0,Math.PI*2);ctx.fillStyle="#111827";ctx.fill();
}
function drawPlayer(x,y,t,n){ctx.beginPath();ctx.arc(x,y,17,0,Math.PI*2);ctx.fillStyle=t==="AZUL"?"#3b82f6":"#ef4444";ctx.fill();ctx.lineWidth=3;ctx.strokeStyle="#fff";ctx.stroke();ctx.fillStyle="#fff";ctx.font="12px Arial";ctx.textAlign="center";ctx.fillText(String(n||"Jogador").slice(0,16),x,y-24);}
function frame(now){
 if(!alive)return;const dt=Math.min((now-(frame.last||now))/1000,.035);frame.last=now;
 let x=move.x,y=move.y;
 if(keys.a||keys.arrowleft)x-=1;if(keys.d||keys.arrowright)x+=1;if(keys.w||keys.arrowup)y-=1;if(keys.s||keys.arrowdown)y+=1;
 const len=Math.hypot(x,y);if(len>1){x/=len;y/=len;}
 if(x||y){facing={x,y};}
 me.x=clamp(me.x+x*me.speed*dt,48,912);me.y=clamp(me.y+y*me.speed*dt,48,492);
 if(host){
  ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;
  const friction=Math.pow(.985,dt*60);ball.vx*=friction;ball.vy*=friction;
  if(ball.y<38||ball.y>502){ball.y=clamp(ball.y,38,502);ball.vy*=-.72;}
  if(ball.x<38||ball.x>922){
   if(ball.y>210&&ball.y<330&&now>goalLock){const scored=ball.x<38?"red":"blue";score[scored]=(score[scored]||0)+1;set(scoreRef,score);goalLock=now+1300;ball={x:480,y:270,vx:0,vy:0};}
   else {ball.x=clamp(ball.x,38,922);ball.vx*=-.72;}
  }
  const dx=ball.x-me.x,dy=ball.y-me.y,d=Math.hypot(dx,dy),min=28;
  if(d<min){const nx=dx/(d||1),ny=dy/(d||1);ball.x=me.x+nx*min;ball.y=me.y+ny*min;ball.vx+=nx*95;ball.vy+=ny*95;}
  for(const p of Object.values(players)){const px=ball.x-p.x,py=ball.y-p.y,pd=Math.hypot(px,py);if(pd<28){const nx=px/(pd||1),ny=py/(pd||1);ball.x=p.x+nx*28;ball.y=p.y+ny*28;ball.vx+=nx*45;ball.vy+=ny*45;}}
  if(now-lastBallPublish>95){lastBallPublish=now;publishBall();}
 }
 if(now-lastPublish>130){lastPublish=now;publishPlayer().catch(e=>{$("status").textContent="Erro de conexão. Verifique as regras do Firebase.";console.warn(e);});}
 draw();requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.addEventListener("pagehide",()=>{alive=false;remove(myRef).catch(()=>{});});
publishPlayer().catch(e=>{$("status").textContent="Não conectou ao Firebase. Confira as regras do Realtime Database.";console.error(e);});
</script>
</body>
</html>
