<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catálogo Zx - Goblox</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#090b14;color:#f7f7ff;font-family:Arial,sans-serif}.top{height:70px;padding:0 5%;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #ffffff18;background:#101321;position:sticky;top:0;z-index:5}.brand{font-size:25px;font-weight:900;letter-spacing:3px;color:#a78bfa;text-decoration:none}.wallet{background:#292044;border:1px solid #8b5cf6;color:#e9ddff;padding:10px 16px;border-radius:12px;font-weight:900}.layout{width:min(1250px,94%);margin:30px auto;display:grid;grid-template-columns:310px 1fr;gap:22px}.panel,.shop{background:#141a2a;border:1px solid #ffffff18;border-radius:18px;padding:22px}.preview{min-height:290px;border-radius:16px;background:linear-gradient(135deg,#5124a8,#172554);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center;transition:.2s}.avatar{width:112px;height:112px;border-radius:50%;object-fit:cover;border:6px solid #c4b5fd;background:#202943}.preview-name{font-size:24px;font-weight:900;margin:13px 0 4px}.preview-user{font-size:13px;color:#d1d5db}.section-title{font-size:24px;font-weight:900;margin:0 0 6px}.muted{color:#9ca3af;font-size:13px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}.tab{border:1px solid #39415e;background:#1b2337;color:#dbe4ff;border-radius:9px;padding:10px 13px;font-weight:800;cursor:pointer}.tab.active{background:#7045d8;border-color:#a78bfa;color:white}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:13px}.item{background:#0d1322;border:1px solid #303951;border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:9px;min-height:190px}.swatch{height:75px;border-radius:10px;border:1px solid #ffffff22;display:flex;align-items:center;justify-content:center;font-size:25px;font-weight:900}.item h3{margin:0;font-size:15px}.price{color:#facc15;font-size:13px;font-weight:900}.action{margin-top:auto;border:0;border-radius:9px;padding:10px;background:#7045d8;color:white;font-weight:900;cursor:pointer}.action:disabled{opacity:.55;cursor:not-allowed}.action.equipped{background:#166534}.message{min-height:22px;color:#86efac;font-size:13px;margin-top:12px}.back{color:#c4b5fd;text-decoration:none;font-weight:800}@media(max-width:800px){.layout{grid-template-columns:1fr}.top{padding:0 3%}.panel{order:0}.shop{order:1}}
</style>
</head>
<body>
<header class="top"><a class="brand" href="lobby.html">GOBLOX</a><a class="back" href="lobby.html">Voltar ao lobby</a><div class="wallet">◈ <span id="zx-balance">Carregando...</span> Zx</div></header>
<main class="layout">
<aside class="panel">
<h1 class="section-title">Seu perfil</h1><p class="muted">Veja como suas personalizações ficam.</p>
<div id="preview" class="preview" style="margin-top:16px"><img id="preview-avatar" class="avatar" src="" alt="Avatar"><div id="preview-name" class="preview-name">Jogador</div><div id="preview-user" class="preview-user">@jogador</div></div>
<p id="status" class="message" role="status"></p>
</aside>
<section class="shop">
<h2 class="section-title">Catálogo Goblox</h2><p class="muted">Compre e equipe personalizações usando Zx. Seus itens ficam salvos na sua conta.</p>
<div class="tabs" id="tabs">
<button class="tab active" data-category="photos">Fotos personalizadas</button><button class="tab" data-category="themes">Temas</button><button class="tab" data-category="frames">Molduras</button><button class="tab" data-category="names">Cores de nome</button>
</div>
<div class="grid" id="items"></div>
</section>
</main>
<script type="module">
import { db, ref, get, set } from "./firebase.js";
import { getCurrentNick } from "./authLocal.js";
const nick=getCurrentNick();
const $=id=>document.getElementById(id);
if(!nick){location.href="index.html";}
const key=encodeURIComponent(String(nick||"").trim().toLowerCase()).replace(/\./g,"%2E");
const catalog=[\n{id:"photo_crown",category:"photos",name:"Coroa Roxa",price:50,kind:"photo",value:"https://api.dicebear.com/9.x/adventurer/svg?seed=PurpleCrown&backgroundColor=b6e3f4",paint:"linear-gradient(135deg,#641baf,#101a48)",symbol:"★"},\n{id:"photo_cat",category:"photos",name:"Gato Style",price:50,kind:"photo",value:"https://api.dicebear.com/9.x/fun-emoji/svg?seed=CoolCat&backgroundColor=c0aede",paint:"#30204c",symbol:"🐱"},\n{id:"photo_galaxy",category:"photos",name:"Galáxia",price:75,kind:"photo",value:"https://api.dicebear.com/9.x/shapes/svg?seed=Galaxy&backgroundColor=6842c2",paint:"linear-gradient(135deg,#3b0764,#1e1b4b)",symbol:"✦"},\n{id:"photo_robot",category:"photos",name:"Robô Goblox",price:50,kind:"photo",value:"https://api.dicebear.com/9.x/bottts/svg?seed=GobloxBot&backgroundColor=c0aede",paint:"#312e81",symbol:"◈"},\n{id:"photo_fire",category:"photos",name:"Chamas",price:75,kind:"photo",value:"https://api.dicebear.com/9.x/adventurer/svg?seed=FirePlayer&backgroundColor=ffdfbf",paint:"linear-gradient(135deg,#9a3412,#7f1d1d)",symbol:"♨"},\n{id:"photo_cyber",category:"photos",name:"Cyber",price:75,kind:"photo",value:"https://api.dicebear.com/9.x/bottts/svg?seed=CyberPlayer&backgroundColor=b6e3f4",paint:"#172554",symbol:"⌁"},\n{id:"photo_shadow",category:"photos",name:"Sombrio",price:75,kind:"photo",value:"https://api.dicebear.com/9.x/adventurer/svg?seed=ShadowPlayer&backgroundColor=333333",paint:"#111827",symbol:"◉"},\n{id:"photo_smile",category:"photos",name:"Neon Smile",price:50,kind:"photo",value:"https://api.dicebear.com/9.x/fun-emoji/svg?seed=NeonSmile&backgroundColor=d1d4f9",paint:"#4c1d95",symbol:"☻"},
{id:"theme_neon",category:"themes",name:"Neon Roxo",price:180,kind:"theme",value:"neon",paint:"linear-gradient(135deg,#641baf,#101a48)",symbol:"✦"},
{id:"theme_ocean",category:"themes",name:"Oceano",price:160,kind:"theme",value:"ocean",paint:"linear-gradient(135deg,#075985,#0e7490)",symbol:"〰"},
{id:"theme_fire",category:"themes",name:"Chamas",price:220,kind:"theme",value:"fire",paint:"linear-gradient(135deg,#9a3412,#7f1d1d)",symbol:"♨"},
{id:"theme_nature",category:"themes",name:"Natureza",price:150,kind:"theme",value:"nature",paint:"linear-gradient(135deg,#166534,#365314)",symbol:"❖"},
{id:"frame_purple",category:"frames",name:"Moldura Roxa",price:90,kind:"frame",value:"#a78bfa",paint:"linear-gradient(135deg,#7c3aed,#c4b5fd)",symbol:"◯"},
{id:"frame_gold",category:"frames",name:"Moldura Dourada",price:140,kind:"frame",value:"#fbbf24",paint:"linear-gradient(135deg,#92400e,#facc15)",symbol:"◯"},
{id:"frame_cyan",category:"frames",name:"Moldura Ciano",price:110,kind:"frame",value:"#22d3ee",paint:"linear-gradient(135deg,#0e7490,#67e8f9)",symbol:"◯"},
{id:"frame_red",category:"frames",name:"Moldura Rubi",price:130,kind:"frame",value:"#fb7185",paint:"linear-gradient(135deg,#9f1239,#fda4af)",symbol:"◯"},
{id:"name_white",category:"names",name:"Branco",price:0,kind:"name",value:"#ffffff",paint:"#e5e7eb",symbol:"Aa"},
{id:"name_purple",category:"names",name:"Roxo",price:70,kind:"name",value:"#c4b5fd",paint:"#7c3aed",symbol:"Aa"},
{id:"name_cyan",category:"names",name:"Ciano",price:85,kind:"name",value:"#67e8f9",paint:"#0891b2",symbol:"Aa"},
{id:"name_gold",category:"names",name:"Dourado",price:100,kind:"name",value:"#fcd34d",paint:"#b45309",symbol:"Aa"}
];
let profile={};let balance=0;let owned=["name_white"];let equipped={theme:"theme_neon",frame:"frame_purple",name:"name_white"};let category="photos";
function say(t,error=false){$("status").textContent=t;$("status").style.color=error?"#fda4af":"#86efac";}
function itemById(id){return catalog.find(x=>x.id===id);}
function renderPreview(){
 const theme=itemById(equipped.theme)||catalog.find(x=>x.kind==="theme"),frame=itemById(equipped.frame)||catalog.find(x=>x.kind==="frame"),name=itemById(equipped.name)||catalog.find(x=>x.kind==="name");
 $("preview").style.background=theme.paint;
 $("preview-avatar").src=profile.avatarUrl||"https://api.dicebear.com/9.x/bottts/svg?seed="+encodeURIComponent(nick);
 $("preview-avatar").style.borderColor=frame.value;
 $("preview-name").style.color=name.value;
 $("preview-name").textContent=profile.displayName||nick;
 $("preview-user").textContent="@"+nick;
}
function renderItems(){
 const root=$("items");root.replaceChildren();
 catalog.filter(x=>x.category===category).forEach(item=>{
  const card=document.createElement("article");card.className="item";
  const swatch=document.createElement("div");swatch.className="swatch";swatch.style.background=item.paint;if(item.kind==="photo"){const image=document.createElement("img");image.src=item.value;image.alt=item.name;image.style.cssText="width:100%;height:100%;object-fit:cover;border-radius:9px";swatch.appendChild(image);}else{swatch.textContent=item.symbol;}
  const title=document.createElement("h3");title.textContent=item.name;
  const price=document.createElement("div");price.className="price";price.textContent=item.price===0?"Grátis":item.price+" Zx";
  const btn=document.createElement("button");btn.className="action";
  const isOwned=owned.includes(item.id);const isEquipped=Object.values(equipped).includes(item.id);
  btn.textContent=isEquipped?"EQUIPADO":isOwned?"EQUIPAR":item.price===0?"OBTER GRÁTIS":"COMPRAR";
  btn.classList.toggle("equipped",isEquipped);
  btn.onclick=()=>choose(item);
  card.append(swatch,title,price,btn);root.append(card);
 });
}
async function persist(){
 await set(ref(db,"profiles/"+key),{...profile,zxBalance:balance,catalogOwned:owned,catalogEquipped:equipped,updatedAt:Date.now()});
 $("zx-balance").textContent=balance.toLocaleString("pt-BR");
}
async function choose(item){
 const ownedAlready=owned.includes(item.id);
 if(!ownedAlready&&balance<item.price){say("Você não tem Zx suficientes para comprar este item.",true);return;}
 try{
  if(!ownedAlready){balance-=item.price;owned.push(item.id);}
  equipped[item.kind]=item.id;
  if(item.kind==="photo") profile.avatarUrl=item.value;
  await persist();renderPreview();renderItems();say(ownedAlready?"Personalização equipada!":"Compra realizada e item equipado!");
 }catch(e){console.error(e);say("Não foi possível salvar no Firebase. Verifique as regras do banco.",true);}
}
$("tabs").addEventListener("click",e=>{
 const btn=e.target.closest("button[data-category]");if(!btn)return;
 category=btn.dataset.category;document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("active",x===btn));renderItems();
});
async function init(){
 try{
  const snap=await get(ref(db,"profiles/"+key));profile=snap.exists()?snap.val():{};
  balance=Number.isFinite(Number(profile.zxBalance))?Math.max(0,Number(profile.zxBalance)):0;
  owned=Array.isArray(profile.catalogOwned)?profile.catalogOwned:["name_white"];
  equipped={theme:"theme_neon",frame:"frame_purple",name:"name_white",...(profile.catalogEquipped||{})};
  $("zx-balance").textContent=balance.toLocaleString("pt-BR");renderPreview();renderItems();
  if(!profile.zxBalance){await persist();}
 }catch(e){console.error(e);$("zx-balance").textContent="—";say("Erro ao carregar sua carteira Zx. Confira a conexão com Firebase.",true);}
}
init();
</script>
</body>
</html>
