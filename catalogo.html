<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Goblox - Editor de Avatar</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-gray-100 font-sans text-gray-800 flex flex-col min-h-screen">

  <!-- HEADER -->
  <header class="bg-white border-b border-gray-200 sticky top-0 z-30 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between gap-4">
      <a href="index.html" class="flex items-center gap-2 text-gray-600 hover:text-gray-900 font-bold text-sm">
        <i data-lucide="arrow-left" class="w-5 h-5"></i> Voltar ao Início
      </a>
      <h1 class="text-xl font-black text-red-600 uppercase">Loja & Avatar</h1>
      <div class="flex items-center gap-1.5 bg-yellow-100 text-yellow-800 px-3 py-1 rounded-full text-sm font-semibold border border-yellow-300">
        <i data-lucide="coins" class="w-4 h-4 text-yellow-600"></i>
        <span id="saldoMoedas">1.250</span>
      </div>
    </div>
  </header>

  <!-- CONTEÚDO PRINCIPAL -->
  <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8 grid grid-cols-1 lg:grid-cols-3 gap-8">
    
    <!-- PAINEL VISUALIZADOR DO AVATAR -->
    <div class="bg-white p-6 rounded-2xl shadow-md border border-gray-200 flex flex-col items-center justify-center text-center">
      <h2 class="text-xl font-bold mb-4 text-gray-900">Seu Avatar Atual</h2>
      
      <!-- Visualização do Avatar -->
      <div class="relative w-48 h-48 bg-gradient-to-b from-gray-100 to-gray-200 rounded-2xl border-4 border-red-500 flex items-center justify-center overflow-hidden shadow-inner mb-6">
        <img id="avatar-preview" class="w-40 h-40 object-contain drop-shadow-md" src="" alt="Preview do Avatar">
      </div>

      <p id="avatar-desc" class="text-sm font-medium text-gray-500 mb-6">Estilo selecionado</p>
      
      <button id="btn-salvar" class="w-full bg-green-500 hover:bg-green-600 text-white font-extrabold py-3 rounded-xl shadow-md transition flex items-center justify-center gap-2">
        <i data-lucide="check-circle" class="w-5 h-5"></i> SALVAR ESTILO
      </button>
    </div>

    <!-- CATÁLOGO DE ITENS DA LOJA -->
    <div class="lg:col-span-2 bg-white p-6 rounded-2xl shadow-md border border-gray-200">
      <h2 class="text-xl font-bold mb-4 text-gray-900 flex items-center gap-2">
        <i data-lucide="shopping-bag" class="w-5 h-5 text-red-600"></i> Catálogo de Estilos & Acessórios
      </h2>

      <!-- Grid de Itens -->
      <div id="items-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4">
        <!-- Inserido dinamicamente via JS -->
      </div>
    </div>

  </main>

  <script type="module">
    import { getCurrentNick } from "./authLocal.js";

    // Ícones
    lucide.createIcons();

    // Lista de itens/avatares disponíveis
    const itensDisponiveis = [
      { id: 'player_one', nome: 'Clássico Bot', seed: 'PlayerOne', preco: 0, icone: 'https://api.dicebear.com/7.x/bottts/svg?seed=PlayerOne' },
      { id: 'cyber_hero', nome: 'Cyber Bot 3000', seed: 'CyberHero', preco: 100, icone: 'https://api.dicebear.com/7.x/bottts/svg?seed=CyberHero' },
      { id: 'golden_bot', nome: 'Bot de Ouro', seed: 'GoldenBot', preco: 250, icone: 'https://api.dicebear.com/7.x/bottts/svg?seed=GoldenBot' },
      { id: 'shadow_ninja', nome: 'Sombra Ninja', seed: 'ShadowNinja', preco: 300, icone: 'https://api.dicebear.com/7.x/bottts/svg?seed=ShadowNinja' },
      { id: 'alien_king', nome: 'Rei Alienígena', seed: 'AlienKing', preco: 500, icone: 'https://api.dicebear.com/7.x/bottts/svg?seed=AlienKing' },
      { id: 'neon_rider', nome: 'Corredor Neon', seed: 'NeonRider', preco: 400, icone: 'https://api.dicebear.com/7.x/bottts/svg?seed=NeonRider' },
      { id: 'pixel_boss', nome: 'Chefão Pixel', seed: 'PixelBoss', preco: 600, icone: 'https://api.dicebear.com/7.x/bottts/svg?seed=PixelBoss' },
      { id: 'astro_boy', nome: 'Astronauta Aventura', seed: 'AstroBoy', preco: 350, icone: 'https://api.dicebear.com/7.x/bottts/svg?seed=AstroBoy' }
    ];

    let seedAtual = localStorage.getItem('goblox_avatar_seed') || 'PlayerOne';
    const previewImg = document.getElementById('avatar-preview');
    const descText = document.getElementById('avatar-desc');
    const grid = document.getElementById('items-grid');

    function atualizarPreview(seed, nome) {
      seedAtual = seed;
      previewImg.src = `https://api.dicebear.com/7.x/bottts/svg?seed=${seed}`;
      descText.innerText = `Equipado: ${nome}`;
    }

    function renderizarItens() {
      grid.innerHTML = '';
      itensDisponiveis.forEach(item => {
        const card = document.createElement('div');
        const equipado = item.seed === seedAtual;

        card.className = `p-4 border-2 rounded-xl flex flex-col items-center justify-between text-center cursor-pointer transition ${
          equipado ? 'border-green-500 bg-green-50' : 'border-gray-200 hover:border-red-400 bg-gray-50'
        }`;

        card.onclick = () => atualizarPreview(item.seed, item.nome);

        card.innerHTML = `
          <img src="${item.icone}" class="w-20 h-20 mb-2 object-contain" alt="${item.nome}">
          <span class="font-bold text-sm text-gray-800">${item.nome}</span>
          <span class="text-xs font-semibold text-yellow-700 mt-1 flex items-center gap-1">
            <i data-lucide="coins" class="w-3 h-3 text-yellow-600"></i> ${item.preco === 0 ? 'Grátis' : item.preco + ' G'}
          </span>
          <button class="mt-3 w-full py-1.5 text-xs font-extrabold rounded-lg ${
            equipado ? 'bg-green-600 text-white' : 'bg-red-600 hover:bg-red-700 text-white'
          }">
            ${equipado ? 'EQUIPADO' : 'EQUIPAR'}
          </button>
        `;

        grid.appendChild(card);
      });
      lucide.createIcons();
    }

    // Salvar escolha do Avatar
    document.getElementById('btn-salvar').onclick = () => {
      localStorage.setItem('goblox_avatar_seed', seedAtual);
      alert('✨ Avatar atualizado com sucesso!');
      renderizarItens();
    };

    // Inicialização
    atualizarPreview(seedAtual, 'Atual');
    renderizarItens();
  </script>
</body>
</html>
